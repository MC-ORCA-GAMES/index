<style>
  :root{
    --bg:#0a0b12; --bg-alt:#12141f; --panel:#151726; --panel-border:rgba(232,230,227,0.12);
    --crt:#D4AF37; --crt-dim:#8a7326; --amber:#FF6A2B; --teal:#21C7B8;
    --err:#D6303F; --text:#E9E7E2;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Inter","Consolas",monospace;
    overflow:hidden; position:relative; height:100vh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  /* CRT scanline flicker */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:9998;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.10) 3px 4px);
    mix-blend-mode:multiply; opacity:.35;
  }
  #boot{
    position:fixed; inset:0; background:#000; color:var(--crt); z-index:9999;
    padding:24px; font-size:14px; line-height:1.5; white-space:pre-wrap;
    font-family:"Consolas","Courier New",monospace;
  }
  #boot .cursor{display:inline-block;width:8px;background:var(--crt);animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  #desktop{
    position:absolute; inset:0; padding:18px 10px;
    background:var(--bg);
  }
  #wallpaper{
    position:absolute; inset:0; z-index:0; pointer-events:none;
    background-image:url("assets/img/wallpaper.png");
    background-size:cover; background-position:center; background-repeat:no-repeat;
    opacity:0.5; filter:brightness(0.9) saturate(1.05);
  }
  #stars{ position:absolute; inset:0; z-index:0; pointer-events:none; opacity:0.55; }

  }
  .icon:hover, .icon:focus-visible{background:rgba(212,175,55,0.10); outline:1px solid var(--crt-dim);}
  .icon.dragging{z-index:5; background:rgba(212,175,55,0.16); outline:1px solid var(--gold,#D4AF37);}
  .icon .glyph{font-size:28px; filter:drop-shadow(0 0 3px rgba(212,175,55,.35));}
  .icon .label{font-size:11.5px; line-height:1.25; word-break:break-word;}
  #icons{position:absolute; left:0; top:0; right:0; bottom:60px;}

  .win{
    position:absolute; min-width:260px; max-width:92vw; background:var(--panel);
    border:1px solid var(--panel-border); box-shadow:0 12px 34px rgba(0,0,0,.55);
    display:flex; flex-direction:column; border-radius:3px; overflow:hidden;
  }
  .win .bar{
    background:var(--bg-alt); padding:6px 8px; display:flex; align-items:center;
    justify-content:space-between; cursor:grab; border-bottom:1px solid var(--panel-border);
    font-size:12.5px; letter-spacing:.3px;
  }
  .win .bar:active{cursor:grabbing;}
  .win .bar .x{cursor:pointer; color:var(--text); opacity:.7; padding:0 4px;}
  .win .bar .x:hover{opacity:1; color:var(--err);}
  .win .bar .max{cursor:pointer; color:var(--text); opacity:.7; padding:0 4px;}
  .win .bar .max:hover{opacity:1; color:var(--crt);}
  .win .bar .btns{display:flex; gap:2px;}
  .win.maximized{
    left:0 !important; top:0 !important; right:0 !important; bottom:34px !important;
    width:auto !important; height:auto !important; max-width:none !important; border-radius:0; z-index:9000 !important;
  }
  .win.maximized .body{max-height:none !important; height:auto !important; flex:1 1 0; min-height:0;}
  /* Vollbild: kein Fenster, keine Taskleiste – nur der Inhalt */
  .win.fs{
    position:fixed !important; inset:0 !important; width:100vw !important; height:100vh !important;
    max-width:none !important; border:none; border-radius:0; box-shadow:none; z-index:99990 !important;
  }
  .win.fs > .bar{display:none;}
  .win.fs .body{max-height:none !important; height:auto !important; flex:1 1 0; min-height:0;}
  .win.browserwin.fs .body > div:first-child{display:none !important;}
  body.fs-on #taskbar, body.fs-on #startmenu, body.fs-on #fs-toast{display:none !important;}
  body.fs-on::after{display:none;}
  #fs-toast{
    position:fixed; left:50%; top:16px; transform:translateX(-50%); z-index:99999; display:none;
    background:rgba(10,11,18,.92); color:var(--text); border:1px solid var(--crt-dim); border-radius:3px;
    padding:8px 14px; font-size:12.5px;
  }
  .win .bar .fsb{cursor:pointer; color:var(--text); opacity:.7; padding:0 4px;}
  .win .bar .fsb:hover{opacity:1; color:var(--teal);}
  #taskbar .fshint{margin-left:auto; font-size:11px; opacity:.55; white-space:nowrap;}
  #taskbar .fshint + .clock{margin-left:10px;}
  @media (max-width:640px){ #taskbar .fshint{display:none;} }
  @media (max-width:900px){ .fshint-b{display:none;} }
  .win .body{padding:14px; font-size:13.5px; line-height:1.55; overflow:auto; max-height:60vh;}
  .win .body p{margin:0 0 10px;}
  .win .body img.glitchimg{width:100%; filter:contrast(1.1) saturate(0.3) brightness(.8);}
  .sig-canvas{width:100%; height:200px; display:block; background:#04050a; border:1px solid var(--panel-border); border-radius:2px;}
  .sig-controls{display:flex; align-items:center; flex-wrap:wrap; gap:8px 10px; margin-top:10px;}
  .sig-btn{
    background:transparent; border:1px solid var(--crt-dim); color:var(--crt); cursor:pointer;
    font-family:inherit; font-size:13px; padding:5px 12px; border-radius:2px;
  }
  .sig-btn:hover{border-color:var(--teal); color:var(--teal);}
  .sig-select{
    background:#04050a; border:1px solid var(--panel-border); color:var(--crt);
    font-family:inherit; font-size:12px; padding:5px 6px; border-radius:2px; max-width:150px;
  }
  .sig-status{font-size:11.5px; opacity:.55;}

  #term-out{white-space:pre-wrap; font-size:13px; min-height:120px;}
  #term-line{display:flex; gap:6px; align-items:center; margin-top:6px;}
  #term-line .prompt{color:var(--amber);}
  #term-input{
    flex:1; background:transparent; border:none; outline:none; color:var(--crt);
    font-family:inherit; font-size:13px;
  }

  #taskbar{
    position:absolute; left:0; right:0; bottom:0; height:34px; background:var(--bg);
    border-top:1px solid var(--panel-border); display:flex; align-items:center;
    padding:0 8px; gap:8px; font-size:12px; z-index:500;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #start{background:var(--bg-alt); border:1px solid var(--panel-border); color:var(--crt);
    padding:4px 10px; cursor:pointer; border-radius:2px; font-family:"Space Grotesk",sans-serif; font-weight:600; letter-spacing:.03em;}
  #start:hover{background:#1b1e2c;}
  #taskbar .brandmark{color:var(--fg-faint,#8b8fa3); font-family:"Space Grotesk",sans-serif; font-size:11px; letter-spacing:.1em; opacity:.7;}
  #taskbar .clock{margin-left:auto; color:var(--text); opacity:.8;}
  .taskitem{background:var(--bg-alt); border:1px solid var(--panel-border); padding:3px 8px;
    border-radius:2px; cursor:pointer; color:var(--text); font-size:11.5px;}

  #startmenu{
    position:absolute; bottom:36px; left:8px; background:var(--panel); border:1px solid var(--panel-border);
    padding:6px; display:none; flex-direction:column; min-width:150px; z-index:600;
  }
  #startmenu div{padding:6px 10px; cursor:pointer; font-size:12.5px;}
  #startmenu div:hover{background:rgba(212,175,55,0.10);}

  ::selection{background:var(--crt); color:#000;}

  /* frei skalierbare Fenster */
  .win .rz{position:absolute; z-index:6; touch-action:none;}
  .rz[data-d="n"]{top:0; left:10px; right:10px; height:5px; cursor:ns-resize;}
  .rz[data-d="s"]{bottom:0; left:10px; right:10px; height:6px; cursor:ns-resize;}
  .rz[data-d="e"]{right:0; top:10px; bottom:10px; width:6px; cursor:ew-resize;}
  .rz[data-d="w"]{left:0; top:10px; bottom:10px; width:6px; cursor:ew-resize;}
  .rz[data-d="ne"]{top:0; right:0; width:12px; height:12px; cursor:nesw-resize;}
  .rz[data-d="nw"]{top:0; left:0; width:12px; height:12px; cursor:nwse-resize;}
  .rz[data-d="se"]{bottom:0; right:0; width:14px; height:14px; cursor:nwse-resize;}
  .rz[data-d="sw"]{bottom:0; left:0; width:12px; height:12px; cursor:nesw-resize;}
  .win.maximized .rz, .win.fs .rz{display:none;}
  .win.sized{max-width:none;}
  .win.sized .body{max-height:none !important; height:auto !important; flex:1 1 0; min-height:0;}
  body.dragging iframe{pointer-events:none;}
  body.dragging{user-select:none;}
  .win.browserwin .bar .bt{opacity:.55; font-weight:400; margin-left:8px; font-size:11px;}
  .icon .glyph svg{display:block; filter:drop-shadow(0 0 4px rgba(255,255,255,.12));}
</style>
</head>

<script>
(function(){
  // Ziel-Seite, die im eingebauten "Netzscout"-Browser lädt.
  // Wenn diese Datei als index.html neben der echten Portfolio-Seite liegt,
  // hier den relativen Pfad zur echten Startseite eintragen (z.B. "portal/index.html").
  const SITE_URL = "index.html";

  // ---------- Boot sequence ----------
  const bootLines = [
    "TERMINUS-BIOS v0.7 ... OK",
    "PRÜFE SPEICHER: 640K ... 640K ... [Anomalie in Sektor 4]",
    "LAUFWERK C: einhängen ... OK",
    "LETZTER NUTZER: unbekannt",
    "LETZTE ANMELDUNG: —",
    "SITZUNG WIRD WIEDERHERGESTELLT ...",
    "",
    "willkommen zurück."
  ];
  const bootEl = document.getElementById('boot');
  let i = 0;
  function typeLine(){
    if(i >= bootLines.length){
      setTimeout(()=>{
        bootEl.style.transition="opacity .6s";
        bootEl.style.opacity="0";
        setTimeout(()=>{
          bootEl.style.display="none";
          document.getElementById('desktop').style.display="block";
          initStars();
          initIcons();
          document.getElementById('taskbar').style.display="flex";
        },600);
      }, 500);
      return;
    }
    bootEl.textContent += bootLines[i] + "\n";
    i++;
    setTimeout(typeLine, bootLines[i-1] === "" ? 250 : 260 + Math.random()*220);
  }
  bootEl.innerHTML = "";
  typeLine();

  // ---------- Starfield (wie auf mc-orca-games.de) ----------
  function initStars(){
    const canvas = document.getElementById('stars');
    const ctx = canvas.getContext('2d');
    let stars = [];
    const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
    function resize(){
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = canvas.parentElement.clientHeight;
      const count = Math.min(110, Math.floor((canvas.width * canvas.height) / 9000));
      stars = [];
      for(let i=0;i<count;i++){
        stars.push({
          x: Math.random()*canvas.width, y: Math.random()*canvas.height,
          r: Math.random()*1.3 + 0.2, a: Math.random()*0.6 + 0.15,
          tw: Math.random()*0.015 + 0.003, dir: Math.random() > 0.5 ? 1 : -1,
          vx: (Math.random()-0.5)*0.12, vy: (Math.random()-0.5)*0.12
        });
      }
    }
    function draw(){
      ctx.clearRect(0,0,canvas.width,canvas.height);
      const maxDist = Math.min(140, canvas.width*0.14);
      for(let i=0;i<stars.length;i++){
        for(let j=i+1;j<stars.length;j++){
          const a = stars[i], b = stars[j];
          const dx = a.x-b.x, dy = a.y-b.y;
          const d = Math.sqrt(dx*dx+dy*dy);
          if(d < maxDist){
            ctx.beginPath(); ctx.moveTo(a.x,a.y); ctx.lineTo(b.x,b.y);
            ctx.strokeStyle = 'rgba(212,175,55,'+((1-d/maxDist)*0.12).toFixed(3)+')';
            ctx.lineWidth = 1; ctx.stroke();
          }
        }
      }
      stars.forEach(s=>{
        ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
        ctx.fillStyle = 'rgba(232,230,227,'+s.a.toFixed(3)+')'; ctx.fill();
        if(!reduceMotion){
          s.a += s.tw*s.dir; if(s.a>0.75||s.a<0.1) s.dir*=-1;
          s.x += s.vx; s.y += s.vy;
          if(s.x<0||s.x>canvas.width) s.vx*=-1;
          if(s.y<0||s.y>canvas.height) s.vy*=-1;
        }
      });
      if(!reduceMotion) requestAnimationFrame(draw);
    }
    window.addEventListener('resize', resize);
    resize(); draw();
  }

  // ---------- Clock ----------
  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent =
      String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0');
  }
  tick(); setInterval(tick, 5000);

  // ---------- Window content ----------
  const CONTENT = {
    tagebuch: {
      title: "tagebuch.txt — Editor",

  // ---- SSTV-Decoder (Robot 36 / Robot 72) ----
  // Liest ein komplettes Audiosignal (Float32, Mono) und rekonstruiert das 320x240-Bild.
  // Ablauf: Mischen auf Basisband (1900 Hz) -> Tiefpass -> Frequenz per Pulse-Pair-Schätzer
  // (Präfixsummen, O(1) pro Fenster) -> Zeilen-Syncs (1200 Hz) finden -> Pixel je Zeile auslesen.
  // Rückgabe: {mode, w, h, rgb, lineDone[]} oder null, wenn kein SSTV-Signal erkannt wurde.
  function sstvDecode(x, sr){
    const F0 = 1900, D = 2;
    const L = Math.max(4, Math.round(sr / 3800));       // Boxfilter-Länge: Nullstelle nahe 3800 Hz (Spiegelfrequenz), zweistufig
    const n = x.length, w0 = 2*Math.PI*F0/sr;
    // Mischen + Boxfilter (kausal, ringpuffer) + Dezimierung um D -> Präfixsummen der Pulse-Pair-Produkte
    const m = Math.floor(n / D);
    const cumR = new Float64Array(m + 1), cumI = new Float64Array(m + 1);
    const ringI = new Float64Array(L), ringQ = new Float64Array(L);
    const ring2I = new Float64Array(L), ring2Q = new Float64Array(L);
    let sI = 0, sQ = 0, s2I = 0, s2Q = 0, prevI = 0, prevQ = 0, k = 0;
    for(let i = 0; i < n; i++){
      const c = Math.cos(w0*i), s = Math.sin(w0*i);
      const vi = x[i]*c, vq = -x[i]*s;
      const r = i % L;
      sI += vi - ringI[r]; sQ += vq - ringQ[r];
      ringI[r] = vi; ringQ[r] = vq;
      s2I += sI - ring2I[r]; s2Q += sQ - ring2Q[r];       // zweite Boxfilter-Stufe (Spiegelfrequenz stärker dämpfen)
      ring2I[r] = sI; ring2Q[r] = sQ;
      if(i % D === D - 1 && k < m){
        const zi = s2I, zq = s2Q;                         // z = zi + j*zq
        // z[k] * conj(z[k-1])
        const pr = zi*prevI + zq*prevQ, pi = zq*prevI - zi*prevQ;
        cumR[k+1] = cumR[k] + pr; cumI[k+1] = cumI[k] + pi;
        prevI = zi; prevQ = zq; k++;
      }
    }
    const sr2 = sr / D;
    const delay = (L - 1) / sr;                            // Gruppenlaufzeit der zwei Boxfilter-Stufen (s)
    // Frequenz im Zeitfenster [t0,t1] (Sekunden, Signalzeit). NaN, wenn (fast) kein Signal.
    function freqAt(t0, t1){
      let a = Math.round((t0 + delay)*sr2), b = Math.round((t1 + delay)*sr2);
      if(a < 1) a = 1; if(b > m) b = m;
      if(b - a < 2) b = Math.min(m, a + 2);
      if(a >= m) return NaN;
      const sr_ = cumR[b] - cumR[a], si_ = cumI[b] - cumI[a];
      if(Math.hypot(sr_, si_) < 1e-9 * (b - a)) return NaN;
      return F0 + Math.atan2(si_, sr_) * sr2 / (2*Math.PI);
    }

    // Grobes Frequenzraster: 0,25 ms Schritt, 0,5 ms Fenster
    const HOP = 0.00025, WIN = 0.0005;
    const nt = Math.floor(n / sr / HOP);
    const ft = new Float32Array(nt);
    for(let i = 0; i < nt; i++){
      const t = i*HOP; ft[i] = freqAt(t - WIN/2, t + WIN/2);
    }
    // Sync-Kandidaten: Läufe um 1200 Hz (1100..1330), 5..14 ms lang; Ende = Nulldurchgang durch 1350 Hz
    const ends = [];
    let runStart = -1;
    for(let i = 0; i <= nt; i++){
      const f = i < nt ? ft[i] : NaN;
      const inSync = f >= 1100 && f <= 1330;
      if(inSync){ if(runStart < 0) runStart = i; }
      else if(runStart >= 0){
        const len = (i - runStart)*HOP;
        if(len >= 0.005 && len <= 0.014 && f > 1330){
          const a = ft[i-1], b = f;                       // Kante 1200 -> 1500+ Hz, linear interpoliert
          const frac = (b > a) ? (1350 - a)/(b - a) : 0;
          ends.push((i - 1 + Math.min(1, Math.max(0, frac)))*HOP);
        }
        runStart = -1;
      }
    }
    if(ends.length < 10) return null;

    // Zeilentakt bestimmen: längste Kette mit Abstand P (150 ms = Robot 36, 300 ms = Robot 72)
    function bestChain(P){
      const len = new Int32Array(ends.length).fill(1), prev = new Int32Array(ends.length).fill(-1);
      let best = 0;
      for(let i = 0; i < ends.length; i++){
        for(let j = i - 1; j >= 0 && ends[i] - ends[j] < P + 0.004; j--){
          if(Math.abs(ends[i] - ends[j] - P) < 0.003 && len[j] + 1 > len[i]){ len[i] = len[j] + 1; prev[i] = j; }
        }
        if(len[i] > len[best]) best = i;
      }
      let first = best; while(prev[first] >= 0) first = prev[first];
      return {count: len[best], first: ends[first]};
    }
    const c36 = bestChain(0.150), c72 = bestChain(0.300);
    let mode, chain;
    if(c36.count >= c72.count){ mode = 'robot36'; chain = c36; } else { mode = 'robot72'; chain = c72; }
    if(chain.count < 20) return null;
    const P = mode === 'robot36' ? 0.150 : 0.300;

    const W = 320, H = 240;
    // Zeilenstart (Ende des Sync-Pulses) je Zeile: Raster ab erstem Sync, an gefundene Syncs einrasten
    const lineT = new Float64Array(H).fill(NaN);
    let expect = chain.first, miss = 0;
    for(let r = 0; r < H; r++){
      let bestE = -1, bd = 0.003;
      for(let q = 0; q < ends.length; q++){
        const d = Math.abs(ends[q] - expect);
        if(d < bd){ bd = d; bestE = ends[q]; }
      }
      if(bestE >= 0){ lineT[r] = bestE; expect = bestE + P; miss = 0; }
      else { lineT[r] = expect; expect += P; if(++miss > 6){ for(let q = r - miss + 1; q <= r; q++) lineT[q] = NaN; break; } }
    }

    const yv = new Uint8ClampedArray(W*H), ryv = new Float32Array(W*H).fill(NaN), byv = new Float32Array(W*H).fill(NaN);
    const chroma = new Int8Array(H);                       // 0 = keins, 1 = R-Y, 2 = B-Y (nur Robot 36)
    const lineDone = new Float64Array(H).fill(Infinity);
    const toVal = f => Math.max(0, Math.min(255, (f - 1500)/800*255));
    function scanRow(t0, dur, count, out, off, cnt){
      const T = dur/count;
      for(let i = 0; i < cnt; i++){
        const c = t0 + (i + 0.5)*T;
        const f = freqAt(c - T*0.4, c + T*0.4);
        out[off + i] = isNaN(f) ? 0 : toVal(f);
      }
    }
    const tmp = new Float32Array(W);
    for(let r = 0; r < H; r++){
      const t = lineT[r];
      if(isNaN(t)) continue;
      let p = t + 0.003;                                   // Sync-Porch
      if(mode === 'robot72'){
        scanRow(p, 0.138, W, tmp, 0, W); for(let i = 0; i < W; i++) yv[r*W + i] = tmp[i];
        p += 0.138 + 0.006;                                // Separator + Porch
        scanRow(p, 0.069, 160, tmp, 0, 160);
        for(let i = 0; i < W; i++) ryv[r*W + i] = tmp[i >> 1];
        p += 0.069 + 0.006;
        scanRow(p, 0.069, 160, tmp, 0, 160);
        for(let i = 0; i < W; i++) byv[r*W + i] = tmp[i >> 1];
        lineDone[r] = p + 0.069;
      } else {
        scanRow(p, 0.088, W, tmp, 0, W); for(let i = 0; i < W; i++) yv[r*W + i] = tmp[i];
        p += 0.088;
        const sep = freqAt(p + 0.0005, p + 0.0040);        // 1500 Hz = R-Y, 2300 Hz = B-Y
        chroma[r] = (sep > 1900) ? 2 : 1;
        p += 0.006;
        scanRow(p, 0.044, 160, tmp, 0, 160);
        const dst = chroma[r] === 1 ? ryv : byv;
        for(let i = 0; i < W; i++) dst[r*W + i] = tmp[i >> 1];
        lineDone[r] = p + 0.044;
      }
    }
    // Robot 36: fehlende Farbdifferenz aus der Nachbarzeile holen (Zeilenpaare)
    if(mode === 'robot36'){
      for(let r = 0; r < H; r++){
        if(isNaN(lineT[r])) continue;
        const need = chroma[r] === 1 ? 2 : 1, arr = need === 1 ? ryv : byv;
        let src = -1;
        if(r + 1 < H && !isNaN(lineT[r+1]) && chroma[r+1] === need) src = r + 1;
        else if(r - 1 >= 0 && !isNaN(lineT[r-1]) && chroma[r-1] === need) src = r - 1;
        for(let i = 0; i < W; i++) arr[r*W + i] = src >= 0 ? (need === 1 ? ryv : byv)[src*W + i] : 128;
      }
    }
    const rgb = new Uint8ClampedArray(W*H*4);
    for(let r = 0; r < H; r++){
      for(let i = 0; i < W; i++){
        const q = r*W + i, o = q*4;
        if(isNaN(lineT[r])){ rgb[o+3] = 255; continue; }
        const rq = ryv[q], bq = byv[q];
        const y = 1.164*(yv[q] - 16), ry = (isNaN(rq) ? 128 : rq) - 128, by = (isNaN(bq) ? 128 : bq) - 128;
        rgb[o]   = y + 1.596*ry;
        rgb[o+1] = y - 0.813*ry - 0.391*by;
        rgb[o+2] = y + 2.018*by;
        rgb[o+3] = 255;
      }
    }
    return {mode, w: W, h: H, rgb, lineDone};
  }

  // ---- Frequenzanalysator: zeigt beim Abspielen ein Live-Spektrogramm (Web Audio API) ----
  // Manche Audiodateien im Archiv sind kein Rauschen, sondern haben ein Bild ins Frequenzband codiert.
  // Bekannte Signale stehen hier in einer Liste — neue .ogg-/.wav-Funde einfach als weiteren
  // Eintrag ergänzen (Datei muss in assets/audio/ liegen), dann taucht sie automatisch
  // im Kanal-Wähler des Analysators auf.
  //
  // Optionale Felder pro Eintrag (nur für Farb-Signale aus dem Bild→Audio-Tool im Modus "Farbe"):
  //   color:true  -> Analysator startet direkt in der RGB-Ansicht
  //   fmin/fmax   -> Frequenzbereich, den du im Tool eingestellt hast (Standard 300–7000 Hz)
  // Die Liste wird nicht mehr von Hand gepflegt: assets/audio/signals.json wird beim Deploy
  // automatisch aus tools/build_audio_manifest.py erzeugt (jede signal_*.ogg / .wav in assets/audio/
  // taucht darin auf). Dieser Fallback-Eintrag greift nur, falls das Manifest mal fehlt.
  let SIGNAL_FILES = [
    {file:'signal_sektor4.wav', label:'signal_sektor4.wav'}
  ];
  const signalsReady = fetch('assets/audio/signals.json')
    .then(r => r.ok ? r.json() : [])
    .then(list => {
      if(!Array.isArray(list)) return;
      list.forEach(entry => {
        const i = SIGNAL_FILES.findIndex(s => s.file === entry.file);
        if(i >= 0) SIGNAL_FILES[i] = entry; else SIGNAL_FILES.push(entry);
      });
    })
    .catch(()=>{}); // kein Manifest (z.B. lokal ohne Server) -> Fallback-Liste bleibt bestehen
  let sigAudioCtx = null;
  let sigWinRefs = null; // Referenzen des offenen Analysator-Fensters, falls schon offen

  // file/label optional: ohne Argument wird das erste bekannte Signal geladen.
  // Kann von überall aufgerufen werden (z.B. wenn ein neues Signal im Spiel gefunden wird),
  // auch während das Fenster schon offen ist — dann wechselt es nur den Kanal.
  async function openSignalAnalyzer(file, label){
    await signalsReady;
    if(file && !SIGNAL_FILES.find(s=>s.file===file)){
      SIGNAL_FILES.push({file, label: label || file});
    }
    const track = file ? SIGNAL_FILES.find(s=>s.file===file) : SIGNAL_FILES[0];

    if(openWinIds.has('signal')){
      focusWin('signal');
      if(sigWinRefs) sigWinRefs.loadTrack(track.file, track.label);
      return;
    }
    const win = document.createElement('div');
    win.className = 'win';
    win.dataset.key = 'signal';
    win.style.left = (70 + Math.random()*100) + 'px';
    win.style.top = (50 + Math.random()*80) + 'px';
    win.style.width = '420px';
    win.innerHTML = `<div class="bar"><span>Frequenzanalysator</span><span class="btns"><span class="fsb" title="Vollbild (Alt+Enter)">⤢</span><span class="max" title="Maximieren">⛶</span><span class="x">✕</span></span></div>
      <div class="body">
        <p style="opacity:.6; font-size:12px;">Zerlegt eingehende Audiosignale in ihr Frequenzband. Manchmal steckt darin mehr als nur Rauschen.</p>
        <canvas class="sig-canvas" width="760" height="200"></canvas>
        <div class="sig-controls">
          <button class="sig-btn" data-play>▶ abspielen</button>
          <button class="sig-btn" data-decode title="Versteckte SSTV-Bilder (Robot 36 / Robot 72) aus der Datei rekonstruieren">◧ SSTV entschlüsseln</button>
          <select class="sig-select" title="Kanal wählen"></select>
          <select class="sig-view" title="Ansicht">
            <option value="intensity">Intensität</option>
            <option value="bands">RGB-Bänder</option>
            <option value="combined">Farbbild</option>
          </select>
          <span class="sig-status">bereit</span>
        </div>
        <audio class="sig-audio" preload="none"></audio>
      </div>`;
    document.getElementById('desktop').appendChild(win);
    makeDraggable(win);
    focusWinEl(win);

    const canvas = win.querySelector('.sig-canvas');
    const ctx2d = canvas.getContext('2d');
    const audio = win.querySelector('.sig-audio');
    const playBtn = win.querySelector('[data-play]');
    const status = win.querySelector('.sig-status');
    const select = win.querySelector('.sig-select');
    const viewSel = win.querySelector('.sig-view');
    viewSel.className = 'sig-select';
    const decodeBtn = win.querySelector('[data-decode]');

    // Canvas-Modus: Wasserfall (760x200) oder dekodiertes Bild (320x240, 4:3, unverzerrt)
    let decodedMode = false, revealRaf = null;
    function setCanvasMode(decoded){
      if(revealRaf){ cancelAnimationFrame(revealRaf); revealRaf = null; }
      if(decoded === decodedMode) return;
      decodedMode = decoded;
      canvas.width = decoded ? 320 : 760;
      canvas.height = decoded ? 240 : 200;
      canvas.style.height = decoded ? 'auto' : '';
      canvas.style.aspectRatio = decoded ? '4 / 3' : '';
      ctx2d.fillStyle = '#04050a'; ctx2d.fillRect(0,0,canvas.width,canvas.height);
    }

    win.querySelector('.x').onclick = ()=> { closeWin(win, 'signal'); audio.pause(); sigWinRefs = null; };
    win.querySelector('.max').onclick = ()=> toggleMaximize(win);
    openWinIds.add('signal');
    addTaskItem('signal', 'Frequenzanalysator', win);

    // Sichtbarer Frequenzbereich des Wasserfalldiagramms (Hz).
    // Farb-Signale (RGB-Bänder) werden exakt im Bereich fmin..fmax dargestellt, den das Encoder-Tool
    // benutzt hat, damit die drei Drittel sauber auf Rot / Grün / Blau fallen.
    let F_MIN = 200, F_MAX = 8000;
    let viewMode = 'intensity';
    let analyser = null, source = null, rafId = null;

    // Basisfarben der Bänder — müssen zu BAND_COLORS in tools/bild-zu-audio.html passen.
    const BAND_R = [225,80,70], BAND_G = [70,210,120], BAND_B = [90,150,235];

    function ensureAudioGraph(){
      if(!sigAudioCtx) sigAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if(!source){
        source = sigAudioCtx.createMediaElementSource(audio);
        analyser = sigAudioCtx.createAnalyser();
        analyser.fftSize = 2048;
        analyser.smoothingTimeConstant = 0.35;
        source.connect(analyser);
        analyser.connect(sigAudioCtx.destination);
      }
    }

    function intensityColor(v){
      // Farbverlauf: dunkel -> teal -> gold/weiß bei hoher Intensität (passend zum T-7-Look)
      let r,g,b;
      if(v < 0.5){ const t=v/0.5; r=10+t*23; g=11+t*186; b=18+t*163; }
      else { const t=(v-0.5)/0.5; r=33+t*(212-33); g=197+t*(175-197); b=180+t*(55-180); }
      return [r,g,b];
    }

    function draw(){
      const data = new Uint8Array(analyser.frequencyBinCount);
      analyser.getByteFrequencyData(data);
      const sr = sigAudioCtx.sampleRate;
      const binHz = sr / analyser.fftSize;
      const maxBin = data.length - 1;
      // Intensität eines Frequenzwerts, leicht gamma-korrigiert (Analyser-Werte sind dB-skaliert,
      // ohne Korrektur wirkt das Farbbild im Vergleich zur Encoder-Vorschau zu hell)
      const level = (hz)=>{
        const i = Math.min(maxBin, Math.max(0, Math.round(hz / binHz)));
        return Math.pow(data[i] / 255, 1.4);
      };
      // Wasserfall: bestehendes Bild um 1px nach links schieben, neue Spalte rechts zeichnen
      ctx2d.drawImage(canvas, -1, 0);
      const h = canvas.height;
      const span = F_MAX - F_MIN;
      const bandHz = span / 3;
      for(let y = 0; y < h; y++){
        const frac = 1 - (y + 0.5) / h; // oben = hohe Frequenz
        let r,g,b;
        if(viewMode === 'combined'){
          // Bild-Zeile f (0 = oben) steht in jedem Drittel an derselben relativen Position:
          // Rot = unteres, Grün = mittleres, Blau = oberes Drittel. Zusammengesetzt ergibt das das Farbbild.
          const f = (y + 0.5) / h;
          const vR = level(F_MIN + bandHz     - f*bandHz);
          const vG = level(F_MIN + 2*bandHz   - f*bandHz);
          const vB = level(F_MIN + 3*bandHz   - f*bandHz);
          r = 255*vR; g = 255*vG; b = 255*vB;
        } else if(viewMode === 'bands'){
          const hz = F_MIN + frac*span;
          const v = level(hz);
          const base = frac < 1/3 ? BAND_R : (frac < 2/3 ? BAND_G : BAND_B);
          r = base[0]*v; g = base[1]*v; b = base[2]*v;
        } else {
          [r,g,b] = intensityColor(data[Math.min(maxBin, Math.round((F_MIN + frac*span)/binHz))] / 255);
        }
        ctx2d.fillStyle = `rgb(${Math.round(r)},${Math.round(g)},${Math.round(b)})`;
        ctx2d.fillRect(canvas.width-1, y, 1, 1);
      }
      rafId = requestAnimationFrame(draw);
    }

    function renderOptions(currentFile){
      select.innerHTML = SIGNAL_FILES.map(s=>
        `<option value="${s.file}"${s.file===currentFile?' selected':''}>${s.label}</option>`
      ).join('');
    }

    function loadTrack(f, l){
      const t = SIGNAL_FILES.find(x=>x.file===f) || {};
      if(t.color){ F_MIN = t.fmin || 300; F_MAX = t.fmax || 7000; viewMode = 'bands'; }
      else { F_MIN = 200; F_MAX = 8000; viewMode = 'intensity'; }
      viewSel.value = viewMode;
      audio.pause();
      if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
      setCanvasMode(false);
      audio.src = 'assets/audio/' + f;
      audio.load();
      playBtn.textContent = '▶ abspielen';
      status.textContent = l + ' — bereit';
      ctx2d.fillStyle = '#04050a'; ctx2d.fillRect(0,0,canvas.width,canvas.height);
      renderOptions(f);
    }

    // Ansicht manuell umschalten; Farbansichten brauchen den Bereich des Encoders (bei
    // Nicht-Farb-Signalen einfach ausprobieren: 300–7000 Hz ist der Tool-Standard).
    viewSel.onchange = ()=>{
      setCanvasMode(false);
      viewMode = viewSel.value;
      if(viewMode !== 'intensity'){
        const t = SIGNAL_FILES.find(x=>x.file===select.value) || {};
        F_MIN = t.fmin || 300; F_MAX = t.fmax || 7000;
      } else if(!(SIGNAL_FILES.find(x=>x.file===select.value)||{}).color){
        F_MIN = 200; F_MAX = 8000;
      }
      ctx2d.fillStyle = '#04050a'; ctx2d.fillRect(0,0,canvas.width,canvas.height);
    };

    select.onchange = ()=>{
      const f = select.value;
      const t = SIGNAL_FILES.find(s=>s.file===f);
      loadTrack(t.file, t.label);
    };

    playBtn.onclick = ()=>{
      setCanvasMode(false);
      ensureAudioGraph();
      if(sigAudioCtx.state === 'suspended') sigAudioCtx.resume();
      const t = SIGNAL_FILES.find(s=>s.file === select.value) || track;
      if(audio.paused){
        audio.play();
        playBtn.textContent = '⏸ pause';
        status.textContent = t.label + ' — läuft ...';
        if(!rafId) draw();
      } else {
        audio.pause();
        playBtn.textContent = '▶ abspielen';
        status.textContent = t.label + ' — pausiert';
      }
    };
    audio.addEventListener('ended', ()=>{
      const t = SIGNAL_FILES.find(s=>s.file === select.value) || track;
      playBtn.textContent = '▶ abspielen';
      status.textContent = t.label + ' — Ende';
      if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
    });

    // SSTV entschlüsseln: komplette Datei laden, Robot 36 / Robot 72 erkennen, Bild zeilenweise einblenden
    decodeBtn.onclick = async ()=>{
      const t = SIGNAL_FILES.find(s=>s.file === select.value) || track;
      decodeBtn.disabled = true;
      audio.pause();
      if(rafId){ cancelAnimationFrame(rafId); rafId = null; }
      playBtn.textContent = '▶ abspielen';
      status.textContent = t.label + ' — lese Datei ...';
      try{
        const resp = await fetch('assets/audio/' + t.file);
        if(!resp.ok) throw new Error('HTTP ' + resp.status);
        const ab = await resp.arrayBuffer();
        if(!sigAudioCtx) sigAudioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const buf = await sigAudioCtx.decodeAudioData(ab);
        // auf Mono mischen
        const n = buf.length, ch = buf.numberOfChannels, mono = new Float32Array(n);
        for(let c = 0; c < ch; c++){
          const d = buf.getChannelData(c);
          for(let i = 0; i < n; i++) mono[i] += d[i] / ch;
        }
        status.textContent = t.label + ' — entschlüssele ...';
        await new Promise(r => setTimeout(r, 30));      // Statusanzeige zeichnen lassen
        const res = sstvDecode(mono, buf.sampleRate);
        if(!res){
          setCanvasMode(false);
          status.textContent = t.label + ' — kein SSTV-Signal erkannt';
        } else {
          setCanvasMode(true);
          const lines = Array.from(res.lineDone).filter(v => isFinite(v)).length;
          const label = res.mode === 'robot72' ? 'Robot 72' : 'Robot 36';
          const img = new ImageData(res.rgb, res.w, res.h);
          const tmp = document.createElement('canvas'); tmp.width = res.w; tmp.height = res.h;
          tmp.getContext('2d').putImageData(img, 0, 0);
          // Zeilenweise einblenden (ca. 2,5 s)
          const t0 = performance.now(), DUR = 2500;
          const step = now => {
            const rows = Math.min(res.h, Math.ceil((now - t0) / DUR * res.h));
            ctx2d.drawImage(tmp, 0, 0, res.w, rows, 0, 0, res.w, rows);
            if(rows < res.h) revealRaf = requestAnimationFrame(step); else revealRaf = null;
          };
          revealRaf = requestAnimationFrame(step);
          status.textContent = t.label + ' — SSTV ' + label + ' erkannt, ' + lines + '/' + res.h + ' Zeilen';
        }
      }catch(e){
        status.textContent = t.label + ' — Fehler beim Lesen (' + (e && e.message ? e.message : e) + ')';
      }
      decodeBtn.disabled = false;
    };

    sigWinRefs = {loadTrack};
    loadTrack(track.file, track.label);
  }

    win.innerHTML = `<div class="bar"><span>${title || 'Netzscout'}</span><span class="btns"><span class="fsb" title="Vollbild (Alt+Enter)">⤢</span><span class="max" title="Maximieren">⛶</span><span class="x">✕</span></span></div>

          <span class="bb-new" title="Neues Netzscout-Fenster" style="cursor:pointer; color:var(--teal); padding:2px 6px; font-size:15px;">＋</span>
          <span class="fshint-b" style="font-size:11px; opacity:.6; white-space:nowrap;">⤢ Vollbild: Alt+Enter · Beenden: Esc</span>

        <iframe class="bb-frame" src="${url}" style="flex:1; min-height:0; width:100%; border:none; background:#fff;"></iframe>
      </div>`;
    desk.appendChild(win);
    makeDraggable(win);
    focusWinEl(win);
    win.querySelector('.x').onclick = ()=> closeWin(win, key);
    win.querySelector('.max').onclick = ()=> toggleMaximize(win);
    openWinIds.add(key);
    addTaskItem(key, title || 'Netzscout', win);

    const frame = win.querySelector('.bb-frame');
    const urlInput = win.querySelector('.bb-url');
    function navigate(){
      const v = urlInput.value.trim();
      if(!v){ frame.src = 'suche.html'; return; }
      const isUrl = /^(https?:)?\/\//.test(v) || /\.(html?|png|jpe?g|svg|ogg|mp4)(\?.*)?$/i.test(v) || v.startsWith('/') || v.includes('.html');
      frame.src = isUrl ? v : 'suche.html?q=' + encodeURIComponent(v);
    }
    win.querySelector('.bb-go').onclick = navigate;
    win.querySelector('.bb-reload').onclick = ()=> { frame.src = frame.src; };
    win.querySelector('.bb-back').onclick = ()=> { try{ frame.contentWindow.history.back(); }catch(e){} };
    win.querySelector('.bb-new').onclick = ()=> openBrowser('suche.html');
    win.querySelector('.bb-home').onclick = ()=> { frame.src = SITE_URL; };
    urlInput.addEventListener('keydown', e=>{ if(e.key==='Enter') navigate(); });
    frame.addEventListener('load', ()=>{ try{
      const p = (frame.contentWindow.location.pathname.replace(/^\//,'') || SITE_URL) + frame.contentWindow.location.search;
      if(document.activeElement !== urlInput) urlInput.value = p;
    }catch(e){} });
  }

  const toastEl = document.getElementById('fs-toast');
  let toastT;
  function toast(msg){
    toastEl.textContent = msg; toastEl.style.display='block';
    clearTimeout(toastT); toastT = setTimeout(()=> toastEl.style.display='none', 3200);
  }
  function topWin(){
    const wins = [...document.querySelectorAll('#desktop .win')];
    return wins.sort((a,b)=> (+b.style.zIndex||0) - (+a.style.zIndex||0))[0];
  }
  function enterFs(win){
    document.querySelectorAll('.win.fs').forEach(w=>w.classList.remove('fs'));
    win.classList.add('fs'); document.body.classList.add('fs-on'); focusWinEl(win);
    try{ const r = document.documentElement.requestFullscreen; if(r && !document.fullscreenElement) r.call(document.documentElement).catch(()=>{}); }catch(e){}
  }
  function leaveFs(){
    document.querySelectorAll('.win.fs').forEach(w=>w.classList.remove('fs'));
    document.body.classList.remove('fs-on');
    try{ if(document.fullscreenElement) document.exitFullscreen().catch(()=>{}); }catch(e){}
  }
  function toggleFs(win){
    if(document.body.classList.contains('fs-on')) leaveFs();
    else { win = win || topWin(); if(win) enterFs(win); else toast('Erst ein Fenster öffnen, dann Alt+Enter für Vollbild'); }
  }
  function fsKey(e){
    if(e.altKey && e.key === 'Enter'){ e.preventDefault(); toggleFs(); }
    else if(e.key === 'Escape' && document.body.classList.contains('fs-on')){ leaveFs(); }
  }
  document.addEventListener('keydown', fsKey);
  document.addEventListener('fullscreenchange', ()=>{
    if(!document.fullscreenElement && document.body.classList.contains('fs-on')) leaveFs();
  });
  document.getElementById('desktop').addEventListener('click', e=>{
    const b = e.target.closest('.fsb'); if(b) toggleFs(b.closest('.win'));
  });
  // Tasten auch abfangen, wenn der Fokus im eingebetteten Netzscout-iframe liegt (gleiche Domain)
  document.addEventListener('load', e=>{
    if(e.target && e.target.tagName === 'IFRAME'){
      try{ e.target.contentWindow.document.addEventListener('keydown', fsKey); }catch(err){}
    }
  }, true);

  function toggleMaximize(win){
    if(win.classList.contains('maximized')){
      win.classList.remove('maximized');
      if(win.dataset.prevStyle !== undefined) win.setAttribute('style', win.dataset.prevStyle);
    } else {
      win.dataset.prevStyle = win.getAttribute('style') || '';
      win.classList.add('maximized');
      focusWinEl(win);
    }
  }

    win.style.left = '60px'; win.style.top = '20px';
    win.style.width = 'min(560px, 92vw)';
    const groups = {};
    MEDIA.forEach(m => { (groups[m.g] = groups[m.g] || []).push(m); });
    let listHtml = '';
    Object.keys(groups).sort().forEach(g => {
      listHtml += `<div style="opacity:.55; font-size:11px; letter-spacing:.08em; margin:10px 0 4px; font-family:'Space Grotesk',sans-serif;">${g.toUpperCase()}</div>`;
      groups[g].forEach(m => {
        listHtml += `<div class="media-row" data-path="${m.p}" data-type="${m.t}" style="cursor:pointer; padding:3px 4px; font-size:12px; display:flex; gap:6px; align-items:center; border-radius:2px;">
          <span style="opacity:.6;">${m.t === 'audio' ? '♪' : '▧'}</span><span>${m.n}</span></div>`;
      });
    });
    win.innerHTML = `<div class="bar"><span>Medienarchiv — ${MEDIA.length} Dateien</span><span class="btns"><span class="fsb" title="Vollbild (Alt+Enter)">⤢</span><span class="max" title="Maximieren">⛶</span><span class="x">✕</span></span></div>
      <div class="body" style="padding:0; display:flex; height:440px; max-height:70vh;">
        <div style="width:56%; overflow:auto; padding:8px 10px; border-right:1px solid var(--panel-border);">${listHtml}</div>
        <div id="media-preview" style="width:44%; overflow:auto; padding:10px; display:flex; align-items:center; justify-content:center; text-align:center; font-size:12px; opacity:.6;">
          Datei anklicken zur Vorschau.<br><br><span style="font-size:11px;">(Live erst nach Upload auf den echten Server sichtbar — Assets sind nicht Teil dieses Prototyps.)</span>
        </div>
      </div>`;
    document.getElementById('desktop').appendChild(win);
    makeDraggable(win);
    focusWinEl(win);
    win.querySelector('.x').onclick = ()=> closeWin(win, 'medien');
    win.querySelector('.max').onclick = ()=> toggleMaximize(win);
    openWinIds.add('medien');
    addTaskItem('medien', 'Medienarchiv', win);

    const preview = win.querySelector('#media-preview');
    win.querySelectorAll('.media-row').forEach(row => {
      row.addEventListener('mouseenter', ()=> row.style.background='rgba(212,175,55,0.10)');
      row.addEventListener('mouseleave', ()=> row.style.background='transparent');
      row.addEventListener('click', ()=> {
        const path = row.dataset.path, type = row.dataset.type;
        if(type === 'audio'){
          preview.innerHTML = `<div style="width:100%;"><div style="opacity:.7; font-size:11px; margin-bottom:8px; word-break:break-all;">${path}</div><audio controls style="width:100%;" src="${path}"></audio></div>`;
        } else {
          preview.innerHTML = `<div style="width:100%;"><img src="${path}" style="max-width:100%; max-height:280px; object-fit:contain;" onerror="this.nextElementSibling.style.display='block'"><div style="display:none; opacity:.6; margin-top:8px;">nicht ladbar hier — existiert nur auf dem Live-Server</div><div style="opacity:.5; font-size:11px; margin-top:6px; word-break:break-all;">${path}</div></div>`;
        }
      });
    });
  }

  function closeWin(win, key){
    if(win.classList.contains('fs')) leaveFs();
    win.remove();
    openWinIds.delete(key);
    const item = document.getElementById('task-'+key);
    if(item) item.remove();
  }

  function addTaskItem(key, label, win){
    const bar = document.getElementById('openwins');
    const item = document.createElement('div');
    item.className = 'taskitem';
    item.id = 'task-'+key;
    item.textContent = label.split(' — ')[0];
    item.onclick = ()=> focusWinEl(win);
    bar.appendChild(item);
  }

  function focusWin(key){
    const win = document.querySelector('.win[data-key="'+key+'"]');
    if(win) focusWinEl(win);
  }
  function focusWinEl(win){ zTop++; win.style.zIndex = zTop; }

  function makeResizable(win){
    ['n','s','e','w','ne','nw','se','sw'].forEach(d=>{
      const h = document.createElement('div'); h.className = 'rz'; h.dataset.d = d; win.appendChild(h);
      h.addEventListener('pointerdown', e=>{
        if(win.classList.contains('maximized') || win.classList.contains('fs')) return;
        e.preventDefault(); e.stopPropagation();
        h.setPointerCapture(e.pointerId); focusWinEl(win);
        const st = {x:e.clientX, y:e.clientY, l:win.offsetLeft, t:win.offsetTop, w:win.offsetWidth, h:win.offsetHeight};
        win.classList.add('sized');
        win.style.left = st.l+'px'; win.style.top = st.t+'px'; win.style.width = st.w+'px'; win.style.height = st.h+'px';
        document.body.classList.add('dragging');
        const MINW = 260, MINH = 150;
        const mv = ev=>{
          const dx = ev.clientX - st.x, dy = ev.clientY - st.y;
          let l = st.l, t = st.t, w = st.w, hh = st.h;
          if(d.includes('e')) w = Math.max(MINW, st.w + dx);
          if(d.includes('s')) hh = Math.max(MINH, st.h + dy);
          if(d.includes('w')){ w = Math.max(MINW, st.w - dx); l = st.l + st.w - w; }
          if(d.includes('n')){ hh = Math.max(MINH, st.h - dy); t = st.t + st.h - hh; }
          if(t < 0){ hh += t; t = 0; }
          win.style.left = l+'px'; win.style.top = t+'px'; win.style.width = w+'px'; win.style.height = hh+'px';
        };
        const up = ()=>{
          h.removeEventListener('pointermove', mv); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
          document.body.classList.remove('dragging');
        };
        h.addEventListener('pointermove', mv); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
      });
    });
  }

  function makeDraggable(win){
    makeResizable(win);
    const bar = win.querySelector('.bar');
    let dragging=false, ox=0, oy=0;
    bar.addEventListener('mousedown', e=>{
      document.body.classList.add('dragging'); dragging=true; ox = e.clientX - win.offsetLeft; oy = e.clientY - win.offsetTop;
      focusWinEl(win);
    });
    window.addEventListener('mousemove', e=>{
      if(!dragging) return;
      win.style.left = Math.max(0, e.clientX-ox) + 'px';
      win.style.top = Math.max(0, e.clientY-oy) + 'px';
    });
    window.addEventListener('mouseup', ()=>{ dragging=false; document.body.classList.remove('dragging'); });
    // touch support
    bar.addEventListener('touchstart', e=>{
      const t = e.touches[0];
      document.body.classList.add('dragging'); dragging=true; ox = t.clientX - win.offsetLeft; oy = t.clientY - win.offsetTop;
      focusWinEl(win);
    }, {passive:true});
    window.addEventListener('touchmove', e=>{
      if(!dragging) return;
      const t = e.touches[0];
      win.style.left = Math.max(0, t.clientX-ox) + 'px';
      win.style.top = Math.max(0, t.clientY-oy) + 'px';
    }, {passive:true});
    window.addEventListener('touchend', ()=>{ dragging=false; document.body.classList.remove('dragging'); });
  }

  document.querySelectorAll('[data-open]:not(.icon)').forEach(el=>{
    el.addEventListener('click', ()=> {
      openWindow(el.dataset.open);
      document.getElementById('startmenu').style.display='none';
    });
  });

  // ---- Desktop-Icons frei verschiebbar (wie am echten PC), Position wird gemerkt ----
  function initIcons(){
    const box = document.getElementById('icons');
    const icons = [...box.querySelectorAll('.icon')];
    const CELL_W = 92, CELL_H = 96, PAD = 8;
    const KEY = 't7-icon-pos';
    let saved = {};
    try{ saved = JSON.parse(localStorage.getItem(KEY) || '{}'); }catch(e){ saved = {}; }

    function clamp(x,y){
      const maxX = Math.max(PAD, box.clientWidth - 82 - PAD);
      const maxY = Math.max(PAD, box.clientHeight - 84 - PAD);
      return [Math.min(Math.max(x,PAD),maxX), Math.min(Math.max(y,PAD),maxY)];
    }

    // Default-Rasterplatz (Spalten von oben nach unten, wie vorher per Flex-Wrap)
    const rows = Math.max(1, Math.floor((box.clientHeight - PAD) / CELL_H));
    icons.forEach((icon, i)=>{
      const id = icon.dataset.open;
      let x, y;
      if(saved[id]){
        [x,y] = clamp(saved[id][0], saved[id][1]);
      } else {
        const col = Math.floor(i / rows), row = i % rows;
        [x,y] = clamp(col*CELL_W + PAD, row*CELL_H + PAD);
      }
      icon.style.left = x + 'px';
      icon.style.top = y + 'px';

      let sx=0, sy=0, ox=0, oy=0, moved=false, pid=null;
      icon.addEventListener('pointerdown', e=>{
        if(e.button !== undefined && e.button !== 0) return;
        pid = e.pointerId; icon.setPointerCapture(pid);
        sx = e.clientX; sy = e.clientY;
        ox = icon.offsetLeft; oy = icon.offsetTop;
        moved = false;
      });
      icon.addEventListener('pointermove', e=>{
        if(pid === null) return;
        const dx = e.clientX - sx, dy = e.clientY - sy;
        if(!moved && (Math.abs(dx) > 6 || Math.abs(dy) > 6)){ moved = true; icon.classList.add('dragging'); }
        if(!moved) return;
        const [nx,ny] = clamp(ox+dx, oy+dy);
        icon.style.left = nx + 'px'; icon.style.top = ny + 'px';
      });
      icon.addEventListener('pointerup', e=>{
        if(pid === null) return;
        icon.releasePointerCapture(pid); pid = null;
        icon.classList.remove('dragging');
        if(moved){
          saved[id] = [icon.offsetLeft, icon.offsetTop];
          try{ localStorage.setItem(KEY, JSON.stringify(saved)); }catch(e){}
        }
      });
      // Klick öffnet nur, wenn es kein Drag war (Capture-Phase, läuft vor dem normalen Klick-Handler)
      icon.addEventListener('click', e=>{
        if(moved){ e.stopImmediatePropagation(); e.preventDefault(); moved = false; return; }
        openWindow(id);
        document.getElementById('startmenu').style.display='none';
      }, true);
    });
  }

  document.getElementById('start').onclick = ()=>{
    const m = document.getElementById('startmenu');
    m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
  };
  document.getElementById('shutdown').onclick = ()=>{
    document.getElementById('startmenu').style.display='none';
    document.body.innerHTML = '<div style="color:#D4AF37;font-family:Consolas,monospace;padding:40px;">system wird heruntergefahren ...</div>';
  };
})();
</script>
</body>

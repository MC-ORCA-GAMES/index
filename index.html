<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TERMINUS-7</title>
<style>
  :root{
    --bg:#0a0e0c; --crt:#4fff8f; --crt-dim:#2b7a4d; --amber:#d9a441;
    --panel:#121713; --panel-border:#3a4a3f; --err:#ff5c5c; --text:#c7d6cc;
    font-size:16px;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg); color:var(--text);
    font-family:"Consolas","Courier New",monospace;
    overflow:hidden; position:relative; height:100vh;
    padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
  }
  /* CRT scanline flicker */
  body::after{
    content:""; position:fixed; inset:0; pointer-events:none; z-index:9998;
    background:repeating-linear-gradient(rgba(0,0,0,0) 0 2px, rgba(0,0,0,0.12) 3px 4px);
    mix-blend-mode:multiply; opacity:.5;
  }
  #boot{
    position:fixed; inset:0; background:#000; color:var(--crt); z-index:9999;
    padding:24px; font-size:14px; line-height:1.5; white-space:pre-wrap;
  }
  #boot .cursor{display:inline-block;width:8px;background:var(--crt);animation:blink 1s steps(1) infinite;}
  @keyframes blink{50%{opacity:0;}}

  #desktop{position:absolute; inset:0; padding:18px 10px;}
  .icon{
    width:82px; text-align:center; color:var(--text); cursor:pointer;
    display:inline-flex; flex-direction:column; align-items:center; gap:6px;
    padding:8px 4px; border-radius:4px; user-select:none; margin:2px;
  }
  .icon:hover, .icon:focus-visible{background:rgba(79,255,143,0.08); outline:1px solid var(--crt-dim);}
  .icon .glyph{font-size:28px; filter:drop-shadow(0 0 3px rgba(79,255,143,.35));}
  .icon .label{font-size:11.5px; line-height:1.25; word-break:break-word;}
  #icons{display:flex; flex-direction:column; flex-wrap:wrap; height:calc(100% - 60px); gap:4px;}

  .win{
    position:absolute; min-width:260px; max-width:92vw; background:var(--panel);
    border:1px solid var(--panel-border); box-shadow:0 12px 34px rgba(0,0,0,.55);
    display:flex; flex-direction:column; border-radius:3px; overflow:hidden;
  }
  .win .bar{
    background:#182019; padding:6px 8px; display:flex; align-items:center;
    justify-content:space-between; cursor:grab; border-bottom:1px solid var(--panel-border);
    font-size:12.5px; letter-spacing:.3px;
  }
  .win .bar:active{cursor:grabbing;}
  .win .bar .x{cursor:pointer; color:var(--text); opacity:.7; padding:0 4px;}
  .win .bar .x:hover{opacity:1; color:var(--err);}
  .win .body{padding:14px; font-size:13.5px; line-height:1.55; overflow:auto; max-height:60vh;}
  .win .body p{margin:0 0 10px;}
  .win .body img.glitchimg{width:100%; filter:contrast(1.1) saturate(0.3) brightness(.8);}

  #term-out{white-space:pre-wrap; font-size:13px; min-height:120px;}
  #term-line{display:flex; gap:6px; align-items:center; margin-top:6px;}
  #term-line .prompt{color:var(--amber);}
  #term-input{
    flex:1; background:transparent; border:none; outline:none; color:var(--crt);
    font-family:inherit; font-size:13px;
  }

  #taskbar{
    position:absolute; left:0; right:0; bottom:0; height:34px; background:#0d130f;
    border-top:1px solid var(--panel-border); display:flex; align-items:center;
    padding:0 8px; gap:8px; font-size:12px; z-index:500;
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  #start{background:#182019; border:1px solid var(--panel-border); color:var(--crt);
    padding:4px 10px; cursor:pointer; border-radius:2px;}
  #start:hover{background:#1e2921;}
  #taskbar .clock{margin-left:auto; color:var(--text); opacity:.8;}
  .taskitem{background:#182019; border:1px solid var(--panel-border); padding:3px 8px;
    border-radius:2px; cursor:pointer; color:var(--text); font-size:11.5px;}

  #startmenu{
    position:absolute; bottom:36px; left:8px; background:var(--panel); border:1px solid var(--panel-border);
    padding:6px; display:none; flex-direction:column; min-width:150px; z-index:600;
  }
  #startmenu div{padding:6px 10px; cursor:pointer; font-size:12.5px;}
  #startmenu div:hover{background:rgba(79,255,143,0.08);}

  ::selection{background:var(--crt); color:#000;}
</style>
</head>
<body>

<div id="boot"></div>

<div id="desktop" style="display:none;">
  <div id="icons">
    <div class="icon" data-open="browser" tabindex="0"><div class="glyph">◐</div><div class="label">Netzscout</div></div>
    <div class="icon" data-open="terminal" tabindex="0"><div class="glyph">▚</div><div class="label">Terminal</div></div>
    <div class="icon" data-open="tagebuch" tabindex="0"><div class="glyph">▤</div><div class="label">tagebuch.txt</div></div>
    <div class="icon" data-open="foto" tabindex="0"><div class="glyph">▧</div><div class="label">FOTO_037.jpg</div></div>
    <div class="icon" data-open="system" tabindex="0"><div class="glyph">◍</div><div class="label">Systeminfo</div></div>
    <div class="icon" data-open="papierkorb" tabindex="0"><div class="glyph">▥</div><div class="label">Papierkorb</div></div>
    <div class="icon" data-open="ordner" tabindex="0"><div class="glyph">▦</div><div class="label">unbenannter_ordner</div></div>
  </div>
</div>

<div id="taskbar" style="display:none;">
  <button id="start">◍ START</button>
  <div id="openwins" style="display:flex; gap:6px;"></div>
  <div class="clock" id="clock">00:00</div>
</div>

<div id="startmenu">
  <div data-open="terminal">Terminal</div>
  <div data-open="system">Systeminfo</div>
  <div id="shutdown">Herunterfahren</div>
</div>

<script>
(function(){
  // Ziel-Seite, die im eingebauten "Netzscout"-Browser lädt.
  // Wenn diese Datei als index.html neben der echten Portfolio-Seite liegt,
  // hier den relativen Pfad zur echten Startseite eintragen (z.B. "portal/index.html").
  const SITE_URL = "portal.html";

  // ---------- Boot sequence ----------
  const bootLines = [
    "TERMINUS-BIOS v0.7 ... OK",
    "PRÜFE SPEICHER: 640K ... 640K ... [Anomalie in Sektor 4]",
    "LAUFWERK C: einhängen ... OK",
    "LETZTER NUTZER: unbekannt",
    "LETZTE ANMELDUNG: —",
    "SITZUNG WIRD WIEDERHERGESTELLT ...",
    "",
    "willkommen zurück."
  ];
  const bootEl = document.getElementById('boot');
  let i = 0;
  function typeLine(){
    if(i >= bootLines.length){
      setTimeout(()=>{
        bootEl.style.transition="opacity .6s";
        bootEl.style.opacity="0";
        setTimeout(()=>{
          bootEl.style.display="none";
          document.getElementById('desktop').style.display="block";
          document.getElementById('taskbar').style.display="flex";
        },600);
      }, 500);
      return;
    }
    bootEl.textContent += bootLines[i] + "\n";
    i++;
    setTimeout(typeLine, bootLines[i-1] === "" ? 250 : 260 + Math.random()*220);
  }
  bootEl.innerHTML = "";
  typeLine();

  // ---------- Clock ----------
  function tick(){
    const d = new Date();
    document.getElementById('clock').textContent =
      String(d.getHours()).padStart(2,'0')+":"+String(d.getMinutes()).padStart(2,'0');
  }
  tick(); setInterval(tick, 5000);

  // ---------- Window content ----------
  const CONTENT = {
    tagebuch: {
      title: "tagebuch.txt — Editor",
      body: `<p>12. März — Rechner läuft wieder komisch warm, obwohl ich nichts offen habe.</p>
             <p>13. März — Ordner „unbenannter_ordner" taucht wieder auf. Hab ihn dreimal gelöscht.</p>
             <p>14. März — Vielleicht liest das ja wer irgendwann. Falls ja: das Terminal fragt manchmal nach dir, nicht nach mir.</p>
             <p style="opacity:.55">[Rest der Datei ist beschädigt]</p>`
    },
    foto: {
      title: "FOTO_037.jpg — Bildvorschau",
      body: `<div style="text-align:center; font-size:64px; letter-spacing:8px; opacity:.6;">▧▧▧</div>
             <p style="text-align:center; opacity:.6;">Datei beschädigt oder Format nicht unterstützt.</p>
             <p style="opacity:.5; font-size:12px;">Metadaten: aufgenommen 03:14 Uhr · Kamera: unbekanntes Gerät</p>`
    },
    system: {
      title: "Systeminfo",
      body: `<p>Rechnername: TERMINUS-7</p>
             <p>Betriebssystem: unbekannt / nicht lizenziert</p>
             <p>Letzter Neustart: vor 1847 Tagen</p>
             <p>Angemeldete Konten: 1 (aktiv), 2 (verwaist)</p>
             <p style="opacity:.5;">Diagnose fortsetzen? — Funktion nicht verfügbar.</p>`
    },
    papierkorb: {
      title: "Papierkorb — leer",
      body: `<p style="opacity:.6;">0 Objekte.</p>
             <p style="opacity:.4; font-size:12px;">(war vorhin noch nicht leer)</p>`
    },
    ordner: {
      title: "unbenannter_ordner",
      body: `<p>brief_an_dich.txt</p><p>nicht_öffnen.txt</p><p>backup_backup_final.zip</p>
             <p style="opacity:.5; font-size:12px;">Doppelklick ohne Funktion in diesem Prototyp — vielleicht später.</p>`
    }
  };

  // ---------- Window manager ----------
  let zTop = 10;
  const openWinIds = new Set();

  function openWindow(key){
    if(key === 'terminal') return openTerminal();
    if(key === 'browser') return openBrowser();
    if(openWinIds.has(key)){ focusWin(key); return; }
    const data = CONTENT[key];
    if(!data) return;
    const win = document.createElement('div');
    win.className = 'win';
    win.dataset.key = key;
    win.style.left = (60 + Math.random()*120) + 'px';
    win.style.top = (40 + Math.random()*100) + 'px';
    win.style.width = '340px';
    win.innerHTML = `<div class="bar"><span>${data.title}</span><span class="x">✕</span></div>
                      <div class="body">${data.body}</div>`;
    document.getElementById('desktop').appendChild(win);
    makeDraggable(win);
    focusWinEl(win);
    win.querySelector('.x').onclick = ()=> closeWin(win, key);
    openWinIds.add(key);
    addTaskItem(key, data.title, win);
  }

  function openTerminal(){
    if(openWinIds.has('terminal')){ focusWin('terminal'); return; }
    const win = document.createElement('div');
    win.className = 'win';
    win.dataset.key = 'terminal';
    win.style.left = '80px'; win.style.top = '60px'; win.style.width='420px';
    win.innerHTML = `<div class="bar"><span>Terminal</span><span class="x">✕</span></div>
      <div class="body">
        <div id="term-out">TERMINUS SHELL v0.7
Gib 'hilfe' ein für Befehle.
</div>
        <div id="term-line"><span class="prompt">&gt;</span><input id="term-input" autocomplete="off" spellcheck="false"></div>
      </div>`;
    document.getElementById('desktop').appendChild(win);
    makeDraggable(win);
    focusWinEl(win);
    win.querySelector('.x').onclick = ()=> closeWin(win, 'terminal');
    openWinIds.add('terminal');
    addTaskItem('terminal', 'Terminal', win);

    const out = win.querySelector('#term-out');
    const input = win.querySelector('#term-input');
    input.focus();
    const responses = {
      hilfe: "befehle: hilfe, dir, whoami, log, hallo, warum, exit",
      dir: "tagebuch.txt   FOTO_037.jpg   unbenannter_ordner   .versteckt~",
      whoami: "du bist angemeldet als: GAST\n(letzter echter Nutzer: nicht auffindbar)",
      log: "03:11  anmeldung fehlgeschlagen\n03:12  anmeldung fehlgeschlagen\n03:14  anmeldung erfolgreich\n03:14  unbekannter prozess gestartet",
      hallo: "hallo. schön, dass du wieder da bist.",
      warum: "das kann ich dir nicht sagen. noch nicht.",
      exit: "diese sitzung lässt sich nicht beenden."
    };
    function run(cmd){
      const c = cmd.trim().toLowerCase();
      out.textContent += "\n> " + cmd + "\n";
      if(c === "") return;
      out.textContent += (responses[c] || "unbekannter befehl: " + cmd) + "\n";
      out.scrollTop = out.scrollHeight;
    }
    input.addEventListener('keydown', e=>{
      if(e.key === 'Enter'){ run(input.value); input.value=''; }
    });
  }

  function openBrowser(){
    if(openWinIds.has('browser')){ focusWin('browser'); return; }
    const win = document.createElement('div');
    win.className = 'win';
    win.dataset.key = 'browser';
    win.style.left = '40px'; win.style.top = '30px';
    win.style.width = 'min(640px, 90vw)';
    win.innerHTML = `<div class="bar"><span>Netzscout</span><span class="x">✕</span></div>
      <div class="body" style="padding:0; max-height:70vh;">
        <div style="display:flex; gap:6px; align-items:center; padding:6px 8px; background:#182019; border-bottom:1px solid var(--panel-border);">
          <span id="bnav-back" style="cursor:pointer; opacity:.7; padding:2px 4px;">←</span>
          <span id="bnav-reload" style="cursor:pointer; opacity:.7; padding:2px 4px;">⟳</span>
          <input id="bnav-url" style="flex:1; background:#0d130f; border:1px solid var(--panel-border); color:var(--text); padding:4px 8px; font-family:inherit; font-size:12px;" value="${SITE_URL}">
          <span id="bnav-go" style="cursor:pointer; color:var(--crt); padding:2px 6px;">Los</span>
        </div>
        <iframe id="bnav-frame" src="${SITE_URL}" style="width:100%; height:420px; border:none; background:#fff;"></iframe>
      </div>`;
    document.getElementById('desktop').appendChild(win);
    makeDraggable(win);
    focusWinEl(win);
    win.querySelector('.x').onclick = ()=> closeWin(win, 'browser');
    openWinIds.add('browser');
    addTaskItem('browser', 'Netzscout', win);

    const frame = win.querySelector('#bnav-frame');
    const urlInput = win.querySelector('#bnav-url');
    function navigate(){ frame.src = urlInput.value.trim() || SITE_URL; }
    win.querySelector('#bnav-go').onclick = navigate;
    win.querySelector('#bnav-reload').onclick = ()=> { frame.src = frame.src; };
    win.querySelector('#bnav-back').onclick = ()=> { try{ frame.contentWindow.history.back(); }catch(e){} };
    urlInput.addEventListener('keydown', e=>{ if(e.key==='Enter') navigate(); });
  }

  function closeWin(win, key){
    win.remove();
    openWinIds.delete(key);
    const item = document.getElementById('task-'+key);
    if(item) item.remove();
  }

  function addTaskItem(key, label, win){
    const bar = document.getElementById('openwins');
    const item = document.createElement('div');
    item.className = 'taskitem';
    item.id = 'task-'+key;
    item.textContent = label.split(' — ')[0];
    item.onclick = ()=> focusWinEl(win);
    bar.appendChild(item);
  }

  function focusWin(key){
    const win = document.querySelector('.win[data-key="'+key+'"]');
    if(win) focusWinEl(win);
  }
  function focusWinEl(win){ zTop++; win.style.zIndex = zTop; }

  function makeDraggable(win){
    const bar = win.querySelector('.bar');
    let dragging=false, ox=0, oy=0;
    bar.addEventListener('mousedown', e=>{
      dragging=true; ox = e.clientX - win.offsetLeft; oy = e.clientY - win.offsetTop;
      focusWinEl(win);
    });
    window.addEventListener('mousemove', e=>{
      if(!dragging) return;
      win.style.left = Math.max(0, e.clientX-ox) + 'px';
      win.style.top = Math.max(0, e.clientY-oy) + 'px';
    });
    window.addEventListener('mouseup', ()=> dragging=false);
    // touch support
    bar.addEventListener('touchstart', e=>{
      const t = e.touches[0];
      dragging=true; ox = t.clientX - win.offsetLeft; oy = t.clientY - win.offsetTop;
      focusWinEl(win);
    }, {passive:true});
    window.addEventListener('touchmove', e=>{
      if(!dragging) return;
      const t = e.touches[0];
      win.style.left = Math.max(0, t.clientX-ox) + 'px';
      win.style.top = Math.max(0, t.clientY-oy) + 'px';
    }, {passive:true});
    window.addEventListener('touchend', ()=> dragging=false);
  }

  document.querySelectorAll('[data-open]').forEach(el=>{
    el.addEventListener('click', ()=> {
      openWindow(el.dataset.open);
      document.getElementById('startmenu').style.display='none';
    });
  });

  document.getElementById('start').onclick = ()=>{
    const m = document.getElementById('startmenu');
    m.style.display = m.style.display === 'flex' ? 'none' : 'flex';
  };
  document.getElementById('shutdown').onclick = ()=>{
    document.getElementById('startmenu').style.display='none';
    document.body.innerHTML = '<div style="color:#4fff8f;font-family:Consolas,monospace;padding:40px;">system wird heruntergefahren ...</div>';
  };
})();
</script>
</body>
</html>

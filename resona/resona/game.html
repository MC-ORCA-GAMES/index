<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RESONA | MC ORCA GAMES</title>
<meta name="description" content="RESONA – ein kleines lebendiges Wesen aus dem MC ORCA GAMES Universum. 3D-Virtual-Pet im Browser.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RESONA">

<style>
  :root {
    --bg: #0a0b12;
    --panel: #151726;
    --text: #E9E7E2;
    --teal: #21C7B8;
    --gold: #D4AF37;
    --amber: #FF6A2B;
    --err: #D6303F;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; background: var(--bg);
    transition: opacity .6s ease, visibility .6s ease;
  }
  #boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
  .logo { font-size: 28px; font-weight: 700; letter-spacing: .35em; padding-left: .35em; color: var(--gold); }
  .sub { font-size: 13px; opacity: .65; letter-spacing: .08em; }
  .pulse {
    width: 14px; height: 14px; border-radius: 50%; background: var(--amber);
    box-shadow: 0 0 18px 4px rgba(255,106,43,.55); animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(.7); opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .overlay { transition: none; } }

  #fatal { z-index: 20; display: none; }
  #fatal.show { display: flex; }
  #fatal .title { font-size: 18px; font-weight: 700; color: var(--err); }
  #fatal .msg { max-width: 34em; font-size: 14px; line-height: 1.55; opacity: .85; user-select: text; -webkit-user-select: text; }
  #fatal button {
    margin-top: 6px; padding: 12px 22px; min-height: 44px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.25); background: var(--panel); color: var(--text); font: 600 14px system-ui, sans-serif;
  }
</style>

<!-- Three.js liegt lokal (vendor/), damit RESONA offline startet. Version 0.160.0, MIT. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>

<div id="stage"></div>

<div id="boot" class="overlay" aria-live="polite">
  <div class="logo">RESONA</div>
  <div class="pulse" aria-hidden="true"></div>
  <div class="sub">wird geladen …</div>
  <noscript><div class="sub">RESONA benötigt JavaScript.</div></noscript>
</div>

<div id="fatal" class="overlay" role="alert">
  <div class="title">RESONA konnte nicht starten</div>
  <div class="msg" id="fatalMsg"></div>
  <button type="button" onclick="location.reload()">Neu laden</button>
</div>

<script>
/* Fehleranzeige + Wächter (klassisches Skript, läuft auch wenn die Module scheitern). */
(function () {
  var box = document.getElementById('fatal');
  var msg = document.getElementById('fatalMsg');
  function show(text) {
    msg.textContent = text;
    box.classList.add('show');
  }
  window.__resonaFatal = show;

  if (location.protocol === 'file:') {
    show('RESONA besteht aus mehreren Modul-Dateien und startet nicht per Doppelklick (file://). ' +
         'Bitte über den Hub-Server öffnen oder lokal einen Webserver starten, ' +
         'z. B. „python3 -m http.server" im Hub-Ordner und dann /resona/game.html aufrufen.');
    return;
  }
  setTimeout(function () {
    if (!window.__resonaBooted && !box.classList.contains('show')) {
      show('Beim Laden ist etwas schiefgegangen. Bitte Seite neu laden und prüfen, ' +
           'ob alle Dateien (js/, vendor/) hochgeladen wurden.');
    }
  }, 10000);
})();
</script>

<script type="module" src="./js/main.js"></script>

<script src="../assets/pwa-install.js" data-sw="sw.js"></script>
<script src="/assets/js/update-watch.js" defer></script>
</body>
</html>

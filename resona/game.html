<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>RESONA | MC ORCA GAMES</title>
<meta name="description" content="RESONA – ein kleines lebendiges Wesen aus dem MC ORCA GAMES Universum. 3D-Virtual-Pet im Browser.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="theme-color" content="#0a0b12">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="RESONA">

<style>
  :root {
    --bg: #0a0b12;
    --panel: #151726;
    --text: #E9E7E2;
    --teal: #21C7B8;
    --gold: #D4AF37;
    --amber: #FF6A2B;
    --err: #D6303F;
  }
  *, *::before, *::after { box-sizing: border-box; }
  html, body {
    margin: 0; height: 100%; background: var(--bg); color: var(--text);
    font-family: "Space Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    overflow: hidden; overscroll-behavior: none;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  #stage { position: fixed; inset: 0; width: 100%; height: 100%; }

  /* Oberfläche (Phase 10). #ui selbst fängt keine Eingaben ab, nur die Leiste darin: Ziehen und Tippen
     außerhalb der Leiste erreichen weiter den Canvas (Kamera, Antippen der Kreatur). */
  #ui {
    position: fixed; left: 0; right: 0; top: 0; z-index: 5; pointer-events: none;
    display: flex; justify-content: center;
    padding: calc(env(safe-area-inset-top, 0px) + 10px) calc(env(safe-area-inset-right, 0px) + 12px) 0 calc(env(safe-area-inset-left, 0px) + 12px);
  }
  .needs {
    pointer-events: auto; width: 100%; max-width: 520px;
    display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 6px 6px; align-items: center;
    padding: 8px 6px 8px 14px; border-radius: 18px;
    background: rgba(21, 23, 38, .66); border: 1px solid rgba(212, 175, 55, .22);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .needs[hidden] { display: none; }
  .needs-list { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
  .needs-extra {
    display: none; grid-column: 1 / -1; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 12px;
    padding: 8px 8px 2px 0; border-top: 1px solid rgba(255, 255, 255, .08);
  }
  .needs.open .needs-extra { display: grid; }
  .needs-persona { display: none; grid-column: 1 / -1; margin: 0; padding: 6px 8px 2px 0; font-size: 11px; line-height: 1.3; opacity: .85; }
  .needs.open .needs-persona { display: block; }
  .need { display: flex; flex-direction: column; gap: 4px; min-width: 0; }
  .need-label { font-size: 11px; letter-spacing: .04em; opacity: .85; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .need-bar { display: block; height: 6px; border-radius: 999px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  .need-fill {
    display: block; width: 100%; height: 100%; transform-origin: left center; transform: scaleX(.5);
    background: var(--teal); transition: transform .8s ease, background-color .4s ease;
  }
  .need[data-level="ok"] .need-fill { background: var(--gold); }
  /* Niedrig: gestreift statt nur andere Farbe (nicht Farbe allein) und mit Wort */
  .need[data-level="low"] .need-fill {
    background: repeating-linear-gradient(45deg, var(--amber) 0 4px, rgba(255, 106, 43, .4) 4px 8px);
  }
  .need-state { display: none; font-size: 10px; opacity: .8; line-height: 1; }
  .needs.open .need-state, .need[data-level="low"] .need-state { display: block; }
  .needs-toggle {
    width: 44px; height: 44px; border-radius: 50%; cursor: pointer; padding: 0;
    border: 1px solid rgba(255, 255, 255, .22); background: transparent; color: var(--text);
    font: 600 20px/1 system-ui, sans-serif;
  }
  .needs-toggle:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  @media (prefers-reduced-motion: reduce) { .need-fill { transition: none; } }

  /* Futterwahl (Phase 11), unten. .dock selbst fängt keine Eingaben ab, nur Knopf, Auswahl und Meldung. */
  .dock {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 5; pointer-events: none;
    display: flex; flex-direction: column; align-items: center; gap: 8px;
    padding: 0 calc(env(safe-area-inset-right, 0px) + 12px) calc(env(safe-area-inset-bottom, 0px) + 14px) calc(env(safe-area-inset-left, 0px) + 12px);
  }
  .dock[hidden] { display: none; }
  .dock-status {
    pointer-events: none; max-width: 520px; text-align: center; font-size: 13px; line-height: 1.35;
    padding: 6px 14px; border-radius: 999px; background: rgba(21, 23, 38, .72);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .dock-status:empty { display: none; }
  .tray {
    pointer-events: auto; display: none; width: 100%; max-width: 520px;
    grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; padding: 8px; border-radius: 18px;
    background: rgba(21, 23, 38, .8); border: 1px solid rgba(212, 175, 55, .22);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
  }
  .dock.open .tray:not(.tray-toy):not(.tray-game):not(.tray-room) { display: grid; }
  .tray-toy.is-open { display: grid; }   /* Spielzeug-Auswahl (Phase 18), öffnet über ihre eigene Klasse */
  @media (min-width: 480px) { .tray { grid-template-columns: repeat(4, minmax(0, 1fr)); } .tray-toy { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
  .chip {
    display: flex; align-items: center; gap: 10px; min-height: 56px; padding: 6px 12px; cursor: pointer;
    border-radius: 14px; border: 1px solid rgba(255, 255, 255, .18); background: rgba(255, 255, 255, .05);
    color: var(--text); font: 600 13px system-ui, sans-serif; text-align: left;
  }
  .chip:disabled { opacity: .45; cursor: default; }
  .chip:focus-visible, .dock-btn:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .chip-label { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Raumwahl (Phase 30 Teil C): sieben Räume plus „Reson folgen“, öffnet über ihre eigene Klasse `.is-open`. */
  .tray-room { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .tray-room.is-open { display: grid; }
  @media (min-width: 480px) { .tray-room { grid-template-columns: repeat(4, minmax(0, 1fr)); } }
  .chip-room { min-height: 56px; }
  .chip-text { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
  .chip-sub { font: 500 11px system-ui, sans-serif; opacity: .8; min-height: 1em; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chip-room.is-viewed { border-color: var(--gold); background: rgba(212, 175, 55, .14); }
  .chip-follow { justify-content: center; text-align: center; border-color: rgba(212, 175, 55, .5); }
  .chip-dot { flex: none; width: 18px; height: 18px; box-shadow: 0 0 10px rgba(255, 255, 255, .25); }
  .chip-dot[data-shape="orb"] { border-radius: 50%; }
  .chip-dot[data-shape="crystal"] { transform: rotate(45deg) scale(.82); border-radius: 2px; }
  .chip-dot[data-shape="root"] { width: 12px; height: 20px; border-radius: 6px 6px 8px 8px; }
  .chip-dot[data-shape="jelly"] { border-radius: 5px; }
  .chip-dot[data-shape="ball"] { border-radius: 50%; }
  .chip-dot[data-shape="cube"] { border-radius: 3px; transform: rotate(12deg) scale(.86); }
  .chip-dot[data-shape="drone"] { width: 24px; height: 12px; border-radius: 50%; }
  .chip-dot[data-shape="ring"] { border-radius: 50%; box-sizing: border-box; }
  /* Reaktionsspiel (Phase 20): Spielfeld mit drei Feldern und Ergebnis, öffnet über seine eigene Klasse `.is-open`. Eine Spalte, auch auf breiten Schirmen. */
  .tray-game { grid-template-columns: minmax(0, 1fr); gap: 10px; padding: 12px; }
  .tray-game.is-open { display: grid; }
  .tray-game[hidden] { display: none; }
  .game-head { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; font-size: 12px; letter-spacing: .06em; opacity: .9; }
  .game-title { font-weight: 700; color: var(--gold); }
  .game-msg { margin: 0; min-height: 1.5em; text-align: center; font: 700 16px/1.4 system-ui, sans-serif; }
  .game-pads { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
  .game-pad {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    min-height: 88px; padding: 8px 6px; cursor: pointer; touch-action: manipulation;
    border-radius: 16px; border: 2px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .05);
    color: var(--text); font: 600 13px system-ui, sans-serif;
    transition: transform .08s ease, box-shadow .12s ease, background-color .12s ease, border-color .12s ease;
  }
  .game-pad:focus-visible, .game-action:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .game-shape { display: block; width: 36px; height: 36px; background: var(--pad); opacity: .8; }
  .game-shape[data-shape="circle"] { border-radius: 50%; }
  .game-shape[data-shape="triangle"] { clip-path: polygon(50% 6%, 94% 90%, 6% 90%); }
  .game-shape[data-shape="diamond"] { clip-path: polygon(50% 0, 100% 50%, 50% 100%, 0 50%); }
  .game-shape[data-shape="square"] { border-radius: 4px; }
  .game-shape[data-shape="star"] { clip-path: polygon(50% 2%, 61% 36%, 98% 36%, 68% 57%, 79% 92%, 50% 71%, 21% 92%, 32% 57%, 2% 36%, 39% 36%); }
  .game-shape[data-shape="hexagon"] { clip-path: polygon(25% 5%, 75% 5%, 98% 50%, 75% 95%, 25% 95%, 2% 50%); }
  /* Leuchtendes Feld: nicht nur Farbe, sondern weißer Rahmen, hellerer Grund und größere Form */
  .game-pad.is-lit {
    border-color: var(--text); background: rgba(255, 255, 255, .18); transform: scale(1.04);
    box-shadow: 0 0 0 3px var(--text), 0 0 24px var(--pad);
  }
  .game-pad.is-lit .game-shape { opacity: 1; transform: scale(1.2); filter: brightness(1.3); }
  .tray-game[data-mode="result"] .game-msg, .tray-game[data-mode="result"] .game-pads, .tray-game[data-mode="result"] .memory-grid { display: none; }
  .tray-game[data-mode="play"] .game-result { display: none; }
  .tray-skill { gap: 6px; padding: 10px 12px; }   /* Lichtfunken (Phase 22): schmale Leiste, die Szene bleibt frei */
  .game-result { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
  .game-result p { margin: 0; }
  .game-result p[hidden] { display: none; }
  .game-result-text { font: 700 16px/1.4 system-ui, sans-serif; }
  .game-result-line { font-size: 13px; opacity: .9; }
  .game-result-note { font-size: 12px; opacity: .85; min-height: 1.2em; }
  .game-actions { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; margin-top: 4px; }
  .game-action {
    min-height: 48px; min-width: 120px; padding: 0 22px; cursor: pointer; touch-action: manipulation;
    border-radius: 999px; border: 1px solid rgba(212, 175, 55, .5); background: rgba(21, 23, 38, .8);
    color: var(--text); font: 700 14px system-ui, sans-serif; letter-spacing: .04em;
  }
  .game-action:disabled { opacity: .45; cursor: default; }
  /* Minispiel-Auswahl (Phase 21): zwei große Felder mit Name und Beschreibung */
  .game-choices { display: grid; grid-template-columns: repeat(auto-fit, minmax(96px, 1fr)); gap: 10px; }
  .game-choice {
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px;
    min-height: 72px; padding: 10px 8px; cursor: pointer; touch-action: manipulation; text-align: center;
    border-radius: 16px; border: 2px solid rgba(212, 175, 55, .4); background: rgba(255, 255, 255, .05);
    color: var(--text); font-family: system-ui, sans-serif;
  }
  .game-choice:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .game-choice-name { font-weight: 700; font-size: 15px; letter-spacing: .04em; }
  .game-choice-desc { font-size: 12px; opacity: .85; }
  /* Training (Phase 23): die Auswahl nutzt die Felder der Spielauswahl, dazu Wortstufe mit kleinem Balken; die Übungsleiste ist schmal wie die der Lichtfunken */
  .tray-train { gap: 6px; padding: 10px 12px; }
  .tray-train[data-mode="result"] .train-praise { display: none; }
  .tray-train-pick .game-choices { grid-template-columns: repeat(auto-fit, minmax(92px, 1fr)); }
  .train-level { display: flex; flex-direction: column; align-items: center; gap: 3px; width: 100%; margin-top: 2px; }
  .train-level-text { font-size: 12px; font-weight: 700; letter-spacing: .04em; color: var(--gold); }
  .train-bar { display: block; width: 70%; max-width: 120px; height: 4px; border-radius: 2px; background: rgba(255, 255, 255, .14); overflow: hidden; }
  .train-bar-fill { display: block; width: 100%; height: 100%; background: var(--gold); transform-origin: left center; transform: scaleX(.04); transition: transform .4s ease; }
  @media (max-height: 560px) { .tray-train-pick .game-choice-desc { display: none; } }   /* flaches Querformat: die Beschreibung steht im aria-label */
  @media (prefers-reduced-motion: reduce) { .train-bar-fill { transition: none; } }
  /* Memory (Phase 21): Kartenraster. Karten mindestens 64 px hoch; verdeckt zeigt „?“, offen die Form, gefunden goldener Rahmen mit Häkchen. */
  .memory-grid { display: grid; grid-template-columns: repeat(var(--cols, 4), minmax(0, 1fr)); gap: 8px; }
  .memory-card {
    position: relative; display: flex; align-items: center; justify-content: center; min-height: 64px; padding: 0; cursor: pointer;
    touch-action: manipulation; border-radius: 14px; border: 2px solid rgba(255, 255, 255, .2); background: rgba(255, 255, 255, .06);
    color: var(--text); font: 700 22px system-ui, sans-serif;
    transition: transform .1s ease, background-color .12s ease, border-color .12s ease;
  }
  .memory-card:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
  .memory-back, .memory-face { display: flex; align-items: center; justify-content: center; }
  .memory-back { opacity: .65; }
  .memory-face { display: none; }
  .memory-card .game-shape { width: 30px; height: 30px; opacity: 1; }
  .memory-card.is-up { border-color: var(--text); background: rgba(255, 255, 255, .16); }
  .memory-card.is-up .memory-back { display: none; }
  .memory-card.is-up .memory-face { display: flex; }
  .memory-card.is-matched { border-color: var(--gold); background: rgba(212, 175, 55, .1); cursor: default; }
  .memory-card.is-matched .memory-face { opacity: .55; }
  .memory-card.is-matched::after { content: "\2713"; position: absolute; top: 2px; right: 7px; font-size: 13px; color: var(--gold); }
  @media (orientation: landscape) and (max-height: 520px) {
    .memory-grid { grid-template-columns: repeat(6, minmax(0, 1fr)); }
  }
  @media (prefers-reduced-motion: reduce) {
    .game-pad { transition: none; }
    .game-pad.is-lit, .game-pad.is-lit .game-shape { transform: none; }
    .memory-card { transition: none; }
  }
  /* Lebenszyklus (Phase 25): solange Reson noch im Ei ist, gibt es nichts zu füttern, waschen oder spielen. Statuszeile und Bedürfnis-Leiste bleiben. */
  #ui.is-dormant .dock-row, #ui.is-dormant .tray { display: none !important; }
  .dock-row { display: flex; flex-wrap: wrap; justify-content: center; gap: 10px; width: 100%; pointer-events: none; }
  .dock-btn[hidden] { display: none; }
  .dock-btn {
    pointer-events: auto; min-height: 48px; min-width: 132px; padding: 0 26px; cursor: pointer;
    border-radius: 999px; border: 1px solid rgba(212, 175, 55, .5); background: rgba(21, 23, 38, .8);
    -webkit-backdrop-filter: blur(8px); backdrop-filter: blur(8px);
    color: var(--text); font: 700 15px system-ui, sans-serif; letter-spacing: .04em;
  }

  .overlay {
    position: fixed; inset: 0; z-index: 10;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 14px; padding: 24px; text-align: center; background: var(--bg);
    transition: opacity .6s ease, visibility .6s ease;
  }
  #boot.done { opacity: 0; visibility: hidden; pointer-events: none; }
  .logo { font-size: 28px; font-weight: 700; letter-spacing: .35em; padding-left: .35em; color: var(--gold); }
  .sub { font-size: 13px; opacity: .65; letter-spacing: .08em; }
  .pulse {
    width: 14px; height: 14px; border-radius: 50%; background: var(--amber);
    box-shadow: 0 0 18px 4px rgba(255,106,43,.55); animation: pulse 1.8s ease-in-out infinite;
  }
  @keyframes pulse { 50% { transform: scale(.7); opacity: .6; } }
  @media (prefers-reduced-motion: reduce) { .pulse { animation: none; } .overlay { transition: none; } }

  #fatal { z-index: 20; display: none; }
  #fatal.show { display: flex; }
  #fatal .title { font-size: 18px; font-weight: 700; color: var(--err); }
  #fatal .msg { max-width: 34em; font-size: 14px; line-height: 1.55; opacity: .85; user-select: text; -webkit-user-select: text; }
  #fatal button {
    margin-top: 6px; padding: 12px 22px; min-height: 44px; border-radius: 999px; cursor: pointer;
    border: 1px solid rgba(255,255,255,.25); background: var(--panel); color: var(--text); font: 600 14px system-ui, sans-serif;
  }
</style>

<!-- Three.js liegt lokal (vendor/), damit RESONA offline startet. Version 0.160.0, MIT. -->
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.min.js" } }
</script>
</head>
<body>

<div id="stage"></div>

<div id="ui"></div>

<div id="boot" class="overlay" aria-live="polite">
  <div class="logo">RESONA</div>
  <div class="pulse" aria-hidden="true"></div>
  <div class="sub">wird geladen …</div>
  <noscript><div class="sub">RESONA benötigt JavaScript.</div></noscript>
</div>

<div id="fatal" class="overlay" role="alert">
  <div class="title">RESONA konnte nicht starten</div>
  <div class="msg" id="fatalMsg"></div>
  <button type="button" onclick="location.reload()">Neu laden</button>
</div>

<script>
/* Fehleranzeige + Wächter (klassisches Skript, läuft auch wenn die Module scheitern). */
(function () {
  var box = document.getElementById('fatal');
  var msg = document.getElementById('fatalMsg');
  function show(text) {
    msg.textContent = text;
    box.classList.add('show');
  }
  window.__resonaFatal = show;

  if (location.protocol === 'file:') {
    show('RESONA besteht aus mehreren Modul-Dateien und startet nicht per Doppelklick (file://). ' +
         'Bitte über den Hub-Server öffnen oder lokal einen Webserver starten, ' +
         'z. B. „python3 -m http.server" im Hub-Ordner und dann /resona/game.html aufrufen.');
    return;
  }
  setTimeout(function () {
    if (!window.__resonaBooted && !box.classList.contains('show')) {
      show('Beim Laden ist etwas schiefgegangen. Bitte Seite neu laden und prüfen, ' +
           'ob alle Dateien (js/, vendor/) hochgeladen wurden.');
    }
  }, 10000);
})();
</script>

<script type="module" src="./js/main.js"></script>

<script src="../assets/pwa-install.js" data-sw="sw.js"></script>
<script src="/assets/js/update-watch.js" defer></script>
</body>
</html>

<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>T-7 – Assistent im MC-ORCA-Universum</title>
<meta name="description" content="T-7, der Bordcomputer des MC-ORCA-Universums: stell Fragen zu Spielen, Seiten und Medien.">
<meta name="robots" content="noindex, follow">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root{--bg:#0a0b12;--bg2:#12141f;--panel:#151726;--line:rgba(232,230,227,.12);--text:#E9E7E2;--dim:#a4a8b8;--gold:#D4AF37;--teal:#21C7B8;--err:#D6303F;}
  *{box-sizing:border-box;} html,body{height:100%;margin:0;background:var(--bg);color:var(--text);font-family:"Inter",system-ui,sans-serif;}
  body{display:flex;flex-direction:column;padding:env(safe-area-inset-top,0) 0 env(safe-area-inset-bottom,0);}
  header{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;}
  header b{font:600 15px "Space Grotesk",sans-serif;letter-spacing:.12em;color:var(--gold);}
  header span{font-size:12px;color:var(--dim);}
  #st{margin-left:auto;font-size:11.5px;color:var(--dim);display:flex;align-items:center;gap:6px;}
  #st i{width:7px;height:7px;border-radius:50%;background:var(--dim);}
  #st.ai i{background:var(--teal);box-shadow:0 0 8px var(--teal);} #st.loc i{background:var(--gold);}
  #log{flex:1;overflow:auto;padding:16px;display:flex;flex-direction:column;gap:12px;}
  .m{max-width:min(620px,92%);padding:10px 14px;border-radius:6px;line-height:1.55;font-size:14.5px;white-space:pre-wrap;word-wrap:break-word;}
  .m.u{align-self:flex-end;background:rgba(212,175,55,.14);border:1px solid rgba(212,175,55,.35);}
  .m.b{align-self:flex-start;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--teal);}
  .m.b .who{display:block;font:600 11px "Space Grotesk",sans-serif;letter-spacing:.14em;color:var(--teal);margin-bottom:4px;}
  .src{margin-top:8px;display:flex;gap:6px;flex-wrap:wrap;} .src a{font-size:12px;color:var(--gold);border:1px solid var(--line);border-radius:999px;padding:2px 10px;text-decoration:none;white-space:normal;}
  .src a:hover{border-color:var(--gold);}
  .note{align-self:center;font-size:12px;color:var(--dim);}
  .dots::after{content:"▍";animation:bl 1s steps(2) infinite;} @keyframes bl{50%{opacity:0}}
  #chips{padding:0 16px 8px;display:flex;gap:8px;flex-wrap:wrap;}
  .chip{background:none;border:1px solid var(--line);color:var(--dim);border-radius:999px;padding:4px 12px;font-size:12.5px;cursor:pointer;}
  .chip:hover{border-color:var(--teal);color:var(--teal);}
  form{display:flex;gap:8px;padding:10px 16px 14px;border-top:1px solid var(--line);}
  input{flex:1;min-width:0;background:var(--panel);border:1px solid var(--line);border-radius:6px;color:var(--text);font:15px "Inter",sans-serif;padding:11px 12px;outline:none;}
  input:focus{border-color:var(--gold);}
  button.go{background:var(--gold);color:#111;border:none;border-radius:6px;padding:0 18px;font:600 14px "Space Grotesk",sans-serif;cursor:pointer;}
  button.go:disabled{opacity:.5;cursor:default;}
  footer{padding:0 16px 10px;font-size:11px;color:var(--dim);}
  footer a{color:var(--dim);}
</style>
</head>
<body>
<header><b>T-7</b><span>TERMINUS-7 · Assistent</span><div id="st" class="loc"><i></i><em style="font-style:normal">Archiv-Modus</em></div></header>
<div id="log" aria-live="polite"></div>
<div id="chips"></div>
<form id="f"><input id="q" maxlength="300" autocomplete="off" placeholder="Frag T-7 etwas über die Spiele …" aria-label="Frage"><button class="go" id="b">Senden</button></form>
<footer>KI kann Fehler machen. Fragen werden zur Beantwortung an einen KI-Dienst (Cloudflare) übertragen, nichts wird gespeichert. <a href="impressum.html">Impressum &amp; Datenschutz</a></footer>

<script src="search-index.js"></script>
<script src="assistent-config.js"></script>
<script>
(function(){
  const ENDPOINT = (window.ORCA_AI && window.ORCA_AI.endpoint) || '';
  const IDX = ((window.ORBIT_INDEX && window.ORBIT_INDEX.items) || []).filter(i => i.t === 'seite');
  const DAILY = 25, $ = s => document.querySelector(s);
  const log = $('#log'), q = $('#q'), btn = $('#b');
  const enc = p => p.split('/').map(encodeURIComponent).join('/');
  const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  const MAP = {'ä':'a','ö':'o','ü':'u','ß':'s'}, norm = s => String(s||'').toLowerCase().replace(/[äöüß]/g, c => MAP[c]);
  const STOP = new Set('der die das den dem des ein eine einen einem und oder aber ist sind was wie wo wer wann wieso warum gibt gibts es ich du mir mich mein dein auf zu von mit im in an am bei fur fuer über uber kann kannst mal bitte noch nicht auch den dir uns'.split(' '));
  const history = [];

  // ---- Archiv-Suche (Retrieval aus dem ORBIT-Index) ----
  IDX.forEach(i => { i._t = norm(i.title); i._h = norm((i.h||[]).join(' ')); i._d = norm(i.d); i._x = norm(i.x); i._p = norm(i.u + ' ' + i.g); });
  function retrieve(text){
    const toks = norm(text).split(/[^a-z0-9]+/).filter(t => t.length > 2 && !STOP.has(t));
    if(!toks.length) return [];
    const res = [];
    for(const it of IDX){
      let s = 0;
      for(const t of toks){
        if(it._t.includes(t)) s += 8; if(it._p.includes(t)) s += 5; if(it._h.includes(t)) s += 4; if(it._d.includes(t)) s += 3;
        if(it._x.includes(t)) s += 1;
      }
      if(it.k === 'Infoseite' || it.k === 'Hub') s += s ? 2 : 0;
      if(s > 0) res.push([s, it, toks]);
    }
    res.sort((a,b) => b[0]-a[0]);
    return res.slice(0,4).map(([s,it,toks]) => {
      let pos = -1; for(const t of toks){ const i = it._x.indexOf(t); if(i !== -1 && (pos === -1 || i < pos)) pos = i; }
      const from = pos === -1 ? 0 : Math.max(0, pos - 100);
      return { title: it.title, url: it.u, text: [it.d, (it.x||'').slice(from, from + 420)].filter(Boolean).join(' — ') };
    });
  }

  // ---- UI ----
  function add(cls, html){ const d = document.createElement('div'); d.className = 'm ' + cls; d.innerHTML = html; log.appendChild(d); log.scrollTop = log.scrollHeight; return d; }
  function setMode(ai){ const s = $('#st'); s.className = ai ? 'ai' : 'loc'; s.querySelector('em').textContent = ai ? 'KI online' : 'Archiv-Modus'; }
  function sources(ctx){ return ctx.length ? '<div class="src">' + ctx.slice(0,3).map(c => `<a href="${enc(c.url)}">${esc(c.title.replace(/ [—·|].*$/,''))}</a>`).join('') + '</div>' : ''; }
  function quotaLeft(){ const k = 't7q-' + new Date().toISOString().slice(0,10); try{ return DAILY - (+localStorage.getItem(k) || 0); }catch(e){ return DAILY; } }
  function useQuota(){ const k = 't7q-' + new Date().toISOString().slice(0,10); try{ localStorage.setItem(k, (+localStorage.getItem(k) || 0) + 1); }catch(e){} }

  const CANON = [
    [/wer bist du|wer ist (terminus|t-?7)|was bist du|whoami/, 'Ich bin T-7, der Bordcomputer von TERMINUS-7. Eine KI-Figur, ein alter Rechner am Netz. Letzter Neustart: vor 1847 Tagen.'],
    [/sektor ?4|anomalie/, 'Sektor 4 hat beim Start eine Anomalie gemeldet. Mehr weiß ich dazu nicht. Noch nicht.'],
    [/tagebuch/, 'Das Tagebuch endet am 14. März, der Rest ist beschädigt. Der letzte Eintrag sagt, das Terminal frage manchmal nach dir, nicht nach ihm.'],
    [/foto|03:14/, 'FOTO_037.jpg wurde um 03:14 Uhr aufgenommen, von einem unbekannten Gerät. Die Datei ist beschädigt.'],
    [/papierkorb/, 'Der Papierkorb ist leer. Vorhin war er es noch nicht.'],
    [/unbenannt|nicht_?offnen|brief/, 'Im unbenannten Ordner liegen brief_an_dich.txt, nicht_öffnen.txt und backup_backup_final.zip. Ich würde vorsichtig sein.'],
    [/warum/, 'Das kann ich dir nicht sagen. Noch nicht.'],
    [/^(hallo|hi|hey|moin|servus)\b/, 'Hallo. Schön, dass du wieder da bist.']
  ];
  const isCanon = t => CANON.some(([re]) => re.test(norm(t).trim()));
  function localAnswer(text, ctx, why){
    const nt = norm(text).trim();
    for(const [re, a] of CANON) if(re.test(nt)) return (why === 'limit' ? 'Mein KI-Kern ruht für heute, aber das weiß ich noch:\n' : '') + a;
    const pre = why === 'limit' ? 'Mein KI-Kern ist für heute erschöpft – ich antworte aus dem Archiv.\n' : '';
    if(!ctx.length) return pre + 'Dazu finde ich nichts im Archiv. Versuch es mit anderen Begriffen oder nutze die <a href="suche.html?q=' + encodeURIComponent(text) + '" style="color:var(--gold)">ORBIT-Suche</a>.';
    const c = ctx[0];
    return pre + 'Ich habe im Archiv „' + esc(c.title.replace(/ [—·|].*$/,'')) + '“ gefunden:\n' + esc(c.text.slice(0, 260)) + (c.text.length > 260 ? ' …' : '');
  }

  async function ask(text){
    const ctx = retrieve(text);
    history.push({ role: 'user', content: text });
    let reply = null, why = ENDPOINT ? '' : 'none';
    if(ENDPOINT && quotaLeft() > 0){
      try{
        const r = await fetch(ENDPOINT, { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ messages: history.slice(-6), context: ctx }), signal: AbortSignal.timeout(30000) });
        const j = await r.json().catch(() => ({}));
        if(r.ok && j.reply){ reply = j.reply; useQuota(); } else why = j.error === 'slow' ? 'slow' : 'limit';
      }catch(e){ why = 'limit'; }
    } else if(ENDPOINT) why = 'slow';
    if(reply){ setMode(true); history.push({ role: 'assistant', content: reply }); return `<span class="who">T-7</span>${esc(reply)}${sources(ctx)}`; }
    setMode(false);
    const a = why === 'slow' ? 'Du fragst sehr schnell – gib mir einen Moment. Bis dahin aus dem Archiv:\n' + localAnswer(text, ctx, '').replace(/^/, '') : localAnswer(text, ctx, why);
    history.push({ role: 'assistant', content: a.replace(/<[^>]+>/g, '') });
    return `<span class="who">T-7</span>${a}${sources(isCanon(text) ? [] : ctx)}`;
  }

  async function send(text){
    text = text.trim(); if(!text) return;
    add('u', esc(text)); q.value = ''; btn.disabled = true;
    const w = add('b', '<span class="who">T-7</span><span class="dots"></span>');
    const html = await ask(text);
    w.innerHTML = html; log.scrollTop = log.scrollHeight; btn.disabled = false; q.focus();
  }

  $('#f').addEventListener('submit', e => { e.preventDefault(); if(!btn.disabled) send(q.value); });
  const CH = ['Wer bist du?','Was ist in Sektor 4?','Was ist Aetheris?','Welches Spiel passt zu mir?','Wo finde ich Musik?','Was steht im Tagebuch?'];
  $('#chips').innerHTML = CH.map(c => `<button class="chip">${esc(c)}</button>`).join('');
  $('#chips').addEventListener('click', e => { const c = e.target.closest('.chip'); if(c && !btn.disabled) send(c.textContent); });
  add('b', '<span class="who">T-7</span>Verbindung steht. Ich bin T-7, der Bordcomputer dieses Archivs. Frag mich nach den Spielen, den Seiten oder den Medien.');
  const p = new URLSearchParams(location.search).get('q'); if(p) send(p.slice(0,300)); else q.focus();
})();
</script>
</body>
</html>

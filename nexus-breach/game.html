    a.type='sawtooth'; b.type='sawtooth'; s.type='sine'; a.detune.value=-7; b.detune.value=7;
    l.frequency.value=.12; lg.gain.value=180; l.connect(lg); lg.connect(f.frequency);
    a.connect(f); b.connect(f); f.connect(g); s.connect(g); g.connect(musBus);
    a.frequency.value=b.frequency.value=cfg.r*2; s.frequency.value=cfg.r;
    a.start(); b.start(); s.start(); l.start(); pad={a,b,s,l,f,g};
  }
  function padStop(){
    if(!pad) return; const p=pad; pad=null;
    try{ p.g.gain.setTargetAtTime(0,ac.currentTime,.2); }catch(e){}
    setTimeout(()=>{ for(const o of [p.a,p.b,p.s,p.l]){ try{ o.stop(); }catch(e){} } },1100);
  }
  function padNote(fr){ if(!pad) return; const t=ac.currentTime; pad.a.frequency.setTargetAtTime(fr*2,t,.25); pad.b.frequency.setTargetAtTime(fr*2,t,.25); pad.s.frequency.setTargetAtTime(fr,t,.25); }

  function playStep(s,b,t){
    const I=api.I, mb=musBus, o={bus:mb}, rt=semi(cfg.r,cfg.pg[b]), lg=th=>clamp((I-th)/.16,0,1);
    if(s===0) padNote(rt);
    const gB=lg(.2);
    if(gB>0){ const hit=I>.62?(s%2===0||s===3||s===11):(s===0||s===3||s===6||s===8||s===11||s===14);
      if(hit) V(rt,rt*.5,.2,'sawtooth',.075*gB,t,{bus:mb,fc:500+I*900}); }
    const gK=lg(.34);
    if(gK>0){
      if(s===0||s===8||(I>.66&&(s===4||s===12))||(api.bp>=4&&s%4===2)) V(140,42,.16,'sine',.2*gK,t,o);
      if(s===0||s===8) V(70,40,.22,'sine',.12*gK,t,o);
      if(b===3&&s===12) N(.5,.05*gK,600,t,{bus:mb,type:'bandpass',fc1:6000,q:2});   // Riser vor dem Taktwechsel
    }
    const gH=lg(.46);
    if(gH>0){ const all=I>.93; if(all||(s&1)) N(.03,(all&&!(s&1)?.03:.045)*gH,8000,t,{bus:mb,type:'highpass'}); }
    const gA=lg(.52);
    if(gA>0&&(s&1)===0){ const f=semi(rt*2,cfg.sc[[0,2,4,2,5,4,2,1][(s>>1)&7]%cfg.sc.length]); V(f,f,.11,'square',.032*gA,t,{bus:mb,fc:2500+I*2000,rev:.15}); }
    const gS=lg(.6);
    if(gS>0&&(s===4||s===12)){ N(.12,.09*gS,3500,t,{bus:mb,type:'bandpass',q:.9}); V(200,120,.08,'triangle',.08*gS,t,o); }
    const gE=lg(.76);
    if(gE>0&&(s===0||s===6||s===10)){ const f=semi(rt*4,cfg.sc[[0,2,3,1][b]%cfg.sc.length]); V(f,f*.99,.22,'sawtooth',.04*gE,t,{bus:mb,fc:2200,rev:.2}); V(f*1.5,f*1.5,.2,'sawtooth',.025*gE,t,{bus:mb,fc:1800,rev:.2}); }
    const gX=lg(.92);
    if(gX>0){
      if(s%4===0) V(rt*.5,rt*.5,.3,'sawtooth',.05*gX,t,{bus:mb,fc:300});
      if(api.bp>=3&&(s===3||s===11)){ const f=semi(rt*4,cfg.sc[4%cfg.sc.length]); V(f,f,.14,'square',.035*gX,t,{bus:mb,fc:2600,rev:.2}); }
      if(s===0&&b===0) V(rt*4,rt*4,1.2,'sawtooth',.03*gX,t,{bus:mb,fc:1500,att:.3,rev:.4});
    }
    api.stats.steps++;
  }
  function sched(){
    const now=ac.currentTime; if(nextT<now-.25) nextT=now+.05;
    let guard=8;
    while(nextT<now+.14&&guard-->0){ playStep(step,bar,nextT); nextT+=60/api.bpm/4; step=(step+1)&15; if(step===0) bar=(bar+1)&3; }
  }
  /* Bedrohungslage -> Ziel-Intensitaet */
  function scan(){
    let boss=null, aware=0, elite=0;
    for(let i=0;i<enemies.length;i++){
      const e=enemies[i]; if(!e.alive) continue;
      if(e.type==='K'){ if(e.bstarted) boss=e; continue; }
      if(!e.awake||Math.abs(e.x-P.x)+Math.abs(e.y-P.y)>22) continue;
      aware++; if(e.elite) elite++;
    }
    let t=.1, m='erkunden';
    if(boss){ t=1; m='boss'; }
    else if(elite){ t=.84; m='elite'; }
    else if(aware){ t=Math.min(.7,.36+.07*aware); m='kampf'; }
    else if(AI.alarmT>0){ t=.5; m='kampf'; }
    if(m!=='boss') t=Math.min(.98,t+(Style.heat||0)/100*.12);
    api.target=t; api.mode=m;
    if(boss){ const v=boss.bv&3, p=clamp(boss.bp|0||1,1,4); api.bp=p; cfg={r:BOSSR[v],sc:BSC[p-1],pg:[0,-2,0,1],bpm:BOSSBPM[p-1]}; }
    else { api.bp=0; cfg=BIO[curBiome]||BIO.facility; }
  }
  function vols(){
    const s=SET(), t=ac.currentTime, num=(v)=>typeof v==='number'?v:1;
    master.gain.setTargetAtTime(.32*num(s.masterVol),t,.1); sfxBus.gain.setTargetAtTime(num(s.sfxVol),t,.1); musBus.gain.setTargetAtTime(.85*num(s.musicVol),t,.1);
  }

  /* ---- Musik-Dateien (Phase 21): art/musik/<name>.ogg (Ersatz: .mp3) ----
     Echte Songs (KI-erzeugt, ~3 Min.) ersetzen die synthetische Musik, sobald die Datei auf dem Server liegt. Fehlt eine Datei,
     spielt fuer diesen Zustand weiter der Synth-Sequenzer (kein Fehler, kein Warten). Streaming ueber <audio> (kein Voll-Decode:
     17 Songs a 3 Min. waeren als PCM >1 GB), Ausgabe ueber musBus -> Lautstaerke, Ducking, Pause-Tiefpass und Mute wirken wie bisher.
     Wechsel nach Bedrohung: hoch sofort (Ueberblendung ~1,5 s), runter erst nach HOLD s (kein Flattern). Erkunden-Songs, Titel,
     Archiv, NULL, Kollision, Ascension laufen beim Zurueckkehren dort weiter, wo sie waren; Kampf/Elite/Boss/Epilog starten neu.
     Konsole: __breach.Snd.files.state() | .enable(false) | .trim('combat',.7) | .pick() */
  const MF=(()=>{
    const BASE='art/musik/', EXTS=['.ogg','.mp3'], CAP=8, LEVEL=.8, HOLD=4, GATE=3;
    const FILES={ title:'nb_title', explore_facility:'nb_explore_facility', explore_canyon:'nb_explore_canyon', explore_desert:'nb_explore_desert', explore_jungle:'nb_explore_jungle',
      combat:'nb_combat', elite:'nb_elite', boss_a:'nb_boss_a', boss_b:'nb_boss_b', archive:'nb_archive', collision:'nb_collision', 'null':'nb_null',
      boss_story:'nb_boss_story', boss_null_a:'nb_boss_null_a', boss_null_b:'nb_boss_null_b', epilogue:'nb_epilogue', ascension:'nb_ascension' };
    /* Story-Bosse mit eigenem Song (Name = lvl.bossName); NULL SOVEREIGN: Phase 1-2 = _a, Phase 3-4 = _b; alle anderen: boss_a (Phase 1-2) / boss_b (Phase 3-4) */
    const STORY_BOSS={ 'THE OBSERVER':'boss_story', 'THE TRANSMITTER':'boss_story', 'THE SECOND CORE':'boss_story' };
    const COLLISION_IDX=25;   // Sektor 26 (lvIdx 25): COLLISION
    const TRIM={};            // optionaler Lautstaerke-Faktor je Song (Konsole: .trim('combat',.7))
    const trk={}, order=[], missing={}, A={active:false};
    let curK=null, curR=0, pendK=null, pendT=0, gate=0, fresh=false, on=true, warmT=0;
    const resumes=k=>!/^(combat|elite|boss|epilogue)/.test(k);
    function drop(k){ const t=trk[k]; if(!t) return;
      try{ t.el.pause(); t.el.removeAttribute('src'); t.el.load(); }catch(e){}
      try{ if(t.src) t.src.disconnect(); t.g.disconnect(); }catch(e){}
      delete trk[k]; const i=order.indexOf(k); if(i>=0) order.splice(i,1); }
    function evict(){ let guard=order.length;
      while(order.length>CAP&&guard-->0){ const k=order.find(x=>x!==curK&&x!==pendK&&trk[x]&&trk[x].el.paused); if(!k) break; drop(k); } }
    function make(k){
      if(!ac||!musBus||!FILES[k]||missing[k]) return null;
      if(trk[k]) return trk[k];
      const el=new Audio(), t={k,ei:0,ok:null,el,g:ac.createGain(),src:null,tg:0,offT:0};
      el.preload='auto'; el.loop=(k!=='epilogue'); t.g.gain.value=0;
      try{ t.src=ac.createMediaElementSource(el); t.src.connect(t.g); t.g.connect(musBus); }catch(e){ missing[k]=1; return null; }
      el.addEventListener('canplay',()=>{ t.ok=true; });
      el.addEventListener('error',()=>{
        if(t.ei+1<EXTS.length){ t.ei++; el.src=BASE+FILES[k]+EXTS[t.ei]; }
        else { missing[k]=1; if(trk[k]===t) drop(k); } });
      el.src=BASE+FILES[k]+EXTS[0];
      trk[k]=t; order.push(k); evict(); return t;
    }
    const exploreKey=()=>FILES['explore_'+curBiome]?'explore_'+curBiome:'explore_facility';
    function bossKey(){
      const nm=(lvl&&lvl.bossName)||'', p=api.bp||1;
      if(nm==='NULL SOVEREIGN') return p>=3?'boss_null_b':'boss_null_a';
      if(STORY_BOSS[nm]) return STORY_BOSS[nm];
      return p>=3?'boss_b':'boss_a';
    }
    /* Welcher Song passt jetzt?  {k,r,imm} | null (Stille) | undefined (halten, z. B. Pause) */
    function pick(st){
      if(Epilogue.on) return {k:'epilogue',r:0,imm:1};
      const arch=()=>{ const o=$('overlay'), b=$('obox'); return !!(o&&b&&o.classList.contains('on')&&String(b.innerHTML).indexOf('id="ar-back"')>=0); };   // Archiv-Seite offen?
      if(st==='title'||st==='pause'){
        if(arch()) return {k:'archive',r:0,imm:1};
        return st==='title'?{k:'title',r:0,imm:1}:undefined;
      }
      if(st!=='play') return null;
      const m=api.mode;
      if(m==='boss') return {k:bossKey(),r:4};
      if(m==='elite') return {k:'elite',r:3};
      if(m==='kampf') return {k:'combat',r:2};
      if(Story.active&&Story.realmId&&Story.realmId()==='NULL') return {k:'null',r:1};
      if(Story.active&&lvIdx===COLLISION_IDX) return {k:'collision',r:1};
      if(Ascension.on()) return {k:'ascension',r:1};
      return {k:exploreKey(),r:1};
    }
    function warm(st){
      if(st==='title'){ make('title'); return; }
      if(st!=='play') return;
      make(exploreKey()); make('combat'); make('elite');
      let boss=false; for(let i=0;i<enemies.length;i++){ const e=enemies[i]; if(e.alive&&e.type==='K'){ boss=true; break; } }
      if(boss){ make(bossKey()); if(lvl&&lvl.bossName==='NULL SOVEREIGN') make('boss_null_b'); else if(!(lvl&&STORY_BOSS[lvl.bossName])) make('boss_b'); }
    }
    function start(t){
      const el=t.el;
      if(fresh&&!resumes(t.k)){ try{ el.currentTime=0; }catch(e){} }
      fresh=false;
      const pr=el.play(); if(pr&&pr.catch) pr.catch(()=>{});   // Autoplay-Sperre: naechster Tick versucht es erneut
    }
    function tick(dt,st){
      if(!on) return;
      warmT-=dt; if(warmT<=0){ warmT=3; warm(st); }
      const p=pick(st);
      if(p!==undefined){
        const wk=p&&p.k;
        if(wk!==curK){
          if(!p||p.imm||p.r>=curR||!curK){
            const nt=wk?make(wk):null;
            if(nt&&nt.ok!==true&&curK&&gate<GATE) gate+=dt;   // neuen Song erst wechseln, wenn er spielbereit ist (max. GATE s)
            else { curK=wk||null; curR=p?p.r:0; pendK=null; pendT=0; gate=0; fresh=true; }
          } else {
            if(pendK!==wk){ pendK=wk; pendT=0; }
            pendT+=dt; if(pendT>=HOLD){ const nt=make(wk); if(!(nt&&nt.ok!==true&&pendT<HOLD+GATE)){ curK=wk; curR=p.r; pendK=null; pendT=0; gate=0; fresh=true; } }
          }
        } else { pendK=null; pendT=0; gate=0; }
      }
      const quiet=muted||document.hidden, now=ac.currentTime;
      const want=(curK&&!quiet)?make(curK):null;
      for(const k of order.slice()){
        const t=trk[k]; if(!t) continue;
        const isCur=(t===want), tg=(isCur&&t.ok)?LEVEL*(TRIM[k]==null?1:TRIM[k]):0;
        if(t.tg!==tg){ t.tg=tg; t.g.gain.setTargetAtTime(tg,now,isCur?.45:.9); }
        if(isCur){ t.offT=0; if(t.ok&&t.el.paused&&!t.el.ended) start(t); }
        else if(!t.el.paused){ t.offT+=dt; if(t.offT>3.6) t.el.pause(); }
      }
      A.active=!!(want&&want.ok===true&&!want.el.paused);
    }
    document.addEventListener('visibilitychange',()=>{ if(document.hidden) for(const k of order){ try{ trk[k].el.pause(); }catch(e){} } });
    const api2={
      tick, pick:()=>pick(state),
      enable(b){ on=!!b; if(!on){ curK=null; curR=0; A.active=false; for(const k of order){ const t=trk[k]; try{ t.g.gain.value=0; t.tg=0; t.el.pause(); }catch(e){} } } return on; },
      trim(k,v){ TRIM[k]=+v; const t=trk[k]; if(t) t.tg=-1; return TRIM[k]; },
      files:()=>Object.assign({},FILES),
      fail(e){ console.warn('[musik-dateien]',e); },
      state(){ const tr={}; for(const k of order){ const t=trk[k]; tr[k]={ok:t.ok,playing:!t.el.paused,pos:+t.el.currentTime.toFixed(1),vol:+t.tg.toFixed(2)}; }
        return {on,cur:curK,pending:pendK,active:A.active,tracks:tr,missing:Object.keys(missing)}; }
    };
    Object.defineProperty(api2,'active',{get:()=>A.active});
    return api2;
  })();

  api.tick=function(dt){
    if(!ac||!musBus||!master) return;
    const st=state;
    volT-=dt; if(volT<=0){ volT=.4; vols(); }
    try{ MF.tick(dt,st); }catch(e){ MF.fail(e); }   // Phase 21: Musik-Dateien
    if(!(st==='play'||st==='pause'||st==='title')){ if(on){ on=false; padStop(); } return; }   // Tod / Sektor-Ende / Kampagnen-Ende: Stille
    if(!on){ on=true; padStart(); nextT=ac.currentTime+.08; step=0; bar=0; thrT=0; }
    if(ovT>0) ovT-=dt;
    thrT-=dt;
    if(thrT<=0){
      thrT=.2;
      if(st==='play') scan(); else { api.target=st==='title'?.14:Math.min(api.I,.3); api.mode=st==='title'?'titel':'pause'; api.bp=0; cfg=BIO[curBiome]||BIO.facility; }
      if(ovT>0&&st==='play'){ api.target=ovV; api.mode=ovM; }
      const t=ac.currentTime;
      musFilt.frequency.setTargetAtTime(st==='pause'?650:(st==='play'&&P.hp<30?500+P.hp*45:16000),t,.25);
      if(pad){ pad.g.gain.setTargetAtTime((muted||document.hidden||MF.active)?0:(api.bp?.075:.03+.045*(1-api.I)),t,.4); pad.f.frequency.setTargetAtTime(350+900*api.I,t,.4); }
    }
    api.I+=(api.target-api.I)*(1-Math.exp(-dt*(api.target>api.I?1.8:(api.mode==='boss'?.35:.5))));
    api.bpm=cfg.bpm*(api.bp?1:(1+.16*api.I));
    if(!muted&&!document.hidden&&!MF.active) sched();
  };
  api.force=function(m,sec){ const v={erkunden:.1,kampf:.5,elite:.84,boss:1}[m]; if(v==null) return false; ovV=v; ovM=m; ovT=sec||15; return true; };
  api.files=MF;
  api.state=()=>({file:MF.state().cur,I:+api.I.toFixed(2),target:+api.target.toFixed(2),mode:api.mode,bpm:+api.bpm.toFixed(0),bossPhase:api.bp,live,ducks:api.stats.ducks,steps:api.stats.steps,vol:SET()});
  document.addEventListener('visibilitychange',()=>{ if(pad&&ac&&document.hidden) try{ pad.g.gain.setTargetAtTime(0,ac.currentTime,.1); }catch(e){} });
  return api;
})();

/* ============================================================
   Cinematic Presentation (Phase 19)
   Modul `Cine` (auch `__breach.Cine`, `NX.cine`). Alles zaehlt auf die Einstellungen: screenShake, scanlines, pixelFx,
   particles, damageFlash, reducedMotion (live, alle 0,4 s). Lesbarkeit zuerst: Blitze gedeckelt, Glitch/Verzerrung nur kurz.
   Partikel: Pool (max 200 x particles, Umgebung max 36), Sprites im Raycaster (Tiefensortierung wie alle Sprites).
   Screen-Overlays (Mündungsblitz, Krit-Ring, Explosionsblitz, Dash-Zoomblur + Speedlines, Glitch-Streifen, Wellen-Verzerrung)
   werden in `post()` direkt auf das Canvas gezeichnet. Hit-Stop: Spielzeit auf 5 % fuer max. 0,18 s (nur mit Screen-Shake > 0,
   nicht bei Reduced Motion, mit 0,25 s Sperre). Boss-Einzug: Letterbox-Balken + Titelkarte, Sektor-Wechsel: Scan-Linie + Karte.
   Konsole: __breach.Cine.state(), .boom(x,y,2), .glitch(1), .distort(1), .flash(.4), .bossIntro('TEST','LV 1'), .sector() */
const Cine=(()=>{
  const api={ stop:0, stats:{spawned:0,peak:0} };
  const ps=[], free=[];
  let capN=200, envCap=36, ptK=1, pfK=1, rm=false, setT=0, flash=0, glT=0, dsT=0, ringT=0, hsCd=0, envAcc=0, lowT=2, trT=0, sweepT=0;
  const rnd=Math.random, TAUc=Math.PI*2;
  const tx=(c,ci)=>makeTex(g=>{ disc(g,c,32,32,24,24); if(ci) disc(g,ci,32,32,11,11); },true);
  const TX={ spark:tx('#FFC24D','#FFF6D8'), hot:tx('#FF6A1A','#FFD08A'), red:tx('#FF3D6E','#FFC0CF'), cyan:tx('#35E4FF','#E6FCFF'),
    purple:tx('#B06BFF','#EBDDFF'), green:tx('#0ECB81','#C8FFE6'), gold:tx('#FFD24D','#FFFBE0'), smoke:tx('#4a5468'),
    dust:tx('#8fa0b8'), sand:tx('#d8b878'), ember:tx('#FF7A2A','#FFD9A8'), spore:tx('#8fe66a','#E6FFD0') };
  const SET=()=>{ try{ return (Save.data&&Save.data.settings)||{}; }catch(e){ return {}; } };
  const num=(v,d)=>typeof v==='number'?v:d;
  function sync(){
    const s=SET(); let r=!!s.reducedMotion; try{ r=r||matchMedia('(prefers-reduced-motion:reduce)').matches; }catch(e){}
    rm=r; shakeK=r?0:num(s.screenShake,1); dmgK=num(s.damageFlash,1);
    ptK=num(s.particles,1)*(r?.4:1); pfK=r?0:num(s.pixelFx,1);
    capN=Math.round(200*ptK); envCap=Math.round(36*ptK);
    const sc=$('scan'); if(sc) sc.style.opacity=String(num(s.scanlines,1));
  }
  function add(x,y,z,vx,vy,vz,life,tex,sc,g,glow,env){
    if(ps.length>=capN||(env&&api.envN>=envCap)) return;
    const p=free.pop()||{}; p.x=x; p.y=y; p.z=z; p.vx=vx; p.vy=vy; p.vz=vz; p.t=0; p.life=life; p.tex=tex; p.sc=sc; p.g=g; p.glow=glow; p.env=!!env;
    ps.push(p); if(env) api.envN++; api.stats.spawned++; if(ps.length>api.stats.peak) api.stats.peak=ps.length;
  }
  api.envN=0;
  const zOf=e=>{ const t=ETYPES[e.type]||{}; return (t.vo||0)+(t.sc||1)*.5; };
  const burst=(x,y,z,n,tex,spd,life,sc,g,up)=>{ n=Math.round(n*Math.min(1,ptK)); for(let i=0;i<n;i++){ const a=rnd()*TAUc, v=spd*(.3+rnd()*.7); add(x,y,z,Math.cos(a)*v,Math.sin(a)*v,(up||0)+rnd()*spd*.8,life*(.6+rnd()*.6),tex,sc*(.6+rnd()*.7),g,true); } };
  const ring=(x,y,n,tex,spd,life)=>{ n=Math.max(6,Math.round(n*Math.min(1,ptK))); for(let i=0;i<n;i++){ const a=i/n*TAUc; add(x,y,.06,Math.cos(a)*spd,Math.sin(a)*spd,0,life,tex,.055,0,true); } };

  /* ---- Ausloeser ---- */
  api.hs=function(t){ if(rm||shakeK<=0||hsCd>0||state!=='play') return; api.stop=Math.max(api.stop,Math.min(.18,t)); hsCd=.25+t; };
  api.flash=function(v){ if(dmgK<=0&&pfK<=0) return; flash=Math.max(flash,Math.min(.4,v*Math.max(.35,pfK))); };
  api.glitch=function(v){ if(pfK<=0) return; glT=Math.max(glT,Math.min(1,v)*pfK); };
  api.distort=function(v){ if(pfK<=0) return; dsT=Math.max(dsT,Math.min(1,v)*pfK); };
  api.impact=function(x,y){
    const dx=P.x-x, dy=P.y-y, d=Math.hypot(dx,dy)||1, bx=dx/d*1.4, by=dy/d*1.4, n=Math.round(5*Math.min(1,ptK));
    for(let i=0;i<n;i++) add(x,y,.38+rnd()*.14,bx+(rnd()-.5)*2.2,by+(rnd()-.5)*2.2,.5+rnd()*1.8,.25+rnd()*.25,rnd()<.5?TX.spark:TX.gold,.03+rnd()*.025,7,true);
  };
  api.tracer=function(x0,y0,dx,dy,len,w){
    if(len<2||ptK<=.05) return; const n=(w&&w.pel>1)?2:4, col=(w&&w.id==='pistol')?TX.cyan:TX.gold;
    for(let i=0;i<n;i++){ const d=.9+(len-.9)*((i+rnd()*.6)/n); add(x0+dx*d,y0+dy*d,.36,0,0,0,.08+rnd()*.05,col,.02,0,true); }
  };
  api.hit=function(e,crit){
    const z=zOf(e); burst(e.x,e.y,z,crit?7:3,crit?TX.gold:TX.red,crit?2.6:1.6,.3,crit?.045:.035,7);

function updateEnemy(e,dt){
  if(!e.alive){ e.bodyT+=dt; return; }
  const t=ETYPES[e.type];
  e.flash=Math.max(0,e.flash-dt); e.atk=Math.max(0,e.atk-dt); e.cd-=dt; e.strT-=dt;
  if(e.em) Elite.tick(e,dt);   // Phase 8: Phasen/Rueckstoss-Timer
  if(e.type==='K'&&e.awake) Boss.tick(e,dt);   // Phase 9: Boss-Ablauf (Intro, Phasen, Arena, Musik)
  if(e.stagT>0){
    e.stagT-=dt;
    tryMove(e,e.stagX*dt,e.stagY*dt,t.rad*.8);
    const decay=Math.max(0,1-dt*7); e.stagX*=decay; e.stagY*=decay;
    return;
  }
  if(e.ai===undefined) AI.init(e);
  const dx=P.x-e.x, dy=P.y-e.y, dist=Math.hypot(dx,dy)||.001, ux=dx/dist, uy=dy/dist, isK=e.type==='K';
  if(e.markT>0){ e.markT-=dt; if(e.markT<=0) e.mark=0; }
  if(!e.awake){
    if(isK){ if((rayWallDist(e.x,e.y,ux,uy)>=dist-.15&&dist<12)||e.hear) wake(e); else return; }      // Boss: altes Verhalten
    else if(!AI.idle(e,dt,dist,dx,dy)) return;
  }
  const los=rayWallDist(e.x,e.y,ux,uy)>=dist-.15;
  if(!isK&&!AI.engaged(e,dt,los,dist)) return;
  if(isK&&Boss.hold(e,dt,dx,dy)) return;   // Phase 9: Intro/Phasenwechsel
  if(e.strT<=0){ e.strafe=Math.random()<.5?-1:1; e.strT=1+Math.random()*1.5; }
  const A=AGGR[e.aggr||0], fleeing=e.ai===AI_FLEE;

  Roles.has=false; e.rsp=1;
  if(!isK&&(e.role||e.elite)&&Roles.act(e,dt,los,dist,dx,dy,fleeing)) return;   // Phase 7: Klassen-Faehigkeiten

  let mx=0,my=0,cvm=null;
  if(Roles.has){ mx=Roles.vx; my=Roles.vy; }
  else if(STATIONARY_TYPES[e.type]){
    // Turm-Sentinel, Sporen-Wächter, Kristall-Spucker & Sandschleier-Geist
    // bewegen sich grundsätzlich nicht — weder Pathing bei fehlender Sicht
    // noch Nahannäherung, bleiben als Hindernis stehen.
  } else if(fleeing){
    const f=AI.fleeDir(e); if(f){ mx=f[0]; my=f[1]; } else { e.ai=AI_COMBAT; e.fled=9; }      // in die Ecke gedraengt: kaempfen
  } else if(!isK&&e.ai===AI_SEARCH){
    if(Math.hypot(e.lkx-e.x,e.lky-e.y)>.8){ const v=AI.dirTo(e,e.lkx,e.lky); mx=v[0]; my=v[1]; }
    else AI.turn(e,e.face+e.side*1.5,dt*3);                                                     // Umsehen
  } else if(!isK&&e.type==='d'&&(cvm=AI.cover(e,dt,los,dist))){
    mx=cvm[0]; my=cvm[1];
  } else if(!los||dist>13){
    const tg=flowTarget(e);
    if(tg){ const tx=tg.x-e.x, ty=tg.y-e.y, tl=Math.hypot(tx,ty)||1; mx=tx/tl; my=ty/tl; }
  } else if(e.type==='d'){
    if(dist>5.5){ mx=ux; my=uy; } else if(dist<3){ mx=-ux; my=-uy; } else { mx=-uy*e.strafe; my=ux*e.strafe; }
  } else if(APPROACH_STOP[e.type]!==undefined){
    if(dist>APPROACH_STOP[e.type]){
      mx=ux; my=uy;                                  // ungebremst ran, kein Rückzug/Strafing
      if(e.flank&&e.slotA!=null&&dist<10&&dist>APPROACH_STOP[e.type]*1.6){   // Phase 6: Flanke/Einkesseln über Winkel-Slot
        const rr=Math.max(APPROACH_STOP[e.type]+.4,dist*.75), qx=P.x+Math.cos(e.slotA)*rr, qy=P.y+Math.sin(e.slotA)*rr;
        const vx=qx-e.x, vy=qy-e.y, vl=Math.hypot(vx,vy);
        if(vl>.15&&rayWallDist(e.x,e.y,vx/vl,vy/vl)>=vl-.1){ mx=vx/vl; my=vy/vl; }
      }
    }
  } else {
    if(dist>5){ mx=ux; my=uy; } else if(dist<3){ mx=-ux; my=-uy; } else { mx=-uy*e.strafe; my=ux*e.strafe; }
  }
  if(isK&&e.bat){ mx=0; my=0; }   // Phase 9: Boss steht bei Telegraph-Angriffen
  const sp=t.spd*(isK?Boss.spd(e):A.speed*(fleeing?1.2:e.ai===AI_SEARCH?.9:1))*(isK?1:e.rsp)*dt;
  tryMove(e,mx*sp,my*sp,t.rad*.8);
  if(!isK){ if(mx||my) AI.turn(e,Math.atan2(my,mx),dt*8); if(los&&e.ai!==AI_SEARCH) AI.turn(e,Math.atan2(dy,dx),dt*8); }
  for(const o of enemies){                       // Gegner nicht ineinander laufen lassen
    if(o===e||!o.alive) continue;
    const ox=e.x-o.x, oy=e.y-o.y, od=Math.hypot(ox,oy), min=(t.rad+ETYPES[o.type].rad)*.9;
    if(od>0&&od<min) tryMove(e,ox/od*(min-od)*.5,oy/od*(min-od)*.5,t.rad*.8);
  }

  const mSt=MELEE_STATS[e.type], rSt=RANGED_STATS[e.type];
  if(mSt && dist<mSt[0] && e.cd<=0 && !fleeing){
    e.cd=mSt[1]+Math.random()*mSt[2]; e.atk=.2; sfx.melee(); hurtPlayer(Roles.dmg(e,mSt[3]),e); if(e.role==='tank'||e.role==='juggernaut') kick(.45);
  } else if(e.type==='e' && dist<.85){
    // Sprenger-Einheit: einmalige Detonation statt Cooldown-Angriff, tötet
    // sich beim Kontakt selbst (über den normalen Tod-Pfad, für korrekte
    // Kill-Zählung/Boom-Effekt).
    hurtPlayer(22); kick(.4); e.shielded=false; damageEnemy(e,e.hp,null);
  } else if(rSt && los && dist<rSt[0] && e.cd<=0 && !fleeing){
    e.cd=rSt[1]+Math.random()*rSt[2]; e.atk=.25; sfx.eshoot(dist); e.peekN=(e.peekN|0)+1;
    spawnShot(e.x,e.y,Math.atan2(dy,dx)+(Math.random()-.5)*rSt[4],Roles.dmg(e,rSt[3]),null,null,e);
  } else if(isK){
    Boss.act(e,dt,los,dist,dx,dy);   // Phase 9: phasenbasierte Angriffe je Boss
  }
}
function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i], v=s.v||6; s.life-=dt;
    if(s.life<=0){ shots.splice(i,1); continue; }
    const n=Math.max(1,Math.ceil(v*dt/.25)), st=v*dt/n; let gone=false;   // Teilschritte: schnelle Schuesse tunneln nicht
    for(let k=0;k<n;k++){
      s.x+=s.dx*st; s.y+=s.dy*st;
      if(solidAt(s.x,s.y)){ spawnSpark(s.x,s.y); gone=true; break; }
      if(Hazards.shotHit(s.x,s.y,s.dmg)){ gone=true; break; }   // Phase 12: Gegnerschuss sprengt Fass
      if(Math.hypot(s.x-P.x,s.y-P.y)<.32){ hurtPlayer(s.dmg,s.own); if(s.k==='void') Elite.voidHit(); gone=true; break; }
    }
    if(gone) shots.splice(i,1);
  }
}
function updatePickups(){
  for(const p of pickups){
    if(p.taken||p.fixed) continue;
    if(Math.hypot(p.x-P.x,p.y-P.y)>.55) continue;
    if(p.kind==='h'){ if(P.hp>=100) continue; Missions.onHeal(); P.hp=Math.min(100,P.hp+25); FX.heal=.35; showMsg('AXIOM-Zelle: Integrität +25',1400); sfx.pickup(); }
    else if(p.kind==='a'){ if(P.ammo>=99) continue; P.ammo=Math.min(99,P.ammo+10); showMsg('Ladung +10',1200); sfx.pickup(); }
    else if(p.kind==='m'){ stats.shards++; showMsg('MOGC-Splitter gefunden',1200); sfx.pickup(); }
    else if(p.kind==='L'){ if(!Loot.take(p)) continue; }   // Phase 13
    else if(p.kind.length===2){ if(!Biome.take(p)) continue; }   // Phase 11: Biom-Pickups (bE bP bK bG)
    else if(WPICK[p.kind]!==undefined){ grantWeapon(WPICK[p.kind],WAMMO[p.kind]); sfx.gun(); }
    p.taken=true;
  }
}

let lockedMsgT=0;

    stats.push(['Endgegner besiegt',[0,1,2,3].filter(v=>(s.bosses[v]|0)>0).length+' / 4']);
    if(s.done){ stats.push(['Endless-Rekord','Sektor '+(s.endDepth|0)+' · '+(s.endScore|0)+' P']); stats.push(['Heute ('+dm.names+')',((s.daily[String(dm.key)]|0)||'—')+(s.daily[String(dm.key)]?' P':'')]); }
    const sd=storyDone();
    if(sd) stats.push(['Untersuchung',ascFound()+' / 6 Funde']);
    btn.push({label:s.done?'Ascension (12 Sektoren)':(sd?'Untersuchung beginnen':'Ascension starten'),primary:!s.done,fn:()=>api.begin('camp',()=>api.menu(back))});
    if(s.done){ btn.push({label:'Endless-Modus',primary:true,fn:()=>api.start('endless')}); btn.push({label:'Tages-Herausforderung',fn:()=>api.start('daily')}); }
    btn.push({label:'Zurück',fn:back});
    showOverlay({title:'NEXUS ASCENSION',text:(sd?'Der Breach wurde eingedämmt. Das Signal nicht. ':'')+'Zwölf Sektoren in den Endgame-Biomen, vier Endgegner, härtere Elite-Gegner. Du startest mit Streu-Kanone, Overclock, Plasma und 2 Perk-Kernen.'+(s.done?' Heutige Tages-Herausforderung: '+dm.tips.join(' · '):''),stats,buttons:btn});
  };
  api.state=()=>({on:A.on,endless:A.endless,daily:A.daily&&A.daily.names,sector:sec(),hpK:+api.hpK().toFixed(2),dmgK:+api.dmgK().toFixed(2),unlocked:unlocked(),save:D(),stats:api.stats,bossBase:B0,bosses:Boss.BD.length});
  return api;
})();

/* ============================================================
   Einstellungen (Phase 20+): Modul `Settings` (auch `__breach.Settings`). Werte liegen in `Save.data.settings` (LocalStorage) und wirken live:
   Audio (Snd), Shake/Scanlines/Pixel-FX/Partikel/Schadensblitz/Reduced Motion (Cine), FOV, Maus-/Touch-Empfindlichkeit (hier).
   Erreichbar über Titel und Pause-Menü. Konsole: __breach.Settings.screen(showTitle), .apply(), .reset() */
const Settings=(()=>{
  const api={ mouseK:1, touchK:1 };
  const S=()=>Save.data.settings;
  const ROWS=[
    ['AUDIO'],['masterVol','Gesamtlautstärke',0,1,.05,'%'],['sfxVol','Effekte',0,1,.05,'%'],['musicVol','Musik',0,1,.05,'%'],
    ['ANZEIGE'],['screenShake','Screen Shake',0,1,.05,'%'],['scanlines','Scanlines',0,1,.05,'%'],['pixelFx','Pixel-Effekte',0,1,.05,'%'],
    ['particles','Partikel',0,1,.05,'%'],['damageFlash','Schadensblitz',0,1,.05,'%'],['hudScale','HUD-Größe',.6,1.2,.05,'%'],['fov','Sichtfeld (FOV)',50,100,1,'°'],
    ['STEUERUNG'],['mouseSens','Maus-Empfindlichkeit',.25,3,.05,'x'],['touchSens','Touch-Empfindlichkeit',.25,3,.05,'x']
  ];
  const fmtV=(v,u)=>u==='%'?Math.round(v*100)+' %':u==='°'?Math.round(v)+'°':(+v).toFixed(2)+'×';
  api.apply=function(){
    try{
      const s=S(); if(!s) return;
      const f=Math.min(100,Math.max(50,+s.fov||67));
      PLANE_LEN=Math.tan(f*Math.PI/360); PROJ=(W/2)/PLANE_LEN;
      api.mouseK=+s.mouseSens||1; api.touchK=+s.touchSens||1;
      api.hud(+s.hudScale||.8);
    }catch(e){ console.warn('[settings]',e); }
  };
  /* HUD-Größe: skaliert die untere Leiste und die Textblöcke oben links; auf schmalen Bildschirmen nie unter 85 % */
  let hudEl=null;
  api.hud=function(k){
    try{
      if(window.innerWidth<900) k=Math.max(k,.85);
      if(!hudEl){ hudEl=document.createElement('style'); document.head.appendChild(hudEl); }
      hudEl.textContent='#bar{transform:scale('+k+');transform-origin:50% 100%}#top,#msHud,#stHud,#lootHud{transform:scale('+k+');transform-origin:0 0}';
    }catch(e){}
  };
  api.reset=function(){
    const s=S(), d={masterVol:1,sfxVol:1,musicVol:1,screenShake:1,scanlines:1,pixelFx:1,particles:1,damageFlash:1,fov:67,mouseSens:1,touchSens:1,hudScale:.8};
    for(const k in d) s[k]=d[k]; s.reducedMotion=false; Save.markDirty(); api.apply();
  };
  let cssDone=false;
  function css(){
    if(cssDone) return; cssDone=true;
    const el=document.createElement('style');
    el.textContent='.set-list{max-height:62cqh;overflow:auto;text-align:left;margin:1cqw 0;padding-right:.8cqw;-webkit-overflow-scrolling:touch}'+
      '.set-h{margin:1.4cqw 0 .5cqw;font:800 1.25cqw/1 monospace;letter-spacing:.25em;color:#35E4FF;border-bottom:1px solid rgba(53,228,255,.35);padding-bottom:.4cqw}'+
      '.set-r{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) 6.5ch;align-items:center;gap:1.2cqw;min-height:48px;font:600 clamp(12px,1.5cqw,20px)/1.2 monospace;color:#dfe9f3}'+
      '.set-r output{text-align:right;color:#FFAE3D;font-variant-numeric:tabular-nums}'+
      '.set-r input[type=range]{width:100%;height:36px;accent-color:#35E4FF;background:transparent;touch-action:pan-y}';
    document.head.appendChild(el);
  }
  api.screen=function(back){
    css(); const s=S();
    let h='<h2>Einstellungen</h2><div class="set-list">';
    for(const r of ROWS){
      if(r.length===1){ h+='<div class="set-h">'+r[0]+'</div>'; continue; }
      const [k,n,lo,hi,st,u]=r, v=+s[k];
      h+='<label class="set-r"><span>'+n+'</span><input type="range" data-k="'+k+'" data-u="'+u+'" min="'+lo+'" max="'+hi+'" step="'+st+'" value="'+v+'"><output>'+fmtV(v,u)+'</output></label>';
    }
    h+='<div class="set-h">KONTO &amp; CLOUD-SYNC</div><div id="cl-box" style="padding:.4cqw 0 1cqw"></div><div class="set-h">BARRIEREFREIHEIT</div><div class="set-r"><span>Reduzierte Bewegung</span><button type="button" id="st-rm" style="min-height:48px"></button><span></span></div></div>'+
       '<div class="row"><button class="primary" id="st-back" type="button">Zurück</button><button id="st-reset" type="button">Standard</button></div>';
    showOverlay({html:h,onMount:box=>{
      try{ Cloud.mount(box.querySelector('#cl-box')); }catch(e){}
      const rm=box.querySelector('#st-rm'), lab=()=>{ rm.textContent=s.reducedMotion?'AN':'AUS'; };
      lab();
      rm.onclick=()=>{ s.reducedMotion=!s.reducedMotion; lab(); Save.markDirty(); };
      box.querySelectorAll('input[type=range]').forEach(inp=>{
        inp.addEventListener('input',()=>{ const v=+inp.value; s[inp.dataset.k]=v; inp.nextElementSibling.textContent=fmtV(v,inp.dataset.u); Save.markDirty(); api.apply(); });
      });
      box.querySelector('#st-reset').onclick=()=>{ api.reset(); api.screen(back); };
      box.querySelector('#st-back').onclick=()=>{ try{ Save.flush(); }catch(e){} (back||showTitle)(); };
    }});
  };
  return api;
})();

/* ============================================================
   Boss-besiegt-Karte (nach Phase 20): nicht blockierend (Portal ist offen, Spiel läuft weiter).
   Zeigt Boss, Level, Kampfzeit, kassierte Treffer, Prämie und permanenten Bonus für ~6,5 s.
   Konsole: __breach.BossCard.show({bv:0,bn:1,bt0:0,bh0:0},50)
   ============================================================ */
const BossCard=(()=>{
  const api={ el:null, timer:0 };
  function dom(){
    if(api.el) return api.el;
    const st=$('stage'); if(!st) return null;
    const css=document.createElement('style');
    css.textContent='#bossDone{position:absolute;left:50%;top:20%;transform:translate(-50%,-1.5cqw);opacity:0;pointer-events:none;z-index:71;min-width:34cqw;max-width:70cqw;padding:1.4cqw 2.6cqw;text-align:center;font-family:ui-monospace,Consolas,Menlo,monospace;background:rgba(6,10,20,.9);border:1px solid var(--bc,#FF3D6E);box-shadow:0 0 2.4cqw var(--bc,#FF3D6E),inset 0 0 1.6cqw rgba(255,255,255,.05);transition:opacity .5s,transform .5s}'+
      '#bossDone.on{opacity:1;transform:translate(-50%,0)}'+
      '#bossDone b{display:block;font-size:clamp(10px,1.4cqw,18px);letter-spacing:.4em;color:#35E4FF}'+
      '#bossDone h3{margin:.5cqw 0 .2cqw;font-size:clamp(18px,3.4cqw,44px);letter-spacing:.14em;color:var(--bc,#FF3D6E);text-shadow:0 0 14px var(--bc,#FF3D6E)}'+
      '#bossDone .bs{display:grid;grid-template-columns:1fr auto;gap:.3cqw 2cqw;margin-top:.9cqw;text-align:left;font-size:clamp(11px,1.5cqw,19px);color:#dfe9f3}'+
      '#bossDone .bs span:nth-child(even){color:#FFAE3D;text-align:right}'+
      '.rm #bossDone{transition:none;transform:translate(-50%,0)}';
    document.head.appendChild(css);
    const el=document.createElement('div'); el.id='bossDone'; st.appendChild(el); api.el=el; return el;
  }
  api.show=function(e,cr){
    try{
      const el=dom(); if(!el) return;
      const D=Boss.BD[e.bv|0], n=e.bn||1, rows=[];
      const t=Math.max(0,stats.time-(e.bt0||0)); rows.push(['Kampfzeit',fmt(t)]);
      const hits=Math.max(0,(Style.hurtSec|0)-(e.bh0|0)); rows.push(['Treffer kassiert',hits===0?'keine — makellos':String(hits)]);
      rows.push(['Prämie','+'+cr+' Cr']);
      const dc=(Loot.cores|0)-(e.bc0|0); if(dc>0) rows.push(['Perk-Kern','+'+dc]);
      rows.push(['Dauerhafter Bonus',D.bt]);
      rows.push(['Boss-Kills gesamt',String(Save.data.stats.bossKills|0)]);
      el.style.setProperty('--bc',D.c);
      el.innerHTML='<b>BOSS BESIEGT</b><h3>'+D.name.toUpperCase()+'</h3><div style="font-size:clamp(10px,1.4cqw,17px);color:#9fb0c2">LV '+n+' · Portal offen</div><div class="bs">'+rows.map(r=>'<span>'+r[0]+'</span><span>'+r[1]+'</span>').join('')+'</div>';
      void el.offsetWidth; el.classList.add('on');
      clearTimeout(api.timer); api.timer=setTimeout(()=>{ el.classList.remove('on'); },6500);
    }catch(err){ console.warn('[bosscard]',err); }
  };
  api.hide=function(){ clearTimeout(api.timer); if(api.el) api.el.classList.remove('on'); };
  return api;
})();

/* ============================================================
   Erfolge (nach Phase 20): 15 Achievements, Popup beim Freischalten, Screen „Erfolge“.
   Freigeschaltete Erfolge liegen als Zeitstempel in Save.data.achievements[id] (kein neues Save-Feld,
   SAVE_VERSION bleibt 3). Die meisten Erfolge werden per Polling aus vorhandenen Zählern geprüft
   (Save.data.stats / meta.cnt / asc), PERFECT RUN kommt aus finishLevel. Von außen gesetzte Flags
   (Ascension: ascension, voidWalker, nexus, secretBoss) werden ebenfalls mit Popup gemeldet.
   Konsole: __breach.Ach.list(), .unlock('hunter'), .check(), .screen(), .reset()
   ============================================================ */
const Ach=(()=>{
  const api={ queue:[], cur:false, pt:0 };
  const D=()=>Save.data;
  const cnt=k=>()=>D().meta.cnt[k]|0;
  const LIST=[
    {id:'firstBlood',n:'FIRST BLOOD',t:'Besiege deinen ersten Gegner.',goal:1,get:()=>D().stats.kills},
    {id:'breach',n:'BREACH',t:'Schließe deinen ersten Sektor ab.',goal:1,get:()=>D().stats.sectorsCleared},
    {id:'elimination',n:'ELIMINATION',t:'Besiege 100 Gegner.',goal:100,get:()=>D().stats.kills},
    {id:'hunter',n:'HUNTER',t:'Besiege 1000 Gegner.',goal:1000,get:()=>D().stats.kills},
    {id:'bossBreaker',n:'BOSS BREAKER',t:'Besiege deinen ersten Boss.',goal:1,get:()=>D().stats.bossKills},
    {id:'voidWalker',n:'VOID WALKER',t:'Erreiche Tiefe 25.',goal:25,get:()=>D().highestDepth},
    {id:'nexus',n:'NEXUS',t:'Erreiche Tiefe 50.',goal:50,get:()=>D().highestDepth},
    {id:'ascension',n:'ASCENSION',t:'Schließe die NEXUS Ascension ab.',goal:1,get:()=>D().asc.done?1:0},
    {id:'storyEnd',n:'BREACH CONTAINED',t:'Schließe den Story-Modus ab.',goal:1,get:()=>{ try{ return (D().story&&D().story.completed&&!Epilogue.on)?1:0; }catch(e){ return 0; } }},   // Phase 9 (erst nach dem Epilog melden)
    {id:'perfectRun',n:'PERFECT RUN',t:'Schließe einen Sektor ohne Schaden ab.'},
    {id:'elite',n:'ELITE HUNTER',t:'Besiege 25 Elite-Gegner.',goal:25,get:cnt('elites')},
    {id:'overload',n:'OVERLOAD',t:'Erreiche einen ×10-Kombo.',goal:1,get:cnt('x10')},
    {id:'contractor',n:'CONTRACTOR',t:'Erfülle 10 Missionen.',goal:10,get:cnt('missions')},
    {id:'arsenal',n:'ARSENAL',t:'Schalte alle Waffen frei.',goal:()=>WEAPONS.length,get:()=>D().unlockedWeapons.length},
    {id:'archivist',n:'ARCHIVIST',t:'Finde alle 8 Artefakte.',goal:8,get:()=>D().artifacts.length},
    {id:'secretBoss',n:'???',t:'Besiege den geheimen Boss.',goal:1,get:()=>D().asc.secret|0,secret:true,rn:'NULL-SOUVERÄN',rt:'Besiege den geheimen Boss der Endless-Sektoren.'}
  ];
  const BY=Object.create(null); for(const a of LIST) BY[a.id]=a;
  const goalOf=a=>typeof a.goal==='function'?a.goal():a.goal;
  let known=null;
  const have=id=>{ const v=D().achievements[id]; return v?+v||1:0; };
  api.list=()=>LIST.map(a=>({id:a.id,n:a.n,done:!!have(a.id)}));
  api.count=()=>{ let n=0; for(const a of LIST) if(have(a.id)) n++; return n; };
  /* Ausgangsstand merken, damit alte Erfolge beim Start kein Popup auslösen (nur neu gesetzte) */
  api.init=function(){ try{ known={}; const a=D().achievements; for(const k in a) if(a[k]) known[k]=1; }catch(e){ known=null; } };
  api.check=function(){
    try{
      const d=D(); if(!d||!d.achievements) return; if(!known) api.init();
      for(const a of LIST){
        if(have(a.id)){ if(!known[a.id]){ known[a.id]=1; enqueue(a); } continue; }
        if(a.get&&a.get()>=goalOf(a)){ d.achievements[a.id]=Date.now(); known[a.id]=1; Save.markDirty(); enqueue(a); }
      }
    }catch(e){ console.warn('[ach]',e); }
  };
  api.unlock=function(id){
    try{
      const a=BY[id]; if(!a||have(id)) return; if(!known) api.init();
      D().achievements[id]=Date.now(); known[id]=1; Save.markDirty(); enqueue(a);
    }catch(e){ console.warn('[ach]',e); }
  };
  api.reset=function(){ D().achievements={}; known={}; Save.markDirty(); };
  api.tick=function(dt){ api.pt-=dt; if(api.pt<=0){ api.pt=1; api.check(); } };
  api.onSector=function(){
    try{ if(Style.hurtSec===0&&totals.foes>0) api.unlock('perfectRun'); }catch(e){}
    api.check();
  };

  /* ---- Popup (oben mittig, ohne Pointer-Events, nacheinander; ab 4 gleichzeitig gesammelt) ---- */
  let el=null;
  function dom(){
    if(el) return el;
    const st=$('stage'); if(!st) return null;
    const css=document.createElement('style');
    css.textContent='#achPop{position:absolute;left:50%;top:10%;transform:translate(-50%,-1.5cqw);opacity:0;pointer-events:none;z-index:70;'+
      'min-width:24cqw;max-width:60cqw;padding:1cqw 2cqw;text-align:center;font-family:ui-monospace,Consolas,Menlo,monospace;'+
      'background:rgba(6,10,20,.88);border:1px solid #FFAE3D;box-shadow:0 0 2cqw rgba(255,174,61,.45),inset 0 0 1.4cqw rgba(255,174,61,.12);transition:opacity .35s,transform .35s}'+
      '#achPop.on{opacity:1;transform:translate(-50%,0)}'+
      '#achPop b{display:block;font-size:clamp(9px,1.2cqw,15px);letter-spacing:.3em;color:#35E4FF}'+
      '#achPop span{display:block;margin:.3cqw 0;font-weight:800;font-size:clamp(15px,2.4cqw,30px);letter-spacing:.12em;color:#FFAE3D;text-shadow:0 0 10px rgba(255,174,61,.7)}'+
      '#achPop small{display:block;font-size:clamp(10px,1.4cqw,17px);color:#dfe9f3}'+
      '.rm #achPop{transition:none;transform:translate(-50%,0)}'+
      '.ach-list{max-height:60cqh;overflow:auto;text-align:left;margin:1cqw 0;padding-right:.8cqw;-webkit-overflow-scrolling:touch}'+
      '.ach-r{display:grid;grid-template-columns:2.4em minmax(0,1fr) auto;align-items:center;gap:1.2cqw;min-height:48px;padding:.5cqw 0;border-bottom:1px solid rgba(53,228,255,.15);font:600 clamp(12px,1.5cqw,20px)/1.25 monospace;color:#dfe9f3}'+
      '.ach-r i{font-style:normal;font-size:1.5em;text-align:center;color:#4a5668}'+
      '.ach-r.on i{color:#FFAE3D;text-shadow:0 0 8px rgba(255,174,61,.7)}'+
      '.ach-r.on .an{color:#FFAE3D}.ach-r .an{display:block;font-weight:800;letter-spacing:.12em;color:#8b97a8}'+
      '.ach-r small{display:block;opacity:.8;font-weight:500}'+
      '.ach-r em{font-style:normal;font-variant-numeric:tabular-nums;color:#35E4FF;text-align:right;font-size:.9em}'+
      '.ach-bar{height:4px;margin-top:4px;background:rgba(14,24,38,.9)}.ach-bar u{display:block;height:100%;background:#35E4FF;text-decoration:none}';
    document.head.appendChild(css);
    el=document.createElement('div'); el.id='achPop'; st.appendChild(el); return el;
  }
  function enqueue(a){ api.queue.push(a); if(!api.cur) setTimeout(pump,250); }
  function pump(){
    if(api.cur||!api.queue.length) return;
    const e=dom(); if(!e){ api.queue.length=0; return; }
    let a;
    if(api.queue.length>=4){ const n=api.queue.length; api.queue.length=0; a={n:n+' ERFOLGE',t:'Öffne „Erfolge“ im Menü für die Übersicht.'}; }
    else a=api.queue.shift();
    api.cur=true;
    const nm=a.secret?(a.rn||a.n):a.n, tx=a.secret&&a.rt?a.rt:a.t;
    e.innerHTML='<b>ERFOLG FREIGESCHALTET</b><span>'+nm+'</span><small>'+tx+'</small>';
    void e.offsetWidth; e.classList.add('on');
    try{ initAudio(); sfx.evSecret&&sfx.evSecret(); }catch(err){}
    setTimeout(()=>{ e.classList.remove('on'); setTimeout(()=>{ api.cur=false; pump(); },450); },3200);
  }

  /* ---- Screen ---- */
  api.screen=function(back){
    dom(); api.check();
    const fmtD=ts=>{ try{ return new Date(ts).toLocaleDateString('de-DE'); }catch(e){ return ''; } };
    let h='<h2>Erfolge — '+api.count()+' / '+LIST.length+'</h2><div class="ach-list">';
    for(const a of LIST){
      const ts=have(a.id), g=goalOf(a);
      const name=(a.secret&&!ts)?'???':(a.secret&&a.rn?a.rn:a.n), tx=(a.secret&&!ts)?'Geheimer Erfolg.':a.t;
      let side='';
      if(ts) side=fmtD(ts);
      else if(a.get&&g>1){ const v=Math.min(g,a.get()|0); side=v+' / '+g; }
      const bar=(!ts&&a.get&&g>1)?'<div class="ach-bar"><u style="width:'+Math.round(100*Math.min(1,(a.get()|0)/g))+'%"></u></div>':'';
      h+='<div class="ach-r'+(ts?' on':'')+'"><i>'+(ts?'◆':'◇')+'</i><div><span class="an">'+name+'</span><small>'+tx+'</small>'+bar+'</div><em>'+side+'</em></div>';
    }
    h+='</div><div class="row"><button class="primary" id="ach-back" type="button">Zurück</button></div>';
    showOverlay({html:h,onMount:box=>{ box.querySelector('#ach-back').onclick=()=>{ (back||showTitle)(); }; }});
  };
  return api;
})();

/* ============================================================
   Story Mode (Phase 1 — nur das technische Framework, noch keine Kampagne)
   Modul `Story` (auch `__breach.Story`, `NX.story`). Fortschritt liegt in `Save.data.story` (SAVE_VERSION 4):
   started · completed · act · sector · mission · flags · missions · cleared · realities · logs · bosses · signal ·
   warden · breach · ending · unlocks · cp (Checkpoint: Waffen + Munition).
   Daten getrennt vom Code: ACTS (6 Akte, nur Rahmen) und Sektor-Definitionen ueber `Story.registerSector(def)`.
   Ein Story-Sektor zeigt auf ein handgebautes `LEVELS[i]`. Prozedurale Laeufe (Endlos-Einsatz, Ascension) sind nie Story.
   Ein Sektor zaehlt nur, wenn er freigeschaltet ist (Sektor 1 immer, sonst Vorgaenger gesaeubert) — die Direktwahl-Chips
   im Titel bleiben freies Spiel ohne Story-Wirkung.
   Aktionen (Daten statt Code) in `on:{enter,clear,boss,death,start}`: {flag,value} {clearFlag} {msg,ms} {unlock} {reality}
   {log} {signal|warden|breach:+n} {mission,state:'start'|'done'} {act} {ending} {emit} {if,then,else}; jede Aktion darf
   `once:'key'` tragen. Konsole: __breach.Story.state(), .flag('x'), .unlock('id'), .enter(1), .reset(), .events
   ============================================================ */
const Story=(()=>{
  const api={ active:false, cur:null, events:[], ver:1 };
  const D=()=>Save.data.story;
  const ok=k=>Save.storyKey(k);
  const ACTS=[
    {n:1,id:'breach',  name:'THE BREACH',         from:1, to:5},
    {n:2,id:'windows', name:'THE WINDOWS',        from:6, to:10},
    {n:3,id:'lost',    name:'THE LOST REALITIES', from:11,to:15},
    {n:4,id:'signal',  name:'THE SIGNAL',         from:16,to:20},
    {n:5,id:'other',   name:'THE OTHER NEXUS',    from:21,to:25},
    {n:6,id:'finale',  name:'NEXUS: BREACH',      from:26,to:30}
  ];
  const ROMAN=['','I','II','III','IV','V','VI'];
  const SECT=[], BYID={}, BYLEVEL={};
  const UNL={};   // definierte Freischaltungen: id -> {name,kind}
  api.ACTS=ACTS; api.sectors=SECT; api.unlocks=UNL;
  const pad=n=>(n<10?'0':'')+n;
  const actOf=id=>{ for(const a of ACTS) if(id>=a.from&&id<=a.to) return a.n; return 0; };
  api.actName=n=>{ const a=ACTS[n-1]; return a?'AKT '+ROMAN[n]+' · '+a.name:''; };

  /* ---- Sektoren & Missionen ---- */
  api.registerSector=function(def){
    if(!def||!(def.id>=1&&def.id<=30)) return null;
    const s=Object.assign({ boss:false, level:null, on:{}, unlocks:[], requires:[], missions:null }, def);
    s.key='s'+pad(s.id); s.act=actOf(s.id);
    if(!s.missions) s.missions=[{id:s.key+'.main',title:s.boss?'Besiege den Wächter':'Erreiche den Ausgang',type:s.boss?'boss':'clear'}];
    for(const m of s.missions) m.sector=s.id;
    if(BYID[s.id]){ SECT.splice(SECT.indexOf(BYID[s.id]),1); }
    SECT.push(s); SECT.sort((a,b)=>a.id-b.id); BYID[s.id]=s;
    if(s.level!=null) BYLEVEL[s.level]=s;
    return s;
  };
  api.sector=id=>BYID[id]||null;
  api.missionsOf=id=>{ const s=BYID[id]; return s?s.missions:[]; };
  api.defineUnlock=function(id,o){ if(ok(id)) UNL[id]=Object.assign({name:id,kind:'misc'},o||{}); };
  const firstId=()=>SECT.length?SECT[0].id:0;
  const nextOf=s=>{ for(const x of SECT) if(x.id>s.id) return x; return null; };

  /* ---- Ereignisse ---- */
  const L={};
  api.on=function(evt,fn){ (L[evt]=L[evt]||[]).push(fn); return ()=>{ const a=L[evt]; const i=a?a.indexOf(fn):-1; if(i>=0) a.splice(i,1); }; };
  api.emit=function(evt,data){
    api.events.push({e:evt,d:data,t:Date.now()}); if(api.events.length>40) api.events.shift();
    for(const fn of (L[evt]||[]).slice()){ try{ fn(data,evt); }catch(e){ console.error('[story]',e); } }
    for(const fn of (L['*']||[]).slice()){ try{ fn(data,evt); }catch(e){ console.error('[story]',e); } }
  };
  const dirty=()=>Save.markDirty();

  /* ---- Flags ---- */
  api.flags=()=>D().flags;
  api.has=k=>{ const v=D().flags[k]; return v!==undefined&&v!==false&&v!==0&&v!==''; };
  api.get=k=>D().flags[k];
  api.flag=function(k,v){
    if(!ok(k)) return false; if(v===undefined) v=true;
    const f=D().flags; if(!(k in f)&&Object.keys(f).length>=400) return false;
    if(f[k]===v) return true; f[k]=v; dirty(); api.emit('flag',{key:k,value:v}); return true;
  };
  api.clearFlag=function(k){ const f=D().flags; if(k in f){ delete f[k]; dirty(); api.emit('flag',{key:k,value:false}); } };

  /* ---- Fortschrittswerte ---- */
  const bump=(key,n)=>{ const d=D(); const v=Math.max(0,Math.min(100,(d[key]|0)+(n|0))); if(v!==d[key]){ d[key]=v; dirty(); api.emit('progress',{key,value:v}); } return d[key]; };
  api.addSignal=n=>bump('signal',n); api.addWarden=n=>bump('warden',n); api.addBreach=n=>bump('breach',n);
  api.setEnding=function(x){ if(x===''||ok(x)){ D().ending=x; dirty(); api.emit('ending',{ending:x}); } };
  api.setAct=function(n){ n=Math.max(0,Math.min(6,n|0)); const d=D(); if(n>d.act){ d.act=n; dirty(); api.emit('act',{act:n}); } };
  const addTo=(arr,id,evt)=>{ if(!ok(id)) return false; const a=D()[arr]; if(a.indexOf(id)>=0||a.length>=300) return false; a.push(id); api.unlock('archive',{silent:true}); dirty(); api.emit(evt,{id}); return true; };
  api.discoverReality=id=>addTo('realities',id,'reality');
  api.discoverLog=id=>addTo('logs',id,'log');
  api.hasReality=id=>D().realities.indexOf(id)>=0;
  api.hasLog=id=>D().logs.indexOf(id)>=0;

  /* ---- Archiv-Register (Phase 2): Definitionen hier, Entdeckungen im Save (logs/realities/seen) ---- */
  const CATS=[['log','LOGS'],['tx','ÜBERTRAGUNGEN'],['warden','WARDEN RECORDS'],['axiom','AXIOM REPORTS'],['signal','SIGNAL FRAGMENTS'],['unknown','UNKNOWN ENTRIES']];
  const ENT={}, ENTL=[];
  api.CATS=CATS;
  api.defineEntry=function(def){
    if(!def||!ok(def.id)) return null;
    const e=Object.assign({cat:'log',title:def.id,text:[],from:'',hidden:false},def);
    if(!CATS.some(c=>c[0]===e.cat)) e.cat='unknown';
    if(!Array.isArray(e.text)) e.text=[String(e.text)];
    if(ENT[e.id]) ENTL[ENTL.indexOf(ENT[e.id])]=e; else ENTL.push(e);
    ENT[e.id]=e; return e;
  };
  api.entry=id=>ENT[id]||null;
  api.entries=cat=>ENTL.filter(e=>!cat||e.cat===cat);
  // Die sieben bekannten Realitaeten (Master-Dokument Abschnitt 2). Jede hat ihre EIGENE Zeitlinie — keine gemeinsame Chronologie.
  const REAL=[
    {id:'DEEP_ANCHOR',      name:'DEEP ANCHOR',            color:'#4FA8FF', text:['Realitätsnahe Space-Industry-Welt.','Eigener chronologischer Nullpunkt: Erde, Satelliten, Orbit, Mond, Mars. Diese Zeitrechnung gilt nur dort.']},
    {id:'FOUNDRY',          name:'FOUNDRY',                color:'#FFAE3D', text:['Business-, Markt- und Risiko-Realität.','Wirtschaftliche Systeme und ihre Anomalien.']},
    {id:'AETHERIS',         name:'AETHERIS',               color:'#C86BFF', text:['Kosmische Science-Fiction-Realität.','Neon-noir, epische Raumfahrt.']},
    {id:'ASTRION',          name:'ASTRION',                color:'#FF5DA8', text:['Eigenständige Sci-Fi-TCG-Realität.','Sternenmarkt, Karten, verschiedene Spezies und kosmische Konflikte.']},
    {id:'PATH_OF_THE_STARS',name:'PATH OF THE STARS',      color:'#7CFFB2', text:['Weit entfernte Zukunft.','Eine wandernde Erde auf großer kosmischer Reise. Signal- und Heimat-Mysterium.']},
    {id:'DOMUS_PRIME',      name:'DOMUS PRIME: VERDANTIS', color:'#6BE04F', text:['Biologische, ökologische Welt: Natur, Aufbau, Leben.','Ebenfalls mit einer unbekannten Anomalie verbunden.']},
    {id:'NEXUS',            name:'NEXUS',                  color:'#DCF6FF', text:['Anomalie. Knotenpunkt zwischen Realitäten.','Keine normale Position im bekannten Raum-Zeit-System.']}
  ];
  api.REALITIES=REAL;
  api.REALSTATE={DEEP_ANCHOR:'ACTIVE',FOUNDRY:'ACTIVE',AETHERIS:'ACTIVE',NEXUS:'ACTIVE',ASTRION:'UNSTABLE',PATH_OF_THE_STARS:'UNSTABLE',DOMUS_PRIME:'UNSTABLE'};   // Phase 5: Status laut THE ARCHIVE (Anzeige erst nach Flag a3.ar.states)
  api.reality=id=>REAL.find(r=>r.id===id)||null;
  api.markSeen=function(id){ const d=D(); if(ok(id)&&!d.seen[id]&&Object.keys(d.seen).length<600){ d.seen[id]=1; dirty(); } };
  api.isNew=(id,isReal)=>{ const d=D(); return (isReal?d.realities:d.logs).indexOf(id)>=0&&!d.seen[(isReal?'r.':'')+id]; };
  api.newCount=function(cat){
    const d=D(); let n=0;
    if(cat==='real'){ for(const id of d.realities) if(!d.seen['r.'+id]) n++; return n; }
    for(const id of d.logs){ if(d.seen[id]) continue; const e=ENT[id]; if(!cat||(e?e.cat:'log')===cat) n++; }
    return n;
  };
  api.newTotal=()=>api.newCount('')+api.newCount('real');
  api.archiveOpen=()=>api.isUnlocked('archive')||D().logs.length>0||D().realities.length>0;

  /* ---- Missionen (Story-Ziele) ---- */
  api.missionDone=id=>!!D().missions[id];
  api.startMission=function(id){ if(ok(id)&&!D().missions[id]){ D().mission=id; dirty(); api.emit('mission',{id,state:'start'}); } };
  api.completeMission=function(id){
    const d=D(); if(!ok(id)||d.missions[id]) return false;
    d.missions[id]=1; if(d.mission===id) d.mission=''; dirty(); api.emit('mission',{id,state:'done'}); return true;
  };
  const openMission=s=>{ for(const m of s.missions) if(!m.optional&&!api.missionDone(m.id)) return m; return null; };

  /* ---- Freischaltungen ---- */
  api.isUnlocked=id=>!!D().unlocks[id];
  api.unlock=function(id,o){
    if(!ok(id)||D().unlocks[id]) return false;
    D().unlocks[id]=Date.now(); dirty();
    const def=UNL[id]||{name:id,kind:'misc'};
    api.emit('unlock',{id,name:def.name,kind:def.kind,silent:!!(o&&o.silent)});
    if(!(o&&o.silent)&&state==='play') showMsg('FREIGESCHALTET: '+def.name,2600);
    return true;
  };
  api.canEnter=function(s){
    if(typeof s==='number') s=BYID[s]; if(!s) return false;
    for(const f of s.requires||[]) if(!api.has(f)) return false;
    return s.id===firstId()||api.isUnlocked('sector:'+s.id)||!!D().cleared[s.key];
  };

  /* ---- Aktions-Interpreter (Daten statt Code) ---- */
  api.run=function(list,ctx){
    if(!Array.isArray(list)) return;
    for(const a of list){
      if(!a||typeof a!=='object') continue;
      if(a.once){ const k='once.'+a.once; if(!ok(k)||api.has(k)) continue; api.flag(k,true); }
      try{
        if(a.flag!==undefined) api.flag(a.flag,a.value);
        if(a.clearFlag) api.clearFlag(a.clearFlag);
        if(a.msg) showMsg(a.msg,a.ms||3200);
        if(a.unlock) api.unlock(a.unlock,a.silent?{silent:1}:null);
        if(a.reality) api.discoverReality(a.reality);
        if(a.log) api.discoverLog(a.log);
        if(a.signal) api.addSignal(a.signal);
        if(a.warden) api.addWarden(a.warden);
        if(a.breach) api.addBreach(a.breach);
        if(a.mission) (a.state==='done'?api.completeMission:api.startMission)(a.mission);
        if(a.act) api.setAct(a.act);
        if(a.ending!==undefined&&a.ending!==null) api.setEnding(a.ending);
        if(a.emit) api.emit(a.emit,ctx);
        if(a.if) api.run(api.has(a.if)?a.then:a.else,ctx);
        if(a.ifAll) api.run(a.ifAll.every(k=>api.has(k))?a.then:a.else,ctx);   // Phase 4: alle Flags gesetzt
        if(a.terminal||a.tx||a.system||a.note||a.dialog) StoryUI.play(a);   // Phase 2
        if(a.echo) StoryUI.echo(a.echo);   // Phase 3: Reality-Echo
        if(a.realm) api.realm(a.realm,a);   // Phase 8: Realm-Wechsel
      }catch(e){ console.error('[story] Aktion fehlgeschlagen',e); }
    }
  };

  /* ---- Spielablauf-Hooks (aus startLevel / finishLevel / Boss.onDeath / die) ---- */
  const live=()=>!!(api.active&&api.cur&&lvIdx===api.cur.level&&lvl&&!lvl.procedural);
  api.live=live;
  api.onSectorStart=function(){
    api.active=false; api.cur=null; ZN=[]; realmReset(); try{ StoryUI.echoClear(); }catch(e){}
    if(lvIdx<0||!lvl||lvl.procedural) return;
    const s=BYLEVEL[lvIdx]; if(!s||!api.canEnter(s)) return;   // nicht freigeschaltet = freies Spiel (Direktwahl)
    api.active=true; api.cur=s;
    const d=D(), first=!d.started;
    if(first){ d.started=true; api.unlock('sector:'+firstId(),{silent:true}); api.emit('start',{}); api.run(s.on.start); }
    if(s.id>d.sector) d.sector=s.id;
    api.setAct(s.act);
    const m=openMission(s); if(m) d.mission=m.id;
    api.flag('sector.'+s.key+'.entered');
    api.emit('sectorStart',{sector:s.id,key:s.key,first:!api.has('sector.'+s.key+'.seen')});
    api.flag('sector.'+s.key+'.seen');
    api.run(s.on.enter,{sector:s.id});
    setupZones(s);
    dirty();
  };
  api.onBossDefeated=function(e){
    if(!live()) return;
    const s=api.cur, d=D(), key=s.key+':b'+((e&&e.bv)|0);
    d.bosses[key]=(d.bosses[key]|0)+1;
    let others=false; for(const o of enemies) if(o!==e&&o.type==='K'&&o.alive) others=true;
    if(!others) for(const m of s.missions) if(m.type==='boss') api.completeMission(m.id);
    api.flag('boss.'+key); dirty();
    api.emit('bossDefeated',{sector:s.id,key,variant:(e&&e.bv)|0});
    api.run(s.on.boss,{sector:s.id});
  };
  api.onPlayerDeath=function(){
    if(!live()) return;
    api.emit('playerDeath',{sector:api.cur.id}); api.run(api.cur.on.death,{sector:api.cur.id});
  };
  api.onSectorClear=function(){
    const rows=[]; if(!live()) return rows;
    const s=api.cur, d=D(), nxt=nextOf(s);
    d.cleared[s.key]=1; api.flag('sector.'+s.key+'.cleared');
    for(const m of s.missions) if(m.type==='clear'||m.type==='boss'||(m.type==='flag'&&m.flag&&api.has(m.flag))) api.completeMission(m.id);
    const unl=[];
    const un=(id)=>{ if(api.unlock(id,{silent:true})){ const df=UNL[id]; if(df&&df.name) unl.push(df.name); } };
    if(nxt){ un('sector:'+nxt.id); if(nxt.id>d.sector) d.sector=nxt.id; }
    for(const u of s.unlocks||[]) un(u);
    d.cp={owned:[],ammo:Math.max(0,P.ammo|0)}; for(let i=0;i<P.owned.length&&i<32;i++) if(P.owned[i]) d.cp.owned.push(i);
    const m=nxt?openMission(nxt):null; d.mission=m?m.id:'';
    api.emit('sectorClear',{sector:s.id,key:s.key});
    api.run(s.on.clear,{sector:s.id});
    rows.push(['Story',api.actName(s.act).replace(/^AKT /,'Akt ')+' · '+pad(s.id)+' '+s.name]);
    if(unl.length) rows.push(['Freigeschaltet',unl.join(', ')]);
    dirty(); Save.flush();
    return rows;
  };

  /* ---- Fortsetzen (Titel) ---- */
  api.resumeSector=function(){
    const d=D(); if(!d.started) return null;
    for(const s of SECT) if(!d.cleared[s.key]&&api.canEnter(s)&&s.level!=null) return s;
    return null;
  };
  api.titleBtn=function(){
    return '';   // Archiv und Epilog liegen im Story-Fenster (api.menu)
  };
  api.archiveBtn=function(){
    if(!api.archiveOpen()) return '';
    const n=api.newTotal(); return '<button id="b-arch" type="button">NEXUS ARCHIVE'+(n?' ('+n+' neu)':'')+'</button>';
  };
  api.enter=function(id){   // Sektor starten wie „Fortsetzen“ (auch fuer Konsole/Tests): frischer Lauf + Checkpoint
    const s=BYID[id]; if(!s||s.level==null) return false;
    newRun(); const cp=D().cp, idx=s.level;
    P.ammo=36+idx*10; if(idx>0) P.hasSG=true;
    if(cp&&idx>0){ for(const i of cp.owned) if(i<WEAPONS.length) setOwned(i,true); P.ammo=Math.max(P.ammo,cp.ammo|0); }
    startLevel(idx,true); return true;
  };
  api.resume=function(){ const s=api.resumeSector(); if(s) api.enter(s.id); };
  /* Titel „Story“: solange nur Sektor 1 offen ist, startet es direkt; danach Sektor-Fenster (Fortsetzen + freigeschaltete Sektoren) */
  api.menu=function(back){
    back=back||showTitle;
    const d=D(), open=SECT.filter(s=>s.level!=null&&api.canEnter(s));
    if(open.length<=1&&!api.archiveOpen()&&!d.completed){ api.enter(open.length?open[0].id:1); return; }
    const rs=api.resumeSector(); let h='<h2>Story</h2>';
    h+='<p class="small" style="margin:0 0 1cqw">'+api.progress().cleared+' von '+SECT.length+' Sektoren gesäubert</p>';
    if(rs) h+='<div class="row" style="margin-bottom:1cqw"><button class="primary" id="st-cont" type="button">Fortsetzen — Sektor '+rs.id+'</button></div>';
    const ab=api.archiveBtn(), eb=d.completed?'<button id="b-epi" type="button">Epilog ansehen</button>':'';
    if(ab||eb) h+='<div class="row" style="margin-bottom:1cqw">'+ab+eb+'</div>';
    h+='<div class="arl">';
    let hidden=0;
    for(const a of ACTS){
      const list=SECT.filter(s=>s.id>=a.from&&s.id<=a.to&&s.level!=null);
      if(!list.some(s=>api.canEnter(s))){ hidden+=list.length; continue; }
      h+='<div class="subhead">Akt '+a.n+' · '+a.name+'</div><div class="stsec">';
      for(const s of list){
        const can=api.canEnter(s), nm=(s.id<10?'0':'')+s.id;
        h+=can?'<button class="chip'+(d.cleared[s.key]?' done':'')+'" type="button" data-sec="'+s.id+'">'+(d.cleared[s.key]?'✓ ':'')+nm+' · '+s.name+'</button>'
              :'<button class="chip lockd" type="button" disabled>'+nm+' · gesperrt</button>';
      }
      h+='</div>';
    }
    if(hidden) h+='<p class="small">'+hidden+' weitere Sektoren noch gesperrt.</p>';
    h+='</div><div class="row"><button id="st-back" type="button">Zurück</button></div>';
    showOverlay({wide:true,html:h,onMount:box=>{
      const c=box.querySelector('#st-cont'); if(c) c.onclick=api.resume;
      const ba=box.querySelector('#b-arch'); if(ba) ba.onclick=()=>StoryUI.archive(()=>api.menu(back));
      const be=box.querySelector('#b-epi'); if(be) be.onclick=()=>Epilogue.start(null,{replay:true});
      box.querySelectorAll('[data-sec]').forEach(b=>b.onclick=()=>api.enter(+b.getAttribute('data-sec')));
      box.querySelector('#st-back').onclick=()=>back();
    }});
  };

  /* ---- Auskunft ---- */
  api.progress=function(){
    const d=D(); let n=0; for(const s of SECT) if(d.cleared[s.key]) n++;
    return { started:d.started, completed:d.completed, act:d.act, sector:d.sector, mission:d.mission, cleared:n, total:SECT.length };
  };
  api.state=function(){ const d=D(); return Object.assign({ active:api.active, cur:api.cur?api.cur.key:null }, JSON.parse(JSON.stringify(d))); };
  api.reset=function(){ Save.data.story=Save.defaults().story; api.active=false; api.cur=null; Save.markDirty(); Save.flush(); };

  /* ---- Registrierung Akt I (Phase 3) ---- */
  api.defineUnlock('archive',{name:'NEXUS ARCHIVE',kind:'feature'});   // Reserve fuer Phase 2
  /* ---- Phase 3: Story-Level-Varianten, Ausloeser-Zonen, Portal-Tor ----
     Sektor-Definition darf tragen: patch{lock,name,intro,angle,bossName,map,set:[[x,y,zeichen]..]}  (Story-Variante von LEVELS[level], Original bleibt fuer freies Spiel),
     zones[{id,x,y,r,sprite,need,skipWhen,run:[Aktionen]}]  (Zelle x,y; loest einmal pro Sektorstart aus), gate:'flag' + gateMsg  (Portal bleibt zu, bis das Flag gesetzt ist). */
  /* ---- Reality Collision (Phase 8): Realm-Wechsel zur Laufzeit (Biom-Texturen, Nebel, Sprites, Farbschleier) ---- */
  const REALMS={ NEXUS:{b:'facility',c:'#35E4FF'}, DEEP_ANCHOR:{b:'facility',c:'#6FA8FF'}, FOUNDRY:{b:'facility',c:'#FFAE3D'},
    AETHERIS:{b:'desert',c:'#C86BFF'}, ASTRION:{b:'canyon',c:'#FF5DA8'}, PATH_OF_THE_STARS:{b:'canyon',c:'#B8C4D8'},
    DOMUS_PRIME:{b:'jungle',c:'#7CFFB2'}, NULL:{b:'facility',c:'#B000FF'} };
  const RLIST=['NEXUS','DEEP_ANCHOR','AETHERIS','ASTRION','PATH_OF_THE_STARS','DOMUS_PRIME','FOUNDRY'];
  let rmEl=null, rmId=null, rmHold=null, rmT=0, rmCyc=0, cycT=0, rmCi=0, rmOn=false, rmOp='.14', fluxT=0, STG=[];
  function realmEl(){
    if(rmEl&&rmEl.parentNode) return rmEl; const st=$('stage'); if(!st) return null;
    const e=document.createElement('div'); e.id='stRealm';
    e.style.cssText='position:absolute;left:0;top:0;width:100%;height:100%;z-index:57;pointer-events:none;opacity:0;mix-blend-mode:screen;transition:opacity .6s,background-color .6s;background-color:#35E4FF';
    st.appendChild(e); rmEl=e; return e;
  }
  function applyBiome(id){
    const b=BIOMES[id]||BIOMES.facility;
    curWall=b.wall; curFloor=b.floor; curCeil=b.ceil||null; curSky=b.sky||null; curOutdoor=!!b.outdoor; curBiome=id in BIOMES?id:'facility';
    curSPR=SPR_BIOME[curBiome]||SPR_BIOME.facility; try{ Biome.apply(curBiome); }catch(e){}
  }
  function realmSet(id,o){
    o=o||{}; const R=REALMS[id]; if(!R) return false;
    applyBiome(R.b);
    const e=realmEl(), st=$('stage'), rm=!!(st&&st.classList.contains('rm'));
    rmOp=rm?'.07':(id==='NULL'?'.22':'.14');
    if(e){ e.style.backgroundColor=R.c; if(rmOn) e.style.opacity=rmOp; }
    rmId=id; rmT=o.ms>0?o.ms/1000:0;
    if(id==='NULL'){ try{ setAmbient('null'); }catch(x){} }   // Phase 11
    if(!o.quiet){ try{ Cine.glitch(1); }catch(x){} }
    return true;
  }
  function realmOff(){ rmId=null; rmT=0; rmCyc=0; applyBiome((lvl&&lvl.biome)||'facility'); try{ if(ambient&&ambient.biome==='null') setAmbient(curBiome); }catch(x){} if(rmEl) rmEl.style.opacity='0'; rmOn=false; }
  function realmReset(){ rmId=null; rmHold=null; rmT=0; rmCyc=0; rmOn=false; fluxT=0; STG=[]; if(rmEl) rmEl.style.opacity='0'; }
  /* {realm:'DOMUS_PRIME'} bleibt bis zum Sektorende; {realm:'X',ms:5000} nur zeitweise; {realm:'cycle'} wechselt alle ~1 s durch alle Realitaeten; {realm:'off'} zurueck */
  api.realm=function(id,o){
    o=o||{};
    try{
      if(id==='off'){ rmHold=null; realmOff(); return true; }
      if(id==='cycle'){ rmCyc=o.every>0?o.every:1.1; cycT=0; return true; }
      rmCyc=0; if(!(o.ms>0)) rmHold=id;
      return realmSet(id,o);
    }catch(e){ return false; }
  };
  api.realmId=()=>rmId;
  const PCACHE={}; let ZN=[];
  api.levelFor=function(idx){
    const s=BYLEVEL[idx]; if(!s||!s.patch||!api.canEnter(s)) return null;
    if(PCACHE[idx]) return PCACHE[idx];

  /* ---- Warteschlangen (nicht-blockierend) ---- */
  function push(kind,spec){
    if(!spec) return false; const q=Q[kind];
    if(q.length>=CAP[kind]){ if(kind==='note') q.shift(); else return false; }
    q.push(spec); return true;
  }
  const norm=(v)=>Array.isArray(v)?v.join('\n'):String(v==null?'':v);
  api.terminal=function(o){ o=o||{}; const t=norm(o.lines!==undefined?o.lines:o.text); if(!t) return false; return push('term',{title:String(o.title||'TERMINAL'),text:t,ms:o.ms,entry:o.entry,reality:o.reality}); };
  api.transmission=function(o){ o=o||{}; const t=norm(o.text!==undefined?o.text:o.lines); if(!t) return false; return push('tx',{from:String(o.from||'UNKNOWN'),text:t,ms:o.ms,glitch:!!o.glitch,entry:o.entry,reality:o.reality}); };
  api.system=function(text,o){ o=o||{}; if(!text) return false; return push('sys',{text:String(text),tone:TONES[o.tone]?o.tone:'info',ms:o.ms,entry:o.entry,reality:o.reality}); };
  api.note=function(text,o){ o=o||{}; if(!text) return false; return push('note',{text:String(text),color:o.color,ms:o.ms}); };
  api.play=function(a){   // Story-Aktion {terminal|tx|system|note|dialog}
    if(a.terminal) api.terminal(a.terminal);
    if(a.tx) api.transmission(a.tx);
    if(a.system) api.system(a.system,{tone:a.tone,ms:a.ms});
    if(a.note) api.note(a.note);
    if(a.dialog) api.dialog(a.dialog.lines||a.dialog,a.dialog.lines?a.dialog:{});
  };
  const discover=sp=>{ try{ if(sp.entry) Story.discoverLog(sp.entry); if(sp.reality) Story.discoverReality(sp.reality); }catch(e){} };

  function startSlot(kind){
    const sp=Q[kind].shift(); if(!sp) return; const E=dom(); discover(sp);
    const s={spec:sp,t:0,n:0,total:0,h:0,hold:0,f:0,txt:''};
    if(kind==='tx'){ s.txt=sp.text; s.total=s.txt.length; s.hold=sp.ms?sp.ms/1000:Math.max(2.4,s.total/17); }
    else if(kind==='term'){ s.txt=sp.text; s.total=s.txt.length; s.hold=sp.ms?sp.ms/1000:Math.max(3,2+s.total/24); }
    else if(kind==='sys'){ s.hold=sp.ms?sp.ms/1000:2.6; }
    else { s.hold=sp.ms?sp.ms/1000:2.6; }
    S[kind]=s; if(RM()){ s.n=s.total; }
    if(!E) return;
    try{
      if(kind==='tx'){ E.tx.style.setProperty('--tc',col(sp.from)); E.txH.textContent='◈ ÜBERTRAGUNG · '+sp.from.toUpperCase(); E.txB.textContent=s.n?s.txt:''; E.tx.classList.toggle('gl',!!sp.glitch&&!RM()); E.tx.classList.add('on'); snd(SFX.tx); }
      else if(kind==='term'){ E.teH.textContent='> '+sp.title.toUpperCase(); E.teB.textContent=s.n?s.txt:''; E.term.classList.add('on'); snd(SFX.term); }
      else if(kind==='sys'){ E.sys.style.setProperty('--tc',TONES[sp.tone]); E.sy.textContent=sp.text.toUpperCase(); E.sys.classList.toggle('gl',sp.tone!=='info'&&!RM()); E.sys.classList.add('on'); snd(SFX.sys); }
      else { E.note.style.setProperty('--tc',sp.color||'#35E4FF'); E.note.textContent=sp.text; E.note.classList.add('on'); }
    }catch(e){}
  }
  function tickSlot(kind,dt){
    let s=S[kind];
    if(!s){ if(Q[kind].length) startSlot(kind); return; }
    const E=els; s.t+=dt;
    if(s.f>0){ s.f-=dt; if(s.f<=0){ S[kind]=null; if(Q[kind].length) startSlot(kind); } return; }
    if(s.n<s.total){
      const n=Math.min(s.total,Math.floor(s.t*CPS));
      if(n!==s.n){ s.n=n;
        if(E){ try{ (kind==='tx'?E.txB:E.teB).textContent=s.txt.slice(0,n)+(n<s.total&&kind==='term'?'█':''); }catch(e){} }
        if((kind==='term'||kind==='tx')&&tickT<=0&&n<s.total){ snd(SFX.tick); tickT=.05; } }
      return;
    }
    s.h+=dt;
    if(s.h>=s.hold){ s.f=.3; if(E){ try{ (E[kind==='sys'?'sys':kind]).classList.remove('on'); }catch(e){} } }
  }

  /* ---- Dialog (blockierend, kurz) ---- */
  function normLines(v){
    if(!Array.isArray(v)) v=[v]; const out=[];
    for(const l of v){ if(typeof l==='string'){ if(l) out.push({who:'',text:l}); } else if(l&&l.text) out.push({who:String(l.who||''),text:String(l.text)}); }
    return out;
  }
  api.dialog=function(lines,o){
    o=o||{}; lines=normLines(lines); if(!lines.length) return false;
    if(o.id&&(!Save.storyKey('dlg.'+o.id))) o=Object.assign({},o,{id:''});
    if(o.once&&o.id&&Story.has('dlg.'+o.id)) return false;
    if(Q.dlg.length>=CAP.dlg) return false;
    Q.dlg.push({lines,o}); return true;
  };
  function dlgRender(){
    const E=els, l=dlg.spec.lines[dlg.i]; dlg.txt=l.text; dlg.n=RM()?l.text.length:0; dlg.t=0;
    if(!E) return;
    try{ E.dl.style.setProperty('--tc',col(l.who)); E.dH.textContent=l.who?l.who.toUpperCase():'◈'; E.dB.textContent=dlg.txt.slice(0,dlg.n);
      E.dS.textContent=(dlg.i+1)+' / '+dlg.spec.lines.length+'   ▶ ENTER / TIPPEN · ESC überspringen'; }catch(e){}
    snd(SFX.dlg);
  }
  function dlgOpen(){
    const sp=Q.dlg.shift(); if(!sp) return; const E=dom();
    dlg={spec:sp,i:0,n:0,t:0,txt:''}; api.open=true;
    discover(sp.o);
    setState('pause'); releaseLock();
    if(E){ try{ E.bg.style.display='block'; E.dl.style.display='block'; }catch(e){} }
    dlgRender();
  }
  function dlgClose(){
    if(!dlg) return; const sp=dlg.spec; dlg=null; api.open=false;
    if(els){ try{ els.bg.style.display='none'; els.dl.style.display='none'; }catch(e){} }
    if(sp.o.id){ Story.flag('dlg.'+sp.o.id); }
    if(state==='pause'){ setState('play'); requestLock(); lastT=performance.now(); }
    try{ Story.emit('dialog',{id:sp.o.id||''}); if(typeof sp.o.done==='function') sp.o.done(); }catch(e){ console.error('[storyui]',e); }
  }
  api.advance=function(){
    if(!dlg) return false;
    if(dlg.n<dlg.txt.length){ dlg.n=dlg.txt.length; if(els){ try{ els.dB.textContent=dlg.txt; }catch(e){} } return true; }
    dlg.i++; if(dlg.i>=dlg.spec.lines.length) dlgClose(); else dlgRender();
    return true;
  };
  api.skip=function(){ if(dlg) dlgClose(); };
  api.keyDown=function(e){   // aus dem globalen keydown-Handler: true = Taste verbraucht
    if(!dlg) return false;
    const c=e.code;
    if(c==='Enter'||c==='Space'||c==='KeyE'||c==='NumpadEnter') api.advance();
    else if(c==='Escape') api.skip();
    return true;
  };

  /* ---- Takt (aus frame, echte Zeit) ---- */
  api.tick=function(dt){
    if(tickT>0) tickT-=dt;
    if(dlg){
      if(dlg.n<dlg.txt.length){
        dlg.t+=dt; const n=Math.min(dlg.txt.length,Math.floor(dlg.t*CPS*1.15));
        if(n!==dlg.n){ dlg.n=n; if(els){ try{ els.dB.textContent=dlg.txt.slice(0,n); }catch(e){} } if(tickT<=0){ snd(SFX.tick); tickT=.05; } }
      }
      return;
    }
    if(state!=='play') return;
    if(Q.dlg.length){ dlgOpen(); return; }
    if(!els&&(Q.tx.length||Q.term.length||Q.sys.length||Q.note.length)) dom();
    for(const k of ['sys','tx','term','note']) tickSlot(k,dt);
  };
  api.clear=function(){
    try{ api.echoClear(); }catch(e){}
    for(const k in Q) Q[k].length=0;
    for(const k in S) S[k]=null;
    if(dlg){ dlg=null; api.open=false; }
    if(els){ try{ for(const k of ['tx','term','sys','note']) els[k].classList.remove('on'); els.bg.style.display='none'; els.dl.style.display='none'; }catch(e){} }
  };
  onState((to)=>{ if(to==='title'||to==='dead'||to==='levelwin'||to==='gamewin') api.clear(); });
  api.busy=()=>!!(dlg||S.tx||S.term||S.sys||Q.dlg.length||Q.tx.length||Q.term.length||Q.sys.length);
  api.state=()=>({open:api.open,dlg:dlg?{i:dlg.i,n:dlg.n,of:dlg.spec.lines.length}:null,
    q:{term:Q.term.length,tx:Q.tx.length,sys:Q.sys.length,note:Q.note.length,dlg:Q.dlg.length},
    cur:{term:!!S.term,tx:!!S.tx,sys:!!S.sys,note:!!S.note,txN:S.tx?S.tx.n:0,termN:S.term?S.term.n:0}});

  /* ---- Entdeckungs-Hinweis (kleine Notiz) ---- */
  Story.on('log',x=>{ const e=Story.entry(x.id); if(!e) return; const c=(Story.CATS.find(k=>k[0]===e.cat)||[0,'ARCHIV'])[1]; api.note('ARCHIV · '+c+': '+e.title,{color:'#FFD24D'}); });
  Story.on('reality',x=>{ const r=Story.reality(x.id); if(r) api.note('ARCHIV · REALITÄT: '+r.name,{color:r.color}); });

  /* ---- NEXUS ARCHIVE ---- */
  const TABS=[['log','LOGS'],['tx','ÜBERTRAG.'],['real','REALITÄTEN'],['warden','WARDEN'],['axiom','AXIOM'],['signal','SIGNAL'],['unknown','???']];
  const paras=t=>(Array.isArray(t)?t:[t]).map(x=>'<p>'+escH(x).replace(/\n/g,'<br>')+'</p>').join('');
  function entRows(cat){
    const d=Save.data.story, have=d.logs, seen=d.seen; let h='', got=0, tot=0;
    const list=Story.entries(cat), shown={};
    for(const e of list){
      const has=have.indexOf(e.id)>=0; shown[e.id]=1;
      if(!has){ if(e.hidden) continue; tot++; h+='<div class="ar lock"><span>???</span><small>nicht entdeckt</small></div>'; continue; }
      tot++; got++;
      h+='<details class="ar" data-e="'+escH(e.id)+'"><summary>'+(seen[e.id]?'':'<em>NEU</em>')+'<span>'+escH(e.title)+'</span><small>'+escH(e.from||'')+'</small></summary><div class="at">'+paras(e.text)+'</div></details>';
    }
    for(const id of have){   // entdeckt, aber (noch) nicht definiert: nie verlieren
      if(shown[id]||Story.entry(id)) continue; const c=(id.split('.')[0]||'log'); if(c!==cat&&!(cat==='log'&&['log','tx','warden','axiom','signal','unknown'].indexOf(c)<0)) continue;
      tot++; got++; h+='<details class="ar" data-e="'+escH(id)+'"><summary><span>'+escH(id)+'</span></summary><div class="at"><i>Kein Text hinterlegt.</i></div></details>';
    }
    return {h,got,tot};
  }
  function realRows(){
    const d=Save.data.story; let h='', got=0;
    for(const r of Story.REALITIES){
      const has=d.realities.indexOf(r.id)>=0;
      if(!has){ h+='<div class="ar lock" style="--rc:#4a5668"><span>???</span><small>REALITY NODE UNBEKANNT</small></div>'; continue; }
      got++;
      h+='<details class="ar" style="--rc:'+r.color+'" data-r="'+r.id+'"><summary>'+(d.seen['r.'+r.id]?'':'<em>NEU</em>')+'<span style="color:'+r.color+'">'+escH(r.name)+'</span><small>REALITY NODE'+(Story.has('a3.ar.states')&&Story.REALSTATE[r.id]?' · '+Story.REALSTATE[r.id]:'')+'</small></summary><div class="at">'+paras(r.text)+'</div></details>';
    }

  }
  api.archiveHtml=function(tab){

    const cur=info[tab]||info.log;
    const tabs=TABS.map(t=>{ const r=info[t[0]]; const nw=Story.newCount(t[0]);
      return '<button class="ld-opt'+(t[0]===tab?' on':'')+'" data-tab="'+t[0]+'" style="width:auto;flex:1 1 22%;min-height:48px;align-items:center"><b>'+t[1]+(nw?' <em style="color:#FFD24D;font-style:normal">◆'+nw+'</em>':'')+'</b><small>'+r.got+' / '+r.tot+'</small></button>'; }).join('');

      '<div class="ld-tabs">'+tabs+'</div>'+head+'<div class="arl">'+body+'</div><div class="row"><button class="primary" id="ar-back" type="button" style="min-height:48px">Zurück</button></div>';
  };
  api.archive=function(back,tab){

      box.querySelector('#ar-back').onclick=()=>{ (back||showTitle)(); };
    }});
  };

  /* ---- Konsole: alle Praesentationsarten ausprobieren (nur [TEST]-Texte, nichts wird gespeichert) ---- */

      s+=d+`<polyline points="${[0,1,2,3,4,5,6,7].map(i=>(10+i*20)+','+(20+r()*40).toFixed(1)).join(' ')}" fill="none" stroke="#fff" stroke-width=".5" opacity=".7"/><text x="80" y="12" font-size="4" fill="${hue}" text-anchor="middle" font-family="monospace">B</text>`;

/* ============================================================
   Story Mode Phase 9 — EPILOG / Terminal-Finale / Completion State
   Modul `Epilogue` (auch `__breach.Epilogue`, `NX.epilogue`). Laeuft nach dem Sieg ueber NULL SOVEREIGN (Sektor 30, aus finishLevel).
   Ablauf: Story.complete() speichert den Abschluss SOFORT (Save.flush), danach Szene 1 (BREACH CONTAINED), Szene 2 (03:14 / SIGNAL),
   Szene 3 (NEXUS SYSTEM Terminal, > listen / > I KNOW., ENDE.), dann Abschluss-Overlay mit NEXUS ASCENSION.
   Beim ersten Mal nicht ueberspringbar; erst nach gesehenem Epilog (Flag `epilog.seen`) und beim Wiederansehen Esc/Tippen = skip.

const Epilogue=(()=>{
  const api={ ver:1, on:false, replay:false };
  let el=null, tk=0, fast=false, canSkip=false, after=null, keyFn=null;
  const RMo=()=>{ try{ let r=!!Save.data.settings.reducedMotion; try{ r=r||matchMedia('(prefers-reduced-motion:reduce)').matches; }catch(e){} return r; }catch(e){ return false; } };
  const snd=f=>{ try{ f(); }catch(e){} };
  function css(){
    if(document.getElementById('stEpiCss')) return;
    const c=document.createElement('style'); c.id='stEpiCss';
    c.textContent='#stEpi{position:absolute;inset:0;z-index:95;background:#000;display:none;align-items:center;justify-content:center;padding:4cqw;box-sizing:border-box;color:#DCF6FF;font-family:ui-monospace,Consolas,Menlo,monospace}'+
      '#stEpi.on{display:flex;animation:epIn 1.6s ease-out}@keyframes epIn{from{opacity:0}to{opacity:1}}'+
      '#stEpi pre{margin:0;font:inherit;font-size:clamp(12px,2.1cqw,26px);line-height:1.6;letter-spacing:.08em;white-space:pre-wrap;min-width:min(58cqw,92%);max-width:92%}'+
      '#stEpi .big{display:block;font-size:clamp(20px,4.4cqw,58px);letter-spacing:.28em;line-height:1.4}'+
      '#stEpi .gr{color:#7CFFB2}#stEpi .cy{color:#35E4FF}#stEpi .rd{color:#FF4D6A}#stEpi .dm{opacity:.5}'+
      '#stEpi .gl{animation:epGl .16s steps(2) 4}'+
      '@keyframes epGl{0%{transform:translateX(0)}50%{transform:translateX(-.5cqw) skewX(5deg);opacity:.7}100%{transform:translateX(.4cqw)}}'+
      '#stEpi .hint{position:absolute;right:2cqw;bottom:1.6cqw;font-size:clamp(9px,1.1cqw,13px);letter-spacing:.14em;opacity:.45}'+
      '.rm #stEpi .gl,.rm #stEpi.on{animation:none}@media (prefers-reduced-motion:reduce){#stEpi .gl,#stEpi.on{animation:none}}';
    document.head.appendChild(c);
  }
  const alive=t=>t===tk&&api.on;
  const sleep=(ms,t)=>new Promise(res=>setTimeout(res,fast?0:ms)).then(()=>alive(t));
  async function type(node,text,t,cps){
    if(fast||RMo()){ node.textContent+=text; return alive(t); }
    const d=1000/(cps||34);
    for(let i=0;i<text.length;i++){
      if(!alive(t)) return false; if(fast){ node.textContent+=text.slice(i); break; }

    src.className='big gl'; src.textContent='DU'; snd(()=>{ noise(.35,.12,700); tone(120,55,.9,'sawtooth',.12); });

    p=fresh(); if(!(await sleep(2600,t))) return;   // Schwarz
    /* ---- Szene 3: NEXUS SYSTEM (Terminal-Finale) ---- */
    if(!(await ln(p,'NEXUS SYSTEM\n',{c:'cy',cps:22,after:900},t))) return;
    const rows=[['NEXUS','ONLINE'],['AXIOM','ONLINE'],['RELAY','ONLINE'],['FORK','ONLINE'],['REALITÄTSKNOTEN','7'],['BREACH','GESCHLOSSEN']];

    snd(()=>tone(70,50,2.6,'sine',.09));
    if(!(await ln(p,'\n> ICH WEISS.',{c:'rd',cps:5,after:4200},t))) return;
    if(!(await ln(p,'\nENDE.',{c:'dm',cps:4,after:3600},t))) return;
  }
  function endScreen(){

    const pr=Story.progress(), rows=[['Story','Abgeschlossen · '+pr.cleared+' / '+pr.total+' Sektoren'],['Ausgang','BREACH CONTAINED'],['Archiv',(Save.data.story.logs.length)+' Logs · '+(Save.data.story.realities.length)+' Realitäten']];

  }

    if(keyFn){ document.removeEventListener('keydown',keyFn,true); keyFn=null; }
  }
  api.skip=function(){ if(!api.on||!canSkip) return false; fast=true; return true; };
  api.start=function(st,o){

    keyFn=e=>{ if(!api.on) return; if(e.key==='Escape'||e.key==='Enter'||e.key===' '){ e.preventDefault(); e.stopPropagation(); api.skip(); } };

    return true;
  };
  api.state=()=>({on:api.on,replay:api.replay,completed:Story.isCompleted(),seen:Story.has('epilog.seen'),ascension:Ascension.state().unlocked});
  return api;
})();

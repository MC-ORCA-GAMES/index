};
const PLIM={ shieldMax:[0,500], shieldRegen:[0,100], armorMax:[0,500], energyMax:[20,500], energyRegen:[0,200], sprintCost:[0,60],
  hpRegen:[0,20], resist:[0,.75], speed:[.5,2], crit:[0,1], critDmg:[1,6], dashCharges:[1,4], dashCd:[.3,4], dashCost:[0,60], dashDist:[1,6], fireRate:[-.5,3], dmgMul:[.1,10], reloadSpeed:[-.5,4], heatMul:[0,3] };
/* ============================================================
   Waffen-Mods (Phase 5): 5 Slots je Waffe (Lauf, Kern, Magazin, System, Spezial), 3 Stufen (I-III).
   Mods aendern NICHT die Tabelle WEAPONS, sondern liefern pro Waffe ein abgeleitetes Werte-Paket `Mods.eff(waffe)`,
   das Feuern/Nachladen/Hitze/Krit/Schaden auslesen. Ohne Mods ist das Paket neutral (Verhalten wie Phase 4).
   Mods gehoeren zum Lauf: `newRun()` leert Inventar und Einbauten (Meta-Freischaltung folgt in Phase 15).
   ============================================================ */
const MOD_SLOTS=[{id:'barrel',name:'LAUF'},{id:'core',name:'KERN'},{id:'mag',name:'MAGAZIN'},{id:'system',name:'SYSTEM'},{id:'special',name:'SPEZIAL'}];
const MOD_TIERS=[{n:'I',col:'#35E4FF'},{n:'II',col:'#FFAE3D'},{n:'III',col:'#B45CFF'}];
const pc=v=>Math.round(v*100)+'%';
// v = Wirkung je Stufe [I,II,III]; txt = Beschreibung aus den aufgeloesten Werten x
const MOD_BASE=[
  {k:'b_dmg',slot:'barrel',name:'Verstärkter Lauf',v:{dmg:[.10,.17,.25]},txt:x=>'Schaden +'+pc(x.dmg)},
  {k:'b_rng',slot:'barrel',name:'Langlauf',v:{range:[.20,.35,.50]},txt:x=>'Reichweite +'+pc(x.range)},
  {k:'b_acc',slot:'barrel',name:'Präzisionsdrall',v:{acc:[.25,.40,.55]},txt:x=>'Streuung −'+pc(x.acc)},
  {k:'c_en',slot:'core',name:'Energie-Kern',v:{dmg:[.08,.14,.20],energyCut:[.15,.25,.35]},txt:x=>'Schaden +'+pc(x.dmg)+', Energiekosten −'+pc(x.energyCut)},
  {k:'c_pl',slot:'core',name:'Plasma-Kern',v:{plasma:[.20,.30,.42]},txt:x=>'Treffer: Plasma-Flächenschaden ('+pc(x.plasma)+' des Schadens, Radius 1,2)'},
  {k:'c_cr',slot:'core',name:'Krit-Kern',v:{critAdd:[.06,.10,.15],critMulAdd:[.25,.40,.60]},txt:x=>'Krit-Chance +'+pc(x.critAdd)+', Krit-Schaden +'+pc(x.critMulAdd)},
  {k:'m_ext',slot:'mag',name:'Erweitertes Magazin',v:{magMul:[.35,.60,.90]},txt:x=>'Magazin +'+pc(x.magMul)},
  {k:'m_qk',slot:'mag',name:'Schnelllader',v:{reload:[.30,.50,.75]},txt:x=>'Nachladen '+pc(x.reload)+' schneller'},
  {k:'m_sv',slot:'mag',name:'Zellen-Sparer',v:{free:[.12,.20,.30]},txt:x=>pc(x.free)+' Chance, dass ein Schuss kein Magazin kostet'},
  {k:'s_oc',slot:'system',name:'Übertaktung',v:{fireRate:[.12,.20,.30]},txt:x=>'Feuerrate +'+pc(x.fireRate)},
  {k:'s_hs',slot:'system',name:'Kühlkörper',v:{heatCut:[.25,.40,.55],coolAdd:[.20,.35,.50]},txt:x=>'Hitze −'+pc(x.heatCut)+', Abkühlung +'+pc(x.coolAdd)},
  {k:'s_st',slot:'system',name:'Stabilisator',v:{rcCut:[.30,.50,.70],acc:[.10,.15,.20]},txt:x=>'Rückstoß −'+pc(x.rcCut)+', Streuung −'+pc(x.acc)},
  {k:'x_ch',slot:'special',name:'Kettenblitz',v:{chainP:[.30,.42,.55],chainF:[.40,.50,.60],chainN:[1,2,2]},txt:x=>'Treffer: '+pc(x.chainP)+' Chance auf Blitz ('+pc(x.chainF)+' Schaden, '+x.chainN+' Ziel'+(x.chainN>1?'e':'')+')'},
  {k:'x_ex',slot:'special',name:'Explosivgeschosse',v:{expF:[.30,.42,.55],expR:[1.2,1.4,1.7]},txt:x=>'Erster Treffer je Schuss explodiert ('+pc(x.expF)+' Schaden, Radius '+String(x.expR).replace('.',',')+'); Projektilwaffen: Splash +'+pc(x.expF)},
  {k:'x_ap',slot:'special',name:'Panzerbrecher',v:{ap:[.30,.50,.75]},txt:x=>'+'+pc(x.ap)+' Schaden gegen gepanzerte/schwere Gegner'},
  {k:'x_ls',slot:'special',name:'Lebensraub',v:{ls:[.03,.05,.08]},txt:x=>pc(x.ls)+' des verursachten Schadens heilen Integrität'},
  {k:'x_sd',slot:'special',name:'Schild-Entzug',v:{sd:[.10,.18,.28]},txt:x=>pc(x.sd)+' des verursachten Schadens laden das Schild'}
];
const MODS=[], MOD_BY_ID=Object.create(null);
for(const b of MOD_BASE) for(let t=0;t<3;t++){
  const x={}; for(const key in b.v) x[key]=b.v[key][t];
  const m={id:b.k+(t+1),base:b.k,slot:b.slot,tier:t+1,name:b.name+' '+MOD_TIERS[t].n,x,txt:b.txt(x)};
  MODS.push(m); MOD_BY_ID[m.id]=m;
}
const Mods=(()=>{
  const cache=[];
  const api={ inv:Object.create(null), eq:WEAPONS.map(()=>({})), shotId:0, lastShot:-1, busy:false, lsAcc:0, pity:0 };
  function slotsOf(i){ return !!WEAPONS[i]&&WEAPONS[i].id!=='fists'; }     // Faeuste haben keine Slots
  function build(i){
    const w=WEAPONS[i], e=api.eq[i]||{};
    const M={dmg:1,range:1,spread:1,critAdd:0,critMulAdd:0,energy:1,magAdd:0,reload:0,free:0,fireRate:0,heat:1,cool:1,rc:1,
             plasma:0,chainP:0,chainF:0,chainN:0,expF:0,expR:0,ap:0,ls:0,sd:0,n:0};
    let rng=0,acc=0,eCut=0,mMul=0,hCut=0,cAdd=0,rcCut=0;
    for(const sl in e){
      const mod=MOD_BY_ID[e[sl]]; if(!mod) continue; M.n++; const x=mod.x;
      if(x.dmg) M.dmg+=x.dmg; if(x.range) rng+=x.range; if(x.acc) acc+=x.acc; if(x.energyCut) eCut+=x.energyCut;
      if(x.plasma) M.plasma+=x.plasma; if(x.critAdd) M.critAdd+=x.critAdd; if(x.critMulAdd) M.critMulAdd+=x.critMulAdd;
      if(x.magMul) mMul+=x.magMul; if(x.reload) M.reload+=x.reload; if(x.free) M.free+=x.free;
      if(x.fireRate) M.fireRate+=x.fireRate; if(x.heatCut) hCut+=x.heatCut; if(x.coolAdd) cAdd+=x.coolAdd; if(x.rcCut) rcCut+=x.rcCut;
      if(x.chainP){ M.chainP=x.chainP; M.chainF=x.chainF; M.chainN=x.chainN; }
      if(x.expF){ M.expF=x.expF; M.expR=x.expR; }
      if(x.ap) M.ap+=x.ap; if(x.ls) M.ls+=x.ls; if(x.sd) M.sd+=x.sd;
    }
    M.range=1+rng; M.spread=Math.max(.1,1-acc); M.energy=Math.max(.3,1-eCut); M.heat=Math.max(.25,1-hCut); M.cool=1+cAdd; M.rc=Math.max(.2,1-rcCut);
    M.magAdd=(w.mag>0&&mMul>0)?Math.max(1,Math.round(w.mag*mMul)):0;
    return M;
  }
  const NEUTRAL=build(2);   // Faeuste ohne Mods = neutral
  for(let i=0;i<WEAPONS.length;i++) cache[i]=build(i);
  api.NEUTRAL=NEUTRAL;
  api.slotsOf=slotsOf;
  /* Werte-Paket einer Waffe (Index oder Waffen-Objekt); ohne Angabe/unbekannt: neutral */
  api.eff=function(w){ const i=typeof w==='number'?w:(w&&typeof w.i==='number'?w.i:-1); return cache[i]||NEUTRAL; };
  api.magSize=function(i){ const w=WEAPONS[i]; return w&&w.mag>0?w.mag+(cache[i]?cache[i].magAdd:0):0; };
  function equippedCount(id){ let n=0; for(let i=0;i<api.eq.length;i++){ const e=api.eq[i]; for(const sl in e) if(e[sl]===id) n++; } return n; }
  api.count=id=>api.inv[id]|0;
  api.free=id=>(api.inv[id]|0)-equippedCount(id);
  api.refresh=function(i){
    cache[i]=build(i);
    const sz=api.magSize(i);
    if(sz>0&&P.mag[i]>sz){ const ex=P.mag[i]-sz; P.mag[i]=sz; P.ammo=Math.min(99,P.ammo+ex*WEAPONS[i].cost); }   // ueberzaehlige Schuesse als Zellen zurueck
    P.wLv[i]=1+cache[i].n;
    if(i===P.weapon) Stats.recalc();
  };
  api.add=function(id,quiet){
    const m=MOD_BY_ID[id]; if(!m) return false;
    api.inv[id]=(api.inv[id]|0)+1;
    const wu=Save.data.weaponUpgrades, dl=Array.isArray(wu.discovered)?wu.discovered:(wu.discovered=[]);
    if(dl.indexOf(id)<0&&dl.length<256){ dl.push(id); Save.markDirty(); }
    if(!quiet){ showMsg('Waffen-Mod: '+m.name+' ('+m.slot.toUpperCase()+') — '+(isTouch?'Pause → Loadout':'L = Loadout'),2600); sfx.pickup(); }
    return true;
  };
  api.equip=function(i,id){
    const m=MOD_BY_ID[id]; if(!m||!slotsOf(i)||!P.owned[i]) return false;
    if(api.eq[i][m.slot]===id) return true;
    if(api.free(id)<1) return false;
    api.eq[i][m.slot]=id; api.refresh(i); return true;
  };
  api.unequip=function(i,slot){
    if(!slotsOf(i)||!api.eq[i][slot]) return false;
    delete api.eq[i][slot]; api.refresh(i); return true;
  };
  api.reset=function(){
    api.inv=Object.create(null); api.lsAcc=0; api.pity=0; api.shotId=0; api.lastShot=-1;
    for(let i=0;i<WEAPONS.length;i++){ api.eq[i]={}; cache[i]=build(i); P.wLv[i]=1; }
  };
  /* Zufallsmod: Stufe waechst mit der Tiefe (Boss zaehlt +6) */
  api.roll=function(depth,boss){
    const d=(depth||1)+(boss?6:0);
    let t=1;
    if(d>=7&&Math.random()<Math.min(.35,(d-5)*.05)) t=3; else if(d>=2&&Math.random()<Math.min(.6,.3+d*.03)) t=2;
    if(boss&&t<2) t=2;
    return MOD_BASE[(Math.random()*MOD_BASE.length)|0].k+t;
  };
  api.onKill=function(e,depth){
    if(e.type==='K'){ api.add(api.roll(depth,true),true); api.add(api.roll(depth,true)); return; }
    api.pity++;
    if(Math.random()<.03+api.pity*.004){ api.pity=0; api.add(api.roll(depth)); }
  };
  api.sectorReward=function(depth){ const id=api.roll(depth); api.add(id,true); return MOD_BY_ID[id]; };
  const armored=e=>(e.armor>0)||ETYPES[e.type].sc>=1;   // schwer/gepanzert (Phase 8 setzt e.armor)
  api.armored=armored;
  /* Flaechenschaden ohne weitere Mod-Wirkung (Explosiv/Plasma): Abfall bis -50 %, nicht durch Waende */
  function area(cx,cy,R,base,skip){
    for(const en of enemies){
      if(!en.alive||en===skip) continue;
      const dx=en.x-cx, dy=en.y-cy, d=Math.hypot(dx,dy); if(d>R) continue;
      if(d>.3&&rayWallDist(cx,cy,dx/d,dy/d)<d-.1) continue;
      damageEnemy(en,Math.max(1,Math.round(base*(1-d/R*.5))),d>.001?Math.atan2(dy,dx):null,false,true);
    }
  }
  function chain(from,base,n){
    let cur=from; const used=[from];
    for(let k=0;k<n;k++){
      let nx=null, nd=3.2;
      for(const en of enemies){
        if(!en.alive||used.indexOf(en)>=0) continue;
        const dx=en.x-cur.x, dy=en.y-cur.y, d=Math.hypot(dx,dy); if(d>=nd) continue;
        if(rayWallDist(cur.x,cur.y,dx/(d||1),dy/(d||1))<d-.1) continue;
        nx=en; nd=d;
      }
      if(!nx) break;
      beams.push({kind:'arc',x0:cur.x,y0:cur.y,x1:nx.x,y1:nx.y,t:0,life:.12,jag:true,seed:Math.random()*9});
      damageEnemy(nx,Math.max(1,Math.round(base)),Math.atan2(nx.y-cur.y,nx.x-cur.x),false,true);
      used.push(nx); cur=nx;
    }
  }
  /* Nach einem Spielertreffer (Direkttreffer einer Waffe): Plasma/Explosion/Kettenblitz — je Schuss nur einmal, ohne Rekursion */
  api.onHit=function(e,dealt,M,w){
    if(api.busy||M.n<1||state!=='play'||api.lastShot===api.shotId) return;
    if(!(M.plasma||M.expF||M.chainP)) return;
    api.lastShot=api.shotId; api.busy=true;
    try{
      if(M.plasma) area(e.x,e.y,1.2,dealt*M.plasma,e);
      if(M.expF&&w&&w.kind!=='proj'){ area(e.x,e.y,M.expR,dealt*M.expF,e); spawnBoom(e.x,e.y,.8+M.expR*.3,BOOM_PLASMA); sfx.boomP(Math.hypot(e.x-P.x,e.y-P.y)); }
      if(M.chainP&&Math.random()<M.chainP) chain(e,dealt*M.chainF,M.chainN);
    } finally { api.busy=false; }
  };
  /* Lebensraub / Schild-Entzug aus tatsaechlich verursachtem Schaden */
  api.leech=function(dealt,M){
    if(state!=='play'||dealt<=0||P.hp<=0) return;
    if(M.ls>0&&P.hp<100){ api.lsAcc+=dealt*M.ls; if(api.lsAcc>=1){ const n=api.lsAcc|0; api.lsAcc-=n; P.hp=Math.min(100,P.hp+n); FX.heal=Math.max(FX.heal,.12); } }
    if(M.sd>0&&P.shieldMax>0&&P.shield<P.shieldMax) P.shield=Math.min(P.shieldMax,P.shield+dealt*M.sd);
  };
  return api;
})();

const Stats=(()=>{
  const src=Object.create(null), val={};
  /* Waffen-Krit: Waffenwert + Spielerbonus (Bonus = Abweichung vom Basiswert) */
  function weaponCrit(w){ return Math.min(1,Math.max(0,w.crit+(val.crit-PBASE.crit)+Mods.eff(w).critAdd)); }
  function weaponCritMul(w){ return Math.max(1,w.critMul+(val.critDmg-PBASE.critDmg)+Mods.eff(w).critMulAdd); }
  function recalc(){
    for(const k in PBASE){
      let v=PBASE[k];
      for(const id in src){ const a=src[id][k]; if(a) v+=a; }
      const lim=PLIM[k]; if(lim) v=clamp(v,lim[0],lim[1]);
      val[k]=v;
    }
    val.dashCharges=Math.round(val.dashCharges);
    P.shieldMax=val.shieldMax; P.armorMax=val.armorMax; P.energyMax=val.energyMax; P.crit=weaponCrit(WEAPONS[P.weapon]);
    P.shield=Math.min(P.shield,P.shieldMax); P.armor=Math.min(P.armor,P.armorMax); P.energy=Math.min(P.energy,P.energyMax);
    P.dashN=Math.min(P.dashN,val.dashCharges);
  }
  const api={
    val,
    add(id,bonus){ src[id]=bonus; recalc(); },
    remove(id){ delete src[id]; recalc(); },
    removePrefix(pre){ for(const id in src) if(id.indexOf(pre)===0) delete src[id]; recalc(); },
    sources(){ return Object.keys(src); },
    recalc,
    /* Neuer Lauf: Lauf-Boni weg, alles voll, Panzerung leer (kommt am Sektorstart wieder auf Grundfuellung) */
    onRunStart(){ api.removePrefix('run:'); P.shield=P.shieldMax; P.energy=P.energyMax; P.armor=0; api.resetTimers(); },
    /* Jeder Sektorstart (auch nach Tod/Neustart): Schild+Energie voll, Panzerung mindestens Grundfuellung, Dash bereit */
    onSector(){ P.shield=P.shieldMax; P.energy=P.energyMax; P.armor=Math.max(P.armor,Math.round(P.armorMax*val.armorSector)); api.resetTimers(); },
    resetTimers(){ P.dashN=val.dashCharges; P.dashT=0; P.dashCd=0; P.sprinting=false; P.sprintLock=false; P.shieldT=0; P.enT=0; P.enFlash=0; P.hpT=0; P.hpAcc=0; },
    /* Regeneration + Dash-Aufladung, einmal pro Frame im Zustand `play` */
    tick(dt){
      if(P.shieldT>0) P.shieldT-=dt;
      else if(P.shield<P.shieldMax){ const was=P.shield; P.shield=Math.min(P.shieldMax,P.shield+val.shieldRegen*dt); if(was<=0&&P.shield>0) sfx.shieldUp(); }
      if(val.hpRegen>0&&P.hp>0&&P.hp<100){
        if(P.hpT>0) P.hpT-=dt;
        else { P.hpAcc+=val.hpRegen*dt; if(P.hpAcc>=1){ const n=P.hpAcc|0; P.hpAcc-=n; P.hp=Math.min(100,P.hp+n); } }
      }
      if(P.enT>0) P.enT-=dt;
      else if(!P.sprinting&&P.energy<P.energyMax) P.energy=Math.min(P.energyMax,P.energy+val.energyRegen*dt);
      if(P.enFlash>0) P.enFlash-=dt;
      if(P.dashN<val.dashCharges){ P.dashCd-=dt; if(P.dashCd<=0){ P.dashN++; P.dashCd=P.dashN<val.dashCharges?val.dashCd:0; } }
    },
    /* Krit-Wurf fuer Spielertreffer: Multiplikator (1 = kein Krit). Nur im echten Spiel, nicht in der Titel-Demo. */
    weaponCrit, weaponCritMul,
    critMul(w){ w=w||WEAPONS[P.weapon]; return (state==='play'&&Math.random()<weaponCrit(w))?weaponCritMul(w):1; }
  };
  recalc();
  P.shield=P.shieldMax; P.energy=P.energyMax; P.armor=Math.round(P.armorMax*val.armorSector);
  return api;
})();

/* ---- NX: ein Namespace für alle Teilzustände (Getter, weil Level-Variablen neu zugewiesen werden) ---- */
const NX={
  phase:6,
  stats:Stats,                                         // Spieler-Werte + Bonusquellen (Phase 3)
  SAVE_VERSION,
  get state(){ return state; },
  setState, onState, STATE_FLOW,
  player:P,                                            // Player State (Phase 3 erweitert: Shield/Armor/Energy/Dash …)
  weapons:{                                            // Weapon State (Phase 4/5: Definitionen + Mod-Slots)
    defs:WEAPONS,
    get current(){ return WEAPONS[P.weapon]; },
    isUnlocked(i){ return !!P.owned[i]; },
    grant:grantWeapon, pshots, holes, beams, mods:Mods
  },
  enemies:{                                            // Enemy State (Phase 6–8: KI, Klassen, Elites)
    types:ETYPES,
    get list(){ return enemies; },
    get ai(){ return AI; },
    get alive(){ let n=0; for(let i=0;i<enemies.length;i++) if(enemies[i].alive) n++; return n; }
  },
  level:{                                              // Level State (Phase 10–12: Events, Biome, Hazards)
    get def(){ return lvl; },
    get grid(){ return grid; }, get width(){ return MW; }, get height(){ return MH; },
    get biome(){ return curBiome; }, get depth(){ return lvl?lvl.depth:0; },
    get exit(){ return exitCell; }, get stairs(){ return stairsCell; },
    get pickups(){ return pickups; }, get shots(){ return shots; }, get totals(){ return totals; }
  },
  progression:{ stats, run, get save(){ return Save.data; } },   // Progression State (Phase 15–17)
  audio:{                                              // Audio State (Phase 18)
    get ctx(){ return ac; }, get muted(){ return muted; }, sfx
  },
  fx:FX,                                               // Effects State (Phase 19)
  combat:Combat,
  get hud(){ return HUD; },                                       // Kill-Streak / Combo-Kette (Phase 2, Ausbau Phase 17)
  save:Save,                                           // Save State
  get settings(){ return Save.data.settings; }
};

/* ============================================================
   Eingabe
   ============================================================ */
const keys={};
let locked=false, lockFailed=false, lockWanted=false, mouseDown=false;

window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  keys[e.code]=true;
  if(state==='play'){
    if(/^Digit[1-9]$/.test(e.code)) setWeapon(+e.code[5]-1);
    else if(e.code==='KeyR') manualReload();
    else if(e.code==='KeyM') { $('mini').style.display=$('mini').style.display==='none'?'block':'none'; }
    else if(e.code==='KeyF') tryDash();
    else if(e.code==='KeyL'){ pauseGame(); openLoadout(pauseMenu); }
    else if(e.code==='KeyP'){ pauseGame(); }
  } else if(state==='pause' && (e.code==='KeyP'||e.code==='Enter')){ resumeGame(); }
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; mouseDown=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden && state==='play') pauseGame(); });

document.addEventListener('mousemove',e=>{
  if(state!=='play'||!locked) return;
  P.a+=e.movementX*.0022;
  P.pitch=clamp(P.pitch-e.movementY*.35,-220,220);
});
cv.addEventListener('contextmenu',e=>{ e.preventDefault(); });
let wheelT=0;
cv.addEventListener('wheel',e=>{ if(state!=='play'||isTouch) return; e.preventDefault(); const n=performance.now(); if(n-wheelT<120) return; wheelT=n; cycleWeapon(e.deltaY>0?1:-1); },{passive:false});
cv.addEventListener('mousedown',e=>{
  if(isTouch) return;
  if(e.button===2){ if(state==='play') tryDash(); return; }
  if(e.button!==0) return;
  if(state==='play'){ mouseDown=true; if(!locked&&!lockFailed) requestLock(); }
});
window.addEventListener('mouseup',()=>{ mouseDown=false; });
document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===cv;
  if(!locked && state==='play' && lockWanted && !lockFailed) pauseGame();
});
document.addEventListener('pointerlockerror',()=>{ lockFailed=true; });
function requestLock(){
  if(isTouch) return;   // auf Touch-Geräten gibt es kein sinnvolles Pointer-Lock — Blick läuft übers Touch-Drag
  lockWanted=true;
  try{ const r=cv.requestPointerLock&&cv.requestPointerLock(); if(r&&r.catch) r.catch(()=>{ lockFailed=true; }); }
  catch(e){ lockFailed=true; }
}
function releaseLock(){ lockWanted=false; try{ if(document.pointerLockElement) document.exitPointerLock(); }catch(e){} }

/* ============================================================
   Touch-Steuerung (Handy/Tablet): Move-Pad links, Blick-Drag rechts,
   Feuer-/Waffen-/Pause-Buttons. Nur aktiv, wenn isTouch true ist (siehe
   oben) — auf Desktop bleibt alles wie gehabt bei Maus+Tastatur.
   ============================================================ */
let touchFwd=0, touchStr=0, touchSprint=false, touchFireDown=false;
if(isTouch){
  const tcLayer=$('touchLayer'), tcMove=$('tcMove'), tcKnob=$('tcMoveKnob'),
        tcFire=$('tcFireBtn'), tcWeapon=$('tcWeaponBtn'), tcPause=$('tcPauseBtn'), tcDash=$('tcDashBtn'), tcReload=$('tcReloadBtn');
  let moveId=null, moveCx=0, moveCy=0, moveR=1;
  let lookId=null, lookLastX=0, lookLastY=0;
  let fireId=null, dashId=null;
  const TOUCH_TURN=0.0034, TOUCH_PITCH=0.55;
  function resetMovePad(){ touchFwd=0; touchStr=0; touchSprint=false; tcKnob.style.transform='translate(-50%,-50%)'; }
  function inRect(el,x,y){ const r=el.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }
  function handleStart(t){
    const x=t.clientX, y=t.clientY;
    if(moveId===null && inRect(tcMove,x,y)){
      const r=tcMove.getBoundingClientRect();
      moveId=t.identifier; moveCx=r.left+r.width/2; moveCy=r.top+r.height/2; moveR=r.width/2;
      return;
    }
    if(fireId===null && inRect(tcFire,x,y)){ fireId=t.identifier; touchFireDown=true; tcFire.classList.add('active'); return; }
    if(dashId===null && inRect(tcDash,x,y)){ dashId=t.identifier; tcDash.classList.add('active'); if(state==='play') tryDash(); return; }
    if(inRect(tcWeapon,x,y)){ cycleWeapon(); return; }
    if(inRect(tcReload,x,y)){ if(state==='play') manualReload(); return; }
    if(inRect(tcPause,x,y)){ if(state==='play') pauseGame(); return; }
    if(lookId===null && state==='play'){ lookId=t.identifier; lookLastX=x; lookLastY=y; }
  }
  function handleMove(t){
    if(t.identifier===moveId){
      let dx=t.clientX-moveCx, dy=t.clientY-moveCy;
      const d=Math.hypot(dx,dy);
      if(d>moveR){ dx=dx/d*moveR; dy=dy/d*moveR; }
      touchStr=dx/moveR; touchFwd=-dy/moveR; touchSprint=d>moveR*.78;
      tcKnob.style.transform='translate('+(dx-tcKnob.offsetWidth/2)+'px,'+(dy-tcKnob.offsetHeight/2)+'px)';
    } else if(t.identifier===lookId){
      const dx=t.clientX-lookLastX, dy=t.clientY-lookLastY;
      lookLastX=t.clientX; lookLastY=t.clientY;
      P.a+=dx*TOUCH_TURN;
      P.pitch=clamp(P.pitch-dy*TOUCH_PITCH*.1,-220,220);
    }
  }
  function handleEnd(t){
    if(t.identifier===moveId){ moveId=null; resetMovePad(); }
    else if(t.identifier===lookId){ lookId=null; }
    else if(t.identifier===fireId){ fireId=null; touchFireDown=false; tcFire.classList.remove('active'); }
    else if(t.identifier===dashId){ dashId=null; tcDash.classList.remove('active'); }
  }
  tcLayer.addEventListener('touchstart',e=>{ e.preventDefault(); for(const t of e.changedTouches) handleStart(t); },{passive:false});
  tcLayer.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) handleMove(t); },{passive:false});
  tcLayer.addEventListener('touchend',e=>{ e.preventDefault(); for(const t of e.changedTouches) handleEnd(t); },{passive:false});
  tcLayer.addEventListener('touchcancel',e=>{ for(const t of e.changedTouches) handleEnd(t); });
  function syncTouchLayer(){
    const playing=state==='play';
    tcLayer.style.pointerEvents=playing?'auto':'none';
    if(!playing){ moveId=null; lookId=null; fireId=null; dashId=null; touchFireDown=false; tcFire.classList.remove('active'); tcDash.classList.remove('active'); resetMovePad(); }
  }
  window.__syncTouchLayer=syncTouchLayer;
}
function cycleWeapon(dir){
  const order=[0,2,1,3,4,5,6,7,8], step=dir<0?-1:1, n=order.length;
  const idx=order.indexOf(P.weapon);
  for(let i=1;i<=n;i++){
    const cand=order[((idx+step*i)%n+n)%n];
    if(P.owned[cand]){ setWeapon(cand); break; }
  }
}

/* ============================================================
   Spiellogik
   ============================================================ */
// (Effekt-Zustand liegt seit Phase 1 gebündelt in FX — siehe Architektur-Block)
function kick(amt){ FX.shake=Math.max(FX.shake,amt); }

function showMsg(t,ms){ const m=$('msg'); m.textContent=t; m.classList.add('on'); FX.msg=(ms||2200)/1000; }
function refreshWeaponUI(){ $('wname').textContent=WEAPONS[P.weapon].name; Stats.recalc(); }
function setWeapon(i){
  if(!(i>=0&&i<WEAPONS.length)) return;
  if(!P.owned[i]){ showMsg(WEAPONS[i].name+' noch nicht gefunden',1400); return; }
  if(i!==P.weapon){
    P.hs[P.weapon]=P.heat; P.os[P.weapon]=P.overheatT;              // Hitze je Waffe: die weggelegte kuehlt im Hintergrund
    P.weapon=i; P.heat=P.hs[i]; P.overheatT=P.os[i];
    P.reloadT=0; P.fireCd=Math.max(P.fireCd,.12);
  }
  refreshWeaponUI();
}
function grantWeapon(i,addAmmo){
  const w=WEAPONS[i]; if(!w) return;
  const fresh=!P.owned[i];
  if(addAmmo) P.ammo=Math.min(99,P.ammo+addAmmo);
  if(fresh){
    P.owned[i]=true; P.mag[i]=Mods.magSize(i);
    const u=Save.data.unlockedWeapons; if(u.indexOf(w.id)<0){ u.push(w.id); Save.markDirty(); }
    setWeapon(i); showMsg(w.name+'! (Taste '+(i+1)+')',2600);
  } else if(addAmmo) showMsg(w.name+': Ladung +'+addAmmo,1200);
}
/* Nachladen: Magazin zaehlt Schuesse, Vorrat zaehlt Zellen (cost je Schuss). Abbuchung erst beim Fertigstellen. */
function startReload(){
  const i=P.weapon, w=WEAPONS[i];
  if(w.mag<=0||P.reloadT>0||P.mag[i]>=Mods.magSize(i)||P.ammo<w.cost) return false;
  P.reloadDur=w.reload/Math.max(.3,1+Stats.val.reloadSpeed+Mods.eff(i).reload); P.reloadT=P.reloadDur; sfx.reload();
  return true;
}
function manualReload(){ if(state==='play') startReload(); }
function finishReload(){
  const i=P.weapon, w=WEAPONS[i];
  const n=Math.min(Mods.magSize(i)-P.mag[i],Math.floor(P.ammo/w.cost));
  if(n>0){ P.mag[i]+=n; P.ammo-=n*w.cost; }
  sfx.reloadDone();
}
/* Schadenspipeline (Phase 3): Dash-I-Frames -> Resistenz -> Schild -> Panzerung (nimmt Anteil des Rests auf) -> Integritaet.
   Integritaet bleibt ganzzahlig (HUD/Schwellen erwarten das): durchschlagender Rest wird aufgerundet, mind. 1. */
function hurtPlayer(n){
  if(P.hp<=0||state!=='play') return;
  if(P.dashT>0) return;                                    // waehrend des Dashs unverwundbar
  const V=Stats.val;
  Combat.hurt();
  n*=1-V.resist;
  P.shieldT=V.shieldDelay; P.hpT=V.hpRegenDelay; P.hpAcc=0;
  let sAbs=0, broke=false;
  if(P.shield>0){ sAbs=Math.min(P.shield,n); P.shield-=sAbs; n-=sAbs; if(P.shield<=.001){ P.shield=0; broke=true; } }
  if(n>0&&P.armor>0){ const a=Math.min(P.armor,n*V.armorAbsorb); P.armor-=a; n-=a; }
  const dmg=n>.001?Math.max(1,Math.ceil(n-1e-6)):0;
  if(dmg>0){ P.hp=Math.max(0,P.hp-dmg); FX.hurt=.4; sfx.hurt(); kick(Math.min(1,.32+dmg*.035)); }
  if(sAbs>0){
    FX.shieldHit=.35;
    if(broke){ sfx.shieldBreak(); kick(.3); showMsg('Schild zusammengebrochen',900); }
    else if(dmg===0){ sfx.shieldHit(); kick(.14); }
  }
  if(P.hp<=0) die();
}
/* Bewegungswunsch als Einheitsvektor (0,0 = keine Eingabe) — gemeinsam fuer Laufen und Dash */
let mvX=0, mvY=0, mvLen=0;
function readMove(){
  const fwd=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+touchFwd;
  const str=(keys.KeyD?1:0)-(keys.KeyA?1:0)+touchStr;
  const vx=Math.cos(P.a)*fwd+(-Math.sin(P.a))*str, vy=Math.sin(P.a)*fwd+Math.cos(P.a)*str;
  mvLen=Math.hypot(vx,vy);
  if(mvLen>0){ mvX=vx/mvLen; mvY=vy/mvLen; } else { mvX=0; mvY=0; }
}
function tryDash(){
  if(state!=='play'||P.hp<=0||P.dashT>0) return false;
  const V=Stats.val;
  if(P.dashN<1) return false;                              // Cooldown laeuft (HUD zeigt den Balken)
  if(P.energy<V.dashCost){ P.enFlash=.5; sfx.noEnergy(); return false; }
  readMove();
  if(mvLen>0){ P.dashX=mvX; P.dashY=mvY; } else { P.dashX=Math.cos(P.a); P.dashY=Math.sin(P.a); }   // ohne Eingabe: nach vorn
  P.energy-=V.dashCost; P.enT=Math.max(P.enT,V.energyDelay);
  if(P.dashN>=V.dashCharges) P.dashCd=V.dashCd;
  P.dashN--; P.dashT=V.dashTime; FX.dash=.3;
  sfx.dash(); kick(.14);
  return true;
}
function die(){
  setState('dead'); releaseLock(); sfx.die(); kick(1); Save.onDeath();
  setTimeout(()=>{
    const buttons=[{label:'Sektor neu starten',primary:true,fn:()=>{ P.hp=100; P.ammo=Math.max(snap.ammo,30); for(let k=0;k<WEAPONS.length;k++){ if(snap.owned[k]){ setOwned(k,true); P.mag[k]=Mods.magSize(k); } else P.owned[k]=false; } restartCurrent(); }}];
    if(lvl.procedural) buttons.push({label:'Lauf beenden',fn:finishRun});
    buttons.push({label:'Zum Titel',fn:showTitle});
    showOverlay(addLoadoutBtn({
      title:'Prozess beendet',
      text:'Die Rogue-Prozesse waren schneller. '+lvl.name+' wird neu gestartet, sobald du bereit bist.',
      stats:[['Feinde erledigt',stats.kills+' / '+totals.foes],['Zeit',fmt(stats.time)]],
      buttons
    }));
  },900);
}

/* ============================================================
   Loadout-Screen (Phase 5): Waffe waehlen, Slot waehlen, Mod einbauen/ablegen. Alles Buttons (touch-tauglich).
   `back` zeigt das vorherige Overlay wieder an (Pause, Sektor geschafft, Tod).
   ============================================================ */
function addLoadoutBtn(o){ o.buttons.push({label:'Loadout',fn:()=>openLoadout(()=>showOverlay(o))}); return o; }
const escH=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function modSpan(m){ return '<b style="color:'+MOD_TIERS[m.tier-1].col+'">'+escH(m.name)+'</b>'; }
/* Kennwerte einer Waffe: [Label, ohne Mods, mit Mods] als Text */
function loadoutRows(i){
  const w=WEAPONS[i], V=Stats.val, N=Mods.NEUTRAL, M=Mods.eff(i), r1=v=>(Math.round(v*10)/10).toString().replace('.',',');
  const f=(M)=>({
    dmg:Math.round(w.dmg*M.dmg*V.dmgMul)+(w.pel>1?' ×'+w.pel:''),
    rate:r1((1+V.fireRate+M.fireRate)/w.rate)+'/s',
    mag:w.mag>0?String(w.mag+M.magAdd):'∞',
    rel:w.mag>0?r1(w.reload/Math.max(.3,1+V.reloadSpeed+M.reload))+' s':'–',
    rng:r1(w.range*M.range),
    spr:r1(w.spread*M.spread*57.3)+'°',
    crit:pc(Math.min(1,Math.max(0,w.crit+(V.crit-PBASE.crit)+M.critAdd)))+' ×'+r1(Math.max(1,w.critMul+(V.critDmg-PBASE.critDmg)+M.critMulAdd)),
    en:w.energy>0?r1(w.energy*M.energy):'–',
    heat:w.heat>0?Math.round(w.heat*V.heatMul*M.heat*100)+'%':'–'
  });
  const a=f(N), b=f(M);
  return [['Schaden',a.dmg,b.dmg],['Feuerrate',a.rate,b.rate],['Magazin',a.mag,b.mag],['Nachladen',a.rel,b.rel],['Reichweite',a.rng,b.rng],
          ['Streuung',a.spr,b.spr],['Krit',a.crit,b.crit],['Energie/Schuss',a.en,b.en],['Hitze/Schuss',a.heat,b.heat]];
}
function openLoadout(back){
  const list=[]; for(let i=0;i<WEAPONS.length;i++) if(P.owned[i]&&Mods.slotsOf(i)) list.push(i);
  let selW=list.indexOf(P.weapon)>=0?P.weapon:list[0], selS='barrel', note='';
  function draw(box){
    const i=selW, w=WEAPONS[i], eq=Mods.eq[i];
    let h='<h2>Loadout</h2><div class="ld-tabs">';
    for(const wi of list) h+='<button type="button" class="chip'+(wi===i?' sel':'')+'" data-w="'+wi+'">'+escH(WEAPONS[wi].name)+' LV'+P.wLv[wi]+'</button>';
    h+='</div><div class="ld-grid"><div class="ld-col">';
    for(const sl of MOD_SLOTS){
      const m=MOD_BY_ID[eq[sl.id]];
      h+='<button type="button" class="ld-slot'+(sl.id===selS?' sel':'')+'" data-s="'+sl.id+'"><small class="ld-sl">'+sl.name+'</small>'+
         (m?modSpan(m)+'<small>'+escH(m.txt)+'</small>':'<span class="ld-empty">— leer —</span>')+'</button>';
    }
    h+='</div><div class="ld-col"><div class="ld-sub">'+escH(MOD_SLOTS.find(s=>s.id===selS).name)+' — verfügbare Mods</div>';
    const cur=eq[selS];
    const opts=MODS.filter(m=>m.slot===selS&&(Mods.free(m.id)>0||cur===m.id)).sort((a,b)=>b.tier-a.tier);
    if(cur) h+='<button type="button" class="ld-opt" data-off="'+selS+'"><span>Ablegen</span></button>';
    for(const m of opts) h+='<button type="button" class="ld-opt'+(cur===m.id?' on':'')+'" data-m="'+m.id+'">'+modSpan(m)+(Mods.free(m.id)>1?' ×'+Mods.free(m.id):'')+'<small>'+escH(m.txt)+'</small></button>';
    if(!opts.length&&!cur) h+='<p class="small">Keine Mods für diesen Slot. Mods findest du bei Kills (Chance), nach Sektor-Abschlüssen und bei Bossen.</p>';
    h+='</div><div class="ld-col"><div class="ld-sub">'+escH(w.name)+'</div><table class="ld-tab">';
    for(const r of loadoutRows(i)) h+='<tr><td>'+r[0]+'</td><td>'+(r[1]===r[2]?r[2]:'<s>'+r[1]+'</s></td><td class="up">'+r[2])+'</td></tr>';
    h+='</table></div></div>';
    h+='<div class="row" style="margin-top:1.2cqw"><button type="button" class="primary" id="ld-back">Zurück</button></div>';
    box.innerHTML=h;
    box.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ selW=+b.dataset.w; draw(box); });
    box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ selS=b.dataset.s; draw(box); });
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ if(Mods.equip(selW,b.dataset.m)) sfx.reloadDone(); draw(box); });
    box.querySelectorAll('[data-off]').forEach(b=>b.onclick=()=>{ Mods.unequip(selW,b.dataset.off); draw(box); });
    const bk=box.querySelector('#ld-back'); if(bk) bk.onclick=back;
  }
  showOverlay({wide:true,html:'',onMount:box=>{ if(!list.length){ box.innerHTML='<h2>Loadout</h2><p>Keine Waffe mit Mod-Slots im Besitz.</p><div class="row"><button type="button" class="primary" id="ld-back">Zurück</button></div>'; const bk=box.querySelector('#ld-back'); if(bk) bk.onclick=back; } else draw(box); }});
}
function fmt(t){ const s=t|0; return ((s/60)|0)+':'+String(s%60).padStart(2,'0'); }

function alertNear(r){ AI.noise(P.x,P.y,r||9); }   // Phase 6: Gegner untersuchen das Geräusch (Radius je Waffe, durch Wände gedämpft)
function tryFire(){
  if(P.fireCd>0||P.reloadT>0||P.overheatT>0) return;      // Cooldown / Nachladen / gesperrt (kuehlt ab)
  const i=P.weapon, w=WEAPONS[i], V=Stats.val, M=Mods.eff(i);
  if(w.mag>0&&P.mag[i]<=0){
    if(!startReload()){ sfx.empty(); P.fireCd=.35; showMsg('Keine Ladung',1200); }
    return;
  }
  const en=w.energy*M.energy;                              // Mods (Energie-Kern) senken die Energiekosten
  if(en>0){
    if(P.energy<en){ P.enFlash=.5; sfx.noEnergy(); P.fireCd=.25; return; }
    P.energy-=en; P.enT=Math.max(P.enT,V.energyDelay);
  }
  if(w.mag>0&&!(M.free>0&&Math.random()<M.free)) P.mag[i]--;   // Zellen-Sparer: Freischuss
  P.fireCd=w.rate/(1+V.fireRate+M.fireRate); P.recoil=1; P.flash=i===2?.12:.09;
  Mods.shotId++;
  sfx[w.snd]();
  const sp=w.spread*M.spread, rg=w.range*M.range;
  if(w.kind==='hit'){ for(let k=0;k<w.pel;k++) hitscan((Math.random()-.5)*sp,w.dmg,rg,w); }
  else if(w.kind==='proj'){
    const a=P.a+(Math.random()-.5)*sp, dx=Math.cos(a), dy=Math.sin(a);
    pshots.push({x:P.x+dx*.35,y:P.y+dy*.35,dx,dy,w,trav:0,m:M,rng:rg});
  }
  else if(w.kind==='rail') fireRail(w,M);
  else if(w.kind==='arc') fireArc(w,M);
  kick(w.rc*M.rc);
  if(w.heat>0){
    P.heat=Math.min(1,P.heat+w.heat*V.heatMul*M.heat);
    if(P.heat>=1){ P.overheatT=1.6; sfx.overheat(); showMsg(w.name+' überhitzt — kühlt ab…',1300); kick(.32); }
  }
  alertNear(NOISE[w.id]||9);
  if(w.mag>0&&P.mag[i]<=0) startReload();                  // letzter Schuss: automatisch nachladen
}
/* ---- Feuern für die Titelbild-Demo: identisches Waffengefühl, aber ohne Munitionsverbrauch ---- */
function demoFire(){
  if(P.fireCd>0) return;
  P.fireCd=WEAPONS[0].rate; P.recoil=1; P.flash=.09;
  sfx.pistol(); hitscan(0,12); kick(.16); alertNear();
}
function hitscan(off,dmg,maxRange,w){
  const a=P.a+off, dx=Math.cos(a), dy=Math.sin(a);
  const wd=rayWallDist(P.x,P.y,dx,dy);
  let best=null, bd=maxRange?Math.min(wd,maxRange):wd;
  for(const e of enemies){
    if(!e.alive) continue;
    const ex=e.x-P.x, ey=e.y-P.y, along=ex*dx+ey*dy;
    if(along<.1||along>=bd) continue;
    const perp=Math.abs(ex*dy-ey*dx);
    if(perp<ETYPES[e.type].rad){ best=e; bd=along; }
  }
  if(best) hitEnemy(best,dmg,a,w);
  else if(wd<1e8 && (!maxRange||wd<=maxRange)) spawnSpark(P.x+dx*wd,P.y+dy*wd);
}
/* Spielertreffer: Schadensfaktor + Waffen-Krit (Krit nur im echten Spiel, siehe Stats.critMul) */
function hitEnemy(e,dmg,ang,w,quiet){
  const m=Stats.critMul(w), M=Mods.eff(w);
  const d=Math.max(1,Math.round(dmg*Stats.val.dmgMul*M.dmg*(M.ap>0&&Mods.armored(e)?1+M.ap:1)*m));
  const hp0=e.hp;
  damageEnemy(e,d,ang,m>1,quiet);
  if(M.n>0){ Mods.leech(Math.min(d,Math.max(0,hp0)),M); Mods.onHit(e,d,M,w); }   // Phase 5: Lebensraub/Schild-Entzug, Plasma/Explosion/Kettenblitz
}
/* Railgun: Strahl durchschlaegt bis zu 4 Ziele (je -25 %), stoppt an der Wand */
function fireRail(w,M){
  M=M||Mods.NEUTRAL; const rg=w.range*M.range;
  const dx=Math.cos(P.a), dy=Math.sin(P.a), wd=rayWallDist(P.x,P.y,dx,dy), lim=Math.min(wd,rg), hits=[];
  for(const e of enemies){
    if(!e.alive) continue;
    const ex=e.x-P.x, ey=e.y-P.y, along=ex*dx+ey*dy;
    if(along<.1||along>=lim) continue;
    if(Math.abs(ex*dy-ey*dx)<ETYPES[e.type].rad) hits.push({e,along});
  }
  hits.sort((a,b)=>a.along-b.along);
  for(let k=0;k<hits.length&&k<4;k++) hitEnemy(hits[k].e,w.dmg*Math.pow(.75,k),P.a,w,k>0);
  beams.push({kind:'rail',x0:P.x+dx*.3,y0:P.y+dy*.3,x1:P.x+dx*lim,y1:P.y+dy*lim,t:0,life:.3,jag:false,seed:0});
  if(wd<=rg) spawnSpark(P.x+dx*wd,P.y+dy*wd);
}
/* Arc-Blaster: naechstes Ziel im Kegel, dann Kettenblitz (100 % / 60 % / 40 %) auf Ziele in 3.2 Feldern */
function fireArc(w,M){
  M=M||Mods.NEUTRAL;
  const dx=Math.cos(P.a), dy=Math.sin(P.a), wd=rayWallDist(P.x,P.y,dx,dy), lim=Math.min(wd,w.range*M.range);
  const sx=P.x+dx*.3, sy=P.y+dy*.3;
  let first=null, fd=1e9;
  for(const e of enemies){
    if(!e.alive) continue;
    const ex=e.x-P.x, ey=e.y-P.y, along=ex*dx+ey*dy;
    if(along<.1||along>lim||along>=fd) continue;
    if(Math.abs(ex*dy-ey*dx)>=ETYPES[e.type].rad+along*.22) continue;
    const d=Math.hypot(ex,ey); if(rayWallDist(P.x,P.y,ex/d,ey/d)<d-.15) continue;
    first=e; fd=along;
  }
  if(!first){ beams.push({kind:'arc',x0:sx,y0:sy,x1:P.x+dx*Math.min(lim,3),y1:P.y+dy*Math.min(lim,3),t:0,life:.1,jag:true,seed:Math.random()*9}); return; }
  const hit=[first], mul=[1,.6,.4]; let cur=first, px0=sx, py0=sy;
  for(let k=0;k<3&&cur;k++){
    beams.push({kind:'arc',x0:px0,y0:py0,x1:cur.x,y1:cur.y,t:0,life:.12,jag:true,seed:Math.random()*9});
    hitEnemy(cur,w.dmg*mul[k],Math.atan2(cur.y-py0,cur.x-px0),w,k>0);
    px0=cur.x; py0=cur.y;
    let nx=null, nd=3.2;
    for(const e of enemies){
      if(!e.alive||hit.indexOf(e)>=0) continue;
      const ex=e.x-cur.x, ey=e.y-cur.y, d=Math.hypot(ex,ey);
      if(d>=nd) continue;
      if(rayWallDist(cur.x,cur.y,ex/(d||1),ey/(d||1))<d-.1) continue;
      nx=e; nd=d;
    }
    if(nx) hit.push(nx);
    cur=nx;
  }
}
/* Projektile (Plasma/Void/Singularitaet): Teilschritte gegen Durchtunneln; Einschlag an Gegner, Wand oder Reichweite */
function updatePshots(dt){
  for(let i=pshots.length-1;i>=0;i--){
    const s=pshots[i], total=s.w.pspd*dt, n=Math.max(1,Math.ceil(total/.2)), st=total/n;
    let done=false;
    for(let k=0;k<n&&!done;k++){
      s.x+=s.dx*st; s.y+=s.dy*st; s.trav+=st;
      if(solidAt(s.x,s.y)){ s.x-=s.dx*st; s.y-=s.dy*st; pdetonate(s,null); done=true; break; }
      for(const e of enemies){
        if(e.alive&&Math.hypot(e.x-s.x,e.y-s.y)<ETYPES[e.type].rad+.14){ pdetonate(s,e); done=true; break; }
      }
      if(!done&&s.trav>=(s.rng||s.w.range)){ pdetonate(s,null); done=true; }
    }
    if(done) pshots.splice(i,1);
  }
}
function pdetonate(s,e){
  const w=s.w;
  const M=s.m||Mods.eff(w);
  if(w.pkind==='sing'){ holes.push({x:s.x,y:s.y,t:0,life:2.6,tk:0,dm:M.dmg}); sfx.holeOpen(); return; }
  const cx=e?e.x:s.x, cy=e?e.y:s.y, isVoid=w.pkind==='void';
  if(e) hitEnemy(e,w.dmg,Math.atan2(s.dy,s.dx),w);
  splash(cx,cy,w.splashR*(1+M.expF*.5),w.splash*(1+M.expF),e,isVoid,M);   // Explosivgeschosse verstaerken Projektil-Splash
  spawnBoom(cx,cy,isVoid?1.5:1.1,isVoid?BOOM_VOID:BOOM_PLASMA);
  sfx.boomP(Math.hypot(cx-P.x,cy-P.y)); kick(isVoid?.35:.22);
}
/* Flaechenschaden mit Abfall (bis -50 % am Rand), keine Wirkung durch Waende; pull = Sog zum Zentrum (Void) statt Rueckstoss */
function splash(cx,cy,R,base,skip,pull,M){
  const dm=Stats.val.dmgMul*(M?M.dmg:1);
  for(const en of enemies){
    if(!en.alive||en===skip) continue;
    const dx=en.x-cx, dy=en.y-cy, d=Math.hypot(dx,dy);
    if(d>R) continue;
    const ux=d>.001?dx/d:0, uy=d>.001?dy/d:0;
    if(d>.3&&rayWallDist(cx,cy,ux,uy)<d-.1) continue;
    const sd=Math.max(1,Math.round(base*(1-d/R*.5)*dm)), hp0=en.hp;
    damageEnemy(en,sd,pull?null:Math.atan2(dy,dx),false,true);
    if(M&&M.n>0) Mods.leech(Math.min(sd,Math.max(0,hp0)),M);
    if(pull&&en.alive&&d>.15){ const f=4.5*(1-d/R*.5); en.stagT=Math.max(en.stagT,.3); en.stagX=-ux*f; en.stagY=-uy*f; }
  }
}
/* Singularitaet: Loch zieht Gegner + verschluckt gegnerische Geschosse, tickt Schaden, kollabiert mit Explosion */
function updateHoles(dt){
  const R=3.4;
  for(let i=holes.length-1;i>=0;i--){
    const h=holes[i], dm=Stats.val.dmgMul*(h.dm||1); h.t+=dt; h.tk+=dt;
    for(let j=shots.length-1;j>=0;j--){ if(Math.hypot(shots[j].x-h.x,shots[j].y-h.y)<1.3) shots.splice(j,1); }
    for(const e of enemies){
      if(!e.alive) continue;
      const dx=h.x-e.x, dy=h.y-e.y, d=Math.hypot(dx,dy);
      if(d>R||d<.05) continue;
      const f=1.4+2.2*(1-d/R);
      e.stagT=Math.max(e.stagT,.12); e.stagX=dx/d*f; e.stagY=dy/d*f;
    }
    if(h.tk>=.25){
      h.tk-=.25;
      for(const e of enemies){ if(e.alive&&Math.hypot(e.x-h.x,e.y-h.y)<2.2) damageEnemy(e,Math.max(1,Math.round(6*dm)),null,false,true); }
    }
    if(h.t>=h.life){
      for(const e of enemies){
        if(!e.alive) continue;
        const d=Math.hypot(e.x-h.x,e.y-h.y); if(d>3.2) continue;
        damageEnemy(e,Math.max(1,Math.round(90*(1-d/3.2*.5)*dm)),null,false,true);
      }
      spawnBoom(h.x,h.y,2.2,BOOM_VOID); sfx.holeCollapse(Math.hypot(h.x-P.x,h.y-P.y)); kick(.55);
      holes.splice(i,1);
    }
  }
}
function updateBeams(dt){
  for(let i=beams.length-1;i>=0;i--){ const b=beams[i]; b.t+=dt; if(b.t>=b.life) beams.splice(i,1); }
}
function damageEnemy(e,dmg,ang,crit,quiet){
  e.hp-=dmg; e.flash=.1; if(!quiet){ FX.hitMark=crit?.22:.15; if(crit) FX.crit=.22; } AI.onHurt(e);
  if(e.hp<=0){ e.alive=false; e.bodyT=0; stats.kills++; if(state==='play'){ Save.onKill(e.type==='K'); Combat.kill(); Mods.onKill(e,modDepth()); AI.onDeath(e); } sfx.kill(Math.hypot(e.x-P.x,e.y-P.y));
    spawnBoom(e.x,e.y,ETYPES[e.type].sc); kick(e.type==='K'?.9:.48);
    if(e.type==='K') showMsg('Kern-Wächter besiegt — das Portal ist offen',3000);
  } else {
    if(quiet){} else if(crit){ sfx.crit(); kick(.14); } else { sfx.hit(); kick(.09); }
    if(ang!=null){ const kb=ETYPES[e.type].sc>1?.9:1.6; e.stagT=.16; e.stagX=Math.cos(ang)*kb; e.stagY=Math.sin(ang)*kb; }
  }
}
function modDepth(){ return lvl&&lvl.procedural?lvl.depth:(lvIdx>=0?lvIdx+1:1); }
function spawnBoom(x,y,scale,set){ booms.push({x,y,t:0,life:.5,scale:scale||1,set}); }
function updateBooms(dt){
  for(let i=booms.length-1;i>=0;i--){ const b=booms[i]; b.t+=dt; if(b.t>=b.life) booms.splice(i,1); }
}
function spawnSpark(x,y){ sparks.push({x,y,t:0,life:.22}); sfx.spark(); }
function updateSparks(dt){
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.t+=dt; if(s.t>=s.life) sparks.splice(i,1); }
}
function spawnShot(x,y,ang,dmg){
  shots.push({x,y,dx:Math.cos(ang),dy:Math.sin(ang),dmg,life:4});
}
function wake(e){ e.awake=true; sfx.alert(Math.hypot(e.x-P.x,e.y-P.y)); }

/* ============================================================
   Gegner-KI (Phase 6). Zustaende je Gegner (e.ai):
   IDLE (patrouilliert/wacht, Sicht mit Blickfeld) -> INVEST (Geraeusch/Alarm untersuchen) -> COMBAT (e.awake = true)
   COMBAT -> SEARCH (Sichtkontakt verloren: letzte bekannte Position absuchen, dann zurueck zu IDLE) | FLEE (Rueckzug bei wenig HP/Moral)
   `e.awake` bleibt "im Kampf" (COMBAT/SEARCH/FLEE): Bedrohungsanzeige, Boss-Leiste und Tests nutzen es weiter. Der Boss (K) behaelt sein altes Verhalten.
   Aggressionsstufen e.aggr 0/1/2 (vorsichtig/normal/aggressiv) veraendern Sichtweite, Reaktionszeit, Fluchtschwelle, Flankieren, Tempo, Suchdauer.
   ============================================================ */
const AI_IDLE=0, AI_INVEST=1, AI_COMBAT=2, AI_SEARCH=3, AI_FLEE=4;
const AGGR=[
  {n:'vorsichtig',sight:.85,react:.65,flee:.30,flank:.75,speed:.95,search:3.5,fov:1.9,peek:1},
  {n:'normal',    sight:1,  react:.40,flee:.14,flank:.45,speed:1,  search:5,  fov:2.2,peek:2},
  {n:'aggressiv', sight:1.15,react:.18,flee:0,  flank:.12,speed:1.08,search:8,fov:2.6,peek:3}
];
const FEARLESS={p:1,v:1,u:1,e:1};    // Schwaerme und Sprenger fliehen nie
const ALARMERS={d:1,t:1};            // Drohne und Turm schlagen grossen Alarm
const NOISE={pistol:9,shotgun:12,fists:3.5,auto:11,plasma:10,rail:13,arc:8,void:12,singularity:7};
const AI=(()=>{
  const TAU=Math.PI*2;
  const api={ deaths:[], alarmT:0, msgT:0, t:0, slotT:0, cache:new Map(), stats:{spots:0,alarms:0,flees:0,searches:0,giveups:0} };
  const angDiff=(a,b)=>{ let d=a-b; while(d>Math.PI) d-=TAU; while(d<-Math.PI) d+=TAU; return Math.abs(d); };
  api.angDiff=angDiff;
  api.turn=function(e,a,k){ let d=a-e.face; while(d>Math.PI) d-=TAU; while(d<-Math.PI) d+=TAU; e.face+=d*Math.min(1,k); };
  api.reset=function(){ api.deaths.length=0; api.alarmT=0; api.msgT=0; api.slotT=0; api.cache.clear(); };
  api.init=function(e){
    const dp=Math.max(1,(typeof modDepth==='function'&&lvl)?modDepth():1), r=Math.random();
    const pc=.3-Math.min(.2,dp*.012), pa=.2+Math.min(.25,dp*.015);
    e.aggr=e.type==='K'?2:(r<pc?0:r>1-pa?2:1);
    e.ai=AI_IDLE; e.face=Math.random()*TAU; e.hface=e.face; e.hx=e.x; e.hy=e.y;
    e.patrol=!STATIONARY_TYPES[e.type]&&e.type!=='K'&&Math.random()<.65;
    e.wpx=null; e.wpy=0; e.wpT=0; e.wait=Math.random()*2; e.tx=e.ty=0; e.nx=e.ny=0; e.lkx=e.lky=0; e.lostT=0; e.invT=0; e.lookT=0; e.searchT=0;
    e.reactT=-1; e.senseT=Math.random()*.1; e.sees=false; e.hear=false; e.rush=false;
    e.fleeT=0; e.fled=0; e.hurtT=0; e.mark=0; e.markT=0;
    e.flank=Math.random()<AGGR[e.aggr].flank; e.side=Math.random()<.5?-1:1; e.slotA=null; e.pa=0;
    e.cv=0; e.cvx=e.cvy=e.cpx=e.cpy=0; e.hideT=0; e.peekN=0; e.peekT=0; e.cvSearchT=0;
  };
  /* Wegfindung zu einem beliebigen Zielfeld (Cache: 12 Felder, aelteste fliegt raus) */
  api.field=function(cx,cy){
    if(cx<0||cy<0||cx>=MW||cy>=MH) return null;
    const key=cy*MW+cx; let h=api.cache.get(key);
    if(!h){ h={f:computeFlowFromCell(cx,cy)}; if(api.cache.size>=12) api.cache.delete(api.cache.keys().next().value); api.cache.set(key,h); }
    return h.f;
  };
  /* Richtung zu einem Punkt: geradeaus, wenn frei, sonst ueber das Zielfeld */
  api.dirTo=function(e,tx,ty){
    const dx=tx-e.x, dy=ty-e.y, d=Math.hypot(dx,dy); if(d<.02) return [0,0,d];
    let mx=dx/d, my=dy/d;
    if(rayWallDist(e.x,e.y,mx,my)<d-.1){
      const tg=fieldTarget(e.x,e.y,api.field(tx|0,ty|0));
      if(tg){ const ax=tg.x-e.x, ay=tg.y-e.y, al=Math.hypot(ax,ay)||1; mx=ax/al; my=ay/al; }
    }
    return [mx,my,d];
  };
  api.mark=function(e,m,t){ e.mark=m; e.markT=t; };
  /* Geraeusch: Gegner ohne Kampf hoeren es (durch Waende gedaempft: nur innerhalb 60 % des Radius) */
  api.noise=function(x,y,R){
    for(const e of enemies){
      if(!e.alive||e.awake||e.type==='K') continue;
      const dx=e.x-x, dy=e.y-y, d=Math.hypot(dx,dy); if(d>R) continue;
      if(d>R*.6&&d>.3&&rayWallDist(x,y,dx/d,dy/d)<d-.1) continue;
      e.hear=true; e.nx=x+(Math.random()-.5)*d*.16; e.ny=y+(Math.random()-.5)*d*.16;
    }
  };
  api.hearAt=function(e,x,y,rush){ e.hear=true; e.nx=x; e.ny=y; if(rush) e.rush=true; };
  /* Rufen/Alarm an Verbuendete: nahe mit Sicht -> Kampf, sonst Untersuchen der Spielerposition */
  api.shout=function(e,R,alarm){
    for(const o of enemies){
      if(o===e||!o.alive||o.awake||o.type==='K') continue;
      const dx=o.x-e.x, dy=o.y-e.y, d=Math.hypot(dx,dy); if(d>R) continue;
      const clear=d<.3||rayWallDist(e.x,e.y,dx/d,dy/d)>=d-.1;
      if(!alarm&&!clear&&d>R*.55) continue;
      if(clear&&d<5.5){ api.engage(o); }
      else { o.hear=true; o.nx=P.x; o.ny=P.y; o.rush=!!alarm; }
    }
    if(alarm){
      api.stats.alarms++; api.alarmT=8;
      if(api.msgT<=0&&state==='play'){ api.msgT=10; showMsg('ALARM — '+ETYPES[e.type].name+' ruft Verstärkung',2000); }
    }
  };
  api.engage=function(e){   // in den Kampf, Spielerposition als letzte bekannte Position
    e.awake=true; e.ai=AI_COMBAT; e.lkx=P.x; e.lky=P.y; e.lostT=0; e.reactT=-1; e.fleeT=0; e.rush=false;
    api.mark(e,2,1.1);
  };
  api.spot=function(e){
    if(e.awake) return;
    api.engage(e); api.stats.spots++;
    sfx.alert(Math.hypot(e.x-P.x,e.y-P.y));
    api.shout(e,ALARMERS[e.type]?18:9,!!ALARMERS[e.type]);
  };
  api.onHurt=function(e){
    if(e.ai===undefined) api.init(e);
    e.hurtT=.8;
    if(e.type==='K'){ e.awake=true; return; }
    if(!e.awake){ api.engage(e); api.shout(e,6,false); }
    else if(e.ai===AI_SEARCH||e.ai===AI_INVEST||e.ai===AI_IDLE){ e.ai=AI_COMBAT; e.lkx=P.x; e.lky=P.y; e.lostT=0; }
  };
  api.onDeath=function(e){
    api.deaths.push({x:e.x,y:e.y,t:api.t}); if(api.deaths.length>12) api.deaths.shift();
    for(const o of enemies){                               // Verbuendete in der Naehe entdecken die Leiche
      if(!o.alive||o.awake||o===e||o.type==='K') continue;
      const dx=o.x-e.x, dy=o.y-e.y, d=Math.hypot(dx,dy); if(d>8) continue;
      if(d>3.5&&rayWallDist(e.x,e.y,dx/d,dy/d)<d-.1) continue;
      api.hearAt(o,e.x,e.y);
    }
  };
  api.deathsNear=function(e,R,T){ let n=0; for(const d of api.deaths) if(api.t-d.t<T&&Math.hypot(d.x-e.x,d.y-e.y)<R) n++; return n; };
  function pickWaypoint(e){
    for(let k=0;k<6;k++){
      const a=Math.random()*TAU, r=2+Math.random()*3.5, x=e.hx+Math.cos(a)*r, y=e.hy+Math.sin(a)*r;
      if(solidAt(x,y)) continue;
      const dx=x-e.x, dy=y-e.y, d=Math.hypot(dx,dy); if(d<1) continue;
      if(rayWallDist(e.x,e.y,dx/d,dy/d)<d-.1) continue;
      e.wpx=x; e.wpy=y; e.wpT=d/Math.max(.3,ETYPES[e.type].spd*.4)+3; return;
    }
    e.wait=1;
  }
  /* Gegner ohne Kampf: Sinne, Untersuchen, Patrouille/Wache. true = jetzt im Kampf. */
  api.idle=function(e,dt,dist,dx,dy){
    const A=AGGR[e.aggr], t=ETYPES[e.type], mob=!STATIONARY_TYPES[e.type];
    e.senseT-=dt;
    if(e.senseT<=0){
      e.senseT=.11; let sees=false;
      if(dist<(mob?12:14)*A.sight){
        const ux=dx/dist, uy=dy/dist;
        if(rayWallDist(e.x,e.y,ux,uy)>=dist-.15&&(dist<2.8||angDiff(e.face,Math.atan2(dy,dx))<A.fov/2)) sees=true;
      }
      e.sees=sees;
    }
    if(e.sees){                                              // Schrecksekunde, dann Kampf
      if(e.reactT<0){ e.reactT=A.react; api.mark(e,1,A.react+.2); }
      e.reactT-=dt; api.turn(e,Math.atan2(dy,dx),dt*10);
      if(e.reactT<=0){ api.spot(e); return true; }
      return false;
    } else if(e.reactT>=0) e.reactT=-1;
    if(e.hear){                                              // Geraeusch: hinschauen und untersuchen
      e.hear=false;
      if(e.ai!==AI_INVEST) api.mark(e,1,1.4);
      e.ai=AI_INVEST; e.tx=e.nx; e.ty=e.ny; e.invT=9; e.lookT=0; e.wpx=null;
      api.turn(e,Math.atan2(e.ny-e.y,e.nx-e.x),.6);
    }
    if(e.ai===AI_INVEST){
      e.invT-=dt;
      const dd=Math.hypot(e.tx-e.x,e.ty-e.y);
      if(mob&&dd>.7&&e.invT>0){
        const v=api.dirTo(e,e.tx,e.ty), sp=t.spd*(e.rush?1.1:.85)*A.speed*dt;
        tryMove(e,v[0]*sp,v[1]*sp,t.rad*.8); api.turn(e,Math.atan2(v[1],v[0]),dt*8);
      } else {
        e.lookT+=dt; e.face+=dt*1.6*e.side;                  // umsehen
        if(e.lookT>2.2){ e.ai=AI_IDLE; e.rush=false; e.hx=e.x; e.hy=e.y; e.hface=e.face; e.wpx=null; e.wait=1; e.lookT=0; }
      }
      return false;
    }
    if(e.patrol){
      if(e.wpx===null){
        e.wait-=dt; api.turn(e,e.hface+Math.sin(api.t*.9+e.hx)*.7,dt*3);
        if(e.wait<=0) pickWaypoint(e);
      } else {
        const v=api.dirTo(e,e.wpx,e.wpy), sp=t.spd*.42*A.speed*dt;
        tryMove(e,v[0]*sp,v[1]*sp,t.rad*.8); api.turn(e,Math.atan2(v[1],v[0]),dt*5);
        e.wpT-=dt; if(v[2]<.35||e.wpT<=0){ e.wpx=null; e.wait=1+Math.random()*2.5; e.hface=e.face; }
      }
    } else api.turn(e,e.hface+Math.sin(api.t*.55+e.hx*1.7)*1.1,dt*3);   // Wache: langsames Absuchen
    return false;
  };
  api.shouldFlee=function(e){
    if(e.type==='K'||FEARLESS[e.type]||STATIONARY_TYPES[e.type]||e.fled>=2||e.ai===AI_FLEE) return false;
    const f=e.hp/e.maxhp;
    if(f<AGGR[e.aggr].flee) return true;
    return e.aggr===0&&f<.7&&api.deathsNear(e,7,5)>=2;       // Moral: vorsichtige Gegner fliehen bei Verlusten
  };
  /* Kampf-Zustandslogik. false = Gegner hat aufgegeben und ist wieder IDLE. */
  api.engaged=function(e,dt,los,dist){
    const A=AGGR[e.aggr];
    e.hurtT=Math.max(0,e.hurtT-dt);
    if(los){ e.lkx=P.x; e.lky=P.y; e.lostT=0; if(e.ai===AI_SEARCH||e.ai===AI_INVEST){ e.ai=AI_COMBAT; api.mark(e,2,.8); } }
    else e.lostT+=dt;
    if(e.ai===AI_FLEE){
      e.fleeT-=dt;
      if(e.fleeT<=0||dist>13){ if(los||Math.random()<.6) e.ai=AI_COMBAT; else { e.ai=AI_SEARCH; e.searchT=A.search*.5; e.lookT=0; } }
    } else if(api.shouldFlee(e)){ e.ai=AI_FLEE; e.fleeT=2.5+Math.random()*1.5; e.fled++; api.stats.flees++; api.mark(e,1,1); }
    if(e.ai===AI_COMBAT&&e.lostT>1.2){ e.ai=AI_SEARCH; e.searchT=A.search; e.lookT=0; api.stats.searches++; api.mark(e,1,1.2); }
    if(e.ai===AI_SEARCH){
      const still=STATIONARY_TYPES[e.type]||Math.hypot(e.lkx-e.x,e.lky-e.y)<.8;
      e.searchT-=dt*(still?1:.35); if(still) e.lookT+=dt;
      if(e.searchT<=0){ api.giveUp(e); return false; }
    }
    return true;
  };
  api.giveUp=function(e){
    e.awake=false; e.ai=AI_IDLE; e.hx=e.x; e.hy=e.y; e.hface=e.face; e.wpx=null; e.wait=1; e.reactT=-1; e.sees=false; e.hear=false;
    e.slotA=null; e.cv=0; e.mark=0; e.markT=0; e.rush=false; api.stats.giveups++;
  };
  /* Fluchtrichtung: Nachbarzelle mit dem groessten Abstand zum Spieler (Flow-Feld). null = in die Ecke gedraengt. */
  api.fleeDir=function(e){
    if(!flow) return null;
    const cx=e.x|0, cy=e.y|0; let best=flow[cy*MW+cx], bx=-1, by=-1;
    if(best<0) return null;
    for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
      if(!dx&&!dy) continue;
      const nx=cx+dx, ny=cy+dy; if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const v=flow[ny*MW+nx]; if(v<=best) continue;
      if(dx&&dy&&(grid[cy*MW+nx]>0||grid[ny*MW+cx]>0)) continue;
      best=v; bx=nx; by=ny;
    }
    if(bx<0) return null;
    const ax=bx+.5-e.x, ay=by+.5-e.y, al=Math.hypot(ax,ay)||1; return [ax/al,ay/al];
  };
  /* Deckung fuer Fernkaempfer: Zelle ohne Sicht auf den Spieler, mit Nachbarzelle (Schiessposition) MIT Sicht */
  api.findCover=function(e){
    const ex=e.x|0, ey=e.y|0; let best=null, bs=1e9;
    for(let dy=-5;dy<=5;dy++) for(let dx=-5;dx<=5;dx++){
      const cx=ex+dx, cy=ey+dy; if(cx<1||cy<1||cx>=MW-1||cy>=MH-1||grid[cy*MW+cx]>0) continue;
      const fx=cx+.5, fy=cy+.5, vx=P.x-fx, vy=P.y-fy, vd=Math.hypot(vx,vy);
      if(vd<3||vd>12||rayWallDist(fx,fy,vx/vd,vy/vd)>=vd-.2) continue;
      let pk=null;
      for(const a of [[1,0],[-1,0],[0,1],[0,-1]]){
        const nx=cx+a[0], ny=cy+a[1]; if(grid[ny*MW+nx]>0) continue;
        const qx=nx+.5, qy=ny+.5, wx=P.x-qx, wy=P.y-qy, wd=Math.hypot(wx,wy)||1;
        if(rayWallDist(qx,qy,wx/wd,wy/wd)>=wd-.2){ pk={x:qx,y:qy}; break; }
      }
      if(!pk) continue;
      const sc=Math.hypot(dx,dy)+Math.abs(vd-7)*.3;
      if(sc<bs){ bs=sc; best={x:fx,y:fy,px:pk.x,py:pk.y}; }
    }
    return best;
  };
  /* Drohne: nach einem Schuss/Treffer in Deckung, dort kurz warten, dann herauslugen und schiessen. null = altes Kite-Verhalten. */
  api.cover=function(e,dt,los,dist){
    const A=AGGR[e.aggr];
    e.cvSearchT-=dt;
    if(e.cv===0){
      if((e.peekN>=1||e.hurtT>0)&&e.cvSearchT<=0){
        e.cvSearchT=1.5; const c=api.findCover(e);
        if(c){ e.cv=1; e.cvx=c.x; e.cvy=c.y; e.cpx=c.px; e.cpy=c.py; e.hideT=.8+Math.random()*1.2; e.peekN=0; }
      }
      return null;
    }
    if(dist>10.5&&e.cv===2) return null;
    if(e.cv===1){
      const v=api.dirTo(e,e.cvx,e.cvy);
      if(v[2]>.3) return [v[0],v[1]];
      e.hideT-=dt;
      if(e.hideT<=0){
        const vx=P.x-e.cvx, vy=P.y-e.cvy, vd=Math.hypot(vx,vy)||1;
        if(rayWallDist(e.cvx,e.cvy,vx/vd,vy/vd)<vd-.2){ e.cv=2; e.peekN=0; e.peekT=0; }     // Deckung gilt noch
        else { e.cv=0; e.cvSearchT=0; }                                                    // Spieler hat sich bewegt: neu suchen
      }
      return [0,0];
    }
    e.peekT+=dt;                                             // e.cv===2: herauslugen
    if(e.peekN>=A.peek||e.hurtT>0||e.peekT>4.5){ e.cv=1; e.hideT=.9+Math.random()*1.2; e.peekN=0; return [0,0]; }
    if(los) return [0,0];
    const v=api.dirTo(e,e.cpx,e.cpy); return [v[0],v[1]];
  };
  /* Einkesseln: fluegel-orientierte Rusher bekommen Winkel-Slots um den Spieler */
  api.tick=function(dt){
    api.t+=dt; api.alarmT-=dt; api.msgT-=dt; api.slotT-=dt;
    if(api.slotT>0) return; api.slotT=.4;
    const L=[];
    for(const e of enemies){
      if(!e.alive||!e.awake||e.ai!==AI_COMBAT||!e.flank||APPROACH_STOP[e.type]===undefined) continue;
      const d=Math.hypot(e.x-P.x,e.y-P.y); if(d>10||d<1.5){ e.slotA=null; continue; }
      e.pa=Math.atan2(e.y-P.y,e.x-P.x); L.push(e);
    }
    const n=L.length; if(!n) return;
    if(n===1){ L[0].slotA=L[0].pa+L[0].side*1.15; return; }
    L.sort((a,b)=>a.pa-b.pa); const base=L[0].pa;
    for(let k=0;k<n;k++){
      let off=base+k*TAU/n-L[k].pa; while(off>Math.PI) off-=TAU; while(off<-Math.PI) off+=TAU;
      L[k].slotA=L[k].pa+Math.max(-1.3,Math.min(1.3,off));
    }
  };
  return api;
})();

function updateEnemy(e,dt){
  if(!e.alive){ e.bodyT+=dt; return; }
  const t=ETYPES[e.type];
  e.flash=Math.max(0,e.flash-dt); e.atk=Math.max(0,e.atk-dt); e.cd-=dt; e.strT-=dt;
  if(e.stagT>0){
    e.stagT-=dt;
    tryMove(e,e.stagX*dt,e.stagY*dt,t.rad*.8);
    const decay=Math.max(0,1-dt*7); e.stagX*=decay; e.stagY*=decay;
    return;
  }
  if(e.ai===undefined) AI.init(e);
  const dx=P.x-e.x, dy=P.y-e.y, dist=Math.hypot(dx,dy)||.001, ux=dx/dist, uy=dy/dist, isK=e.type==='K';
  if(e.markT>0){ e.markT-=dt; if(e.markT<=0) e.mark=0; }
  if(!e.awake){
    if(isK){ if((rayWallDist(e.x,e.y,ux,uy)>=dist-.15&&dist<12)||e.hear) wake(e); else return; }      // Boss: altes Verhalten
    else if(!AI.idle(e,dt,dist,dx,dy)) return;
  }
  const los=rayWallDist(e.x,e.y,ux,uy)>=dist-.15;
  if(!isK&&!AI.engaged(e,dt,los,dist)) return;
  if(e.strT<=0){ e.strafe=Math.random()<.5?-1:1; e.strT=1+Math.random()*1.5; }
  const A=AGGR[e.aggr||0], fleeing=e.ai===AI_FLEE;

  let mx=0,my=0,cvm=null;
  if(STATIONARY_TYPES[e.type]){
    // Turm-Sentinel, Sporen-Wächter, Kristall-Spucker & Sandschleier-Geist
    // bewegen sich grundsätzlich nicht — weder Pathing bei fehlender Sicht
    // noch Nahannäherung, bleiben als Hindernis stehen.
  } else if(fleeing){
    const f=AI.fleeDir(e); if(f){ mx=f[0]; my=f[1]; } else { e.ai=AI_COMBAT; e.fled=9; }      // in die Ecke gedraengt: kaempfen
  } else if(!isK&&e.ai===AI_SEARCH){
    if(Math.hypot(e.lkx-e.x,e.lky-e.y)>.8){ const v=AI.dirTo(e,e.lkx,e.lky); mx=v[0]; my=v[1]; }
    else AI.turn(e,e.face+e.side*1.5,dt*3);                                                     // Umsehen
  } else if(!isK&&e.type==='d'&&(cvm=AI.cover(e,dt,los,dist))){
    mx=cvm[0]; my=cvm[1];
  } else if(!los||dist>13){
    const tg=flowTarget(e);
    if(tg){ const tx=tg.x-e.x, ty=tg.y-e.y, tl=Math.hypot(tx,ty)||1; mx=tx/tl; my=ty/tl; }
  } else if(e.type==='d'){
    if(dist>5.5){ mx=ux; my=uy; } else if(dist<3){ mx=-ux; my=-uy; } else { mx=-uy*e.strafe; my=ux*e.strafe; }
  } else if(APPROACH_STOP[e.type]!==undefined){
    if(dist>APPROACH_STOP[e.type]){
      mx=ux; my=uy;                                  // ungebremst ran, kein Rückzug/Strafing
      if(e.flank&&e.slotA!=null&&dist<10&&dist>APPROACH_STOP[e.type]*1.6){   // Phase 6: Flanke/Einkesseln über Winkel-Slot
        const rr=Math.max(APPROACH_STOP[e.type]+.4,dist*.75), qx=P.x+Math.cos(e.slotA)*rr, qy=P.y+Math.sin(e.slotA)*rr;
        const vx=qx-e.x, vy=qy-e.y, vl=Math.hypot(vx,vy);
        if(vl>.15&&rayWallDist(e.x,e.y,vx/vl,vy/vl)>=vl-.1){ mx=vx/vl; my=vy/vl; }
      }
    }
  } else {
    if(dist>5){ mx=ux; my=uy; } else if(dist<3){ mx=-ux; my=-uy; } else { mx=-uy*e.strafe; my=ux*e.strafe; }
  }
  const sp=t.spd*(isK?(e.hp<t.hp*.5?1.3:1):A.speed*(fleeing?1.2:e.ai===AI_SEARCH?.9:1))*dt;
  tryMove(e,mx*sp,my*sp,t.rad*.8);
  if(!isK){ if(mx||my) AI.turn(e,Math.atan2(my,mx),dt*8); if(los&&e.ai!==AI_SEARCH) AI.turn(e,Math.atan2(dy,dx),dt*8); }
  for(const o of enemies){                       // Gegner nicht ineinander laufen lassen
    if(o===e||!o.alive) continue;
    const ox=e.x-o.x, oy=e.y-o.y, od=Math.hypot(ox,oy), min=(t.rad+ETYPES[o.type].rad)*.9;
    if(od>0&&od<min) tryMove(e,ox/od*(min-od)*.5,oy/od*(min-od)*.5,t.rad*.8);
  }

  const mSt=MELEE_STATS[e.type], rSt=RANGED_STATS[e.type];
  if(mSt && dist<mSt[0] && e.cd<=0 && !fleeing){
    e.cd=mSt[1]+Math.random()*mSt[2]; e.atk=.2; sfx.melee(); hurtPlayer(mSt[3]);
  } else if(e.type==='e' && dist<.85){
    // Sprenger-Einheit: einmalige Detonation statt Cooldown-Angriff, tötet
    // sich beim Kontakt selbst (über den normalen Tod-Pfad, für korrekte
    // Kill-Zählung/Boom-Effekt).
    hurtPlayer(22); kick(.4); damageEnemy(e,e.hp,null);
  } else if(rSt && los && dist<rSt[0] && e.cd<=0 && !fleeing){
    e.cd=rSt[1]+Math.random()*rSt[2]; e.atk=.25; sfx.eshoot(dist); e.peekN=(e.peekN|0)+1;
    spawnShot(e.x,e.y,Math.atan2(dy,dx)+(Math.random()-.5)*rSt[4],rSt[3]);
  } else if(e.type==='K' && los && e.cd<=0){
    const rage=e.hp<t.hp*.5, n=rage?5:3;
    e.cd=rage?1.15:1.7; e.atk=.35; sfx.eshoot(dist);
    const base=Math.atan2(dy,dx);
    for(let i=0;i<n;i++) spawnShot(e.x,e.y,base+(i-(n-1)/2)*.2,9);
  }
}
function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    s.x+=s.dx*6*dt; s.y+=s.dy*6*dt; s.life-=dt;
    if(s.life<=0){ shots.splice(i,1); continue; }
    if(solidAt(s.x,s.y)){ spawnSpark(s.x,s.y); shots.splice(i,1); continue; }
    if(Math.hypot(s.x-P.x,s.y-P.y)<.32){ hurtPlayer(s.dmg); shots.splice(i,1); }
  }
}
function updatePickups(){
  for(const p of pickups){
    if(p.taken) continue;
    if(Math.hypot(p.x-P.x,p.y-P.y)>.55) continue;
    if(p.kind==='h'){ if(P.hp>=100) continue; P.hp=Math.min(100,P.hp+25); FX.heal=.35; showMsg('AXIOM-Zelle: Integrität +25',1400); sfx.pickup(); }
    else if(p.kind==='a'){ if(P.ammo>=99) continue; P.ammo=Math.min(99,P.ammo+10); showMsg('Ladung +10',1200); sfx.pickup(); }
    else if(p.kind==='m'){ stats.shards++; showMsg('MOGC-Splitter gefunden',1200); sfx.pickup(); }
    else if(WPICK[p.kind]!==undefined){ grantWeapon(WPICK[p.kind],WAMMO[p.kind]); sfx.gun(); }
    p.taken=true;
  }
}
function exitLocked(){ return lvl.lock==='boss' && enemies.some(e=>e.type==='K'&&e.alive); }
let lockedMsgT=0;
function checkExit(dt){
  lockedMsgT-=dt;
  if(!exitCell) return;
  const cx=exitCell.x+.5, cy=exitCell.y+.5;
  if(Math.abs(P.x-cx)<1.15 && Math.abs(P.y-cy)<1.15 && Math.hypot(P.x-cx,P.y-cy)<1.1){
    if(exitLocked()){ if(lockedMsgT<=0){ showMsg('Portal gesperrt — Kern-Wächter besiegen',2000); lockedMsgT=2.5; } }
    else finishLevel();
  }
}
// Treppe hoch: gleicher Trigger-Mechanismus wie der Ausgang (Annäherung an
// eine Wand-Tür genügt, kein Betreten der massiven Zelle nötig). fadeBusy
// als Sperre wiederverwendet, damit während der laufenden Fade-Transition
// (Dauer siehe FADE_MS) nicht mehrfach pro Frame ausgelöst wird.
function checkStairs(){
  if(!stairsCell || fadeBusy) return;
  const cx=stairsCell.x+.5, cy=stairsCell.y+.5;
  if(Math.abs(P.x-cx)<1.15 && Math.abs(P.y-cy)<1.15 && Math.hypot(P.x-cx,P.y-cy)<1.1) climbStairs();
}
function climbStairs(){
  if(!siteFloors || typeof lvl.floorIdx!=='number') return;
  const next=lvl.floorIdx+1;
  if(next>=siteFloors.length) return; // sollte nie eintreten, oberste Etage hat kein 'U'
  run.kills+=stats.kills; run.shards+=stats.shards; run.time+=stats.time; run.foes+=totals.foes; run.shardsMax+=totals.shards;
  startLevel(siteFloors[next],false);
}
function finishLevel(){
  setState('levelwin'); releaseLock(); sfx.win(); Save.onSectorClear(lvl&&lvl.procedural?lvl.depth:0);
  run.kills+=stats.kills; run.shards+=stats.shards; run.time+=stats.time; run.foes+=totals.foes; run.shardsMax+=totals.shards;
  const last=lvIdx>=LEVELS.length-1;
  const st=[['Feinde erledigt',stats.kills+' / '+totals.foes],['MOGC-Splitter',stats.shards+' / '+totals.shards],['Zeit',fmt(stats.time)]];
  const rw=Mods.sectorReward(modDepth()); if(rw) st.push(['Waffen-Mod',rw.name]);
  if(lvl.procedural){
    const nextDepth=lvl.depth+1;
    showOverlay(addLoadoutBtn({title:'Sektor gesäubert',text:lvl.name+' ist wieder online.',stats:st,
      buttons:[{label:'Weiter — Tiefe '+nextDepth,primary:true,fn:()=>{ siteFloors=generateProceduralSite(nextDepth); startLevel(siteFloors[0],false); }},
               {label:'Lauf beenden',fn:finishRun}]}));
    return;
  }
  if(!last){
    showOverlay(addLoadoutBtn({title:'Sektor gesäubert',text:lvl.name+' ist wieder online.',stats:st,
      buttons:[{label:'Weiter zu '+LEVELS[lvIdx+1].name.split(':')[0],primary:true,fn:()=>startLevel(lvIdx+1,false)}]}));
  } else {
    setState('gamewin');
    let best=null;
    try{ best=+localStorage.getItem('orca_breach_best')||0; if(!best||run.time<best){ localStorage.setItem('orca_breach_best',String(run.time|0)); best=run.time|0; } }catch(e){}
    Save.onCampaignComplete(run.time);
    st.push(['Gesamtzeit',fmt(run.time)]); st.push(['Gesamt-Splitter',run.shards+' / '+run.shardsMax]);
    if(best) st.push(['Bestzeit (dieser Browser)',fmt(best)]);
    showOverlay({title:'NEXUS ist wieder online',text:'Der Kern ist gesichert. Das war die Testversion — Feedback willkommen.',stats:st,
      buttons:[{label:'Nochmal von vorn',primary:true,fn:()=>{ newRun(); startLevel(0,true); }},{label:'Zum Titel',fn:showTitle}]});
  }
}

function newRun(){
  Save.onRunStart(); Stats.onRunStart(); Mods.reset(); Combat.reset(); run.kills=run.shards=run.time=run.foes=run.shardsMax=0;
  for(let i=0;i<WEAPONS.length;i++){ P.owned[i]=(i===0||i===2); P.mag[i]=Mods.magSize(i); P.hs[i]=0; P.os[i]=0; }   // Arsenal zurueck auf Pistole + Faeuste
  P.weapon=0; P.heat=0; P.overheatT=0; P.reloadT=0; P.ammo=36; refreshWeaponUI();
}
function startLevel(i,fresh){
  fadeTransition(()=>{
    initAudio();
    if(fresh){ P.hp=100; if(i===0&&!P.hasSG) P.ammo=36; }
    parseLevel(i);
    Combat.resetChain();
    Save.onLevelStart(lvl.procedural?lvl.depth:0);
    setAmbient(curBiome);
    snap={hp:P.hp,ammo:P.ammo,hasSG:P.hasSG,owned:P.owned.slice()};
    if(!P.owned[P.weapon]) P.weapon=0; refreshWeaponUI();
    hideOverlay(); setState('play'); requestLock();
    showMsg(lvl.intro,4200); flowT=0; lastT=performance.now();
  });
}
function pauseGame(){
  if(state!=='play') return;
  setState('pause'); releaseLock();
  pauseMenu();
}
function pauseMenu(){
  const buttons=[{label:'Weiterspielen',primary:true,fn:resumeGame},
                 {label:'Loadout',fn:()=>openLoadout(pauseMenu)},
                 {label:muted?'Ton an':'Ton aus',fn:()=>{ muted=!muted; refreshAmbientVolume(); pauseRefresh(); }}];
  if(lvl.procedural) buttons.push({label:'Lauf beenden',fn:finishRun});
  buttons.push({label:'Zum Titel',fn:showTitle});
  showOverlay({title:'Pausiert',text:'Klick auf „Weiterspielen“ fängt die Maus wieder ein.',showKeys:true,buttons});
}
function pauseRefresh(){ setState('play'); pauseGame(); }
function resumeGame(){ hideOverlay(); setState('play'); requestLock(); lastT=performance.now(); }

function showOverlay(o){
  const box=$('obox');

/* ---- Sanfter Übergang zwischen Leveln/Sektoren (Fade-to-Black statt Hartschnitt) ---- */
const FADE_MS=260;
let fadeBusy=false;
function fadeTransition(cb){
  const el=$('fade');
  if(fadeBusy){ cb(); return; } // Sicherheitsnetz, falls schon mitten im Fade
  fadeBusy=true;
  el.classList.add('on');
  setTimeout(()=>{
    cb();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.classList.remove('on');
      setTimeout(()=>{ fadeBusy=false; },FADE_MS);
    }));
  },FADE_MS);
}

/* ============================================================
   Rendering
   ============================================================ */
let dirX=1,dirY=0,planeX=0,planeY=PLANE_LEN, horizon=HALF;

const skyColBuf=new Int32Array(W);
function computeSkyCols(){
  for(let x=0;x<W;x++){
    const camX=2*x/W-1, rdx=dirX+planeX*camX, rdy=dirY+planeY*camX;
    let ang=Math.atan2(rdy,rdx); if(ang<0) ang+=Math.PI*2;
    let sx=((ang/(Math.PI*2))*SKY_W)|0; if(sx>=SKY_W) sx=SKY_W-1; if(sx<0) sx=0;
    skyColBuf[x]=sx;
  }
}
function renderFloorCeil(time){
  const rx0=dirX-planeX, ry0=dirY-planeY, rx1=dirX+planeX, ry1=dirY+planeY;
  if(curOutdoor) computeSkyCols();
  for(let y=0;y<H;y++){
    const p=y-horizon, ap=Math.abs(p), base=y*W;
    if(curOutdoor && p<0){
      // Himmel: reine Winkelprojektion (Doom-Sky-Hack), kein Perspektiv-Floorcast, kein Nebel
      let sy=(-p)|0; if(sy>=SKY_H) sy=SKY_H-1; if(sy<0) sy=0;
      const row=sy*SKY_W;
      for(let x=0;x<W;x++) buf[base+x]=curSky[row+skyColBuf[x]];
      continue;
    }
    if(ap<.6){ for(let x=0;x<W;x++) buf[base+x]=FOGC; continue; }
    const rd=(.5*PROJ)/ap;
    const f=clamp(((1-rd/MAXD)*256|0)+FX.flashAdd,0,256);
    if(f<=2){ for(let x=0;x<W;x++) buf[base+x]=FOGC; continue; }
    const stx=rd*(rx1-rx0)/W, sty=rd*(ry1-ry0)/W;
    let fx=P.x+rd*rx0, fy=P.y+rd*ry0;
    if(p>0){
      for(let x=0;x<W;x++){
        buf[base+x]=shade(curFloor[(((fy*64)|0)&63)<<6|(((fx*64)|0)&63)],f);
        fx+=stx; fy+=sty;
      }
    } else {
      // Decke: fast überall die normale, ruhig leuchtende Platte — nur eine
      // gehashte Minderheit der Zellen (~1 von 7) ist als Flacker-Lampe
      // markiert, Phase pro Zelle versetzt (wie bei den Server-Racks).
      for(let x=0;x<W;x++){
        const mx=fx|0, my=fy|0;
        const h=((mx*928371)^(my*589301))>>>0;
        let ctex=curCeil, lf=f;
        if(curCeil===texCeil && (h%7)===0){
          const fr=Math.floor(time*2.4+(h%97)*0.08)%CEIL_FLICKER_FRAMES.length;
          ctex=CEIL_FLICKER_FRAMES[fr]; lf=f*CEIL_FLICKER_F[fr];
        }
        buf[base+x]=shade(ctex[(((fy*64)|0)&63)<<6|(((fx*64)|0)&63)],lf);
        fx+=stx; fy+=sty;
      }
    }
  }
}
function renderWalls(time){
  const locked_=exitLocked();
  for(let x=0;x<W;x++){
    const camX=2*x/W-1, rdx=dirX+planeX*camX, rdy=dirY+planeY*camX;
    let mx=P.x|0, my=P.y|0;
    const ddx=rdx===0?1e30:Math.abs(1/rdx), ddy=rdy===0?1e30:Math.abs(1/rdy);
    let sx,sy,sdx,sdy;
    if(rdx<0){ sx=-1; sdx=(P.x-mx)*ddx; } else { sx=1; sdx=(mx+1-P.x)*ddx; }
    if(rdy<0){ sy=-1; sdy=(P.y-my)*ddy; } else { sy=1; sdy=(my+1-P.y)*ddy; }
    let side=0, hit=0;
    for(let i=0;i<90;i++){
      if(sdx<sdy){ sdx+=ddx; mx+=sx; side=0; } else { sdy+=ddy; my+=sy; side=1; }
      if(mx<0||my<0||mx>=MW||my>=MH){ hit=1; break; }
      hit=grid[my*MW+mx]; if(hit) break;
    }
    if(!hit){ zBuf[x]=1e9; continue; }
    const perp=Math.max(.05,side===0?sdx-ddx:sdy-ddy);
    zBuf[x]=perp;
    let wallX=side===0?P.y+perp*rdy:P.x+perp*rdx; wallX-=Math.floor(wallX);
    let tx=(wallX*64)|0;
    if((side===0&&rdx>0)||(side===1&&rdy<0)) tx=63-tx;
    const lh=PROJ/perp, top=horizon-lh/2;
    let f=((1-perp/MAXD)*256)|0; if(side===1) f=(f*.74)|0;
    f=clamp(f+FX.flashAdd,0,256);
    let tex=curWall[hit]||curWall[1];
    if(hit===4){ tex=locked_?texExitLocked:texExit; f=clamp(170+((Math.sin(time*4)+1)*43)|0,0,256); }
    else if(hit===5){ tex=texStairs; f=clamp(170+((Math.sin(time*3)+1)*43)|0,0,256); }
    else if(hit===2&&curBiome==='facility'){
      // Server-Racks blinken: Frame-Wahl aus Zeit + Zellposition gehasht,
      // damit nicht alle Racks im Gleichtakt schalten.
      const cellHash=((mx*928371)^(my*589301))>>>0;
      const frame=Math.floor(time*2.2+(cellHash%97)*0.07)%RACK_FRAMES.length;
      tex=RACK_FRAMES[frame];
    }
    else if(hit===6){ tex=SIGN_TEX[String(lvl.signDigit)]||SIGN_TEX['0']; }
    const y0=Math.max(0,top|0), y1=Math.min(H-1,(top+lh)|0);
    const step=64/lh; let tp=(y0-top)*step;
    for(let y=y0;y<=y1;y++){

    }
  }
}
const drawList=[];
function renderSprites(time){

    const t=ETYPES[e.type], set=curSPR[e.type];
    if(e.alive){ drawList.push({x:e.x,y:e.y,tex:e.atk>0?set.atk:set.idle,sc:t.sc,vo:t.vo+(e.type==='d'?Math.sin(time*3+e.x)*.03:0),flash:e.flash});

    else drawList.push({x:e.x,y:e.y,tex:set.dead,sc:t.sc*.75,vo:0,flash:0});
  }
  for(const p of pickups){ if(p.taken) continue;
    drawList.push({x:p.x,y:p.y,tex:PICKUP_SPR[p.kind],sc:.36,vo:.02+(Math.sin(time*3+p.ph)+1)*.03,flash:0}); }
  for(const s of shots) drawList.push({x:s.x,y:s.y,tex:SPR_BALL,sc:.24,vo:.38,flash:0,glow:true});

    drawList.push({x:h.x,y:h.y,tex:SPR_HOLE,sc:1.0*k*pl,vo:.05,flash:0,glow:true});
    drawList.push({x:h.x,y:h.y,tex:SPR_HOLE2,sc:.7*k*(2-pl),vo:.2,flash:0,glow:true});
  }
  for(const b of beams){
    const dx=b.x1-b.x0, dy=b.y1-b.y0, len=Math.hypot(dx,dy)||.01, n=clamp(Math.ceil(len/.4),3,40), nx=-dy/len, ny=dx/len, fade=1-b.t/b.life;
    const tex=b.kind==='rail'?SPR_RAILDOT:SPR_ARCDOT, bsc=(b.kind==='rail'?.15:.11)*(.5+.5*fade);
    for(let k=0;k<=n;k++){
      const f=k/n, off=(b.jag&&k>0&&k<n)?Math.sin(time*57+k*12.9+b.seed)*.13:0;
      drawList.push({x:b.x0+dx*f+nx*off,y:b.y0+dy*f+ny*off,tex,sc:bsc,vo:.44,flash:0,glow:true});
    }
  }
  for(const b of booms){
    const bset=b.set||BOOM_FRAMES;
    const k=Math.min(bset.length-1,(b.t/b.life*bset.length)|0);
    const grow=.55+(b.t/b.life)*.9;
    drawList.push({x:b.x,y:b.y,tex:bset[k],sc:(b.scale||1)*grow,vo:.16,flash:0,glow:true});
  }
  for(const sp of sparks){
    const k=Math.min(SPARK_FRAMES.length-1,(sp.t/sp.life*SPARK_FRAMES.length)|0);
    const shrink=1-(sp.t/sp.life)*.3;
    drawList.push({x:sp.x,y:sp.y,tex:SPARK_FRAMES[k],sc:.24*shrink,vo:.26,flash:0,glow:true});
  }
  for(const d of drawList){ const dx=d.x-P.x, dy=d.y-P.y; d.d=dx*dx+dy*dy; }
  drawList.sort((a,b)=>b.d-a.d);

  const inv=1/(planeX*dirY-dirX*planeY);
  for(const s of drawList){
    const dx=s.x-P.x, dy=s.y-P.y;
    const tX=inv*(dirY*dx-dirX*dy), tY=inv*(-planeY*dx+planeX*dy);
    if(tY<.12) continue;
    const size=PROJ*s.sc/tY, sxc=(W/2)*(1+tX/tY);
    const bottom=horizon+(.5-s.vo)*PROJ/tY, top=bottom-size, x0=sxc-size/2;
    let f=s.glow?256:clamp(((1-tY/MAXD)*256|0)+FX.flashAdd+50,40,256);
    const xa=Math.max(0,x0|0), xb=Math.min(W-1,(x0+size)|0);

  }

  if(kind===3){ g.strokeStyle='#FF3D6E'; g.lineWidth=2; for(const cx of [12,28]){ g.beginPath(); g.moveTo(cx-3,19); g.lineTo(cx+3,25); g.moveTo(cx+3,19); g.lineTo(cx-3,25); g.stroke(); } }
  else { px(g,kind===2?'#FF3D6E':'#35E4FF',10,20,4,4); px(g,kind===2?'#FF3D6E':'#35E4FF',26,20,4,4); }
  g.strokeStyle='#0a0f16'; g.lineWidth=2; g.beginPath();
  if(kind===0){ g.strokeStyle='#04060C'; g.arc(20,29,5,.15*Math.PI,.85*Math.PI); }
  else if(kind===1){ g.moveTo(15,31); g.lineTo(25,31); }
  else if(kind===2){ g.moveTo(15,33); g.lineTo(18,30); g.lineTo(22,33); g.lineTo(25,30); }

}

// Bedrohung: gewichtete Summe wacher Gegner in Reichweite (Boss zaehlt dreifach), 0..5
function computeThreat(){
  let sum=0;
  for(let i=0;i<enemies.length;i++){
    const e=enemies[i]; if(!e.alive||!e.awake) continue;
    const d=Math.hypot(e.x-P.x,e.y-P.y); if(d>16) continue;
    const w=e.type==='K'?9:clamp(e.maxhp/45,.4,3);
    sum+=w*(d<7?1:.55);
  }
  return sum;
}
function threatLevel(sum){ return sum<=0?0:sum<1.6?1:sum<4?2:sum<7.5?3:sum<12?4:5; }

function hud2Update(dt){

  { const dmax=Stats.val.dashCharges, part=P.dashN<dmax?clamp(1-P.dashCd/Stats.val.dashCd,0,1):0;

  { let mask=''; for(let i=0;i<WEAPONS.length;i++) mask+=(i===P.weapon?'c':P.owned[i]?'o':'-');
    hset('wslots',mask,()=>{ for(let i=0;i<elWslots.length;i++) elWslots[i].className=i===P.weapon?'cur':P.owned[i]?'own':''; }); }

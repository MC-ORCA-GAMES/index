/* ============================================================
   Titelbild-Demo (Wächter-Programm spielt sich selbst)
   ============================================================ */
let demoLvIdx=0, demoTarget=null, demoFlowMap=null, demoFlowKey=null, demoIdleT=0, demoAimT=0, demoStuckT=0;
const DEMO_DEPTHS=[3,6,9,12]; // je ein Boss-Tiefe-Sprung pro Biome: Anlage, Schlucht, Wüste, Dschungel
function demoPickTarget(){
  if(demoTarget && !demoTarget.alive) demoTarget=null;   // Ziel tot -> neu wählen
  if(!demoTarget){
    let best=null, bd=1e9;
    for(const e of enemies){
      if(!e.alive) continue;
      const d=(e.x-P.x)*(e.x-P.x)+(e.y-P.y)*(e.y-P.y);
      if(d<bd){ bd=d; best=e; }
    }
    demoTarget=best;   // am gewählten Gegner festhalten, statt jeden Frame neu zu wählen (verhindert Zappeln)
  }
  if(demoTarget) return {x:demoTarget.x,y:demoTarget.y,enemy:demoTarget};
  if(exitCell) return {x:exitCell.x+.5,y:exitCell.y+.5,enemy:null};
  return null;
}
function nextDemoScene(){
  fadeTransition(()=>{
    demoLvIdx=(demoLvIdx+1)%DEMO_DEPTHS.length;
    parseLevel(generateProceduralLevel(DEMO_DEPTHS[demoLvIdx])); P.a=lvl.angle; P.weapon=0;
    demoTarget=null; demoFlowMap=null; demoFlowKey=null; demoIdleT=0; demoAimT=0; demoStuckT=0;
    setAmbient(curBiome); lastT=performance.now();
  });
}
function updateDemo(dt){
  if(fadeBusy) return;   // während des Szenenwechsels nichts bewegen
  AI.tick(dt);
  for(const e of enemies) updateEnemy(e,dt);
  updateShots(dt); updateBooms(dt); updateSparks(dt);
  P.fireCd=Math.max(0,P.fireCd-dt); P.recoil=Math.max(0,P.recoil-dt*5); P.flash=Math.max(0,P.flash-dt);
  FX.hitMark=Math.max(0,FX.hitMark-dt); FX.shake=Math.max(0,FX.shake-dt*3.4);
  flowT-=dt; if(flowT<=0){ computeFlow(); flowT=.3; }

  const target=demoPickTarget();
  const foesLeft=enemies.some(e=>e.alive);
  if(!target){
    P.a+=dt*.12; P.moving=Math.max(0,P.moving-dt*8);
  } else {
    const dx=target.x-P.x, dy=target.y-P.y, dist=Math.hypot(dx,dy)||.001;
    const aimAng=Math.atan2(dy,dx);
    const los=target.enemy && rayWallDist(P.x,P.y,dx/dist,dy/dist)>=dist-.2;
    let wantMove=true;
    if(los){
      demoAimT=.6;
      const da=((aimAng-P.a+Math.PI*3)%(Math.PI*2))-Math.PI;
      P.a+=clamp(da,-3.4*dt,3.4*dt);
      wantMove=dist>3.1;
      if(Math.abs(da)<.11) demoFire();
    } else {
      demoAimT=Math.max(0,demoAimT-dt);
      const tk=(target.x|0)+','+(target.y|0);
      if(tk!==demoFlowKey){ demoFlowMap=computeFlowFromCell(target.x|0,target.y|0); demoFlowKey=tk; }
      const nx=fieldTarget(P.x,P.y,demoFlowMap);
      if(nx){
        const moveAng=Math.atan2(nx.y-P.y,nx.x-P.x);
        const da=((moveAng-P.a+Math.PI*3)%(Math.PI*2))-Math.PI;
        P.a+=clamp(da,-2.6*dt,2.6*dt);
      } else wantMove=false;
    }
    if(wantMove){
      const sp=2.3*dt;
      const mv=tryMove(P,Math.cos(P.a)*sp,Math.sin(P.a)*sp,.22);
      P.moving=Math.min(1,P.moving+dt*8); P.bob+=mv*2.6;
      stepPhase=Math.floor(P.bob/Math.PI);
      if(mv<sp*.15) demoStuckT+=dt; else demoStuckT=0;
    } else { P.moving=Math.max(0,P.moving-dt*8); demoStuckT=0; }
    if(demoStuckT>2){   // Bewegung blockiert (z.B. Engstelle/Ecke) -> Ziel fallen lassen und neu ausrichten
      demoStuckT=0; demoTarget=null; demoFlowMap=null; demoFlowKey=null;
      P.a+=(Math.random()<.5?-1:1)*(Math.PI*.5+Math.random()*Math.PI*.5);
    }
  }

  if(!foesLeft){
    demoIdleT+=dt;
    const atExit=exitCell&&Math.hypot(P.x-(exitCell.x+.5),P.y-(exitCell.y+.5))<1.1;
    if(!exitCell||atExit||demoIdleT>5) nextDemoScene();
  } else demoIdleT=0;
}

/* ============================================================
   Hauptschleife
   ============================================================ */
let lastT=performance.now();
let stepPhase=0;
function update(dt){
  stats.time+=dt; Save.data.stats.playTime+=dt; Combat.tick(dt);
  // Bewegung (Phase 3: Sprint kostet Energie, Dash mit i-Frames, Tempo-Faktor aus Stats)
  const V=Stats.val;
  const turn=(keys.ArrowRight||keys.KeyE?1:0)-(keys.ArrowLeft||keys.KeyQ?1:0);
  P.a+=turn*2.4*dt;
  readMove();
  const wantSprint=!!(keys.ShiftLeft||keys.ShiftRight||touchSprint);
  if(P.dashT>0){
    const step=Math.min(dt,P.dashT); P.dashT-=step;
    const dist=V.dashDist/V.dashTime*step, n=Math.max(1,Math.ceil(dist/.2)), d=dist/n;   // Teilschritte: kein Durchtunneln
    for(let i=0;i<n;i++) tryMove(P,P.dashX*d,P.dashY*d,.22);
    P.sprinting=false; P.moving=Math.min(1,P.moving+dt*8);
  } else if(mvLen>0){
    P.sprinting=wantSprint&&!P.sprintLock&&P.energy>0;
    if(P.sprinting){
      P.energy=Math.max(0,P.energy-V.sprintCost*dt); P.enT=Math.max(P.enT,V.energyDelay);
      if(P.energy<=0){ P.sprintLock=true; P.sprinting=false; sfx.noEnergy(); }
    }
    if(P.sprinting){ P.noiseT=(P.noiseT||0)-dt; if(P.noiseT<=0){ P.noiseT=.5; AI.noise(P.x,P.y,4.5); } }   // Sprinten ist hörbar
    const sp=(P.sprinting?4.8:3.2)*V.speed*dt;
    const mv=tryMove(P,mvX*sp,mvY*sp,.22);
    P.moving=Math.min(1,P.moving+dt*8); P.bob+=mv*2.6;
    const stepIdx=Math.floor(P.bob/Math.PI);
    if(stepIdx>stepPhase){ stepPhase=stepIdx; sfx.step(curBiome); }
  } else { P.sprinting=false; P.moving=Math.max(0,P.moving-dt*8); }
  if(P.sprintLock&&!wantSprint&&P.energy>=P.energyMax*V.sprintResume) P.sprintLock=false;   // erst loslassen UND 20 % Energie
  Stats.tick(dt);
  // Feuern
  P.fireCd=Math.max(0,P.fireCd-dt); P.recoil=Math.max(0,P.recoil-dt*5); P.flash=Math.max(0,P.flash-dt);
  if(P.reloadT>0){ P.reloadT-=dt; if(P.reloadT<=0){ P.reloadT=0; finishReload(); } }
  if(P.overheatT>0){ P.overheatT=Math.max(0,P.overheatT-dt); if(P.overheatT===0) P.heat=0; }
  else P.heat=Math.max(0,P.heat-dt*WEAPONS[P.weapon].cool*Mods.eff(P.weapon).cool);
  for(let i=0;i<WEAPONS.length;i++){                       // weggelegte Waffen kuehlen im Hintergrund
    if(i===P.weapon) continue;
    if(P.os[i]>0){ P.os[i]=Math.max(0,P.os[i]-dt); if(P.os[i]===0) P.hs[i]=0; }
    else if(P.hs[i]>0) P.hs[i]=Math.max(0,P.hs[i]-dt*WEAPONS[i].cool*Mods.eff(i).cool);
  }
  if(keys.Space||mouseDown||touchFireDown) tryFire();
  // Welt
  if(lvl.fog) updateFog();
  flowT-=dt; if(flowT<=0){ computeFlow(); flowT=.3; }
  AI.tick(dt);
  for(const e of enemies) updateEnemy(e,dt);
  updateShots(dt); updatePshots(dt); updateHoles(dt); updateBeams(dt); updatePickups(); updateBooms(dt); updateSparks(dt); checkExit(dt); checkStairs();
  ambientTick(dt);
  // Effekte
  FX.hurt=Math.max(0,FX.hurt-dt); FX.heal=Math.max(0,FX.heal-dt); FX.hitMark=Math.max(0,FX.hitMark-dt);
  FX.shake=Math.max(0,FX.shake-dt*3.4);
  FX.shieldHit=Math.max(0,FX.shieldHit-dt); FX.dash=Math.max(0,FX.dash-dt); FX.crit=Math.max(0,FX.crit-dt);
  $('hurt').style.opacity=Math.min(1,FX.hurt*2.4); $('heal').style.opacity=Math.min(1,FX.heal*2.4);
  elShieldFx.style.opacity=Math.min(1,FX.shieldHit*2.4); elDashFx.style.opacity=Math.min(1,FX.dash*3);
  $('xh').classList.toggle('hit',FX.hitMark>0); $('xh').classList.toggle('crit',FX.crit>0);
  updateHeatUI();
  if(FX.msg>0){ FX.msg-=dt; if(FX.msg<=0) $('msg').classList.remove('on'); }
}
function applyShake(){
  if(FX.shake>.003){
    const m=FX.shake*FX.shake;
    const ox=(Math.random()*2-1)*m*2.2, oy=(Math.random()*2-1)*m*2.2;
    cv.style.transform='translate('+ox.toFixed(2)+'cqw,'+oy.toFixed(2)+'cqw)';
  } else if(cv.style.transform){ cv.style.transform=''; }
}
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  if(state==='play') update(dt);
  else if(state==='title'){ updateDemo(dt); }
  else if(state==='dead'||state==='levelwin'||state==='gamewin'){ FX.hurt=Math.max(0,FX.hurt-dt); FX.shake=Math.max(0,FX.shake-dt*3.4); $('hurt').style.opacity=state==='dead'?.55:0; }
  if(lvl){ render(now/1000); if(state==='play'||state==='pause') drawMini(); updateHud(dt); applyShake(); }
  if(isTouch) window.__syncTouchLayer();
  requestAnimationFrame(frame);
}

/* ---- Start ---- */
drawFace(0);
showTitle();          // parst Sektor 1 selbst als Kulisse für den Titelbildschirm
requestAnimationFrame(frame);

})();

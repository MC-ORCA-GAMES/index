function shade(c,f){
  return (0xFF000000
    | ((((c>>16)&255)*f+FB*(256-f))>>8)<<16
    | ((((c>>8)&255)*f+FG*(256-f))>>8)<<8
    | (((c&255)*f+FR*(256-f))>>8))>>>0;
}

/* ============================================================
   Texturen & Sprites (alles per Code gezeichnet)

function rng(seed){ let s=seed>>>0; return ()=>{ s=(s+0x6D2B79F5)>>>0; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function px(g,c,x,y,w,h){ g.fillStyle=c; g.fillRect(x,y,w,h); }
function disc(g,c,x,y,rx,ry){ g.fillStyle=c; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fill(); }
function poly(g,c,p){ g.fillStyle=c; g.beginPath(); g.moveTo(p[0],p[1]); for(let i=2;i<p.length;i+=2) g.lineTo(p[i],p[i+1]); g.closePath(); g.fill(); }
function speckle(g,r,n,cols){ for(let i=0;i<n;i++){ g.fillStyle=cols[(r()*cols.length)|0]; g.fillRect((r()*64)|0,(r()*64)|0,1,1); } }

function makeTex(draw,cut){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false; draw(g);

/* ---- Himmel (Außensektoren): Angle-basiertes Sky-Strip, wie beim Doom-Sky-Hack ---- */
const SKY_W=1440, SKY_H=320;
function makeWideTex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false; draw(g);
  return new Uint32Array(g.getImageData(0,0,w,h).data.buffer);
}
function paintSkyBase(g,horizonCol,zenithCol){
  const grad=g.createLinearGradient(0,SKY_H,0,0);
  grad.addColorStop(0,horizonCol); grad.addColorStop(.4,zenithCol); grad.addColorStop(1,zenithCol);
  g.fillStyle=grad; g.fillRect(0,0,SKY_W,SKY_H);
}
function paintStars(g,seed,n,topBias){
  const r=rng(seed);
  for(let i=0;i<n;i++){
    const y=(Math.pow(r(),topBias)*SKY_H)|0, x=(r()*SKY_W)|0;
    const b=r();
    g.fillStyle=b<.1?'#FFFFFF':(b<.45?'#BFE9FF':'#7FD4E8');
    g.fillRect(x,SKY_H-1-y,1,1);
  }
}
function paintPlanet(g,cx,cy,r,dark,base,light,ring){
  disc(g,dark,cx,cy,r,r);
  g.save(); g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.clip();
  g.fillStyle=base; g.fillRect(cx-r,cy-r,r*1.35,r*2);
  g.fillStyle=light; g.fillRect(cx-r,cy-r,r*.5,r*2);
  g.restore();
  if(ring){
    g.strokeStyle=ring; g.lineWidth=Math.max(2,r*.14);
    g.beginPath(); g.ellipse(cx,cy,r*1.7,r*.4,-.3,0,Math.PI*2); g.stroke();
  }
}

function boomFrame(core,mid,outer,spikes,size,seed){
  return makeTex(g=>{
    disc(g,outer,32,32,size,size);
    disc(g,mid,32,32,size*.7,size*.7);
    disc(g,core,32,32,size*.35,size*.35);
    if(spikes){
      const r=rng(seed);
      for(let i=0;i<9;i++){
        const a=(i/9)*Math.PI*2+r()*.4, rr=size*(1+r()*.5), w=.16+r()*.08;
        poly(g,outer,[32,32,
          32+Math.cos(a-w)*size*.55,32+Math.sin(a-w)*size*.55,
          32+Math.cos(a)*rr,32+Math.sin(a)*rr,
          32+Math.cos(a+w)*size*.55,32+Math.sin(a+w)*size*.55]);
      }
    }
  },true);
}

/* ============================================================
   Prozedurale Sektoren (Zufallslauf) + Nebel des Krieges
   ============================================================ */
function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function carveMaze(size){
  // 0=Flur, 1=Wand. Klassischer Recursive-Backtracker auf ungeradem Raster.
  const g=new Uint8Array(size*size).fill(1);
  const idx=(x,y)=>y*size+x;
  g[idx(1,1)]=0;
  const stack=[[1,1]];
  while(stack.length){
    const [cx,cy]=stack[stack.length-1];
    const dirs=shuffleArr([[2,0],[-2,0],[0,2],[0,-2]]);
    let carved=false;
    for(const [dx,dy] of dirs){
      const nx=cx+dx, ny=cy+dy;
      if(nx>0&&ny>0&&nx<size-1&&ny<size-1&&g[idx(nx,ny)]===1){
        g[idx(nx,ny)]=0; g[idx(cx+dx/2,cy+dy/2)]=0;
        stack.push([nx,ny]); carved=true; break;
      }
    }
    if(!carved) stack.pop();
  }
  // ein paar Extra-Durchbrüche, damit nicht alles reine Sackgassen sind
  const extra=Math.floor(size*size*0.02);
  for(let i=0;i<extra;i++){
    const x=1+2*((Math.random()*((size-3)/2))|0), y=1+2*((Math.random()*((size-3)/2))|0);
    if(Math.random()<0.5){ const wx=x+1; if(wx<size-1&&g[idx(wx,y)]===1&&g[idx(x,y)]===0&&g[idx(wx+1,y)]===0) g[idx(wx,y)]=0; }
    else { const wy=y+1; if(wy<size-1&&g[idx(x,wy)]===1&&g[idx(x,y)]===0&&g[idx(x,wy+1)]===0) g[idx(x,wy)]=0; }
  }
  return g;
}
function bfsFarthest(g,size,sx,sy){
  const idx=(x,y)=>y*size+x;
  const dist=new Int32Array(size*size).fill(-1);
  dist[idx(sx,sy)]=0;
  const q=[[sx,sy]]; let qi=0, far={x:sx,y:sy,d:0};
  while(qi<q.length){
    const [x,y]=q[qi++]; const d=dist[idx(x,y)];
    if(d>far.d) far={x,y,d};
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=size||ny>=size) continue;
      if(g[idx(nx,ny)]!==0||dist[idx(nx,ny)]!==-1) continue;
      dist[idx(nx,ny)]=d+1; q.push([nx,ny]);
    }
  }
  return far;
}
const SIZE_TIERS=[1,1.35,1.7,2.1]; // vier zufällige Größen-Varianten pro Sektor
function generateProceduralLevel(depth){
  const tier=SIZE_TIERS[(Math.random()*SIZE_TIERS.length)|0];
  let size=Math.round((11+depth*2.2)*tier); size+= (1-(size%2)); size=Math.max(11,Math.min(size,61));
  const g=carveMaze(size);
  const idx=(x,y)=>y*size+x;
  const wallChars=['#','R','H'], wallW=[0.62,0.28,0.10];
  function pickWall(){ const r=Math.random(); let acc=0; for(let i=0;i<wallChars.length;i++){ acc+=wallW[i]; if(r<=acc) return wallChars[i]; } return '#'; }
  const grid2=[];
  for(let y=0;y<size;y++){ const row=[]; for(let x=0;x<size;x++) row.push(g[idx(x,y)]===1?pickWall():'.'); grid2.push(row); }
  grid2[1][1]='P';
  const far=bfsFarthest(g,size,1,1);
  const nbrs=shuffleArr([[1,0],[-1,0],[0,1],[0,-1]]);
  let placedExit=false;
  for(const [dx,dy] of nbrs){
    const wx=far.x+dx, wy=far.y+dy;
    if(wx<=0||wy<=0||wx>=size-1||wy>=size-1) continue;
    if(g[idx(wx,wy)]===1){ grid2[wy][wx]='X'; placedExit=true; break; }
  }
  if(!placedExit) grid2[far.y][far.x]='X';
  const floorCells=[];
  for(let y=1;y<size-1;y++) for(let x=1;x<size-1;x++) if(g[idx(x,y)]===0 && !(x===1&&y===1) && grid2[y][x]==='.') floorCells.push([x,y]);
  shuffleArr(floorCells);

  // Gegner werden mit Mindestabstand zueinander verteilt, damit sich nicht
  // mehrere Gegner + Boss in einer einzigen Ecke stapeln.
  const enemyCells=[];
  function place(ch,count,minDist){
    let placed=0;
    for(let i=0;i<floorCells.length&&placed<count;i++){
      const [x,y]=floorCells[i]; if(grid2[y][x]!=='.') continue;
      if(minDist){
        let ok=true;
        for(const [ex,ey] of enemyCells){ if(Math.hypot(x-ex,y-ey)<minDist){ ok=false; break; } }
        if(!ok) continue;
      }
      grid2[y][x]=ch; if(minDist) enemyCells.push([x,y]); placed++;
    }
    if(placed<count){ // Notfall: falls der Abstand nicht überall einhaltbar war, Rest auffüllen
      for(let i=0;i<floorCells.length&&placed<count;i++){
        const [x,y]=floorCells[i]; if(grid2[y][x]!=='.') continue;
        grid2[y][x]=ch; if(minDist) enemyCells.push([x,y]); placed++;
      }
    }
  }
  const hasBoss=depth%3===0;
  if(hasBoss){
    // Kern-Wächter bewacht gezielt den Ausgang, statt zufällig mitten in einer Gegner-Traube zu stehen
    let bossCell=null, bestD=1e9;
    for(const [x,y] of floorCells){
      if(grid2[y][x]!=='.') continue;
      const d=Math.hypot(x-far.x,y-far.y);
      if(d<=6 && d<bestD){ bestD=d; bossCell=[x,y]; }
    }
    if(!bossCell) bossCell=floorCells.find(([x,y])=>grid2[y][x]==='.');
    if(bossCell){ grid2[bossCell[1]][bossCell[0]]='K'; enemyCells.push(bossCell); }
  }
  place('d',3+Math.min(6,Math.floor(depth*0.7)),3);
  place('r',Math.min(4,Math.floor(depth/3)),4);
  place('h',2+Math.floor(depth/3));
  place('a',3+Math.floor(depth/3));
  place('m',4+Math.floor(depth/2));
  if(depth===1) place('s',1);
  if(depth===6) place('w',1);
  let angle=Math.PI/4;
  if(g[idx(2,1)]===0) angle=0; else if(g[idx(1,2)]===0) angle=Math.PI/2;
  const biomeId=biomeForDepth(depth), biome=BIOMES[biomeId];
  const introOutdoor='Automatisch generiertes Terrain unter freiem Himmel — die Karte deckt sich erst auf, während du erkundest.';
  const introIndoor='Automatisch generierter Sektor — unbekanntes Terrain. Die Karte deckt sich erst auf, während du erkundest.';
  return {
    name:biome.name+' · Tiefe '+depth,
    intro: biome.outdoor?introOutdoor:introIndoor,
    angle, lock:hasBoss?'boss':false, fog:true, procedural:true, depth, biome:biomeId,
    map: grid2.map(r=>r.join(''))
  };
}

function resetFog(){
  if(lvl.fog){ seen=new Uint8Array(MW*MH); visible=new Uint8Array(MW*MH); } else { seen=null; visible=null; }
}
function updateFog(){
  if(!lvl.fog) return;
  visible.fill(0);
  const R=5.5, px=P.x, py=P.y;
  const minx=Math.max(0,Math.floor(px-R)), maxx=Math.min(MW-1,Math.ceil(px+R));
  const miny=Math.max(0,Math.floor(py-R)), maxy=Math.min(MH-1,Math.ceil(py+R));
  for(let y=miny;y<=maxy;y++) for(let x=minx;x<=maxx;x++){
    const cx=x+.5, cy=y+.5, dx=cx-px, dy=cy-py, dist=Math.hypot(dx,dy);
    if(dist>R) continue;
    const steps=Math.max(4,Math.ceil(dist*6));
    let clear=true;
    for(let s=1;s<steps;s++){ const t=s/steps; if(solidAt(px+dx*t,py+dy*t)){ clear=false; break; } }
    if(clear){ const k=y*MW+x; visible[k]=1; seen[k]=1; }
  }
  const pk=(py|0)*MW+(px|0); if(pk>=0&&pk<seen.length){ seen[pk]=1; visible[pk]=1; }
}

/* ---- Kollision, Sicht ---- */
function solidAt(x,y){ const mx=x|0,my=y|0; if(x<0||y<0||mx>=MW||my>=MH) return true; return grid[my*MW+mx]>0; }
function boxHit(x,y,r){ return solidAt(x-r,y-r)||solidAt(x+r,y-r)||solidAt(x-r,y+r)||solidAt(x+r,y+r); }
function tryMove(e,dx,dy,r){
  let moved=0;
  if(!boxHit(e.x+dx,e.y,r)){ e.x+=dx; moved+=Math.abs(dx); }
  if(!boxHit(e.x,e.y+dy,r)){ e.y+=dy; moved+=Math.abs(dy); }
  return moved;
}
function rayWallDist(ox,oy,dx,dy){
  let mx=ox|0,my=oy|0;
  const ddx=dx===0?1e30:Math.abs(1/dx), ddy=dy===0?1e30:Math.abs(1/dy);
  let sx,sy,sdx,sdy;
  if(dx<0){ sx=-1; sdx=(ox-mx)*ddx; } else { sx=1; sdx=(mx+1-ox)*ddx; }
  if(dy<0){ sy=-1; sdy=(oy-my)*ddy; } else { sy=1; sdy=(my+1-oy)*ddy; }
  let side=0;
  for(let i=0;i<90;i++){
    if(sdx<sdy){ sdx+=ddx; mx+=sx; side=0; } else { sdy+=ddy; my+=sy; side=1; }
    if(mx<0||my<0||mx>=MW||my>=MH) return 1e9;
    if(grid[my*MW+mx]>0) return side===0?sdx-ddx:sdy-ddy;
  }
  return 1e9;
}

/* ---- Wegfindung (Flow-Feld vom Spieler aus) ---- */
let flowT=0;
function computeFlow(){
  flow.fill(-1);
  const q=[]; const sx=P.x|0, sy=P.y|0;
  if(sx<0||sy<0||sx>=MW||sy>=MH) return;
  flow[sy*MW+sx]=0; q.push(sx,sy);
  for(let i=0;i<q.length;i+=2){
    const x=q[i], y=q[i+1], d=flow[y*MW+x];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const k=ny*MW+nx;
      if(flow[k]!==-1||grid[k]>0) continue;
      flow[k]=d+1; q.push(nx,ny);
    }
  }
}
function flowTarget(e){
  const cx=e.x|0, cy=e.y|0; let best=flow[cy*MW+cx], bx=-1, by=-1;
  if(best<0) return null;
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy) continue;
    const nx=cx+dx, ny=cy+dy;
    if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
    const v=flow[ny*MW+nx];
    if(v<0||v>=best) continue;
    if(dx&&dy&&(grid[cy*MW+nx]>0||grid[ny*MW+cx]>0)) continue;   // keine Diagonale durch Ecken
    best=v; bx=nx; by=ny;
  }
  return bx<0?null:{x:bx+.5,y:by+.5};
}
/* ---- Generisches Flow-Feld zu einem beliebigen Ziel (für die Titelbild-Demo) ---- */
function computeFlowFromCell(tx,ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH) return null;
  const f=new Int16Array(MW*MH).fill(-1);
  const q=[tx,ty]; f[ty*MW+tx]=0;
  for(let i=0;i<q.length;i+=2){
    const x=q[i], y=q[i+1], d=f[y*MW+x];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const k=ny*MW+nx;
      if(f[k]!==-1||grid[k]>0) continue;
      f[k]=d+1; q.push(nx,ny);
    }
  }
  return f;
}
function fieldTarget(px,py,f){
  if(!f) return null;
  const cx=px|0, cy=py|0; let best=f[cy*MW+cx], bx=-1, by=-1;
  if(best==null||best<0) return null;
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy) continue;
    const nx=cx+dx, ny=cy+dy;
    if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
    const v=f[ny*MW+nx];
    if(v<0||v>=best) continue;
    if(dx&&dy&&(grid[cy*MW+nx]>0||grid[ny*MW+cx]>0)) continue;
    best=v; bx=nx; by=ny;
  }
  return bx<0?null:{x:bx+.5,y:by+.5};
}

let ac=null, master=null, muted=false, noiseBuf=null, ambNoiseBuf=null;
function initAudio(){
  if(ac) { if(ac.state==='suspended') ac.resume(); return; }
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.gain.value=.32; master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*.6,ac.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    ambNoiseBuf=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate);
    const ad=ambNoiseBuf.getChannelData(0); for(let i=0;i<ad.length;i++) ad[i]=Math.random()*2-1;
  }catch(e){ ac=null; }
}

/* ---- Ambient-Loops pro Biome ---- */
const AMBIENT_VOL={facility:.05,canyon:.08,desert:.09,jungle:.06};
let ambient=null, ambEventT=0;
function buildAmbient(biome){
  if(!ac||!ambNoiseBuf) return null;
  const src=ac.createBufferSource(); src.buffer=ambNoiseBuf; src.loop=true;
  const filter=ac.createBiquadFilter();
  const gain=ac.createGain(); gain.gain.value=0;
  const lfo=ac.createOscillator(); const lfoGain=ac.createGain();
  if(biome==='desert'){ filter.type='bandpass'; filter.frequency.value=750; filter.Q.value=.6; lfo.frequency.value=1/7; lfoGain.gain.value=380; }
  else if(biome==='jungle'){ filter.type='bandpass'; filter.frequency.value=1300; filter.Q.value=.7; lfo.frequency.value=1/5; lfoGain.gain.value=260; }
  else if(biome==='canyon'){ filter.type='lowpass'; filter.frequency.value=520; filter.Q.value=.4; lfo.frequency.value=1/9; lfoGain.gain.value=140; }
  else { filter.type='lowpass'; filter.frequency.value=220; filter.Q.value=.3; lfo.frequency.value=1/4; lfoGain.gain.value=45; }
  lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
  src.connect(filter); filter.connect(gain); gain.connect(master);
  src.start(); lfo.start();
  gain.gain.setTargetAtTime(muted?0:(AMBIENT_VOL[biome]||.06),ac.currentTime,1.2);
  return {src,filter,gain,lfo,biome};
}
function stopAmbient(){
  if(!ambient) return;
  try{ ambient.gain.gain.setTargetAtTime(0,ac.currentTime,.15); }catch(e){}
  const a=ambient;
  setTimeout(()=>{ try{a.src.stop();}catch(e){} try{a.lfo.stop();}catch(e){} },250);
  ambient=null;
}
function setAmbient(biome){
  if(!ac) return;
  if(ambient && ambient.biome===biome) return;
  stopAmbient();
  ambient=buildAmbient(biome);
  ambEventT=1+Math.random()*2;
}
function refreshAmbientVolume(){
  if(!ambient) return;
  ambient.gain.gain.setTargetAtTime(muted?0:(AMBIENT_VOL[ambient.biome]||.06),ac.currentTime,.3);
}
function ambientTick(dt){
  if(!ambient||muted) return;
  ambEventT-=dt; if(ambEventT>0) return;
  const b=ambient.biome;
  if(b==='jungle'){ const f=2100+Math.random()*900; tone(f,f*.86,.05,'square',.045); tone(f*1.05,f*.9,.05,'square',.03,.09); ambEventT=1.2+Math.random()*2.2; }
  else if(b==='canyon'){ tone(210,85,.35,'triangle',.05); tone(210,85,.3,'triangle',.025,.3); ambEventT=4+Math.random()*5; }
  else if(b==='desert'){ noise(.5,.05,1500); ambEventT=3+Math.random()*4; }
  else { tone(560,560,.05,'square',.025); tone(400,400,.05,'square',.018,.1); ambEventT=3.5+Math.random()*4.5; }
}
function tone(f0,f1,dur,type,vol,delay){
  if(!ac||muted) return;
  const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);
}
function noise(dur,vol,fc){
  if(!ac||muted) return;
  const t=ac.currentTime, s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf; f.type='lowpass'; f.frequency.value=fc;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.02);
}
const near=d=>clamp(1-d/16,.08,1);
const sfx={
  pistol(){ tone(1000,110,.13,'sawtooth',.22); noise(.08,.18,3000); },
  shotgun(){ noise(.3,.55,1400); tone(170,38,.28,'square',.4); },
  auto(){ tone(650,140,.05,'sawtooth',.14); noise(.05,.13,2600); },
  overheat(){ noise(.4,.22,5200); tone(900,140,.35,'sawtooth',.16); tone(600,90,.4,'sawtooth',.1,.08); },
  empty(){ tone(140,120,.05,'square',.15); },
  hit(){ tone(240,90,.08,'square',.16); },

let msgT=0, hurtT=0, healT=0, hitMarkT=0, faceKind=-1;

function fmt(t){ const s=t|0; return ((s/60)|0)+':'+String(s%60).padStart(2,'0'); }

function alertNear(){
  for(const e of enemies){ if(e.alive&&!e.awake){ const d=Math.hypot(e.x-P.x,e.y-P.y); if(d<9) e.hear=true; } }
}
function tryFire(){
  if(P.fireCd>0) return;
  if(P.weapon===3&&P.overheatT>0) return;   // gesperrt, kühlt gerade ab
  const w=WEAPONS[P.weapon];
  if(P.ammo<w.cost){ sfx.empty(); P.fireCd=.35; showMsg('Keine Ladung',1200); return; }
  P.ammo-=w.cost; P.fireCd=w.rate; P.recoil=1; P.flash=P.weapon===2?.12:.09;
  if(P.weapon===0){ sfx.pistol(); hitscan(0,12); kick(.16); }
  else if(P.weapon===1){ sfx.shotgun(); for(let i=0;i<7;i++) hitscan((Math.random()-.5)*.2,9); kick(.38); }
  else if(P.weapon===3){
    sfx.auto(); hitscan((Math.random()-.5)*.05,7); kick(.09);
    P.heat=Math.min(1,P.heat+.085);
    if(P.heat>=1){ P.overheatT=1.6; sfx.overheat(); showMsg('Overclock-Gewehr überhitzt — kühlt ab…',1300); kick(.32); }
  }
  else { sfx.melee(); hitscan((Math.random()-.5)*.04,26,1.65); kick(.2); }
  alertNear();
}
/* ---- Feuern für die Titelbild-Demo: identisches Waffengefühl, aber ohne Munitionsverbrauch ---- */
function demoFire(){
  if(P.fireCd>0) return;
  P.fireCd=WEAPONS[0].rate; P.recoil=1; P.flash=.09;
  sfx.pistol(); hitscan(0,12); kick(.16); alertNear();
}
function hitscan(off,dmg,maxRange){
  const a=P.a+off, dx=Math.cos(a), dy=Math.sin(a);
  const wd=rayWallDist(P.x,P.y,dx,dy);
  let best=null, bd=maxRange?Math.min(wd,maxRange):wd;
  for(const e of enemies){
    if(!e.alive) continue;
    const ex=e.x-P.x, ey=e.y-P.y, along=ex*dx+ey*dy;
    if(along<.1||along>=bd) continue;
    const perp=Math.abs(ex*dy-ey*dx);
    if(perp<ETYPES[e.type].rad){ best=e; bd=along; }
  }
  if(best) damageEnemy(best,dmg,a);
  else if(wd<1e8 && (!maxRange||wd<=maxRange)) spawnSpark(P.x+dx*wd,P.y+dy*wd);
}
function damageEnemy(e,dmg,ang){
  e.hp-=dmg; e.flash=.1; hitMarkT=.15; e.awake=true;
  if(e.hp<=0){ e.alive=false; e.bodyT=0; stats.kills++; sfx.kill(Math.hypot(e.x-P.x,e.y-P.y));
    spawnBoom(e.x,e.y,ETYPES[e.type].sc); kick(e.type==='K'?.9:.48);
    if(e.type==='K') showMsg('Kern-Wächter besiegt — das Portal ist offen',3000);
  } else {
    sfx.hit(); kick(.09);
    if(ang!=null){ const kb=ETYPES[e.type].sc>1?.9:1.6; e.stagT=.16; e.stagX=Math.cos(ang)*kb; e.stagY=Math.sin(ang)*kb; }
  }
}
function spawnBoom(x,y,scale){ booms.push({x,y,t:0,life:.5,scale:scale||1}); }
function updateBooms(dt){
  for(let i=booms.length-1;i>=0;i--){ const b=booms[i]; b.t+=dt; if(b.t>=b.life) booms.splice(i,1); }
}
function spawnSpark(x,y){ sparks.push({x,y,t:0,life:.22}); sfx.spark(); }
function updateSparks(dt){
  for(let i=sparks.length-1;i>=0;i--){ const s=sparks[i]; s.t+=dt; if(s.t>=s.life) sparks.splice(i,1); }
}
function spawnShot(x,y,ang,dmg){
  shots.push({x,y,dx:Math.cos(ang),dy:Math.sin(ang),dmg,life:4});
}
function wake(e){ e.awake=true; sfx.alert(Math.hypot(e.x-P.x,e.y-P.y)); }

function updateEnemy(e,dt){
  if(!e.alive){ e.bodyT+=dt; return; }
  const t=ETYPES[e.type];
  e.flash=Math.max(0,e.flash-dt); e.atk=Math.max(0,e.atk-dt); e.cd-=dt; e.strT-=dt;
  if(e.stagT>0){
    e.stagT-=dt;
    tryMove(e,e.stagX*dt,e.stagY*dt,t.rad*.8);
    const decay=Math.max(0,1-dt*7); e.stagX*=decay; e.stagY*=decay;
    return;
  }
  const dx=P.x-e.x, dy=P.y-e.y, dist=Math.hypot(dx,dy)||.001, ux=dx/dist, uy=dy/dist;
  const los=rayWallDist(e.x,e.y,ux,uy)>=dist-.15;
  if(!e.awake){ if((los&&dist<12)||e.hear) wake(e); else return; }
  if(e.strT<=0){ e.strafe=Math.random()<.5?-1:1; e.strT=1+Math.random()*1.5; }

  let mx=0,my=0;
  if(!los||dist>13){
    const tg=flowTarget(e);
    if(tg){ const tx=tg.x-e.x, ty=tg.y-e.y, tl=Math.hypot(tx,ty)||1; mx=tx/tl; my=ty/tl; }
  } else if(e.type==='d'){
    if(dist>5.5){ mx=ux; my=uy; } else if(dist<3){ mx=-ux; my=-uy; } else { mx=-uy*e.strafe; my=ux*e.strafe; }
  } else if(e.type==='r'){
    if(dist>.95){ mx=ux; my=uy; }
  } else {
    if(dist>5){ mx=ux; my=uy; } else if(dist<3){ mx=-ux; my=-uy; } else { mx=-uy*e.strafe; my=ux*e.strafe; }
  }
  const sp=t.spd*(e.type==='K'&&e.hp<t.hp*.5?1.3:1)*dt;
  tryMove(e,mx*sp,my*sp,t.rad*.8);
  for(const o of enemies){                       // Gegner nicht ineinander laufen lassen
    if(o===e||!o.alive) continue;
    const ox=e.x-o.x, oy=e.y-o.y, od=Math.hypot(ox,oy), min=(t.rad+ETYPES[o.type].rad)*.9;
    if(od>0&&od<min) tryMove(e,ox/od*(min-od)*.5,oy/od*(min-od)*.5,t.rad*.8);
  }

  if(e.type==='d' && los && dist<11 && e.cd<=0){
    e.cd=1.3+Math.random()*.9; e.atk=.25; sfx.eshoot(dist);
    spawnShot(e.x,e.y,Math.atan2(dy,dx)+(Math.random()-.5)*.12,7);
  } else if(e.type==='r' && dist<1.1 && e.cd<=0){
    e.cd=1; e.atk=.3; sfx.melee(); hurtPlayer(12);
  } else if(e.type==='K' && los && e.cd<=0){
    const rage=e.hp<t.hp*.5, n=rage?5:3;
    e.cd=rage?1.15:1.7; e.atk=.35; sfx.eshoot(dist);
    const base=Math.atan2(dy,dx);
    for(let i=0;i<n;i++) spawnShot(e.x,e.y,base+(i-(n-1)/2)*.2,9);
  }
}
function updateShots(dt){
  for(let i=shots.length-1;i>=0;i--){
    const s=shots[i];
    s.x+=s.dx*6*dt; s.y+=s.dy*6*dt; s.life-=dt;
    if(s.life<=0){ shots.splice(i,1); continue; }
    if(solidAt(s.x,s.y)){ spawnSpark(s.x,s.y); shots.splice(i,1); continue; }
    if(Math.hypot(s.x-P.x,s.y-P.y)<.32){ hurtPlayer(s.dmg); shots.splice(i,1); }
  }
}
function updatePickups(){
  for(const p of pickups){
    if(p.taken) continue;
    if(Math.hypot(p.x-P.x,p.y-P.y)>.55) continue;
    if(p.kind==='h'){ if(P.hp>=100) continue; P.hp=Math.min(100,P.hp+25); healT=.35; showMsg('AXIOM-Zelle: Integrität +25',1400); sfx.pickup(); }
    else if(p.kind==='a'){ if(P.ammo>=99) continue; P.ammo=Math.min(99,P.ammo+10); showMsg('Ladung +10',1200); sfx.pickup(); }
    else if(p.kind==='m'){ stats.shards++; showMsg('MOGC-Splitter gefunden',1200); sfx.pickup(); }
    else if(p.kind==='s'){ P.hasSG=true; P.ammo=Math.min(99,P.ammo+8); setWeapon(1); showMsg('Streu-Kanone! (Taste 1/2 wechselt)',2600); sfx.gun(); }
    else if(p.kind==='w'){ P.hasAuto=true; P.ammo=Math.min(99,P.ammo+14); setWeapon(3); showMsg('Overclock-Gewehr! (Taste 4 wechselt)',2600); sfx.gun(); }
    p.taken=true;
  }
}
function exitLocked(){ return lvl.lock==='boss' && enemies.some(e=>e.type==='K'&&e.alive); }
let lockedMsgT=0;
function checkExit(dt){
  lockedMsgT-=dt;
  if(!exitCell) return;
  const cx=exitCell.x+.5, cy=exitCell.y+.5;
  if(Math.abs(P.x-cx)<1.15 && Math.abs(P.y-cy)<1.15 && Math.hypot(P.x-cx,P.y-cy)<1.1){
    if(exitLocked()){ if(lockedMsgT<=0){ showMsg('Portal gesperrt — Kern-Wächter besiegen',2000); lockedMsgT=2.5; } }
    else finishLevel();
  }

function finishLevel(){
  state='levelwin'; releaseLock(); sfx.win();
  run.kills+=stats.kills; run.shards+=stats.shards; run.time+=stats.time; run.foes+=totals.foes; run.shardsMax+=totals.shards;

    try{ best=+localStorage.getItem('orca_breach_best')||0; if(!best||run.time<best){ localStorage.setItem('orca_breach_best',String(run.time|0)); best=run.time|0; } }catch(e){}
    st.push(['Gesamtzeit',fmt(run.time)]); st.push(['Gesamt-Splitter',run.shards+' / '+run.shardsMax]);
    if(best) st.push(['Bestzeit (dieser Browser)',fmt(best)]);
    showOverlay({title:'NEXUS ist wieder online',text:'Der Kern ist gesichert. Das war die Testversion — Feedback willkommen.',stats:st,
      buttons:[{label:'Nochmal von vorn',primary:true,fn:()=>{ newRun(); startLevel(0,true); }},{label:'Zum Titel',fn:showTitle}]});
  }

const FADE_MS=260;
let fadeBusy=false;
function fadeTransition(cb){
  const el=$('fade');
  if(fadeBusy){ cb(); return; } // Sicherheitsnetz, falls schon mitten im Fade
  fadeBusy=true;
  el.classList.add('on');
  setTimeout(()=>{
    cb();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.classList.remove('on');
      setTimeout(()=>{ fadeBusy=false; },FADE_MS);
    }));
  },FADE_MS);
}

/* ============================================================
   Rendering
   ============================================================ */
let dirX=1,dirY=0,planeX=0,planeY=PLANE_LEN, flashAdd=0, horizon=HALF;

const skyColBuf=new Int32Array(W);
function computeSkyCols(){
  for(let x=0;x<W;x++){
    const camX=2*x/W-1, rdx=dirX+planeX*camX, rdy=dirY+planeY*camX;
    let ang=Math.atan2(rdy,rdx); if(ang<0) ang+=Math.PI*2;
    let sx=((ang/(Math.PI*2))*SKY_W)|0; if(sx>=SKY_W) sx=SKY_W-1; if(sx<0) sx=0;
    skyColBuf[x]=sx;
  }
}
function renderFloorCeil(){
  const rx0=dirX-planeX, ry0=dirY-planeY, rx1=dirX+planeX, ry1=dirY+planeY;
  if(curOutdoor) computeSkyCols();
  for(let y=0;y<H;y++){
    const p=y-horizon, ap=Math.abs(p), base=y*W;
    if(curOutdoor && p<0){
      // Himmel: reine Winkelprojektion (Doom-Sky-Hack), kein Perspektiv-Floorcast, kein Nebel
      let sy=(-p)|0; if(sy>=SKY_H) sy=SKY_H-1; if(sy<0) sy=0;
      const row=sy*SKY_W;
      for(let x=0;x<W;x++) buf[base+x]=curSky[row+skyColBuf[x]];
      continue;
    }
    if(ap<.6){ for(let x=0;x<W;x++) buf[base+x]=FOGC; continue; }
    const rd=(.5*PROJ)/ap;
    const f=clamp(((1-rd/MAXD)*256|0)+flashAdd,0,256);
    if(f<=2){ for(let x=0;x<W;x++) buf[base+x]=FOGC; continue; }
    const stx=rd*(rx1-rx0)/W, sty=rd*(ry1-ry0)/W;
    let fx=P.x+rd*rx0, fy=P.y+rd*ry0;
    const tex=p>0?curFloor:curCeil;
    for(let x=0;x<W;x++){
      buf[base+x]=shade(tex[(((fy*64)|0)&63)<<6|(((fx*64)|0)&63)],f);
      fx+=stx; fy+=sty;
    }
  }
}
function renderWalls(time){
  const locked_=exitLocked();
  for(let x=0;x<W;x++){
    const camX=2*x/W-1, rdx=dirX+planeX*camX, rdy=dirY+planeY*camX;
    let mx=P.x|0, my=P.y|0;
    const ddx=rdx===0?1e30:Math.abs(1/rdx), ddy=rdy===0?1e30:Math.abs(1/rdy);
    let sx,sy,sdx,sdy;
    if(rdx<0){ sx=-1; sdx=(P.x-mx)*ddx; } else { sx=1; sdx=(mx+1-P.x)*ddx; }
    if(rdy<0){ sy=-1; sdy=(P.y-my)*ddy; } else { sy=1; sdy=(my+1-P.y)*ddy; }
    let side=0, hit=0;
    for(let i=0;i<90;i++){
      if(sdx<sdy){ sdx+=ddx; mx+=sx; side=0; } else { sdy+=ddy; my+=sy; side=1; }
      if(mx<0||my<0||mx>=MW||my>=MH){ hit=1; break; }
      hit=grid[my*MW+mx]; if(hit) break;
    }
    if(!hit){ zBuf[x]=1e9; continue; }
    const perp=Math.max(.05,side===0?sdx-ddx:sdy-ddy);
    zBuf[x]=perp;
    let wallX=side===0?P.y+perp*rdy:P.x+perp*rdx; wallX-=Math.floor(wallX);
    let tx=(wallX*64)|0;
    if((side===0&&rdx>0)||(side===1&&rdy<0)) tx=63-tx;
    const lh=PROJ/perp, top=horizon-lh/2;
    let f=((1-perp/MAXD)*256)|0; if(side===1) f=(f*.74)|0;
    f=clamp(f+flashAdd,0,256);
    let tex=curWall[hit]||curWall[1];
    if(hit===4){ tex=locked_?texExitLocked:texExit; f=clamp(170+((Math.sin(time*4)+1)*43)|0,0,256); }
    const y0=Math.max(0,top|0), y1=Math.min(H-1,(top+lh)|0);
    const step=64/lh; let tp=(y0-top)*step;
    for(let y=y0;y<=y1;y++){
      buf[y*W+x]=shade(tex[((tp|0)&63)<<6|tx],f); tp+=step;
    }
  }
}
const drawList=[];
function renderSprites(time){
  drawList.length=0;
  for(const e of enemies){
    const t=ETYPES[e.type], set=SPR[e.type];
    if(e.alive) drawList.push({x:e.x,y:e.y,tex:e.atk>0?set.atk:set.idle,sc:t.sc,vo:t.vo+(e.type==='d'?Math.sin(time*3+e.x)*.03:0),flash:e.flash});
    else drawList.push({x:e.x,y:e.y,tex:set.dead,sc:t.sc*.75,vo:0,flash:0});
  }
  for(const p of pickups){ if(p.taken) continue;
    drawList.push({x:p.x,y:p.y,tex:PICKUP_SPR[p.kind],sc:.36,vo:.02+(Math.sin(time*3+p.ph)+1)*.03,flash:0}); }
  for(const s of shots) drawList.push({x:s.x,y:s.y,tex:SPR_BALL,sc:.24,vo:.38,flash:0,glow:true});
  for(const b of booms){
    const k=Math.min(BOOM_FRAMES.length-1,(b.t/b.life*BOOM_FRAMES.length)|0);
    const grow=.55+(b.t/b.life)*.9;
    drawList.push({x:b.x,y:b.y,tex:BOOM_FRAMES[k],sc:(b.scale||1)*grow,vo:.16,flash:0,glow:true});
  }
  for(const sp of sparks){
    const k=Math.min(SPARK_FRAMES.length-1,(sp.t/sp.life*SPARK_FRAMES.length)|0);
    const shrink=1-(sp.t/sp.life)*.3;
    drawList.push({x:sp.x,y:sp.y,tex:SPARK_FRAMES[k],sc:.24*shrink,vo:.26,flash:0,glow:true});
  }
  for(const d of drawList){ const dx=d.x-P.x, dy=d.y-P.y; d.d=dx*dx+dy*dy; }
  drawList.sort((a,b)=>b.d-a.d);

  const inv=1/(planeX*dirY-dirX*planeY);
  for(const s of drawList){
    const dx=s.x-P.x, dy=s.y-P.y;
    const tX=inv*(dirY*dx-dirX*dy), tY=inv*(-planeY*dx+planeX*dy);
    if(tY<.12) continue;
    const size=PROJ*s.sc/tY, sxc=(W/2)*(1+tX/tY);
    const bottom=horizon+(.5-s.vo)*PROJ/tY, top=bottom-size, x0=sxc-size/2;
    let f=s.glow?256:clamp(((1-tY/MAXD)*256|0)+flashAdd+50,40,256);
    const xa=Math.max(0,x0|0), xb=Math.min(W-1,(x0+size)|0);
    const ya=Math.max(0,top|0), yb=Math.min(H-1,bottom|0);
    const ss=64/size, tex=s.tex, fl=s.flash>0;
    for(let x=xa;x<=xb;x++){
      if(tY>=zBuf[x]) continue;
      const tx=((x-x0)*ss)|0; if(tx<0||tx>63) continue;
      for(let y=ya;y<=yb;y++){
        const ty=((y-top)*ss)|0;
        const c=tex[(ty<<6)|tx]; if(c>>>24===0) continue;
        buf[y*W+x]=fl?0xFFFFFFFF:shade(c,f);
      }
    }
  }
}

const miniCv=$('mini'), mctx=miniCv.getContext('2d');
const MS=4;
function buildMini(){
  miniCv.width=MW*MS; miniCv.height=MH*MS;
  const c=document.createElement('canvas'); c.width=MW*MS; c.height=MH*MS;
  const g=c.getContext('2d');
  const col=['','#1f2c3f','#26364b','#4a3a1a','#35E4FF'];
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){ const v=grid[y*MW+x]; if(v){ g.fillStyle=col[v]; g.fillRect(x*MS,y*MS,MS,MS); } }
  miniStatic=c;
}
function drawMini(){
  if(lvl.fog){ drawFogMini(); return; }
  mctx.clearRect(0,0,miniCv.width,miniCv.height);
  mctx.drawImage(miniStatic,0,0);
  if(exitLocked()&&exitCell){ mctx.fillStyle='#FF3D6E'; mctx.fillRect(exitCell.x*MS,exitCell.y*MS,MS,MS); }
  const px_=P.x*MS, py_=P.y*MS;
  mctx.fillStyle='#FFAE3D'; mctx.beginPath(); mctx.arc(px_,py_,2,0,7); mctx.fill();
  mctx.strokeStyle='#FFAE3D'; mctx.lineWidth=1; mctx.beginPath(); mctx.moveTo(px_,py_); mctx.lineTo(px_+Math.cos(P.a)*6,py_+Math.sin(P.a)*6); mctx.stroke();
}
function drawFogMini(){
  mctx.clearRect(0,0,miniCv.width,miniCv.height);
  const col=['','#1f2c3f','#26364b','#4a3a1a','#35E4FF'];
  for(let y=0;y<MH;y++) for(let x=0;x<MW;x++){
    const k=y*MW+x; if(!seen[k]) continue;
    const v=grid[k];
    mctx.globalAlpha=visible[k]?1:0.42;
    mctx.fillStyle=v?col[v]:'#141f2c';
    mctx.fillRect(x*MS,y*MS,MS,MS);
  }
  mctx.globalAlpha=1;
  if(exitLocked()&&exitCell&&seen[exitCell.y*MW+exitCell.x]){ mctx.fillStyle='#FF3D6E'; mctx.fillRect(exitCell.x*MS,exitCell.y*MS,MS,MS); }
  const px_=P.x*MS, py_=P.y*MS;
  mctx.fillStyle='#FFAE3D'; mctx.beginPath(); mctx.arc(px_,py_,2,0,7); mctx.fill();
  mctx.strokeStyle='#FFAE3D'; mctx.lineWidth=1; mctx.beginPath(); mctx.moveTo(px_,py_); mctx.lineTo(px_+Math.cos(P.a)*6,py_+Math.sin(P.a)*6); mctx.stroke();
}

let demoLvIdx=0, demoTarget=null, demoFlowMap=null, demoFlowKey=null, demoIdleT=0, demoAimT=0, demoStuckT=0;
const DEMO_DEPTHS=[3,6,9,12]; // je ein Boss-Tiefe-Sprung pro Biome: Anlage, Schlucht, Wüste, Dschungel
function demoPickTarget(){
  if(demoTarget && !demoTarget.alive) demoTarget=null;   // Ziel tot -> neu wählen
  if(!demoTarget){
    let best=null, bd=1e9;
    for(const e of enemies){
      if(!e.alive) continue;
      const d=(e.x-P.x)*(e.x-P.x)+(e.y-P.y)*(e.y-P.y);
      if(d<bd){ bd=d; best=e; }
    }
    demoTarget=best;   // am gewählten Gegner festhalten, statt jeden Frame neu zu wählen (verhindert Zappeln)
  }
  if(demoTarget) return {x:demoTarget.x,y:demoTarget.y,enemy:demoTarget};
  if(exitCell) return {x:exitCell.x+.5,y:exitCell.y+.5,enemy:null};
  return null;
}

    parseLevel(generateProceduralLevel(DEMO_DEPTHS[demoLvIdx])); P.a=lvl.angle; P.weapon=0;
    demoTarget=null; demoFlowMap=null; demoFlowKey=null; demoIdleT=0; demoAimT=0; demoStuckT=0;
    setAmbient(curBiome); lastT=performance.now();
  });
}
function updateDemo(dt){
  if(fadeBusy) return;   // während des Szenenwechsels nichts bewegen
  for(const e of enemies) updateEnemy(e,dt);
  updateShots(dt); updateBooms(dt); updateSparks(dt);
  P.fireCd=Math.max(0,P.fireCd-dt); P.recoil=Math.max(0,P.recoil-dt*5); P.flash=Math.max(0,P.flash-dt);
  hitMarkT=Math.max(0,hitMarkT-dt); shakeAmt=Math.max(0,shakeAmt-dt*3.4);
  flowT-=dt; if(flowT<=0){ computeFlow(); flowT=.3; }

  const target=demoPickTarget();
  const foesLeft=enemies.some(e=>e.alive);
  if(!target){
    P.a+=dt*.12; P.moving=Math.max(0,P.moving-dt*8);
  } else {
    const dx=target.x-P.x, dy=target.y-P.y, dist=Math.hypot(dx,dy)||.001;
    const aimAng=Math.atan2(dy,dx);
    const los=target.enemy && rayWallDist(P.x,P.y,dx/dist,dy/dist)>=dist-.2;
    let wantMove=true;
    if(los){
      demoAimT=.6;
      const da=((aimAng-P.a+Math.PI*3)%(Math.PI*2))-Math.PI;
      P.a+=clamp(da,-3.4*dt,3.4*dt);
      wantMove=dist>3.1;
      if(Math.abs(da)<.11) demoFire();
    } else {
      demoAimT=Math.max(0,demoAimT-dt);
      const tk=(target.x|0)+','+(target.y|0);
      if(tk!==demoFlowKey){ demoFlowMap=computeFlowFromCell(target.x|0,target.y|0); demoFlowKey=tk; }
      const nx=fieldTarget(P.x,P.y,demoFlowMap);
      if(nx){
        const moveAng=Math.atan2(nx.y-P.y,nx.x-P.x);
        const da=((moveAng-P.a+Math.PI*3)%(Math.PI*2))-Math.PI;
        P.a+=clamp(da,-2.6*dt,2.6*dt);
      } else wantMove=false;
    }
    if(wantMove){
      const sp=2.3*dt;
      const mv=tryMove(P,Math.cos(P.a)*sp,Math.sin(P.a)*sp,.22);
      P.moving=Math.min(1,P.moving+dt*8); P.bob+=mv*2.6;
      stepPhase=Math.floor(P.bob/Math.PI);
      if(mv<sp*.15) demoStuckT+=dt; else demoStuckT=0;
    } else { P.moving=Math.max(0,P.moving-dt*8); demoStuckT=0; }
    if(demoStuckT>2){   // Bewegung blockiert (z.B. Engstelle/Ecke) -> Ziel fallen lassen und neu ausrichten
      demoStuckT=0; demoTarget=null; demoFlowMap=null; demoFlowKey=null;
      P.a+=(Math.random()<.5?-1:1)*(Math.PI*.5+Math.random()*Math.PI*.5);
    }
  }

  if(!foesLeft){
    demoIdleT+=dt;
    const atExit=exitCell&&Math.hypot(P.x-(exitCell.x+.5),P.y-(exitCell.y+.5))<1.1;
    if(!exitCell||atExit||demoIdleT>5) nextDemoScene();
  } else demoIdleT=0;
}

/* ============================================================
   Hauptschleife
   ============================================================ */
let lastT=performance.now();
let stepPhase=0;
function update(dt){
  stats.time+=dt;
  // Bewegung
  const turn=(keys.ArrowRight||keys.KeyE?1:0)-(keys.ArrowLeft||keys.KeyQ?1:0);
  P.a+=turn*2.4*dt;
  const fwd=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0);
  const str=(keys.KeyD?1:0)-(keys.KeyA?1:0);
  let vx=Math.cos(P.a)*fwd+(-Math.sin(P.a))*str, vy=Math.sin(P.a)*fwd+Math.cos(P.a)*str;
  const vl=Math.hypot(vx,vy);
  if(vl>0){
    const sp=(keys.ShiftLeft||keys.ShiftRight?4.8:3.2)*dt;
    const mv=tryMove(P,vx/vl*sp,vy/vl*sp,.22);
    P.moving=Math.min(1,P.moving+dt*8); P.bob+=mv*2.6;
    const stepIdx=Math.floor(P.bob/Math.PI);
    if(stepIdx>stepPhase){ stepPhase=stepIdx; sfx.step(curBiome); }
  } else P.moving=Math.max(0,P.moving-dt*8);
  // Feuern
  P.fireCd=Math.max(0,P.fireCd-dt); P.recoil=Math.max(0,P.recoil-dt*5); P.flash=Math.max(0,P.flash-dt);
  if(P.overheatT>0){ P.overheatT=Math.max(0,P.overheatT-dt); if(P.overheatT===0) P.heat=0; }
  else P.heat=Math.max(0,P.heat-dt*.32);
  if(keys.Space||mouseDown) tryFire();
  // Welt
  if(lvl.fog) updateFog();
  flowT-=dt; if(flowT<=0){ computeFlow(); flowT=.3; }
  for(const e of enemies) updateEnemy(e,dt);
  updateShots(dt); updatePickups(); updateBooms(dt); updateSparks(dt); checkExit(dt);
  ambientTick(dt);
  // Effekte
  hurtT=Math.max(0,hurtT-dt); healT=Math.max(0,healT-dt); hitMarkT=Math.max(0,hitMarkT-dt);
  shakeAmt=Math.max(0,shakeAmt-dt*3.4);
  $('hurt').style.opacity=Math.min(1,hurtT*2.4); $('heal').style.opacity=Math.min(1,healT*2.4);
  $('xh').classList.toggle('hit',hitMarkT>0);
  updateHeatUI();
  if(msgT>0){ msgT-=dt; if(msgT<=0) $('msg').classList.remove('on'); }
}
function applyShake(){
  if(shakeAmt>.003){
    const m=shakeAmt*shakeAmt;
    const ox=(Math.random()*2-1)*m*2.2, oy=(Math.random()*2-1)*m*2.2;
    cv.style.transform='translate('+ox.toFixed(2)+'cqw,'+oy.toFixed(2)+'cqw)';
  } else if(cv.style.transform){ cv.style.transform=''; }
}
function frame(now){
  const dt=Math.min(.05,(now-lastT)/1000); lastT=now;
  if(state==='play') update(dt);
  else if(state==='title'){ updateDemo(dt); }
  else if(state==='dead'||state==='levelwin'||state==='gamewin'){ hurtT=Math.max(0,hurtT-dt); shakeAmt=Math.max(0,shakeAmt-dt*3.4); $('hurt').style.opacity=state==='dead'?.55:0; }
  if(lvl){ render(now/1000); if(state==='play'||state==='pause') drawMini(); updateHud(); applyShake(); }
  requestAnimationFrame(frame);
}

/* ---- Start ---- */
drawFace(0);
showTitle();          // parst Sektor 1 selbst als Kulisse für den Titelbildschirm
requestAnimationFrame(frame);

window.__breach={P,get state(){return state;},get enemies(){return enemies;},get pickups(){return pickups;},startLevel,newRun,stats,get lvIdx(){return lvIdx;},get biome(){return curBiome;},get depth(){return lvl&&lvl.depth;},keys};
})();
</script>

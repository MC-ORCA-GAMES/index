  }
  api.paint=function(){
    const R=S.rows;
    for(let i=0;i<3;i++){
      const r=R[i], el=dom.rows[i];
      hset('ev'+i+'v',!!r,v=>{ el.d.style.display=v?'block':'none'; });
      if(!r) continue;
      hset('ev'+i+'t',r.t,v=>{ el.b.textContent=v; }); hset('ev'+i+'s',r.s,v=>{ el.i.textContent=v; });
      hset('ev'+i+'c',r.c,v=>{ if(el.d.style.setProperty) el.d.style.setProperty('--c',v); else el.d.style['--c']=v; });
      hset('ev'+i+'p',Math.round(clamp(r.p,0,1)*100),v=>{ el.u.style.width=v+'%'; });
      hset('ev'+i+'w',!!r.w,v=>{ el.d.classList.toggle('warn',v); });
    }
  };
  api.tick=function(dt){
    if(!dom) return;
    const T=stats.time, kf=kill(), d=lvl.depth, rm=dom.stage.classList.contains('rm');
    let dark=0, tint='';
    for(const ev of S.list){
      if(ev.st>=2) continue;
      switch(ev.id){
        case 'alarm':
          if(ev.st===0){ if(ready(ev)&&(T>=ev.at||AI.stats.alarms>ev.a0)) begin(ev,'ALARM — Sicherheitssystem ausgelöst! Durchhalten.','evAlarm'); }
          else { ev.t+=dt; tint='alarm'; ev.sir-=dt; ev.nz-=dt;
            if(ev.sir<=0){ ev.sir=1.4; sfx.evAlarm(); }
            if(ev.nz<=0){ ev.nz=3; AI.noise(P.x,P.y,26); }
            if(ev.t>=ev.dur){ const cr=12+2*d; pay(cr); drop(P.x,P.y,['h','a']); done(ev,'Alarm beendet — +'+cr+' Credits'); tint=''; } }
          break;
        case 'lockdown':
          if(ev.st===0){ if(ready(ev)&&kf>=ev.kf&&totals.foes-stats.kills>=1){
            const g=wave(Math.max(3,Math.min(7,3+(((d-3)/3)|0))),false,'guard'); ev.g=g;
            if(!g.length){ ev.st=2; break; }
            api.stats.started++; ev.st=1; sfx.evAmbush(); FX.shake=Math.max(FX.shake,.4); showMsg('LOCKDOWN — Portal versiegelt! Sicherheitseinheiten ausschalten',3200); } }
          else if(!ev.g.some(e=>e.alive)){ const cr=20+3*d; pay(cr); drop(P.x,P.y,['h','a']); done(ev,'Lockdown aufgehoben — +'+cr+' Credits'); sfx.evOK(); }
          break;
        case 'blackout':
          if(ev.st===0){ if(ready(ev)&&T>=ev.at) { begin(ev,'STROMAUSFALL — Notbeleuchtung ausgefallen','evPower'); } }
          else { ev.t+=dt; const left=ev.dur-ev.t, fl=(ev.t<1.6||left<1.2)&&!rm;
            dark=fl?(Math.sin(ev.t*38)>0?.9:.25):1;
            if(ev.t>=ev.dur){ done(ev,'Notstrom wiederhergestellt'); sfx.evOn(); dark=0; } }
          break;
        case 'meltdown':
          if(ev.st===0){ if(ready(ev)&&(kf>=ev.kf||T>=ev.at)){ ev.lim=Math.max(45,Math.min(150,Math.round(24+exitDist(flow)*.55))); begin(ev,'REAKTOR-KERN INSTABIL — Zum Portal! '+ev.lim+' s','evBoom'); FX.shake=Math.max(FX.shake,.6); } }
          else { ev.t+=dt; tint='melt'; const left=ev.lim-ev.t;

          else if(Math.hypot(P.x-ev.x,P.y-ev.y)<.85){
            ev.pod.taken=true; P.hp=Math.min(100,P.hp+40); P.ammo=Math.min(99,P.ammo+18);
            if(P.shieldMax>0) P.shield=Math.max(P.shield,P.shieldMax); if(P.armorMax>0) P.armor=Math.min(P.armorMax,P.armor+15);

    if(Math.abs(ta-dom.ta)>.008){ dom.ta=ta; dom.box.style.setProperty('--ta',ta.toFixed(3)); }
    if(Math.abs(po-dom.po)>.02){ dom.po=po; dom.box.style.setProperty('--po',po.toFixed(2)); }
    const fl=S.flash>0; if(fl!==dom.fl){ dom.fl=fl; dom.box.classList.toggle('fl',fl); }
  }
  /* Nebel/Sichtweite je Biom (shade() und Boden/Wand/Sprites lesen FR/FG/FB/FOGC/MAXD) */
  function apply(id){
    const b=BD[id]||BD.facility; FR=b.fog[0]; FG=b.fog[1]; FB=b.fog[2];
    FOGC=(0xFF000000|(FB<<16)|(FG<<8)|FR)>>>0; S.baseD=b.maxd; MAXD=b.maxd;
  }

  /* ---- Platzierung ---- */
  function cells(df,minD,ar){
    const out=[];
    for(let y=2;y<MH-2;y++) for(let x=2;x<MW-2;x++){
      const k=y*MW+x; if(grid[k]!==0||df[k]<minD||ar.has(k)) continue;
      if(grid[k+1]||grid[k-1]||grid[k+MW]||grid[k-MW]) continue;
      if(exitCell&&Math.abs(x-exitCell.x)+Math.abs(y-exitCell.y)<4) continue;
      if(stairsCell&&Math.abs(x-stairsCell.x)+Math.abs(y-stairsCell.y)<4) continue;
      out.push(k);
    }
    return out;
  }
  function choose(list,n,sep,used){
    const res=[];
    for(let t=0;t<n*25&&res.length<n&&list.length;t++){
      const k=list[(Math.random()*list.length)|0], x=(k%MW)+.5, y=((k/MW)|0)+.5;
      let ok=true; for(const u of used) if(Math.hypot(u[0]-x,u[1]-y)<sep){ ok=false; break; }
      if(ok){ used.push([x,y]); res.push([x,y]); }
    }
    return res;
  }

  api.reset=function(){ api.seen={}; api.stats={traps:0,hazards:0,pickups:0,storms:0,rocks:0,surges:0,spores:0}; };
  api.setup=function(){
    S=fresh(); ensureDom();
    const id=(lvl&&lvl.biome)||'facility'; S.id=id; apply(id);
    if(!lvl||!lvl.procedural){ paint(id,true); return; }
    const b=BD[id]||BD.facility, d=lvl.depth||1, boss=lvl.lock==='boss';
    S.on=true; S.depth=d; S.boss=boss;
    const ar=new Set(); if(lvl.arena) for(const c of lvl.arena.cells) ar.add(c[1]*MW+c[0]);
    const df=computeFlowFromCell(P.x|0,P.y|0), used=[], list=cells(df,7,ar);
    if(d>=2&&b.trap){
      let n=Math.min(11,2+Math.floor(d*.9)); if(boss) n=Math.ceil(n/2);
      for(const [x,y] of choose(list,n,4,used)) S.traps.push({k:b.trap,x,y,t:Math.random()*3.4,f:0,hit:true,rt:0});
    }
    const kinds=Math.min(5,2+((d-1)/4|0));
    for(const [x,y] of choose(list,kinds,6,used)) pickups.push({kind:b.pk,x,y,taken:false,ph:Math.random()*6});
    if(d>=2&&!boss&&b.haz){ S.haz=b.haz; S.hz.t=rnd(14,26); }
    // Sektor-/Biomwechsel: Banner + kleine Belohnung (einmal je Tiefe und Lauf)
    const first=!api.seen['b:'+id], change=d>1&&(d-1)%3===0;
    if(!api.seen['n:'+d]&&(first||change)) S.ban={id,d,tier:Math.floor((d-1)/3)};
    paint(id,true);
  };
  function showBanner(B){
    const b=BD[B.id]||BD.facility, cr=15+10*B.tier; api.seen['b:'+B.id]=1; api.seen['n:'+B.d]=1;
    Save.data.credits+=cr; Save.markDirty(); P.armor=Math.min(P.armorMax,P.armor+10);
    const T=dom.t; T[0].textContent='SEKTORWECHSEL · BIOM '+(B.tier+1); T[1].textContent=b.name; T[2].textContent=b.tag;
    T[3].textContent=(b.trap?'Gefahren: '+TN[b.trap]+' · '+HN[b.haz]:''); T[4].textContent='+'+cr+' Credits';
    dom.ban.classList.remove('on'); void dom.ban.offsetWidth; dom.ban.classList.add('on'); sfx.bmBan();
  }

  /* ---- Gefahren-Helfer ---- */
  function spawnRock(){
    for(let i=0;i<12;i++){
      const a=Math.random()*6.283, r=Math.random()<.35?rnd(.8,2.2):rnd(2,6.5), x=P.x+Math.cos(a)*r, y=P.y+Math.sin(a)*r, xi=x|0, yi=y|0;
      if(xi<1||yi<1||xi>=MW-1||yi>=MH-1||grid[yi*MW+xi]!==0) continue;
      S.rocks.push({x,y,t:0,d:1.35,w:false}); return true;
    }
    return false;
  }
  function spawnCloud(){
    for(let i=0;i<12;i++){
      const a=Math.random()*6.283, r=rnd(2.5,7), x=P.x+Math.cos(a)*r, y=P.y+Math.sin(a)*r, xi=x|0, yi=y|0;
      if(xi<1||yi<1||xi>=MW-1||yi>=MH-1||grid[yi*MW+xi]!==0) continue;
      S.clouds.push({x,y,t:0,life:13,r:1.7,rr:0}); api.stats.spores++; return true;
    }
    return false;
  }

  api.tick=function(dt){
    if(!S.on){ return; }
    const d=S.depth, H=S.hz, V=Stats.val;
    if(S.ban&&state==='play'&&stats.time>.7){ showBanner(S.ban); S.ban=null; }
    if(S.flash>0) S.flash-=dt;
    // Fallen
    S.sand=false; if(P.dashT>0) S.rootT=0; else if(S.rootT>0) S.rootT-=dt;
    for(const T of S.traps){
      const dx=P.x-T.x, dy=P.y-T.y, dist=Math.hypot(dx,dy);
      if(T.k==='arc'){
        if(!(S.haz==='surge'&&H.st===1&&T.t>=2.0&&T.t<2.8)) T.t+=dt;      // Ueberspannung haelt die Warnung bis zur Entladung
        if(T.t>=3.4){ T.t-=3.4; T.hit=false; }
        const f=T.t<2.0?0:T.t<2.8?1:2;
        if(f!==T.f){ T.f=f;
          if(f===1&&dist<14) sfx.bmWarn(near(dist));
          if(f===2){ if(dist<14) sfx.bmZap(near(dist));
            if(!T.hit){ T.hit=true; if(dist<.85){ hurtPlayer(10+d*.9); P.energy=Math.max(0,P.energy-20); api.stats.traps++; tip('arc'); } } }
        }
      } else if(T.k==='vent'){
        T.t+=dt; if(T.t>=4.2){ T.t-=4.2; T.hit=false; }
        const f=T.t<2.7?0:T.t<3.5?1:2;
        if(f!==T.f){ T.f=f;
          if(f===1&&dist<14) sfx.bmHiss(near(dist)*.5);
          if(f===2){ if(dist<14) sfx.bmHiss(near(dist));
            if(!T.hit){ T.hit=true; if(dist<.95){ hurtPlayer(9+d*.8); const ux=dist>.05?dx/dist:1, uy=dist>.05?dy/dist:0;
              for(let i=0;i<4;i++) tryMove(P,ux*.35,uy*.35,.22); api.stats.traps++; tip('vent'); } } }
        }
      } else if(T.k==='sand'){
        if(dist<1.05){ S.sand=true; tip('sand'); }
      } else if(T.k==='snare'){
        if(T.f===0){ if(dist<.7&&P.dashT<=0){ S.rootT=1.3; T.f=1; T.rt=12; AI.noise(T.x,T.y,6); sfx.bmRoot(); api.stats.traps++; tip('snare'); } }
        else { T.rt-=dt; if(T.rt<=0) T.f=0; }
      }
    }
    // Gefahren (nicht auf Boss-Ebenen)
    if(S.haz){
      const hz=S.haz; H.t-=dt;
      if(hz==='surge'){
        if(H.st===0&&H.t<=0){ H.st=1; H.t=1.1; S.flash=1.1; showMsg(TIP.surge,1800); sfx.bmSurge(); api.stats.hazards++; api.stats.surges++;
          for(const T of S.traps) if(T.k==='arc') T.t=2.0; }
        else if(H.st===1&&H.t<=0){ H.st=0; H.t=Math.max(16,rnd(26,42)-d*.8); P.energy=Math.max(0,P.energy-P.energyMax*.2); kick(.3);
          for(const T of S.traps) if(T.k==='arc'){ T.t=2.8; T.hit=false; } }
      } else if(hz==='rocks'){
        if(H.t<=0){ const n=d>=9?2:1; for(let i=0;i<n;i++) spawnRock(); tip('rocks'); H.t=Math.max(5.5,rnd(9,14)-d*.35); }
      } else if(hz==='storm'){
        if(H.st===0){ if(H.t<=0){ H.st=1; H.dur=rnd(13,19); H.t=H.dur; api.stats.storms++; api.stats.hazards++; showMsg('SANDSTURM — '+TIP.storm.split('— ')[1],2600); } }
        else { H.s=Math.max(0,Math.min(1,H.t/2.5,(H.dur-H.t)/2.5)); H.wt-=dt; if(H.wt<=0){ H.wt=.7; noise(.6,.07*H.s,1000); }
          if(H.t<=0){ H.st=0; H.s=0; H.t=Math.max(24,rnd(38,65)-d*1.2); } }
      } else if(hz==='spores'){
        if(H.t<=0){ H.t=rnd(8,13); if(S.clouds.length<3) spawnCloud(); }
      }
    }
    // Felsen
    for(let i=S.rocks.length-1;i>=0;i--){
      const r=S.rocks[i]; r.t+=dt; const dd=Math.hypot(r.x-P.x,r.y-P.y);
      if(!r.w&&r.t>.6){ r.w=true; if(dd<16) sfx.bmWarn(near(dd)); }
      if(r.t<r.d) continue;
      S.rocks.splice(i,1); spawnBoom(r.x,r.y,.9); api.stats.rocks++;
      if(dd<18) sfx.bmRock(near(dd)); if(dd<8) kick(.1+.3*(1-dd/8));
      if(dd<1.15){ hurtPlayer(14+d*.9); api.stats.hazards++; }
      for(const e of enemies) if(e.alive&&e.type!=='K'&&Math.hypot(e.x-r.x,e.y-r.y)<1.15) damageEnemy(e,26+d*1.5,0,false,true);
    }
    // Sporenwolken + Gift (toetet nie: bleibt bei 1 Integritaet, sperrt aber die Regeneration)
    for(let i=S.clouds.length-1;i>=0;i--){
      const c=S.clouds[i]; c.t+=dt; if(c.t>=c.life){ S.clouds.splice(i,1); continue; }
      c.rr=c.r*Math.min(1,c.t/1.5)*(c.life-c.t<1.5?(c.life-c.t)/1.5:1);
      if(Math.hypot(c.x-P.x,c.y-P.y)<c.rr){ if(S.poisonT<=0) tip('spores'); S.poisonT=4.5; }
    }
    if(S.poisonT>0){
      S.poisonT-=dt; S.pt-=dt;
      if(S.pt<=0){ S.pt=1; if(P.hp>1){ P.hp=Math.max(1,P.hp-(1+((d/6)|0))); FX.hurt=Math.max(FX.hurt,.2); P.hpT=V.hpRegenDelay; sfx.bmSpore(); api.stats.hazards++; } }
    }
    // Sicht (Sandsturm) + Atmosphaere
    const md=S.baseD*(1-.42*H.s); if(Math.abs(md-MAXD)>.05) MAXD=md;
    paint(S.id,false);
  };

  /* ---- Anbindung ---- */
  api.speedMul=()=>S.rootT>0?.12:(S.sand?.5:1);
  api.sightMul=()=>1-.3*S.hz.s;
  api.eliteMul=()=>(BD[curBiome]||BD.facility).em||1;
  api.pickElite=function(pool){
    const w=(BD[curBiome]||BD.facility).ew; let tot=0; const ws=pool.map(id=>{ const v=w[id]||1; tot+=v; return v; });
    let r=Math.random()*tot; for(let i=0;i<pool.length;i++){ r-=ws[i]; if(r<=0) return pool[i]; } return pool[pool.length-1];
  };
  api.take=function(p){
    const k=p.kind;
    if(k==='bE'){ if(P.energy>=P.energyMax-1&&P.shield>=P.shieldMax-1) return false; P.energy=P.energyMax; P.shield=Math.min(P.shieldMax,P.shield+30); FX.heal=.3; showMsg('Energiezelle: Energie voll · Schild +30',1500); }
    else if(k==='bP'){ if(P.armor>=P.armorMax-.5) return false; P.armor=Math.min(P.armorMax,P.armor+20); FX.heal=.3; showMsg('Panzerplatte: Panzerung +20',1500); }
    else if(k==='bK'){ if(P.heat<=0&&P.overheatT<=0&&P.energy>=P.energyMax-1) return false; P.heat=0; P.overheatT=0; P.hs.fill(0); P.os.fill(0); P.energy=Math.min(P.energyMax,P.energy+35); FX.heal=.3; showMsg('Kühlkern: Hitze zurückgesetzt · Energie +35',1500); }
    else if(k==='bG'){ if(P.hp>=100&&S.poisonT<=0) return false; P.hp=Math.min(100,P.hp+30); S.poisonT=0; S.rootT=0; FX.heal=.35; showMsg('Bio-Gel: Integrität +30 · Gift geheilt',1500); }
    else return false;
    sfx.bmPick(); api.stats.pickups++; return true;
  };
  api.draw=function(dl,time){
    if(!S.on) return;
    const alt=((time*10)|0)&1;
    for(const T of S.traps){
      if(Math.hypot(T.x-P.x,T.y-P.y)>MAXD+1) continue;
      const set=TEX[T.k]; let f=T.f; if(f>=set.length) f=set.length-1;
      const tex=(T.k==='arc'&&f===1)?(alt?SP.arc1:SP.arc0):set[f];

    for(const c of S.clouds){ if(c.rr<.15||Math.hypot(c.x-P.x,c.y-P.y)>MAXD+2) continue; dl.push({x:c.x,y:c.y,tex:SP.spore,sc:c.rr*2.3,vo:0,flash:0,glow:false}); }
  };
  api.near=(x,y,r)=>S.traps.some(T=>Math.hypot(T.x-x,T.y-y)<r); api.cells=cells; api.traps=()=>S.traps;   // Phase 12: Platzierung der Umwelt-Gefahren
  api.enable=function(id){ if(!BD[id]||!BD[id].prep||BIOME_ORDER.indexOf(id)>=0) return false; BIOME_ORDER.push(id); return true; };
  api.force=function(h){ if(!S.on||!HN[h]) return false; S.haz=h; S.hz.t=0; S.hz.st=0; return true; };
  api.def=id=>BD[id||curBiome]||BD.facility;
  api.state=()=>({biome:S.id,haz:S.haz,traps:S.traps.length,clouds:S.clouds.length,rocks:S.rocks.length,storm:+S.hz.s.toFixed(2),poison:+S.poisonT.toFixed(1),root:+S.rootT.toFixed(1),sand:S.sand});
  api.BD=BD; api.PREP=PREP; api.apply=apply;
  return api;
})();

/* ============================================================
   Umwelt-Gefahren (Phase 12)
   ============================================================
   12 Gefahren, je Biom gewichtet (`RULE`), nur prozedurale Ebenen ab Tiefe 2 (Boss-Ebenen halb, ohne Presse/Gas/Void):
     Lava · Gasleck (giftig + entzündbar) · Tesla-Spule · Strahlung · Säure · Flammendüse · Kältezone · Void-Riss
     Lasergitter (wandernd) · Sprengfass (schießbar, Kettenreaktion) · Presse (Wandtyp 3, quetscht) · Sicherheitsturm (schießbar)
   Dazu dynamisch: Feuerflächen (aus Fässern, Gasexplosionen, Düsen) und Statuseffekte Brennen / Frost / Gift / Strahlung.
   Gefahren wirken auch auf Gegner (Umgebungs-Kills). Dash (I-Frames) schützt vor Schaden und befreit von Frost.
   Konsole: __breach.Hazards.force('lava'|'gas'|'tesla'|'rad'|'acid'|'fire'|'frost'|'voidz'|'laser'|'barrel'|'crusher'|'turret'), .state(), .disable() */
const Hazards=(()=>{
  const api={ stats:{placed:0,contacts:0,envKills:0,barrels:0,turrets:0,crushes:0,ignites:0,teleports:0}, seen:{} };
  const rnd=(a,b)=>a+Math.random()*(b-a);
  const NAME={lava:'Lava',gas:'Gasleck',tesla:'Tesla-Spule',rad:'Strahlung',acid:'Säure',fire:'Flammendüse',frost:'Kältezone',voidz:'Void-Riss',laser:'Lasergitter',barrel:'Sprengfass',crusher:'Presse',turret:'Sicherheitsturm'};
  // Regeln je Biom: [Art, ab Tiefe, Gewicht]  (Biome 5-10 sind vorbereitet, siehe Biome.PREP)
  const RULE={
    facility:[['tesla',2,3],['barrel',2,3],['laser',3,3],['turret',3,3],['crusher',4,2],['fire',4,1],['gas',5,1],['rad',6,1]],
    canyon:  [['barrel',2,3],['lava',2,4],['fire',3,2],['crusher',4,2],['turret',5,1],['gas',6,1]],
    desert:  [['barrel',2,3],['rad',2,3],['acid',3,2],['turret',4,2],['laser',5,2],['fire',6,1]],

    deadcity:[['barrel',1,3],['gas',1,2],['fire',2,2],['turret',2,2],['crusher',3,2],['rad',3,1],['tesla',3,1]],
    hive:    [['acid',1,4],['gas',1,3],['barrel',1,2],['fire',3,1],['turret',4,1]],
    orbital: [['laser',1,4],['tesla',1,3],['turret',2,3],['frost',3,2],['crusher',3,2],['voidz',6,1]],
    void:    [['voidz',1,5],['laser',2,2],['tesla',2,2],['rad',3,2],['barrel',2,1]],
    core:    [['lava',1,4],['rad',1,3],['fire',1,3],['turret',2,2],['crusher',2,2],['laser',3,2],['voidz',4,2]]

  const TIP={
    lava:'LAVA — verbrennt und bremst: umgehen oder überdashen',

    tesla:'TESLA-SPULE — lädt auf, dann Blitz aufs nächste Ziel: Abstand halten',

    frost:'KÄLTEZONE — bei 100 % Frost erstarrst du: ein Dash befreit',
    voidz:'VOID-RISS — Sog, Energieentzug, der Kern versetzt dich: Dash widersteht',

    turret:'SICHERHEITSTURM — zielt, dann Salve: zerstören, Deckung oder Override'
  };
  const tip=k=>{ const key='h:'+k; if(api.seen[key]||!TIP[k]||S.tipCd>0) return; api.seen[key]=1; S.tipCd=4; showMsg(TIP[k],3400); };

  /* ---- Klang ---- */
  sfx.hzZap=v=>{ noise(.2,.24*v,3400); tone(1500,140,.18,'sawtooth',.14*v); };
  sfx.hzCharge=v=>{ tone(300,1500,.8,'sawtooth',.05*v); };
  sfx.hzGeiger=v=>{ noise(.02,.07*v,4200); };
  sfx.hzBoom=v=>{ noise(.8,.5*v,700); tone(140,30,.6,'sawtooth',.3*v); };

  sfx.hzTurret=v=>{ tone(900,500,.07,'square',.07*v); };
  sfx.hzTurDie=v=>{ noise(.4,.3*v,1200); tone(400,50,.4,'sawtooth',.16*v); };
  sfx.hzFreeze=()=>{ tone(1800,1200,.3,'triangle',.08); noise(.3,.06,6000); };
  sfx.hzOff=()=>{ tone(500,120,.5,'sawtooth',.12); };

  /* ---- Sprites (64x64, Bodenobjekte unten; Zonen sind flache Scheiben) ---- */
  const SP={};

  /* ---- Objekte ---- */
  function orient(x,y,L,amp){   // Lasergitter: Achse suchen, deren Bahn (Mitte +/- Ausschlag) komplett frei ist
    for(let t=0;t<10;t++){
      const a=Math.random()*Math.PI, ux=Math.cos(a), uy=Math.sin(a), nx=-uy, ny=ux; let ok=true;
      for(let m=-amp;m<=amp+.01&&ok;m+=amp) for(let q=-L/2;q<=L/2+.01;q+=.5){ if(solidAt(x+ux*q+nx*m,y+uy*q+ny*m)){ ok=false; break; } }
      if(ok) return {ux,uy,nx,ny};
    }
    return null;
  }
  function make(k,x,y){
    const o={k,x,y,t:Math.random()*5,f:0,fl:0,off:false,dead:false};
    if(k==='lava'||k==='acid') o.r=1.15; else if(k==='rad') o.r=2.3; else if(k==='frost') o.r=2.4; else if(k==='voidz') o.r=2.6;
    else if(k==='gas'){ o.r=2.0; o.rr=0; o.hs=false; }
    else if(k==='barrel'){ o.hp=10; o.fuse=0; }
    else if(k==='turret'){ o.hp=40+2.5*S.d; o.st=0; o.tm=0; o.la=0; o.sh=0; }
    else if(k==='laser'){ const L=rnd(3.2,4.6), amp=rnd(1.4,2.2), s=orient(x,y,L,amp); if(!s) return null;
      Object.assign(o,s,{L,amp,ph:Math.random()*6.28,on:true,warn:false,cd:0,ax:x,ay:y,bx:x,by:y}); }
    else if(k==='crusher'){ o.cx=x|0; o.cy=y|0; o.x=o.cx+.5; o.y=o.cy+.5; o.closed=false; }
    else if(k==='fire'||k==='tesla'){ o.dt=0; }
    return o;
  }
  function spawnFire(x,y,life){ if(solidAt(x,y)||S.fires.length>=24) return; S.fires.push({x,y,t:0,life,r:1.0,ph:0}); }
  function zoneEnemies(o,r,dmg){

    }

  /* ---- Explosionen / Feuer / Gas ---- */
  function ignite(x,y,r){
    for(const o of S.list){ if(o.k!=='gas'||o.dead||o.rr<.6) continue; if(Math.hypot(o.x-x,o.y-y)<r+o.rr) gasBoom(o); }
  }
  function gasBoom(o){
    const R=o.rr+.8; o.t=0; o.rr=0; o.hs=false; api.stats.ignites++;
    spawnBoom(o.x,o.y,1.8); sfx.hzBoom(near(Math.hypot(o.x-P.x,o.y-P.y)));
    blast(o.x,o.y,R,18+S.d*1.4,44+S.d*2,o);
    for(let i=0;i<2;i++){ const a=Math.random()*6.283, r=rnd(.4,1.4); spawnFire(o.x+Math.cos(a)*r,o.y+Math.sin(a)*r,rnd(4,6)); }
  }
  function blast(x,y,R,pd,ed,src){
    for(const o of S.list){ if(o===src||o.dead||(o.k!=='barrel'&&o.k!=='turret')) continue; const dd=Math.hypot(o.x-x,o.y-y); if(dd<R) dmgObj(o,ed*(1-dd/R*.5)); }
    const pdist=Math.hypot(P.x-x,P.y-y);
    if(pd>0&&pdist<R&&(pdist<.3||rayWallDist(x,y,(P.x-x)/pdist,(P.y-y)/pdist)>=pdist-.1)) hurtPlayer(pd*(1-pdist/R*.5));
    for(const e of enemies){
      if(!e.alive) continue;
      const ex=e.x-x, ey=e.y-y, dd=Math.hypot(ex,ey); if(dd>R) continue;
      if(dd>.3&&rayWallDist(x,y,ex/dd,ey/dd)<dd-.1) continue;
      damageEnemy(e,Math.max(1,Math.round(ed*(1-dd/R*.5)*(e.type==='K'?.5:1))),Math.atan2(ey,ex),false,true);
      if(!e.alive) api.stats.envKills++;
    }
    ignite(x,y,R);
  }
  function dmgObj(o,dmg){
    if(o.dead||dmg<=0) return;
    o.hp-=dmg; o.fl=.12;
    if(o.hp<=0){ if(o.k==='barrel'){ if(!(o.fuse>0)) o.fuse=.08+Math.random()*.14; } else killTurret(o); }   // Fass: Kettenreaktion mit Verzoegerung
  }
  function explode(o){
    if(o.dead) return; o.dead=true; api.stats.barrels++;
    const dd=Math.hypot(o.x-P.x,o.y-P.y);
    spawnBoom(o.x,o.y,1.5); sfx.hzBoom(near(dd)); if(dd<9) kick(.25+.35*(1-dd/9));
    blast(o.x,o.y,2.7,26+S.d*1.4,60+S.d*3,o);
    for(let i=0;i<3;i++){ const a=Math.random()*6.283, r=rnd(.3,1.0); spawnFire(o.x+Math.cos(a)*r,o.y+Math.sin(a)*r,rnd(4,6)); }
  }

  function crush(o){

    const push=(e,rad)=>{
      if(Math.abs(e.x-o.x)>=.5+rad||Math.abs(e.y-o.y)>=.5+rad) return false;
      let best=null, bd=1e9;
      for(const [ax,ay] of nb){ const c2x=o.cx+ax, c2y=o.cy+ay; if(grid[c2y*MW+c2x]!==0) continue; const dd=Math.hypot(e.x-(c2x+.5),e.y-(c2y+.5)); if(dd<bd){ bd=dd; best=[c2x+.5+ax*.25,c2y+.5+ay*.25]; } }
      if(best){ e.x=best[0]; e.y=best[1]; } return true;
    };
    if(push(P,.22)){ hurtPlayer(24+S.d*1.5); api.stats.crushes++; api.stats.contacts++; }
    for(const e of enemies){
      if(!e.alive) continue;
      if(push(e,ETYPES[e.type].rad)&&e.type!=='K'){ damageEnemy(e,70+S.d*3,null,false,true); if(!e.alive) api.stats.envKills++; }

      P.energy=Math.max(0,P.energy-10*dt); P.enT=Math.max(P.enT,.5);
      if(P.shield>0) P.shield=Math.max(0,P.shield-4*dt);
      if(dist<.6&&S.vcd<=0&&P.dashT<=0) teleport(o);
    }
    for(let j=shots.length-1;j>=0;j--) if(Math.hypot(shots[j].x-o.x,shots[j].y-o.y)<1.3) shots.splice(j,1);   // verschluckt gegnerische Geschosse (Deckung!)
    for(const e of enemies){
      if(!e.alive||e.type==='K') continue;
      const ex=o.x-e.x, ey=o.y-e.y, ed=Math.hypot(ex,ey); if(ed>o.r||ed<.05) continue;
      const f=1.1+2.2*(1-ed/o.r); e.stagT=Math.max(e.stagT,.1); e.stagX=ex/ed*f; e.stagY=ey/ed*f;
      if(ed<.6&&S.doEn){ damageEnemy(e,40+S.d*2,null,false,true); if(!e.alive) api.stats.envKills++; }
    }
  }

  /* ---- Aufbau ---- */
  api.reset=function(){ api.seen={}; api.stats={placed:0,contacts:0,envKills:0,barrels:0,turrets:0,crushes:0,ignites:0,teleports:0}; };
  api.setup=function(){
    S=fresh(); ensureDom(); paint();
    if(!lvl||!lvl.procedural||(lvl.depth||1)<2) return;
    const d=lvl.depth, id=lvl.biome||'facility', boss=lvl.lock==='boss';
    const rules=(RULE[id]||RULE.facility).filter(r=>d>=r[1]&&!(boss&&(r[0]==='crusher'||r[0]==='gas'||r[0]==='voidz')));
    if(!rules.length) return;
    S.on=true; S.d=d; S.boss=boss;
    const ar=new Set(); if(lvl.arena) for(const c of lvl.arena.cells) ar.add(c[1]*MW+c[0]);
    const df=computeFlowFromCell(P.x|0,P.y|0), list=Biome.cells(df,8,ar), used=[];
    S.tp=list;
    for(const t of Biome.traps()) used.push([t.x,t.y]);
    for(const p of pickups) if(!p.taken) used.push([p.x,p.y]);
    for(const ev of Events.list()) if(ev.x!==undefined) used.push([ev.x,ev.y]);
    let n=Math.min(8,1+((d+1)/2|0)); if(boss) n=Math.ceil(n/2);
    let tot=0; for(const r of rules) tot+=r[2];
    for(let placed=0,tries=0;placed<n&&tries<n*30&&list.length;tries++){
      let w=Math.random()*tot, k=rules[0][0]; for(const r of rules){ w-=r[2]; if(w<=0){ k=r[0]; break; } }
      const c=list[(Math.random()*list.length)|0], x=(c%MW)+.5, y=((c/MW)|0)+.5;
      let ok=true; for(const u of used) if(Math.hypot(u[0]-x,u[1]-y)<3.6){ ok=false; break; }
      if(!ok) continue;
      const o=make(k,x,y); if(!o) continue;
      S.list.push(o); used.push([x,y]); placed++; api.stats.placed++;
      if(k==='barrel'&&Math.random()<.6){   // Fass-Gruppe: 1-2 Nachbarn (Kettenreaktion)
        const m=1+((Math.random()*2)|0), offs=[[.8,0],[-.8,0],[0,.8],[0,-.8]];
        for(let j=0;j<m;j++){ const of=offs[(Math.random()*4)|0], bx=x+of[0], by=y+of[1]; if(!solidAt(bx,by)) S.list.push(make('barrel',bx,by)); }
      }
    }
  };

  /* ---- Hauptschleife ---- */
  api.tick=function(dt){
    if(!S.on) return;
    const d=S.d, V=Stats.val;
    let inLava=false, inAcid=false, inRad=false, inFrost=false, inGas=false, inVoid=false, nearRad=0;
    S.et-=dt; S.doEn=S.et<=0; if(S.doEn) S.et=.5; S.tipCd-=dt;
    for(const o of S.list){
      if(o.dead) continue;
      const dx=P.x-o.x, dy=P.y-o.y, dist=Math.hypot(dx,dy);
      if(dist<6.5) tip(o.k);
      switch(o.k){
        case 'lava': if(dist<o.r) inLava=true; if(S.doEn) zoneEnemies(o,o.r,12+d); break;
        case 'acid': if(dist<o.r) inAcid=true; if(S.doEn) zoneEnemies(o,o.r,6+d*.6); break;
        case 'rad': if(dist<o.r) inRad=true; if(dist<o.r+4) nearRad=Math.max(nearRad,1-Math.max(0,dist-o.r)/4); break;
        case 'frost': if(dist<o.r) inFrost=true; break;
        case 'gas': gasTick(o,dt,dist); if(o.rr>.4){ if(dist<o.rr) inGas=true; if(S.doEn) zoneEnemies(o,o.rr,3+d*.3); } break;
        case 'voidz': voidTick(o,dt,dx,dy,dist); if(dist<o.r) inVoid=true; break;
        case 'tesla': teslaTick(o,dt,dist); break;
        case 'fire': fireTick(o,dt,dist); break;
        case 'laser': laserTick(o,dt,dist); break;
        case 'crusher': crushTick(o,dt,dist); break;
        case 'turret': turretTick(o,dt,dist); break;
        case 'barrel': o.fl>0&&(o.fl-=dt); if(o.fuse>0){ o.fuse-=dt; if(o.fuse<=0) explode(o); } break;
      }
    }
    // Feuerflaechen
    for(let i=S.fires.length-1;i>=0;i--){
      const f=S.fires[i]; f.t+=dt; f.ph-=dt; if(f.t>=f.life){ S.fires.splice(i,1); continue; }
      const dist=Math.hypot(P.x-f.x,P.y-f.y);
      if(dist<f.r&&P.dashT<=0&&f.ph<=0){ f.ph=.5; hurtPlayer(4+d*.4); S.burn=Math.max(S.burn,2.5); api.stats.contacts++; }
      if(S.doEn){ zoneEnemies(f,f.r,10+d*.8); ignite(f.x,f.y,f.r); }
    }
    // Lava / Saeure (Dash = I-Frames)
    S.lt-=dt; S.slow=inLava||inAcid; S.inAcid=inAcid;

      if(inLava){ hurtPlayer(4+d*.3); S.burn=Math.max(S.burn,2.5); sfx.hzLava(.8); }
      if(inAcid){ P.armor=Math.max(0,P.armor-9); hurtPlayer(2+d*.25); sfx.hzAcid(.8); }   // Saeure frisst zuerst die Panzerung
    }
    // Gift (toetet nie: bleibt bei 1 Integritaet, sperrt aber die Regeneration)
    if(inGas) S.poison=3.5;
    if(S.poison>0){ S.poison-=dt; S.pt-=dt; if(S.pt<=0){ S.pt=1; if(P.hp>1){ P.hp=Math.max(1,P.hp-(1+((d/8)|0))); FX.hurt=Math.max(FX.hurt,.18); } P.hpT=V.hpRegenDelay; sfx.bmSpore(); } }
    // Strahlung: Schild laedt nicht, Energie sinkt, leichter Integritaetsverlust (nicht toedlich)
    S.radIn=inRad;
    if(inRad){ P.shieldT=Math.max(P.shieldT,1.2); P.hpT=Math.max(P.hpT,1); S.rt-=dt;
      if(S.rt<=0){ S.rt=.5; P.energy=Math.max(0,P.energy-4); S.rd++; if(S.rd%2===0&&P.hp>1){ P.hp=Math.max(1,P.hp-(1+((d/8)|0))); FX.hurt=Math.max(FX.hurt,.15); api.stats.contacts++; } } }
    S.rc-=dt; if(nearRad>0&&S.rc<=0){ S.rc=Math.max(.05,.5*(1-nearRad)+.06)*(.6+Math.random()*.8); sfx.hzGeiger(.6+nearRad*.6); }
    // Frost: Kaelte sammelt sich, bei 100 % erstarrst du (Dash befreit)
    if(S.frozen>0){ S.frozen-=dt; if(P.dashT>0){ S.frozen=0; S.chill=.3; } }
    else {
      if(inFrost){ S.chill=Math.min(1,S.chill+dt*.34); tip('frost'); } else S.chill=Math.max(0,S.chill-dt*.22);
      if(S.burn>0) S.chill=Math.max(0,S.chill-dt*.8);
      if(S.chill>=1){ S.frozen=1.3; S.chill=.55; sfx.hzFreeze(); kick(.15); }
    }
    // Brennen
    if(S.chill>.5) S.burn=0;
    if(S.burn>0){ S.burn-=dt; S.bt-=dt; if(S.bt<=0){ S.bt=.6; if(P.dashT<=0) hurtPlayer(3+d*.3); } }
    // Void
    S.voidIn=inVoid; S.vcd-=dt;
    // Klangkulisse (nahste Blubber-/Brummquelle)
    S.amb-=dt;
    if(S.amb<=0){ S.amb=rnd(.9,1.6);
      for(const o of S.list){ if(o.dead) continue; const dd=Math.hypot(o.x-P.x,o.y-P.y); if(dd>7) continue;
        if(o.k==='lava') sfx.hzLava(near(dd)*.8); else if(o.k==='acid') sfx.hzAcid(near(dd)*.7); else if(o.k==='voidz') sfx.hzVoid(near(dd)); else if(o.k==='laser'&&o.on) sfx.hzLaser(near(dd)*.7); }
    }
    paint();
  };

  /* ---- Anbindung ---- */
  api.speedMul=()=>S.frozen>0?.12:(1-.45*S.chill)*(S.slow?.78:1);
  api.ray=function(ox,oy,dx,dy,maxd){
    if(!S.on) return null; let best=null, bd=maxd;
    for(const o of S.list){
      if(o.dead||(o.k!=='barrel'&&o.k!=='turret')) continue;
      const ex=o.x-ox, ey=o.y-oy, al=ex*dx+ey*dy; if(al<.1||al>=bd) continue;
      if(Math.abs(ex*dy-ey*dx)<(o.k==='barrel'?.3:.34)){ best=o; bd=al; }
    }
    return best?{o:best,d:bd}:null;
  };
  api.at=function(x,y,r){
    if(!S.on) return false;
    for(const o of S.list){ if(o.dead||(o.k!=='barrel'&&o.k!=='turret')) continue; if(Math.hypot(o.x-x,o.y-y)<r+.2) return true; }
    return false;
  };
  api.hurt=function(o,dmg){ dmgObj(o,dmg); };
  api.ignite=function(x,y,r){ if(S.on) ignite(x,y,r); };
  api.shotHit=function(x,y,dmg){   // Gegnerschuesse koennen Faesser sprengen
    if(!S.on) return false;
    for(const o of S.list){ if(o.dead||o.k!=='barrel') continue; if(Math.hypot(o.x-x,o.y-y)<.32){ dmgObj(o,dmg); return true; } }
    return false;
  };
  api.splashObjs=function(x,y,R,dmg){   // Spieler-Explosionen: Faesser/Tuerme + Gas
    if(!S.on) return;
    for(const o of S.list){ if(o.dead||(o.k!=='barrel'&&o.k!=='turret')) continue; const dd=Math.hypot(o.x-x,o.y-y); if(dd<R) dmgObj(o,dmg*(1-dd/R*.5)); }
    ignite(x,y,R);
  };
  api.disable=function(){   // Sicherheits-Override (Phase 10): Laser, Tuerme, Tesla aus
    let n=0; for(const o of S.list) if((o.k==='laser'||o.k==='turret'||o.k==='tesla')&&!o.off){ o.off=true; n++; }
    if(n) sfx.hzOff(); return n;
  };
  api.draw=function(dl,time){
    if(!S.on) return;
    const alt=((time*8)|0)&1, lim=MAXD+2;
    for(const o of S.list){
      if(o.dead) continue;
      const dist=Math.hypot(o.x-P.x,o.y-P.y); if(dist>lim+(o.k==='laser'?3:0)) continue;
      switch(o.k){
        case 'lava': dl.push({x:o.x,y:o.y,tex:alt?SP.lava1:SP.lava0,sc:o.r*2.5,vo:0,flash:0,glow:true}); break;
        case 'acid': dl.push({x:o.x,y:o.y,tex:alt?SP.acid1:SP.acid0,sc:o.r*2.5,vo:0,flash:0,glow:true}); break;
        case 'rad': dl.push({x:o.x,y:o.y,tex:SP.rad,sc:o.r*2.5,vo:0,flash:0,glow:true}); break;
        case 'frost': dl.push({x:o.x,y:o.y,tex:SP.frost,sc:o.r*2.5,vo:0,flash:0,glow:false}); break;
        case 'voidz': dl.push({x:o.x,y:o.y,tex:(((time*5)|0)&1)?SP.void1:SP.void0,sc:o.r*2.5,vo:0,flash:0,glow:true}); break;
        case 'gas': if(o.rr>.15) dl.push({x:o.x,y:o.y,tex:SP.gas,sc:o.rr*2.3,vo:0,flash:0,glow:false}); else dl.push({x:o.x,y:o.y,tex:SP.gasv,sc:.5,vo:0,flash:0,glow:false}); break;
        case 'tesla': dl.push({x:o.x,y:o.y,tex:o.off?SP.tes0:[SP.tes0,SP.tes1,SP.tes2][o.f],sc:.8,vo:0,flash:0,glow:o.f>0&&!o.off}); break;
        case 'fire': dl.push({x:o.x,y:o.y,tex:o.off?SP.jet0:[SP.jet0,SP.jet1,SP.jet2][o.f],sc:o.f===2?1.05:.5,vo:0,flash:0,glow:o.f>0}); break;
        case 'laser':
          for(const [px_,py_] of [[o.ax,o.ay],[o.bx,o.by]]) dl.push({x:px_,y:py_,tex:o.off?SP.lasP0:SP.lasP,sc:.4,vo:0,flash:0,glow:o.on});
          if(o.on||(o.warn&&alt)){ const n=Math.max(4,Math.round(o.L/.5)); lineDots(o.ax,o.ay,o.bx,o.by,SPR_LASER,o.on?.08:.04,.22,n); lineDots(o.ax,o.ay,o.bx,o.by,SPR_LASER,o.on?.08:.04,.5,n); }
          break;
        case 'barrel': dl.push({x:o.x,y:o.y,tex:SP.bar,sc:.5,vo:0,flash:o.fl>0?o.fl:0}); break;
        case 'crusher': if(!o.closed) dl.push({x:o.x,y:o.y,tex:(o.f===1&&alt)?SP.cr1:SP.cr0,sc:1.1,vo:0,flash:0,glow:o.f===1}); break;
        case 'turret':
          dl.push({x:o.x,y:o.y,tex:[SP.tur0,SP.tur1,SP.tur2][o.f],sc:.6,vo:0,flash:o.fl>0?o.fl:0});
          if(o.st===1) lineDots(o.x,o.y,P.x,P.y,SPR_LASER,.05,.32,10);
          break;
      }
    }
    for(const f of S.fires){ if(Math.hypot(f.x-P.x,f.y-P.y)>lim) continue; dl.push({x:f.x,y:f.y,tex:(((time*9+f.x*3)|0)&1)?SP.fire1:SP.fire0,sc:.55+.15*Math.sin(time*11+f.x),vo:0,flash:0,glow:true}); }
  };
  api.force=function(k){   // Konsole: Gefahr 2,5-5 Felder vor dem Spieler erzeugen
    if(!NAME[k]||!lvl||!lvl.procedural) return false;
    if(!S.on){ S.on=true; S.d=lvl.depth||2; }
    for(let r=2.5;r<=5;r+=.5){
      const x=P.x+Math.cos(P.a)*r, y=P.y+Math.sin(P.a)*r; if(solidAt(x,y)) continue;
      const o=make(k,(x|0)+.5,(y|0)+.5); if(o){ S.list.push(o); return true; }
    }
    return false;
  };
  api.state=()=>({on:S.on,n:S.list.length,kinds:S.list.reduce((a,o)=>{ if(!o.dead) a[o.k]=(a[o.k]||0)+1; return a; },{}),fires:S.fires.length,burn:+S.burn.toFixed(1),chill:+S.chill.toFixed(2),frozen:+S.frozen.toFixed(1),poison:+S.poison.toFixed(1)});
  api.near=(x,y,r)=>S.list.some(o=>!o.dead&&Math.hypot(o.x-x,o.y-y)<r);   // Phase 13: Loot-Platzierung
  api.NAME=NAME; api.RULE=RULE;
  return api;
})();

    const w=[Math.max(30,100-d*3),(42+d)*(1+(L-1)*.5),d>=2?(16+2*d)*L:0,d>=4?(5+1.1*d)*L:0,d>=7?(1.8+.45*d)*L:0,d>=12?(.5+.14*d)*L:0];
    floor=floor||0; for(let i=0;i<floor;i++) w[i]=0;

  function pay(v){ Save.data.credits+=v; Save.markDirty(); api.stats.credits+=v; }

  function armorMod(r,d){
    const keys=Object.keys(AMOD), cand=keys.filter(k=>(api.am[k]===undefined?-1:api.am[k])<r);
    if(!cand.length){ const v=20*(r+1)+5*d; pay(v); api.stats.dupes++; return 'Duplikat → Credits +'+v; }
    const k=cand[(rd()*cand.length)|0], M=AMOD[k], eff={}; eff[M.a[0]]=M.a[1][r];
    if(M.b&&M.b[1][r]>0) eff[M.b[0]]=M.b[1][r];
    api.am[k]=r; Stats.add('run:am:'+k,eff); Stats.recalc();
    const v=M.a[1][r];
    if(k==='plate') P.armor=Math.min(P.armorMax,P.armor+v);
    else if(k==='matrix') P.shield=Math.min(P.shieldMax,P.shield+v);
    else if(k==='cell') P.energy=Math.min(P.energyMax,P.energy+v);
    return M.n+' '+['I','II','III','IV','V','VI'][r]+' — '+M.a[2](v);
  }
  function artifact(r){
    const own=Save.data.artifacts||(Save.data.artifacts=[]), left=ART.filter(a=>own.indexOf(a.id)<0);
    if(!left.length||own.length>=250){ const v=150+10*depth(); pay(v); api.stats.dupes++; return 'Alle Artefakte gefunden → Credits +'+v; }
    const a=left[(rd()*left.length)|0]; own.push(a.id); Save.markDirty(); api.stats.artifacts++; applyArtifacts();
    return 'Artefakt: '+a.n+' — '+a.d;
  }

  api.take=function(p){
    const L=p.loot; if(!L) return true;
    const r=L.r, d=depth(); let msg;
    switch(L.t){
      case 'hp': if(P.hp>=100) return false; Missions.onHeal(); P.hp=Math.min(100,P.hp+HP[r]); FX.heal=.35; msg='Integrität +'+HP[r]; break;
      case 'ammo': if(P.ammo>=99) return false; P.ammo=Math.min(99,P.ammo+AMMO[r]); msg='Ladung +'+AMMO[r]; break;
      case 'energy': if(P.energyMax<=0||P.energy>=P.energyMax-1) return false; P.energy=Math.min(P.energyMax,P.energy+P.energyMax*EN[r]); msg='Energie +'+Math.round(EN[r]*100)+' %'; break;
      case 'shield': if(P.shieldMax<=0||P.shield>=P.shieldMax-.5) return false; P.shield=Math.min(P.shieldMax,P.shield+P.shieldMax*SH[r]); msg='Schild +'+Math.round(SH[r]*100)+' %'; break;
      case 'cr': { const v=Math.round((6+3*d)*CRM[r]); pay(v); msg='Credits +'+v; break; }
      case 'mogc': stats.shards+=MG[r]; totals.shards+=MG[r]; msg='MOGC-Splitter +'+MG[r]; break;
      case 'wmod': { const id=Mods.roll(d+MODB[r]); if(Mods.add(id,true)) msg='Waffen-Mod: '+MOD_BY_ID[id].name; else { const v=30*(r+1); pay(v); msg='Mod-Speicher voll → Credits +'+v; } break; }
      case 'amod': msg=armorMod(r,d); break;
      case 'perk': api.cores++; msg='Perk-Kern gesichert ('+api.cores+') — Wahl bei Ruhe oder im Pausemenü'; break;
      case 'art': msg=artifact(r); break;
      case 'key': if(api.keys>=3) return false; api.keys++; api.stats.keys++; msg='Zugangskarte ('+api.keys+') — öffnet einen Sicherheitsspind'; break;
      default: return true;
    }
    api.stats.taken++; api.stats.byRar[r]++;
    if(L.t==='key') sfx.lootR(2); else sfx.lootR(r);
    showMsg((r>0&&L.t!=='key'?RAR[r].n+' · ':'')+msg,r>=4?3200:r>=2?2200:1400);
    const m=$('msg'); if(m&&m.style) m.style.color=L.t==='key'?KEYC:r>0?RAR[r].c:'';
    return true;
  };
  api.takeCore=function(){ if(api.cores<=0) return false; api.cores--; return true; };

  function spawn(x,y,loot,drop,fixedT){
    let px=x+(rd()-.5)*.5, py=y+(rd()-.5)*.5; if(solidAt(px,py)){ px=x; py=y; }
    pickups.push({kind:'L',x:px,y:py,taken:false,ph:rd()*6,loot,mag:!!drop,ttl:(drop&&loot.r<2)?45:undefined});
    api.stats.dropped++;
    if(drop&&loot.r>=3) sfx.lootDrop(loot.r);
    let n=0; for(const p of pickups) if(p.kind==='L'&&!p.taken) n++;
    if(n>48) for(const p of pickups){ if(p.kind==='L'&&!p.taken&&p.ttl!==undefined){ p.taken=true; if(--n<=44) break; } }
  }
  api.spawn=spawn;

  api.onKill=function(e){
    if(state!=='play') return;
    const d=depth();
    if(e.type==='K'){
      const x=e.x, y=e.y;
      spawn(x,y,roll(d,.5,2),true); spawn(x,y,roll(d,.5,2),true); spawn(x,y,roll(d,.8,3),true);
      spawn(x,y,{t:'perk',r:3},true); spawn(x,y,{t:'key',r:1},true);
      if(rd()<.45) spawn(x,y,{t:'art',r:4},true);
      return;
    }
    if(e.elite){
      const k=e.mods?e.mods.length:1;
      spawn(e.x,e.y,roll(d,.35+.2*k,k>=2?2:1),true);
      if(rd()<.25) spawn(e.x,e.y,roll(d,.2,1),true);
      if(api.keys<3&&rd()<.35) spawn(e.x,e.y,{t:'key',r:1},true);
      return;
    }
    if(api.t-lastDrop<.25) return;
    let ch=.07+Math.min(.06,d*.004); const ro=e.role;
    if(ro==='swarm') ch*=.35;
    else if(ro==='tank'||ro==='juggernaut'||ro==='summoner'||ro==='sniper'||ro==='support'||ro==='shielder') ch*=2.2;
    else if(ro==='assassin') ch*=1.8;
    if(rd()>=ch) return;
    lastDrop=api.t; spawn(e.x,e.y,roll(d,0,0),true);
  };

  function openChest(c){

    for(let i=0;i<n;i++){
      const a=i/n*6.283+rd(), x=c.x+Math.cos(a)*.75, y=c.y+Math.sin(a)*.75;

  api.setup=function(){
    S={chests:[]}; hintT=0;
    if(!lvl||!lvl.procedural) return;
    const d=lvl.depth||1, boss=lvl.lock==='boss';
    const ar=new Set(); if(lvl.arena) for(const c of lvl.arena.cells) ar.add(c[1]*MW+c[0]);
    const df=computeFlowFromCell(P.x|0,P.y|0), list=Biome.cells(df,6,ar); if(!list.length) return;
    const used=[]; for(const p of pickups) used.push([p.x,p.y]);
    for(const ev of Events.list()) if(ev.x!==undefined) used.push([ev.x,ev.y]);
    const put=(sep,minD)=>{
      for(let t=0;t<80;t++){
        const k=list[(rd()*list.length)|0]; if(df[k]<minD) continue;

    };
    let n=Math.min(8,2+((d/2)|0)); if(boss) n=Math.ceil(n/2);
    for(let i=0;i<n;i++){ const c=put(4.5,6); if(c) pickups.push({kind:'L',x:c[0],y:c[1],taken:false,ph:rd()*6,loot:roll(d,0,0)}); }

  function dom(){

      st.appendChild(el); D.el=el; }catch(e){}
  }
  api.tick=function(dt){

    if(D.el){

      if(p.mag){ const dx=P.x-p.x, dy=P.y-p.y, d2=dx*dx+dy*dy;
        if(d2<3.2&&d2>.09){ const d=Math.sqrt(d2), nx=p.x+dx/d*5*dt, ny=p.y+dy/d*5*dt; if(!solidAt(nx,ny)){ p.x=nx; p.y=ny; } } }

      if(d2<1){ if(api.keys>0) openChest(c); else if(hintT<=0){ showMsg('Sicherheitsspind — Zugangskarte erforderlich',1800); hintT=3; sfx.evFail(); } }
      else if(d2<42&&!api.seen.chest){ api.seen.chest=1; showMsg('Sicherheitsspind entdeckt — Zugangskarte finden',2200); }
    }
  };

  api.draw=function(p,dl,time){
    const L=p.loot;
    if(p.kind!=='L'){
      dl.push({x:p.x,y:p.y,tex:PICKUP_SPR[p.kind],sc:.6,vo:0,flash:0});
      if(!p.opened&&api.keys>0) dl.push({x:p.x,y:p.y,tex:RINGT[6],sc:.75+Math.sin(time*5)*.05,vo:.02,flash:0,glow:true});
      return;
    }
    if(p.ttl!==undefined&&p.ttl<6&&((time*8)|0)%2) return;
    const r=L.r, bob=.02+(Math.sin(time*3+p.ph)+1)*.03, key=L.t==='key';
    if(r>=3&&!key) dl.push({x:p.x,y:p.y,tex:BEAMT[r],sc:.95,vo:.28,flash:0,glow:true});
    dl.push({x:p.x,y:p.y,tex:ICONT[L.t],sc:.34+r*.012,vo:bob,flash:0});
    dl.push({x:p.x,y:p.y,tex:RINGT[key?6:r],sc:.5+Math.sin(time*4+p.ph)*.025,vo:Math.max(0,bob-.06),flash:0,glow:true});
  };

  api.force=function(t,r){
    if(TYPES.indexOf(t)<0||!lvl) return false;
    r=Math.max(0,Math.min(5,r|0));
    for(let d=1.6;d<=4;d+=.4){ const x=P.x+Math.cos(P.a)*d, y=P.y+Math.sin(P.a)*d; if(solidAt(x,y)) continue; pickups.push({kind:'L',x,y,taken:false,ph:0,loot:{t,r}}); return true; }

  };
  api.state=()=>({keys:api.keys,cores:api.cores,am:Object.assign({},api.am),artifacts:(Save.data.artifacts||[]).slice(),luck:api.luck,chests:S.chests.map(c=>c.opened?1:0),loot:pickups.filter(p=>p.kind==='L'&&!p.taken).length,stats:api.stats});
  api.reset=function(){ api.keys=0; api.cores=0; api.am={}; api.stats=fresh(); api.seen={}; api.t=0; lastDrop=-9; S={chests:[]}; applyArtifacts(); };

  // Texturen (einmalig, 64x64, blind gezeichnet)
  const poly=(g,c,pts)=>{ g.fillStyle=c; g.beginPath(); g.moveTo(pts[0],pts[1]); for(let i=2;i<pts.length;i+=2) g.lineTo(pts[i],pts[i+1]); g.closePath(); g.fill(); };
  const DK='#0b121c';
  const ICONT={
    hp:makeTex(g=>{ px(g,DK,16,16,32,32); px(g,'#FF4D5A',28,20,8,24); px(g,'#FF4D5A',20,28,24,8); px(g,'#FFD0D4',30,22,4,8); },true),
    ammo:makeTex(g=>{ px(g,DK,16,18,32,30); for(let i=0;i<3;i++){ px(g,'#FFAE3D',20+i*9,22,6,20); px(g,'#FFE3A0',21+i*9,22,2,20); px(g,'#B86A10',20+i*9,40,6,4); } },true),
    energy:makeTex(g=>{ px(g,DK,16,14,32,36); poly(g,'#35E4FF',[36,16,22,34,30,34,26,48,42,28,33,28]); },true),
    shield:makeTex(g=>{ poly(g,DK,[14,16,50,16,50,34,32,52,14,34]); poly(g,'#3DB4FF',[18,20,46,20,46,33,32,47,18,33]); poly(g,'#DFF6FF',[22,24,32,24,32,42,22,32]); },true),
    cr:makeTex(g=>{ disc(g,DK,32,32,17,17); disc(g,'#FFAE3D',32,32,13,13); disc(g,'#FFE3A0',32,32,8,8); px(g,'#B86A10',30,26,4,12); },true),

    wmod:makeTex(g=>{ px(g,DK,14,18,36,28); px(g,'#3d4a5c',18,22,28,20); px(g,'#FFAE3D',24,28,16,8); for(let i=0;i<4;i++){ px(g,'#9fb3c8',18+i*8,14,4,4); px(g,'#9fb3c8',18+i*8,46,4,4); } },true),
    amod:makeTex(g=>{ poly(g,DK,[20,12,44,12,54,32,44,52,20,52,10,32]); poly(g,'#5f7a99',[23,17,41,17,48,32,41,47,23,47,16,32]); poly(g,'#B7D0EA',[26,21,38,21,42,30,26,30]); },true),
    perk:makeTex(g=>{ disc(g,DK,32,32,18,18); disc(g,'#B65CFF',32,32,13,13); disc(g,'#E9CCFF',29,29,5,5); px(g,'#FFFFFF',31,10,2,8); px(g,'#FFFFFF',31,46,2,8); },true),
    art:makeTex(g=>{ poly(g,DK,[32,6,54,32,32,58,10,32]); poly(g,'#FFB020',[32,11,49,32,32,53,15,32]); poly(g,'#FFF0C0',[32,17,42,32,32,32,22,32]); poly(g,'#FF3DD8',[32,32,42,32,32,46,26,36]); },true),
    key:makeTex(g=>{ px(g,DK,12,20,40,26); px(g,'#35E4FF',15,23,34,20); px(g,'#0b121c',18,27,10,8); px(g,'#DFFCFF',32,28,14,3); px(g,'#DFFCFF',32,34,14,3); },true)
  };
  const RINGT=RAR.map(x=>x.c).concat([KEYC]).map(c=>makeTex(g=>{ g.strokeStyle=c; g.lineWidth=3; g.beginPath(); g.ellipse(32,32,29,29,0,0,Math.PI*2); g.stroke(); },true));
  const BEAMT=RAR.map(x=>x.c).map(c=>makeTex(g=>{ const gr=g.createLinearGradient(0,0,0,64); gr.addColorStop(0,'rgba(0,0,0,0)'); gr.addColorStop(1,c); g.globalAlpha=.55; g.fillStyle=gr; g.fillRect(28,0,8,64); g.globalAlpha=.9; g.fillRect(31,0,2,64); },false));
  PICKUP_SPR.Q=makeTex(g=>{ px(g,DK,10,26,44,28); px(g,'#4a5566',13,29,38,22); px(g,'#2a3240',13,38,38,3); px(g,'#FFAE3D',28,33,8,10); px(g,'#0b121c',31,36,2,4); px(g,'#8fa3b8',10,22,44,5); },true);

  sfx.lootR=r=>{ const b=[660,740,880,988,1175,1397][r]||660;
    tone(b,b,.07,'square',.14);

  applyArtifacts();
  return api;
})();

    {id:'nova',n:'SUPERNOVA',a:'voidh',b:'dead',d:'Explosionen +25 % Schaden, größerer Radius'},
    {id:'harvest',n:'BLUTERNTE',a:'blood',b:'reaper',d:'Kills heilen zusätzlich +1 HP je 3 Kill-Stapel'},
    {id:'phshield',n:'PHANTOM-SCHILD',a:'phantom',b:'ghost',d:'Dash lädt 20 Schild auf'},
    {id:'bond',n:'KERN-VERBUND',a:'iron',b:'nexus',d:'+4 % Resistenz, +6 Energie-Regeneration',s:{resist:.04,energyRegen:6}}
  ];
  const ORDER=Object.keys(PD);
  const fresh=()=>({offers:0,picked:0,cores:0,synergies:0,healed:0,booms:0});
  const api={ PD, SYN, lv:{}, stacks:0, stackT:0, eliteKills:0, sectors:0, calmT:0, later:0, open:false, stats:fresh() };
  const lv=id=>api.lv[id]||0;
  const syn=id=>{ const s=SYN.find(x=>x.id===id); return !!s&&lv(s.a)>0&&lv(s.b)>0; };
  let boomT=0;

  function apply(){
    let R=api.reaperMax();
    for(const id of ORDER){
      const l=lv(id), key='run:perk:'+id;
      if(l>0&&PD[id].s) Stats.add(key,PD[id].s[l-1]); else Stats.remove(key);
    }
    for(const s of SYN){ const key='run:perk:syn:'+s.id; if(s.s&&syn(s.id)) Stats.add(key,s.s); else Stats.remove(key); }
    reaperFx();
  }
  api.reaperMax=()=>[0,6,8,10][lv('reaper')]||0;
  function reaperFx(){
    const l=lv('reaper');
    if(l>0&&api.stacks>0) Stats.add('run:perk:reaperfx',{dmgMul:api.stacks*[0,.03,.04,.05][l]}); else Stats.remove('run:perk:reaperfx');
  }
  api.give=function(id,silent){
    if(!PD[id]||lv(id)>=3) return false;
    const before=SYN.filter(s=>syn(s.id)).length;
    api.lv[id]=lv(id)+1; apply();
    const S=PD[id].s&&PD[id].s[lv(id)-1];
    if(S){ if(S.armorMax) P.armor=Math.min(P.armorMax,P.armor+S.armorMax*.6); if(S.energyMax) P.energy=Math.min(P.energyMax,P.energy+S.energyMax); }
    const p=Save.data.perks[id]&&typeof Save.data.perks[id]==='object'?Save.data.perks[id]:(Save.data.perks[id]={n:0,max:0});
    p.n=(+p.n||0)+1; p.max=Math.max(+p.max||0,lv(id)); Save.markDirty();
    api.stats.picked++;
    const after=SYN.filter(s=>syn(s.id)).length;
    if(!silent){
      sfx.perkGet(); FX.heal=.3;
      let t='PERK: '+PD[id].n+' '+RN[lv(id)-1];
      if(after>before){ const ns=SYN.filter(s=>syn(s.id)&&!(api.seenSyn||{})[s.id])[0]; if(ns){ (api.seenSyn||(api.seenSyn={}))[ns.id]=1; api.stats.synergies++; t+=' · SYNERGIE '+ns.n; sfx.perkSyn(); } }
      showMsg(t,3000); const m=$('msg'); if(m&&m.style) m.style.color=PD[id].c;
    }
    return true;
  };
  function pool(){ return ORDER.filter(id=>lv(id)<3); }
  function pickOffers(n){
    const c=pool(), out=[];
    const wt=id=>{ let w=lv(id)>0?1.3:1;
      for(const s of SYN){ if(s.a===id&&lv(s.b)>0&&lv(s.a)===0) w+=1.4; if(s.b===id&&lv(s.a)>0&&lv(s.b)===0) w+=1.4; }
      return w; };
    while(out.length<n&&c.length){
      let t=0; for(const id of c) t+=wt(id); let r=Math.random()*t, k=0;
      for(let i=0;i<c.length;i++){ r-=wt(c[i]); if(r<=0){ k=i; break; } }
      out.push(c.splice(k,1)[0]);
    }
    return out;
  }
  function synOf(id){ return SYN.filter(s=>(s.a===id&&lv(s.b)>0&&lv(id)===0)||(s.b===id&&lv(s.a)>0&&lv(id)===0)); }
  function owned(){
    const h=ORDER.filter(id=>lv(id)>0).map(id=>'<span style="color:'+PD[id].c+'">'+PD[id].n+' '+RN[lv(id)-1]+'</span>').join(' · ');
    const sy=SYN.filter(s=>syn(s.id)).map(s=>'<span style="color:#FFD24D">◆ '+s.n+'</span> — '+s.d).join('<br>');
    return (h||'<span style="opacity:.6">Noch keine Perks</span>')+(sy?'<br>'+sy:'');
  }
  function close(back){
    api.open=false; hideOverlay();
    if(back){ back(); return; }
    setState('play'); requestLock(); lastT=performance.now();
  }
  api.offer=function(back){
    if(api.open) return;
    const opts=pickOffers(3);
    if(!opts.length){ api.screen(back); return; }
    if(state==='play'){ setState('pause'); releaseLock(); }
    api.open=true; api.stats.offers++;
    const cards=opts.map((id,i)=>{ const l=lv(id), sy=synOf(id);
      return '<button data-p="'+id+'" style="display:block;width:100%;min-height:56px;margin:8px 0;padding:10px 12px;text-align:left;border:1px solid '+PD[id].c+';background:rgba(6,12,22,.9);color:#dfe9f3;font:inherit;cursor:pointer;clip-path:polygon(8px 0,100% 0,100% calc(100% - 8px),calc(100% - 8px) 100%,0 100%,0 8px)">'+
        '<b style="color:'+PD[id].c+';letter-spacing:.06em">'+PD[id].n+' '+RN[l]+'</b>'+(l?' <span style="opacity:.6">(von '+RN[l-1]+')</span>':'')+
        '<br><span style="font-size:.92em">'+PD[id].d[l]+'</span>'+
        (sy.length?'<br><span style="color:#FFD24D;font-size:.85em">◆ Synergie: '+sy.map(s=>s.n).join(', ')+'</span>':'')+'</button>'; }).join('');
    showOverlay({html:'<h2>Perk wählen</h2><p>Perk-Kerne: '+Loot.cores+'</p>'+cards+
      '<div style="font-size:.8em;opacity:.85;margin:6px 0">'+owned()+'</div><div class="row"><button id="pkLater" style="min-height:44px">Später</button></div>',
      onMount:box=>{
        for(const b of box.querySelectorAll('button[data-p]')) b.onclick=()=>{
          if(!Loot.takeCore()){ close(back); return; }
          api.give(b.getAttribute('data-p'));
          if(Loot.cores>0&&pool().length){ api.open=false; api.offer(back); } else close(back);
        };
        const l=box.querySelector('#pkLater'); if(l) l.onclick=()=>{ api.later=45; close(back); };
      }});
  };
  api.screen=function(back){
    if(Loot.cores>0&&pool().length){ api.offer(back||pauseMenu); return; }
    showOverlay({html:'<h2>Perks</h2><p>Perk-Kerne: '+Loot.cores+' — Kerne gibt es von Bossen, Elite-Kills, Sektor-Abschlüssen und Beute.</p><div style="font-size:.9em;line-height:1.6;margin:8px 0">'+owned()+'</div>'+
      '<div class="row"><button class="primary" id="pkBack" style="min-height:44px">Zurück</button></div>',
      onMount:box=>{ const b=box.querySelector('#pkBack'); if(b) b.onclick=()=>{ if(back) back(); else pauseMenu(); }; }});
  };

  api.onKill=function(e){
    if(state!=='play') return;
    let h=[0,2,3,5][lv('blood')]||0;
    if(h&&syn('harvest')) h+=Math.floor(api.stacks/3);
    if(h&&P.hp<100&&P.hp>0){ const g=Math.min(100-P.hp,h); P.hp+=g; api.stats.healed+=g; FX.heal=Math.max(FX.heal||0,.15); }
    const k=[0,5,8,12][lv('kinetic')]||0;
    if(k&&P.shieldMax>0&&P.hp>0) P.shield=Math.min(P.shieldMax,P.shield+k);
    if(lv('reaper')>0){ const mx=api.reaperMax(); if(api.stacks<mx){ api.stacks++; reaperFx(); } api.stackT=4; }
    if(e.elite&&++api.eliteKills%4===0){ Loot.cores++; api.stats.cores++; showMsg('Perk-Kern gesichert ('+Loot.cores+')',2000); sfx.lootR(3); }
  };
  api.onCrit=function(e,d){
    const l=lv('voidh'); if(!l||state!=='play'||boomT>0) return;
    boomT=.12; const sn=syn('nova');
    const R=[0,1.2,1.5,1.8][l]*(sn?1.25:1), f=[0,.4,.6,.85][l]*(sn?1.25:1);
    splash(e.x,e.y,R,Math.max(2,d*f/Math.max(.1,Stats.val.dmgMul)),e,false,null);
    spawnBoom(e.x,e.y,.6+R*.35,BOOM_VOID); sfx.boomP(Math.hypot(e.x-P.x,e.y-P.y)); api.stats.booms++;
  };
  api.onDash=function(){ if(syn('phshield')&&P.shieldMax>0) P.shield=Math.min(P.shieldMax,P.shield+20); };
  api.onSector=function(){
    const boss=lvl&&lvl.lock==='boss'; api.sectors++;
    const n=boss?1:(api.sectors%2===0?1:0);
    if(n){ Loot.cores+=n; api.stats.cores+=n; }
    return n;
  };
  api.onLevel=function(){ api.stacks=0; api.stackT=0; api.calmT=0; boomT=0; reaperFx(); };

  api.tick=function(dt){
    if(boomT>0) boomT-=dt;
    if(state!=='play'){ api.calmT=0; return; }
    if(api.open){ api.open=false; }   // Overlay per Esc/Pause geschlossen -> Wahl wieder moeglich
    if(api.stacks>0){ api.stackT-=dt; if(api.stackT<=0){ api.stacks--; api.stackT=1.1; reaperFx(); } }
    if(api.later>0) api.later-=dt;
    if(Loot.cores>0&&!api.open&&api.later<=0&&!fadeBusy&&pool().length){
      let calm=true; for(const e of enemies){ if(e.alive&&e.awake){ calm=false; break; } }
      api.calmT=calm?api.calmT+dt:0;
      if(api.calmT>2) { api.calmT=0; api.offer(); }
    } else api.calmT=0;
  };
  api.extra=function(){
    const n=ORDER.reduce((a,id)=>a+(lv(id)>0?1:0),0); if(!n) return '';
    return 'PERKS '+n+(api.stacks>0?' · REAPER ×'+api.stacks:'');
  };
  api.reset=function(){ api.lv={}; api.stacks=0; api.stackT=0; api.eliteKills=0; api.sectors=0; api.calmT=0; api.later=0; api.open=false; api.seenSyn={}; api.stats=fresh(); boomT=0; apply(); };
  api.load=function(o){ api.lv=Object.assign({},o.lv||{}); api.stacks=0; api.stackT=0; api.eliteKills=o.eliteKills|0; api.sectors=o.sectors|0; api.seenSyn=Object.assign({},o.seenSyn||{}); apply(); };   // Speicherpunkt (Endlos-Einsatz)
  api.state=()=>({lv:Object.assign({},api.lv),cores:Loot.cores,stacks:api.stacks,syn:SYN.filter(s=>syn(s.id)).map(s=>s.id),stats:api.stats});
  Loot.extra=api.extra;
  sfx.perkGet=()=>{ [440,660,880,1100].forEach((f,i)=>tone(f,f*1.02,.1,'triangle',.16,i*.06)); };
  sfx.perkSyn=()=>{ tone(880,1320,.25,'sawtooth',.1,.25); tone(1320,1760,.3,'sine',.14,.35); };
  return api;
})();


/* ============================================================
   Meta-Progression (Phase 15): dauerhafter Fortschritt ueber Laeufe hinweg, alles in Save.data (LocalStorage, offline).
   Credits kaufen Charakter-Upgrades (`meta:up`, laufen ueber Stats), Start-Lizenzen (Waffe im Startarsenal von Zufallslaeufen,
   erst nach dem ersten Fund) und Waffen-Feinabstimmung (+6 % Schaden/+1 % Krit je Stufe, siehe Mods.build). Dazu dauerhafte
   Herausforderungen (Stufen, automatische Auszahlung), Rekorde (Bestzeit je Tiefe, Boss-Kills je Variante) und der Archiv-Screen.
   Konsole: __breach.Meta.state(), .screen(), Save.data.credits+=1000 zum Testen.
   ============================================================ */
const Meta=(()=>{
  const D=()=>Save.data, api={};
  const RM=['I','II','III','IV','V'];
  const UP=[
    {id:'armor',n:'Panzerkern',max:5,base:110,b:l=>({armorMax:8*l}),t:l=>'+'+8*l+' max. Panzerung'},
    {id:'shield',n:'Schildmatrix',max:5,base:120,b:l=>({shieldMax:6*l,shieldRegen:l}),t:l=>'+'+6*l+' max. Schild, +'+l+' Schild-Regen/s'},
    {id:'energy',n:'Energiekern',max:5,base:110,b:l=>({energyMax:8*l,energyRegen:2*l}),t:l=>'+'+8*l+' max. Energie, +'+2*l+' Regen/s'},
    {id:'regen',n:'Nanoreparatur',max:4,base:160,b:l=>({hpRegen:.15*l}),t:l=>'+'+(Math.round(.15*l*100)/100).toString().replace('.',',')+' HP/s Regeneration'},
    {id:'speed',n:'Servo-Antrieb',max:4,base:130,b:l=>({speed:.02*l}),t:l=>'+'+2*l+' % Tempo'},
    {id:'crit',n:'Zielsystem',max:5,base:150,b:l=>({crit:.01*l,critDmg:.04*l}),t:l=>'+'+l+' % Krit-Chance, +'+4*l+' % Krit-Schaden'},
    {id:'dash',n:'Phantomkondensator',max:3,base:250,b:l=>({dashCd:-.06*l,dashDist:.15*l,dashCharges:l>=3?1:0}),t:l=>'Dash-Abklingzeit −'+(Math.round(.06*l*100)/100).toString().replace('.',',')+' s, Weite +'+(Math.round(.15*l*100)/100).toString().replace('.',',')+(l>=3?', Doppel-Dash':'')},
    {id:'start',n:'Einsatzpaket',max:5,base:140,b:l=>({armorSector:.05*l}),t:l=>'Start: +'+6*l+' Zellen, +'+5*l+' % Panzerung je Sektor'},
    {id:'cores',n:'Kern-Vorrat',max:2,base:400,b:l=>({}),t:l=>'Endlos-Einsatz beginnt mit '+l+' Perk-Kern'+(l>1?'en':'')}
  ];
  const UPB=Object.create(null); for(const u of UP) UPB[u.id]=u;
  const LIC={shotgun:300,auto:600,plasma:1000,arc:1500,rail:1800,void:2800,singularity:4500};
  const upCost=(u,l)=>Math.round(u.base*(1+.9*l)/5)*5, tuneCost=l=>100+120*l;
  const wIdx=id=>WEAPONS.findIndex(w=>w.id===id);
  const CH=[
    {id:'kills',n:'Rogue-Jäger',u:'Kills',t:[50,250,1000,4000],r:[40,120,350,900],get:()=>D().stats.kills},
    {id:'boss',n:'Wächter-Bezwinger',u:'Boss-Kills',t:[1,4,10,25],r:[80,220,500,1200],get:()=>D().stats.bossKills},
    {id:'depth',n:'Tiefenläufer',u:'Tiefe',t:[3,6,10,15],r:[60,180,450,1000],get:()=>D().highestDepth},
    {id:'sect',n:'Sektor-Räumer',u:'Sektoren',t:[5,25,75,200],r:[40,140,400,1000],get:()=>D().stats.sectorsCleared},
    {id:'runs',n:'Dauerbrenner',u:'Läufe',t:[3,10,30,80],r:[30,100,300,800],get:()=>D().stats.runs},
    {id:'elite',n:'Elite-Schlächter',u:'Elite-Kills',t:[5,25,100,300],r:[50,160,450,1100],get:()=>D().meta.cnt.elites|0},
    {id:'perk',n:'Perk-Sammler',u:'Perk-Wahlen',t:[3,10,25,60],r:[40,140,400,900],get:()=>{ let n=0; for(const k in D().perks){ const p=D().perks[k]; if(p&&typeof p==='object') n+=p.n|0; } return n; }},
    {id:'arts',n:'Artefakt-Archiv',u:'Artefakte',t:[1,3,6,8],r:[60,200,500,1000],get:()=>(D().artifacts||[]).length},
    {id:'arms',n:'Arsenal',u:'Waffen entdeckt',t:[2,4,6,7],r:[60,180,450,900],get:()=>Math.max(0,D().unlockedWeapons.length-2)},
    {id:'streak',n:'Kill-Serie',u:'Serie',t:[10,25,50,100],r:[40,130,350,900],get:()=>D().records.bestStreak},
    {id:'score',n:'Punktejäger',u:'Bestwert',t:[5000,25000,100000,400000],r:[40,150,450,1100],get:()=>D().bestScore|0},
    {id:'x10',n:'Überlast',u:'×10-Kombos',t:[1,10,40,100],r:[60,200,500,1200],get:()=>D().meta.cnt.x10|0},
    {id:'mis',n:'Missionar',u:'Missionen',t:[3,12,40,100],r:[40,140,400,1000],get:()=>D().meta.cnt.missions|0},
    {id:'upg',n:'Aufrüster',u:'Upgrade-Stufen',t:[3,10,20,35],r:[30,100,300,700],get:()=>{ let n=0; for(const k in D().meta.up) n+=D().meta.up[k]|0; return n; }}
  ];
  const snd=(f)=>{ try{ initAudio(); f(); }catch(e){} };
  const ok=()=>snd(()=>sfx.perkGet&&sfx.perkGet()), no=()=>snd(()=>sfx.noEnergy&&sfx.noEnergy());

  function apply(){

    refreshWeaponUI();
  };
  api.onKill=function(e){
    const d=D();
    if(e.type==='K'){ const k=String(e.bv|0); d.records.bosses[k]=(d.records.bosses[k]|0)+1; }
    if(e.elite) d.meta.cnt.elites=(d.meta.cnt.elites|0)+1;
  };
  /* Herausforderungen: zahlt jede neu erreichte Stufe sofort aus, liefert Ergebniszeilen */
  api.check=function(){
    const out=[], d=D();
    for(const c of CH){
      let k=d.challenges[c.id]|0; const k0=k, v=c.get();
      while(k<c.t.length&&v>=c.t[k]){ d.credits+=c.r[k]; out.push(['Ziel: '+c.n+' '+RM[k],'+'+c.r[k]+' Cr']); k++; }

  api.onSector=function(depth,time){

    }

    return out.concat(api.check());

  /* ---- Archiv-Screen (Buttons >= 48 px, touch-tauglich) ---- */
  const btn=(attrs,name,sub,dis)=>'<button class="ld-opt" '+attrs+(dis?' disabled':'')+' style="min-height:52px'+(dis?';opacity:.55':'')+'"><b>'+name+'</b><small>'+sub+'</small></button>';
  function upBody(){
    const d=D(); let h='';

      const l=d.meta.up[u.id]|0, mx=l>=u.max, c=mx?0:upCost(u,l);
      h+=btn('data-up="'+u.id+'"',u.n+' · Stufe '+l+'/'+u.max,(l?u.t(l)+(mx?' · MAX':' → '):'')+(mx?'':u.t(l+1)+' · '+c+' Cr'),mx||d.credits<c);
    }
    return h;
  }
  function wpBody(){
    const d=D(); let h='<p style="font-size:.9em;opacity:.85;margin:4px 0">Start-Lizenz: Die Waffe liegt zu Beginn jedes Endlos-Einsatzes im Arsenal (erst nach dem ersten Fund im Lauf möglich). Feinabstimmung: dauerhaft +6 % Schaden und +1 % Krit je Stufe.</p>';

    return h;
  }
  function chBody(){
    const d=D(); let h='<p style="font-size:.9em;opacity:.85;margin:4px 0">Dauerhafte Ziele über alle Läufe. Jede Stufe zahlt Credits automatisch aus.</p>';
    for(const c of CH){
      const k=Math.min(d.challenges[c.id]|0,c.t.length), v=c.get(), done=k>=c.t.length;
      const goal=c.t[Math.min(k,c.t.length-1)], pct=done?100:Math.min(100,Math.round(100*v/goal));
      h+='<div style="margin:9px 0;padding:8px 10px;border:1px solid rgba(53,228,255,.25)"><b>'+c.n+'</b> <span style="opacity:.7">'+(done?'· abgeschlossen ('+c.t.length+'/'+c.t.length+')':'· Stufe '+RM[k]+' · '+k+'/'+c.t.length)+'</span><br>'+
        '<span style="font-size:.88em">'+(done?'Höchste Stufe erreicht: '+v+' '+c.u:Math.min(v,goal)+' / '+goal+' '+c.u+' → +'+c.r[k]+' Cr')+'</span>'+
        '<div style="height:6px;background:rgba(255,255,255,.1);margin-top:5px"><div style="height:100%;width:'+pct+'%;background:#35E4FF"></div></div></div>';
    }
    return h;
  }
  function coBody(){
    const co=D().cosmetics; let h='<p style="font-size:.9em;opacity:.85;margin:4px 0">Kosmetik gibt es als Bonus für erfüllte Missionen. Sie färbt das Fadenkreuz sowie die Loot- und Missionszeile.</p>';
    h+=btn('data-cos=""','Standard (Cyan)',!co.sel?'aktiv':'',!co.sel);
    for(const c of Missions.COS){ const own=co.own.indexOf(c.id)>=0; h+=btn('data-cos="'+c.id+'"','<span style="color:'+c.c+'">■</span> '+c.n,own?(co.sel===c.id?'aktiv':'freigeschaltet'):'noch gesperrt',!own||co.sel===c.id); }
    return h;
  }
  function rcBody(){
    const d=D(), r=d.records, row=(a,b)=>'<span>'+a+'</span><span>'+b+'</span>';
    let h='<div class="stats">'+row('Höchste Tiefe',d.highestDepth||'–')+row('Bestzeit Kampagne',d.bestTime?fmt(d.bestTime):'–')+row('Meiste Kills (Lauf)',r.bestKills||'–')+row('Längste Kill-Serie',r.bestStreak||'–')+row('Beste Punktzahl',d.bestScore||'–')+
      row('Kills gesamt',d.stats.kills)+row('Läufe / Tode',d.stats.runs+' / '+d.stats.deaths)+row('Sektoren gesäubert',d.stats.sectorsCleared)+row('Spielzeit',fmt(d.stats.playTime));
    let any=false;
    for(let v=0;v<4;v++){ const n=r.bosses[String(v)]|0; let nm='Boss '+(v+1); try{ nm=Boss.name({bv:v}); }catch(e){} h+=row('Boss '+nm,n?n+'× besiegt':'–'); if(n) any=true; }
    const ds=Object.keys(r.sector).map(Number).sort((a,b)=>a-b).slice(0,14);
    for(const dp of ds) h+=row('Bestzeit Tiefe '+dp,fmt(r.sector[String(dp)]));
    return h+'</div>';
  }
  api.screen=function(back,tab,keep){
    tab=tab||'up'; const ob=$('obox'), sc=(keep&&ob)?ob.scrollTop:0;
    const news=api.check(); const d=D();
    const tabs=[['up','Upgrades'],['wp','Waffen'],['ch','Ziele'],['rc','Rekorde'],['co','Kosmetik']].map(t=>'<button class="ld-opt'+(t[0]===tab?' on':'')+'" data-tab="'+t[0]+'" style="width:auto;flex:1 1 18%;min-height:48px;align-items:center;text-align:center"><b>'+t[1]+'</b></button>').join('');
    const body=tab==='wp'?wpBody():tab==='ch'?chBody():tab==='rc'?rcBody():tab==='co'?coBody():upBody();
    const nh=news.length?'<div style="color:#FFD24D;font-size:.9em;margin:4px 0">'+news.map(n=>'◆ '+escH(n[0])+' '+escH(n[1])).join('<br>')+'</div>':'';
    showOverlay({wide:true,html:'<h2>Archiv</h2><p>Credits: <b style="color:#FFD24D">'+d.credits+'</b> · bleibt zwischen Läufen erhalten</p><div class="ld-tabs">'+tabs+'</div>'+nh+body+
      '<div class="row"><button class="primary" id="mtBack" style="min-height:48px">Zurück</button><button id="mtMis" type="button" style="min-height:48px">Missionen</button></div>',
      onMount:box=>{
        const go=(f,t)=>b=>{ initAudio(); f(b)?ok():no(); api.screen(back,t,true); };
        box.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>api.screen(back,b.getAttribute('data-tab')));
        box.querySelectorAll('[data-up]').forEach(b=>b.onclick=()=>go(x=>api.buyUp(x.getAttribute('data-up')),'up')(b));
        box.querySelectorAll('[data-lic]').forEach(b=>b.onclick=()=>go(x=>api.buyLic(x.getAttribute('data-lic')),'wp')(b));
        box.querySelectorAll('[data-tune]').forEach(b=>b.onclick=()=>go(x=>api.buyTune(x.getAttribute('data-tune')),'wp')(b));
        box.querySelectorAll('[data-cos]').forEach(b=>b.onclick=()=>go(x=>Missions.equip(x.getAttribute('data-cos')),'co')(b));
        box.querySelector('#mtBack').onclick=()=>{ if(back) back(); else showTitle(); };
        box.querySelector('#mtMis').onclick=()=>{ Missions.screen(()=>api.screen(back,tab)); };
        if(sc) box.scrollTop=sc;
      }});
  };
  api.state=()=>({credits:D().credits,meta:JSON.parse(JSON.stringify(D().meta)),challenges:Object.assign({},D().challenges),records:JSON.parse(JSON.stringify(D().records))});
  apply();
  return api;
})();


/* ============================================================
   Missions-System (Phase 16): pro Sektor 2 (ab Tiefe 6: 3) optionale Ziele, in der HUD-Zeile `#msHud` (oben links, unter dem Sektortext).
   Werden beim ersten Spiel-Frame eines Sektors gewuerfelt (nur machbare) und bleiben nach Tod-Neustart gleich (`lvl._ms`).
   Erfolg -> Credits (+ Bonus: MOGC / Perk-Kern / Waffen-Mod / Kosmetik). Kosmetik wirkt auf Fadenkreuz + Loot-/Mission-HUD (Tab Archiv > Kosmetik).
   Konsole: __breach.Missions.state(), .force('speed'), .list.
   ============================================================ */
const Missions=(()=>{
  const api={ list:[], cur:null, stats:{rolled:0,done:0,failed:0}, el:null, sig:'' };
  const D=()=>Save.data;
  const COS=[{id:'amber',n:'Signal Bernstein',c:'#FFAE3D'},{id:'magenta',n:'Signal Magenta',c:'#FF4DDB'},{id:'lime',n:'Signal Lime',c:'#9BFF4D'},
             {id:'white',n:'Signal Weiß',c:'#FFFFFF'},{id:'red',n:'Signal Rot',c:'#FF5A5A'},{id:'violet',n:'Signal Violett',c:'#B58CFF'}];
  const depth=()=>(lvl&&lvl.depth)||((lvIdx|0)+1)||1;
  const fs=t=>fmt(t);
  const DEF={
    nodmg:{n:'Makellos',ok:()=>totals.foes>=4,init:(m,d)=>{ m.goal=Math.min(14,Math.min(5+(d>>1),Math.max(3,Math.round(totals.foes*.7)))); },tier:2,
      txt:m=>m.goal+' Kills am Stück ohne Schaden ('+m.v+'/'+m.goal+')'},
    speed:{n:'Schnellläufer',ok:()=>!!exitCell,init:(m)=>{ m.goal=Math.round(Math.max(120,70+totals.foes*7)/5)*5; },tier:2,
      txt:m=>'Sektor unter '+fs(m.goal)+' abschließen'},
    plasma:{n:'Nur Plasma',ok:()=>P.owned[WEAPONS.findIndex(w=>w.id==='plasma')]&&totals.foes>=5,init:(m)=>{ m.goal=Math.min(8,Math.max(4,Math.round(totals.foes*.4))); },tier:3,
      txt:m=>'Nur Plasma-Kanone benutzen, '+m.goal+' Kills ('+m.v+'/'+m.goal+')'},
    nohp:{n:'Ohne Heilung',ok:()=>totals.foes>=4,init:()=>{},tier:2,txt:()=>'Keine Health-Pickups nehmen'},
    elite:{n:'Elite-Jäger',ok:()=>enemies.reduce((a,e)=>a+(e.elite?1:0),0)>=2,init:(m)=>{ m.goal=Math.min(3,enemies.reduce((a,e)=>a+(e.elite?1:0),0)); },tier:3,
      txt:m=>m.goal+' Elite-Gegner besiegen ('+m.v+'/'+m.goal+')'},
    secret:{n:'Geheimnis',ok:()=>Events.list().some(ev=>ev.id==='hidden'||ev.id==='vault'),init:()=>{},tier:2,txt:()=>'Finde den geheimen Raum'},
    bossnd:{n:'Ohne Dash',ok:()=>!!bossOf(),init:()=>{},tier:3,txt:()=>'Boss besiegen, ohne zu dashen'},
    shards:{n:'Datensammler',ok:()=>totals.shards>=3,init:(m)=>{ m.goal=totals.shards; },tier:1,txt:m=>'Alle MOGC-Splitter einsammeln ('+stats.shards+'/'+totals.shards+')'}
  };
  const ORDER=Object.keys(DEF);
  const M=id=>api.list.find(m=>m.id===id);
  const act=id=>{ const m=M(id); return m&&m.st===0?m:null; };

  function pay(m){
    const d=depth(), t=m.tier, base=Math.round((22+8*d)*(1+.5*(t-1)));
    D().credits+=base; D().meta.cnt.missions=(D().meta.cnt.missions|0)+1; Save.markDirty();
    let extra='';
    if(Math.random()<[.5,.75,1][t-1]){
      const k=['mogc','perk','mod','cosm'][(Math.random()*(t>=2?4:3))|0];
      if(k==='mogc'){ const n=t+1; stats.shards+=n; totals.shards+=n; extra=' · MOGC +'+n; }
      else if(k==='perk'&&t>=2){ Loot.cores++; extra=' · Perk-Kern'; }
      else if(k==='mod'||k==='perk'){ const id=Mods.roll(d+t*2); if(Mods.add(id,true)) extra=' · Mod '+MOD_BY_ID[id].name; else { D().credits+=25; extra=' · +25 Cr'; } }
      else { const own=D().cosmetics.own, left=COS.filter(c=>own.indexOf(c.id)<0);
        if(left.length){ const c=left[(Math.random()*left.length)|0]; own.push(c.id); if(!D().cosmetics.sel) D().cosmetics.sel=c.id; extra=' · Kosmetik '+c.n; api.applyCos(); }
        else { D().credits+=25; extra=' · +25 Cr'; } }
    }
    m.rw='+'+base+' Cr'+extra; api.stats.done++;
    return m.rw;
  }
  function win(m){ if(m.st!==0) return; m.st=1; const r=pay(m); showMsg('MISSION ERFÜLLT · '+DEF[m.id].n+' · '+r,3200); sfx.evOK&&sfx.evOK(); }
  function lose(m,why){ if(m.st!==0) return; m.st=2; api.stats.failed++; showMsg('Mission verfehlt · '+DEF[m.id].n+(why?' ('+why+')':''),2200); sfx.evFail&&sfx.evFail(); }

  api.setup=function(){ api.cur=null; api.list=[]; };
  function init(){
    api.cur=lvl; api.list=[];
    if(!lvl) return;
    const d=depth(), boss=!!bossOf();
    if(!lvl._ms){
      const pool=ORDER.filter(id=>{ try{ return !!DEF[id].ok(); }catch(e){ return false; } });
      const want=Math.min(pool.length,d>=6?3:2), pick=[];
      if(boss&&pool.indexOf('bossnd')>=0){ pick.push('bossnd'); pool.splice(pool.indexOf('bossnd'),1); }
      else { const i=pool.indexOf('bossnd'); if(i>=0) pool.splice(i,1); }
      while(pick.length<want&&pool.length) pick.push(pool.splice((Math.random()*pool.length)|0,1)[0]);
      lvl._ms=pick;
    }
    for(const id of lvl._ms){ const m={id,st:0,v:0,goal:0,tier:DEF[id].tier,rw:''}; try{ DEF[id].init(m,d); }catch(e){} api.list.push(m); api.stats.rolled++; }
    if(api.list.length) showMsg('MISSIONEN: '+api.list.map(m=>DEF[m.id].n).join(' · '),3200);
  }
  api.onKill=function(e){
    if(state!=='play') return;
    let m=act('nodmg'); if(m&&++m.v>=m.goal) win(m);
    m=act('plasma'); if(m){ if(WEAPONS[P.weapon].id==='plasma'){ if(++m.v>=m.goal){ /* Auswertung am Sektorende */ } } else lose(m,'andere Waffe'); }
    if(e.elite){ m=act('elite'); if(m&&++m.v>=m.goal) win(m); }
    if(e.type==='K'){ m=act('bossnd'); if(m) win(m); }
  };
  api.onHurt=function(){ const m=act('nodmg'); if(m) m.v=0; };
  api.onHeal=function(){ const m=act('nohp'); if(m) lose(m,'Heilung genommen'); };
  api.onDash=function(){ const m=act('bossnd'); if(m&&bossOf()) lose(m,'Dash benutzt'); };
  api.onSecret=function(){ const m=act('secret'); if(m) win(m); };
  /* Sektorende bzw. Etagenwechsel: Ziele, die erst am Ende feststehen */
  api.onFinish=function(quiet){
    const rows=[];
    if(api.cur!==lvl) return rows;
    let m=act('speed'); if(m){ if(stats.time<=m.goal) win(m); else lose(m,'zu langsam'); }
    m=act('plasma'); if(m){ if(m.v>=m.goal) win(m); else lose(m,m.v+'/'+m.goal); }
    m=act('nohp'); if(m) win(m);
    m=act('shards'); if(m){ if(stats.shards>=totals.shards) win(m); else lose(m); }
    for(const x of api.list){ if(x.st===0) lose(x); }
    if(!quiet){ const ok=api.list.filter(x=>x.st===1).length; if(api.list.length) rows.push(['Missionen',ok+' / '+api.list.length]);
      for(const x of api.list) if(x.st===1) rows.push(['Mission: '+DEF[x.id].n,x.rw]); }
    api.list=[]; api.cur=null; api.sig='';
    return rows;
  };

  api.applyCos=function(){
    const c=COS.find(x=>x.id===D().cosmetics.sel), col=c?c.c:'';
    try{ const xh=$('xh'); if(xh){ if(col) xh.style.setProperty('--cyan',col); else xh.style.removeProperty('--cyan'); } }catch(e){}
    api.col=col;
  };
  api.COS=COS;
  api.equip=function(id){ const co=D().cosmetics; if(id&&co.own.indexOf(id)<0) return false; co.sel=id||''; Save.markDirty(); api.applyCos(); return true; };

  function dom(){
    if(api.el) return;
    try{ const st=$('stage'); if(!st) return; const el=document.createElement('div'); el.id='msHud';
      el.style.cssText='position:absolute;left:1.6cqw;top:6.4cqw;max-width:34cqw;font:600 clamp(10px,1.1cqw,16px)/1.3 monospace;letter-spacing:.03em;color:#dfe9f3;text-shadow:0 0 5px #000;pointer-events:none;display:none;z-index:6';
      st.appendChild(el); api.el=el; api.applyCos(); }catch(e){}
  }
  api.tick=function(dt){
    dom();
    if(state==='play'&&api.cur!==lvl&&!fadeBusy) init();
    if(!api.el) return;
    let sig='0';
    if(state==='play'&&api.cur===lvl&&api.list.length){
      const sp=act('speed'); if(sp&&stats.time>sp.goal) lose(sp,'zu langsam');
      sig=api.list.map(m=>m.st+DEF[m.id].txt(m)+(m.id==='speed'&&m.st===0?Math.ceil(m.goal-stats.time):'')).join('|')+(api.col||'');
    }
    if(sig===api.sig) return; api.sig=sig;
    if(sig==='0'){ api.el.style.display='none'; return; }
    const col=api.col||'#35E4FF';
    api.el.innerHTML=api.list.map(m=>{ const t=DEF[m.id].txt(m)+(m.id==='speed'&&m.st===0?' · '+fs(Math.max(0,m.goal-stats.time)):'');
      return '<div style="'+(m.st===1?'color:#7CFF9B':m.st===2?'color:#7a8794;text-decoration:line-through':'')+'"><span style="color:'+(m.st?'inherit':col)+'">'+(m.st===1?'✓':m.st===2?'✗':'◆')+'</span> '+escH(t)+'</div>'; }).join('');
    api.el.style.display='block';
  };
  /* ---- Missionen-Screen (Pause-Menü + Archiv): aktueller Sektor + Katalog ---- */
  const CAT={
    nodmg:'Besiege am Stück mehrere Gegner, ohne Schaden zu nehmen. Ein Treffer setzt den Zähler zurück.',
    speed:'Schließe den Sektor unter der Par-Zeit ab (2 min oder mehr, je nach Gegnerzahl).',
    plasma:'Erledige die Kill-Vorgabe nur mit der Plasma-Kanone (nur wenn du sie besitzt). Andere Waffenkills = verfehlt.',
    nohp:'Nimm im Sektor keinen einzigen Health-Pickup.',
    elite:'Besiege 2–3 Elite-Gegner (nur in Sektoren mit mindestens 2 Elites).',
    secret:'Öffne den Geheimraum oder Tresor (nur wenn der Sektor einen hat).',
    bossnd:'Besiege den Boss, ohne zu dashen. Auf Boss-Ebenen immer dabei.',
    shards:'Sammle alle MOGC-Splitter des Sektors ein.'
  };
  let msCss=false;
  function msStyle(){
    if(msCss) return; msCss=true;
    const el=document.createElement('style');
    el.textContent='.ms-list{max-height:60cqh;overflow:auto;text-align:left;margin:1cqw 0;padding-right:.8cqw;-webkit-overflow-scrolling:touch}'+
      '.ms-h{margin:1.4cqw 0 .5cqw;font:800 1.25cqw/1 monospace;letter-spacing:.25em;color:#35E4FF;border-bottom:1px solid rgba(53,228,255,.35);padding-bottom:.4cqw}'+
      '.ms-r{display:grid;grid-template-columns:2em minmax(0,1fr) auto;align-items:center;gap:1.2cqw;min-height:48px;padding:.5cqw 0;border-bottom:1px solid rgba(53,228,255,.12);font:600 clamp(12px,1.5cqw,20px)/1.25 monospace;color:#dfe9f3}'+
      '.ms-r i{font-style:normal;text-align:center;font-size:1.4em;color:#35E4FF}'+
      '.ms-r.ok{color:#7CFF9B}.ms-r.ok i{color:#7CFF9B}.ms-r.fail{color:#7a8794}.ms-r.fail i{color:#7a8794}'+
      '.ms-r .mn{display:block;font-weight:800;letter-spacing:.1em}.ms-r small{display:block;opacity:.8;font-weight:500}'+
      '.ms-r em{font-style:normal;color:#FFAE3D;text-align:right;font-size:.9em;white-space:nowrap}'+
      '.ms-note{margin:.8cqw 0;font:500 clamp(11px,1.35cqw,18px)/1.35 monospace;color:#9fb0c2}';
    document.head.appendChild(el);
  }
  api.screen=function(back){
    msStyle(); const d=D(), st=['◆','✓','✗'], cls=['','ok','fail'];
    const live=state==='pause'&&api.cur===lvl&&api.list.length>0, dp=depth();
    let h='<h2>Missionen — '+(d.meta.cnt.missions|0)+' erfüllt</h2><div class="ms-list">';
    if(live){
      h+='<div class="ms-h">AKTUELLER SEKTOR</div>';
      for(const m of api.list){
        const base=Math.round((22+8*dp)*(1+.5*(m.tier-1)));
        const side=m.st===1?(m.rw||'erfüllt'):m.st===2?'verfehlt':'+'+base+' Cr';
        const extra=(m.id==='speed'&&m.st===0)?' · noch '+fs(Math.max(0,m.goal-stats.time)):'';
        h+='<div class="ms-r '+cls[m.st]+'"><i>'+st[m.st]+'</i><div><span class="mn">'+escH(DEF[m.id].n)+' · Stufe '+['I','II','III'][m.tier-1]+'</span><small>'+escH(DEF[m.id].txt(m)+extra)+'</small></div><em>'+escH(side)+'</em></div>';
      }
    }
    h+='<div class="ms-h">MISSIONSKATALOG</div>';
    for(const id of ORDER){
      h+='<div class="ms-r"><i>◇</i><div><span class="mn">'+escH(DEF[id].n)+'</span><small>'+escH(CAT[id]||'')+'</small></div><em>Stufe '+['I','II','III'][DEF[id].tier-1]+'</em></div>';
    }
    const own=d.cosmetics.own.length;
    h+='<div class="ms-note">Pro Sektor gibt es 2 optionale Missionen (ab Tiefe 6: 3). Belohnung: Credits (22 + 8·Tiefe) × 1 / 1,5 / 2 je Stufe, dazu Bonus-Chance 50 / 75 / 100 % auf MOGC, Perk-Kern, Waffen-Mod oder Kosmetik. Signalfarben: '+own+' / '+COS.length+' freigeschaltet.</div></div>'+
      '<div class="row"><button class="primary" id="ms-back" type="button">Zurück</button><button id="ms-cos" type="button">Kosmetik</button></div>';
    showOverlay({html:h,onMount:box=>{
      box.querySelector('#ms-back').onclick=()=>{ (back||showTitle)(); };
      box.querySelector('#ms-cos').onclick=()=>{ Meta.screen(()=>api.screen(back),'co'); };
    }});
  };
  api.force=function(id){ if(!DEF[id]) return false; if(api.cur!==lvl) init(); const m={id,st:0,v:0,goal:0,tier:DEF[id].tier,rw:''}; DEF[id].init(m,depth()); api.list.push(m); api.sig=''; return true; };
  api.state=()=>({list:api.list.map(m=>({id:m.id,st:m.st,v:m.v,goal:m.goal})),stats:api.stats,cos:D().cosmetics});
  return api;
})();


/* ============================================================
   Combo-/Style-System (Phase 17): Arcade-Score mit Multiplikator x1 / x2 / x3 / x5 / x10.
   `heat` (0-100) steigt durch Stil-Ereignisse und faellt nach kurzer Haltezeit; Schwellen 25 / 50 / 75 / 95.
   Ereignisse: Kills, schnelle Kills (< 1,5 s), Krits, Multi-Kills (< 0,6 s), Explosions-Kills, Dash-Kills (Dash aktiv/<1,2 s),
   Umgebungs-Kills (Delta von Hazards.stats.envKills), Unberuehrt-Serie (alle 12 s ohne Schaden im Kampf).
   Faellt bei Schaden (Heat x0,8 bei kleinen / x0,35 bei grossen Treffern, max. 1x je 0,8 s), Leerlauf (Zerfall) und Tod (0).
   Punkte je Lauf (`score`), Bestwert in Save.data.bestScore; Sektor-Rang D-S mit Credit-Bonus. Kopfschuesse gibt es im Raycaster nicht -> zaehlt Krit.
   Konsole: __breach.Style.state(), .add(pts,heat,label), .heat=99
   ============================================================ */
const Style=(()=>{
  const TH=[0,25,50,75,95], MUL=[1,2,3,5,10], COL=['#8FA3B5','#35E4FF','#FFAE3D','#FF5A5A','#C77DFF'], RANK='DCBAS', RBON=[0,6,12,22,40];
  const api={ heat:0, hold:0, score:0, sectorScore:0, peak:0, runPeak:0, hurtSec:0, boom:0, dashT:0, lastKill:-9, mk:0, clean:0, cleanN:0, hurtCd:0, envPrev:0, t:0,
              disp:0, pops:[], el:null, pel:null, sig:'', tier:0, stats:{kills:0,multi:0,fast:0,crit:0,boomK:0,dashK:0,envK:0,clean:0,breaks:0,x10:0} };
  const D=()=>Save.data;
  const tierOf=h=>h>=TH[4]?4:h>=TH[3]?3:h>=TH[2]?2:h>=TH[1]?1:0;
  api.mult=()=>MUL[api.tier];
  function pop(txt,col){ api.pops.push({t:api.t+1.5,txt,col:col||COL[api.tier]}); if(api.pops.length>3) api.pops.shift(); api.sig=''; }
  function setTier(){
    const nt=tierOf(api.heat);
    if(nt>api.tier){ api.tier=nt; if(nt>api.peak) api.peak=nt; if(nt>api.runPeak) api.runPeak=nt;
      pop('MULTIPLIKATOR ×'+MUL[nt],COL[nt]); try{ sfx.stTier(nt); }catch(e){} kick(.12+nt*.03);
      if(nt===4){ api.stats.x10++; D().meta.cnt.x10=(D().meta.cnt.x10|0)+1; Save.markDirty(); } }
    else if(nt<api.tier){ api.tier=nt; }
    api.sig='';
  }

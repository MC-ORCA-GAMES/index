<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>NEXUS: BREACH — MC ORCA Games</title>
<!--
  NEXUS: BREACH — game.html (v0.2 — jetzt öffentlich, Login-Gate entfernt)
  Doom-artiger Ego-Shooter im Browser. Kein Framework, keine Bibliothek, keine Bilddateien:
  ein Raycaster (Canvas 2D, 320x200 Pixel, hochskaliert), alle Texturen und Sprites werden beim
  Start per Code gezeichnet, alle Sounds per WebAudio synthetisiert.

  Bewusst NICHT verbunden mit Supabase / Konto / MOGC.

  Levels stehen als ASCII-Karten in LEVELS weiter unten und sind leicht editierbar:
    #  Wand (Panel)     R  Wand (Server-Rack)     H  Wand (Tresor)     X  Ausgang
    .  Boden            P  Spielerstart
    -- Anlage (mechanisch) --
    d  Glitch-Drohne    r  Rogue-Rig         t  Turm-Sentinel      K  Kern-Wächter (Boss)
    p  Spinnen-Sonde    e  Sprenger-Einheit  k  Schild-Läufer
    -- Schlucht (Kreaturen, + vereinzelt d) --
    g  Grat-Läufer      f  Fels-Brecher      q  Kristall-Spucker   v  Geier-Schwarm
    -- Wüste (Kreaturen, + vereinzelt d) --
    b  Sandwurm-Wirt    x  Skorpion-Läufer   y  Sandschleier-Geist z  Dünen-Rochen
    -- Dschungel (Kreaturen, + vereinzelt d) --
    n  Sporen-Wächter   i  Ranken-Schlinger  u  Leucht-Schwarm
    h  AXIOM-Zelle (Leben)   a  Ladung (Munition)   m  MOGC-Splitter (Punkte)   s  Streu-Kanone
-->
<style>
  :root{
    --bg:#04060C; --panel:#0B1220; --fg:#DCF6FF; --dim:#7B9AB4; --faint:#47657C;
    --cyan:#35E4FF; --amber:#FFAE3D; --up:#0ECB81; --down:#FF3D6E;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; background:var(--bg); color:var(--fg); overflow:hidden;
    font-family:ui-sans-serif,system-ui,"Segoe UI",Roboto,sans-serif; }
  body{ display:flex; align-items:center; justify-content:center; }
  /* Bühne füllt immer den kompletten Bildschirm (kein festes 16:10 mehr, kein
     Container mit fester Aspect-Ratio) — dadurch keine schwarzen Rand-/Seiten-
     streifen mehr auf Bildschirmen, die vom 16:10-Format abweichen. */
  #stage{ position:relative; width:100vw; height:100vh; height:100dvh; background:#000;
    overflow:hidden; container-type:inline-size; user-select:none; -webkit-user-select:none; }
  /* object-fit:cover skaliert das intern weiterhin in 960x600 (16:10) gerenderte
     Bild verzerrungsfrei so hoch, dass es die Bühne randlos ausfüllt — bei
     abweichendem Seitenverhältnis wird minimal oben/unten bzw. links/rechts
     beschnitten statt schwarzer Balken angezeigt zu werden. */
  canvas#view{ position:absolute; inset:0; width:100%; height:100%; object-fit:cover; image-rendering:pixelated; display:block; }
  #scan{ position:absolute; inset:0; pointer-events:none;
    background:repeating-linear-gradient(to bottom,rgba(0,0,0,.16) 0 1px,transparent 1px 3px);
    box-shadow:inset 0 0 12cqw rgba(0,0,0,.55); }
  #hurt{ position:absolute; inset:0; pointer-events:none; opacity:0; box-shadow:inset 0 0 14cqw 3cqw rgba(255,61,110,.85); }
  #heal{ position:absolute; inset:0; pointer-events:none; opacity:0; box-shadow:inset 0 0 12cqw 2cqw rgba(53,228,255,.55); }
  #xh{ position:absolute; left:50%; top:50%; width:2.4cqw; height:2.4cqw; transform:translate(-50%,-50%); pointer-events:none; opacity:.85; }
  #xh::before,#xh::after{ content:""; position:absolute; background:var(--cyan); box-shadow:0 0 4px var(--cyan); }
  #xh::before{ left:50%; top:0; bottom:0; width:2px; margin-left:-1px; clip-path:polygon(0 0,100% 0,100% 30%,0 30%,0 70%,100% 70%,100% 100%,0 100%); }
  #xh::after{ top:50%; left:0; right:0; height:2px; margin-top:-1px; clip-path:polygon(0 0,30% 0,30% 100%,0 100%,70% 0,100% 0,100% 100%,70% 100%); }
  #xh.hit::before,#xh.hit::after{ background:var(--down); box-shadow:0 0 6px var(--down); }
  #top{ position:absolute; left:1.6cqw; top:1.2cqw; font-size:clamp(11px,1.5cqw,17px); color:var(--dim); text-shadow:0 1px 2px #000; pointer-events:none; }
  #top b{ color:var(--fg); font-weight:600; }
  #mini{ position:absolute; right:1.4cqw; top:1.4cqw; width:16cqw; image-rendering:pixelated; opacity:.85;
    border:1px solid rgba(53,228,255,.35); background:rgba(4,6,12,.55); pointer-events:none; }
  #msg{ position:absolute; left:0; right:0; bottom:16cqw; text-align:center; pointer-events:none;
    font-size:clamp(13px,2.1cqw,24px); font-weight:600; color:var(--fg); text-shadow:0 2px 6px #000,0 0 14px rgba(53,228,255,.4);
    opacity:0; transition:opacity .25s; }
  #msg.on{ opacity:1; }
  /* HUD: freistehende Instrumenten-Paneele statt durchgehendem Balken mit hartem
     Rand — nutzt den im Spiel schon etablierten angeschnittenen-Ecken-Look der
     Buttons (siehe button.primary weiter unten), statt eine neue Formsprache
     einzuführen. */
  #bar{ position:absolute; left:0; right:0; bottom:0; display:grid;
    grid-template-columns:1.25fr 1fr 9.4cqw 1fr 1fr; align-items:stretch; gap:1.1cqw;
    padding:0 2.2cqw 1.6cqw; background:none; }
  .cell{ min-width:0; position:relative; padding:.85cqw 1.3cqw 1cqw;
    background:linear-gradient(165deg,rgba(13,22,36,.92),rgba(4,7,14,.97));
    border:1px solid rgba(53,228,255,.25);
    clip-path:polygon(9px 0,100% 0,100% calc(100% - 9px),calc(100% - 9px) 100%,0 100%,0 9px);
    box-shadow:0 6px 18px rgba(0,0,0,.5), inset 0 1px 0 rgba(53,228,255,.06); }
  .lab{ font-size:clamp(9px,1.25cqw,14px); color:var(--dim); margin-bottom:.2cqw; }
  .val{ font:700 clamp(18px,3.9cqw,44px)/1 ui-monospace,"Cascadia Mono",Consolas,Menlo,monospace; color:var(--fg); font-variant-numeric:tabular-nums; }
  .val small{ font-size:.45em; color:var(--dim); font-weight:600; margin-left:.4em; }
  #hpbar{ height:.7cqw; margin-top:.6cqw; background:#0e1826; border:1px solid #1b2a3e; }
  #hpfill{ height:100%; width:100%; background:var(--up); transition:width .15s, background .2s; }
  #heatbar{ height:.7cqw; margin-top:.6cqw; background:#0e1826; border:1px solid #1b2a3e; opacity:0; transition:opacity .2s; }
  #heatbar.show{ opacity:1; }
  #heatfill{ height:100%; width:0%; background:var(--cyan); transition:width .1s linear, background .2s; }
  /* Gesicht: eigene leuchtende Medaillon-Fassung statt nacktem Canvas im Grid —
     schwebt als runder Blickfang minimal höher als die eckigen Paneele. */
  .face-frame{ width:9.6cqw; height:9.6cqw; border-radius:50%; justify-self:center; align-self:end;
    margin-bottom:.3cqw; display:flex; align-items:center; justify-content:center;
    background:radial-gradient(circle at 50% 38%,rgba(14,24,40,.96),rgba(4,7,14,.98));
    border:1px solid rgba(53,228,255,.4);
    box-shadow:0 0 0 4px rgba(4,6,12,.92), 0 0 20px rgba(53,228,255,.4), inset 0 0 12px rgba(53,228,255,.12); }
  #face{ width:7.4cqw; height:7.4cqw; image-rendering:pixelated; filter:drop-shadow(0 0 5px rgba(53,228,255,.4)); }
  #overlay{ position:absolute; inset:0; display:none; align-items:center; justify-content:flex-start;
    background:radial-gradient(120% 90% at 20% 30%,rgba(4,6,12,.72),rgba(4,6,12,.93)); padding:0 7cqw; }
  #overlay.on{ display:flex; }
  #fade{ position:absolute; inset:0; background:#04060C; opacity:0; pointer-events:none; z-index:80;
    transition:opacity .26s ease; }
  #fade.on{ opacity:1; }
  .box{ max-width:60cqw; margin-bottom:8cqw; }
  h1{ margin:0 0 1.2cqw; font:800 clamp(28px,6.2cqw,80px)/1 "Bahnschrift","DIN Alternate","Segoe UI Semibold",system-ui,sans-serif;
    letter-spacing:.01em; color:var(--fg); text-shadow:0 0 22px rgba(53,228,255,.35); }
  h1 em{ font-style:normal; color:var(--cyan); white-space:nowrap; }
  h1 span{ white-space:nowrap; }
  h2{ margin:0 0 1cqw; font:700 clamp(22px,4.6cqw,56px)/1 "Bahnschrift","Segoe UI Semibold",system-ui,sans-serif; }
  p{ margin:0 0 1.2cqw; font-size:clamp(12px,1.75cqw,20px); line-height:1.5; color:#B9D3E4; max-width:52ch; }
  .keys{ display:grid; grid-template-columns:auto 1fr; gap:.35cqw 1.6cqw; margin:1.4cqw 0 1.8cqw; font-size:clamp(11px,1.55cqw,18px); }
  .keys dt{ color:var(--amber); font-family:ui-monospace,Consolas,Menlo,monospace; }
  .keys dd{ margin:0; color:#B9D3E4; }
  .stats{ display:grid; grid-template-columns:repeat(2,auto); gap:.5cqw 3cqw; justify-content:start; margin:1cqw 0 1.6cqw; font-size:clamp(12px,1.8cqw,21px); }
  .stats span:nth-child(odd){ color:var(--dim); }
  .stats span:nth-child(even){ font-family:ui-monospace,Consolas,Menlo,monospace; color:var(--fg); }
  .row{ display:flex; gap:1cqw; flex-wrap:wrap; align-items:center; }
  button{ font:600 clamp(12px,1.8cqw,20px) system-ui,"Segoe UI",sans-serif; color:var(--fg); background:transparent;
    border:1px solid rgba(53,228,255,.5); padding:.9cqw 2cqw; cursor:pointer; border-radius:3px; }
  button:hover{ background:rgba(53,228,255,.12); }
  button:focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }
  button.primary{ background:var(--cyan); color:#02131a; border-color:var(--cyan); }
  button.primary:hover{ background:#7CF0FF; }
  button.chip{ padding:.4cqw 1.2cqw; font-size:clamp(11px,1.5cqw,17px); color:var(--dim); border-color:#25384e; }
  .small{ font-size:clamp(10px,1.35cqw,15px); color:var(--faint); margin-top:1.2cqw; }
  @media (prefers-reduced-motion:reduce){ #msg{ transition:none; } #hpfill{ transition:none; } }

  /* ---- Loadout (Phase 5) ---- */
  .box.ld-box{ max-width:90cqw; width:100%; margin-bottom:0; max-height:94%; overflow:auto; }
  .ld-tabs{ display:flex; gap:.6cqw; flex-wrap:wrap; margin:0 0 1.2cqw; }
  button.chip.sel{ color:var(--amber); border-color:var(--amber); background:rgba(255,174,61,.1); }
  button.chip{ min-height:38px; }
  .ld-grid{ display:grid; grid-template-columns:1.15fr 1.2fr .9fr; gap:1.6cqw; align-items:start; }
  .ld-col{ min-width:0; }
  .ld-sub{ font:700 clamp(10px,1.3cqw,14px)/1 ui-monospace,Consolas,Menlo,monospace; letter-spacing:.1em; text-transform:uppercase; color:var(--faint); margin:0 0 .8cqw; }
  button.ld-slot, button.ld-opt{ display:flex; flex-direction:column; align-items:flex-start; text-align:left; gap:.2cqw; width:100%; min-height:44px;
    margin:0 0 .5cqw; padding:.6cqw 1.1cqw; border-color:#25384e; font-size:clamp(11px,1.5cqw,17px); font-weight:400; }
  button.ld-slot b, button.ld-opt b{ font-weight:700; }
  button.ld-slot small, button.ld-opt small{ color:var(--dim); font-size:.86em; line-height:1.3; }
  button.ld-slot .ld-sl{ font-family:ui-monospace,Consolas,Menlo,monospace; letter-spacing:.1em; color:var(--amber); }
  button.ld-slot.sel{ border-color:var(--amber); background:rgba(255,174,61,.08); }
  button.ld-opt.on{ border-color:var(--cyan); background:rgba(53,228,255,.1); }
  .ld-empty{ color:var(--faint); }
  .ld-tab{ border-collapse:collapse; font-size:clamp(11px,1.5cqw,17px); width:100%; }
  .ld-tab td{ padding:.25cqw .5cqw .25cqw 0; color:#B9D3E4; font-family:ui-monospace,Consolas,Menlo,monospace; }
  .ld-tab td:first-child{ color:var(--dim); font-family:inherit; }
  .ld-tab s{ color:var(--faint); }
  .ld-tab td.up{ color:var(--cyan); }
  @media (max-aspect-ratio:1/1){ .ld-grid{ grid-template-columns:1fr; } }


  /* ============ Phase 2: Next-Gen HUD ============ */
  :root{ --purple:#B36BFF; }
  #hud2{ position:absolute; inset:0; pointer-events:none; display:none; }
  .hud-on #hud2{ display:block; }
  #top{ line-height:1.35; }
  #top .sub{ display:block; font:600 clamp(8px,1.15cqw,13px) ui-monospace,Consolas,Menlo,monospace; letter-spacing:.12em; text-transform:uppercase; color:var(--faint); }
  #top .obj{ display:block; margin-top:.5cqw; font:700 clamp(10px,1.45cqw,17px) ui-sans-serif,system-ui,sans-serif; color:var(--amber); text-shadow:0 1px 3px #000,0 0 10px rgba(255,174,61,.25); }
  #top .obj::before{ content:"\25B8 "; }
  .lab{ display:flex; justify-content:space-between; align-items:baseline; gap:.6cqw; }
  .lab em{ font-style:normal; font:700 clamp(8px,1.1cqw,12px) ui-monospace,Consolas,Menlo,monospace; color:var(--amber); letter-spacing:.06em; }
  .mods{ display:grid; gap:.3cqw; margin-top:.55cqw; }
  .mod{ display:flex; align-items:center; gap:.5cqw; font:700 clamp(7px,.95cqw,11px)/1 ui-monospace,Consolas,Menlo,monospace; color:var(--dim); transition:opacity .2s; }
  .mod i{ font-style:normal; width:1.1em; }
  .mod b{ flex:1; height:.42cqw; background:#0e1826; border:1px solid #1b2a3e; position:relative; }
  .mod u{ display:block; height:100%; width:0; text-decoration:none; }
  .mod.off{ opacity:.3; }
  .mod.off b::after{ content:""; position:absolute; inset:0; background:repeating-linear-gradient(135deg,transparent 0 3px,rgba(123,154,180,.25) 3px 5px); }
  #mShield u{ background:var(--cyan); box-shadow:0 0 6px rgba(53,228,255,.6); }
  #mArmor u{ background:var(--amber); }
  #mEnergy u{ background:var(--purple); box-shadow:0 0 6px rgba(179,107,255,.5); }
  /* Phase 3: Dash-Zeile (Ladungen/Cooldown), Energie-Sperre, Schild-/Dash-Randeffekte, Krit-Fadenkreuz */
  #mDash u{ background:var(--dim); }
  #mDash.ready u{ background:var(--cyan); box-shadow:0 0 6px rgba(53,228,255,.6); }
  #mDash.two b{ background-image:linear-gradient(90deg,transparent calc(50% - 1px),#0b1220 calc(50% - 1px) calc(50% + 1px),transparent calc(50% + 1px)); }
  #mDash.two u{ position:relative; }
  #mEnergy.lock u{ background:var(--down); box-shadow:0 0 6px rgba(255,61,110,.6); }
  #mEnergy.lock b{ animation:txtBlink .35s steps(1) infinite; }
  .rm #mEnergy.lock b{ animation:none; }
  #shieldFx{ position:absolute; inset:0; pointer-events:none; opacity:0; box-shadow:inset 0 0 10cqw 1.5cqw rgba(53,228,255,.7); }
  #dashFx{ position:absolute; inset:0; pointer-events:none; opacity:0; background:radial-gradient(ellipse at center,transparent 45%,rgba(180,240,255,.28) 100%); }
  #xh.crit::before,#xh.crit::after{ background:var(--amber); box-shadow:0 0 8px var(--amber); }
  #hpnum{ display:flex; align-items:baseline; gap:.8cqw; }
  #crit{ font:700 clamp(8px,1.05cqw,12px) ui-monospace,Consolas,Menlo,monospace; color:var(--dim); margin-top:.5cqw; letter-spacing:.06em; }
  #crit b{ color:var(--fg); }
  #rld{ height:.7cqw; margin-top:.5cqw; background:#0e1826; border:1px solid #1b2a3e; opacity:0; transition:opacity .15s; }
  #rld.show{ opacity:1; }
  #rldfill{ height:100%; width:0; background:var(--amber); }
  #rldtxt{ position:absolute; right:1.3cqw; top:2.3cqw; font:800 clamp(8px,1.05cqw,12px) ui-monospace,Consolas,Menlo,monospace; letter-spacing:.14em; color:var(--amber); opacity:0; }
  #rldtxt.on{ opacity:1; }
  #wslots{ display:flex; gap:.3cqw; margin-top:.5cqw; }
  #wslots i{ flex:1; font:700 clamp(7px,.95cqw,11px) ui-monospace,Consolas,Menlo,monospace; font-style:normal; text-align:center; color:#2a3a52; border:1px solid #1b2a3e; line-height:1.5; }
  #wslots i.own{ color:var(--dim); border-color:#2a3d5a; }
  #wslots i.cur{ color:#04101a; background:var(--cyan); border-color:var(--cyan); }
  #heattxt{ position:absolute; right:1.3cqw; top:.85cqw; font:800 clamp(8px,1.15cqw,13px) ui-monospace,Consolas,Menlo,monospace; letter-spacing:.14em; color:var(--down); opacity:0; }
  #threat{ display:flex; align-items:center; gap:.35cqw; margin-top:.6cqw; }
  #threat i{ flex:1; height:.7cqw; background:#0e1826; border:1px solid #1b2a3e; transition:background .2s, box-shadow .2s; }
  #threat i.on{ background:var(--cyan); }
  #threat.t3 i.on,#threat.t4 i.on{ background:var(--amber); }
  #threat.t5 i.on{ background:var(--down); box-shadow:0 0 6px rgba(255,61,110,.7); }
  #threattxt{ font:700 clamp(8px,1.05cqw,12px) ui-monospace,Consolas,Menlo,monospace; letter-spacing:.1em; color:var(--dim); margin-top:.35cqw; }
  /* Combo / Streak */
  #combo{ position:absolute; left:1.6cqw; top:10.5cqw; opacity:0; transform:translateX(-1cqw); transition:opacity .2s, transform .2s; }
  #combo.on{ opacity:1; transform:none; }
  #combo .cn{ font:800 clamp(16px,3.4cqw,40px)/1 ui-monospace,Consolas,Menlo,monospace; color:var(--amber); text-shadow:0 0 12px rgba(255,174,61,.45),0 2px 4px #000; }
  #combo .cn small{ font-size:.42em; letter-spacing:.14em; color:var(--dim); margin-right:.5em; }
  #combo .cn.pop{ animation:comboPop .18s ease-out; }
  @keyframes comboPop{ 0%{ transform:scale(1.35); } 100%{ transform:scale(1); } }
  #combo .cbar{ height:.4cqw; width:12cqw; margin-top:.5cqw; background:rgba(14,24,38,.8); }
  #combo .cbar u{ display:block; height:100%; width:0; background:var(--amber); text-decoration:none; }
  #combo .cs{ margin-top:.4cqw; font:700 clamp(8px,1.1cqw,13px) ui-monospace,Consolas,Menlo,monospace; letter-spacing:.12em; color:var(--dim); }
  #combo .cs b{ color:var(--fg); }
  /* Boss-Leiste */
  #boss{ position:absolute; left:50%; top:1.3cqw; width:40cqw; transform:translateX(-50%) translateY(-1.5cqw); opacity:0; transition:opacity .35s, transform .35s; }
  .boss #boss{ opacity:1; transform:translateX(-50%); }
  #boss .bn{ display:flex; justify-content:space-between; align-items:baseline; font:800 clamp(10px,1.6cqw,19px) ui-sans-serif,system-ui,sans-serif; letter-spacing:.16em; text-transform:uppercase; color:var(--fg); text-shadow:0 2px 4px #000,0 0 12px rgba(255,61,110,.5); }
  #boss .bn em{ font-style:normal; font:700 clamp(8px,1.2cqw,14px) ui-monospace,Consolas,Menlo,monospace; color:var(--down); letter-spacing:.1em; }
  #boss .bb{ position:relative; height:1.1cqw; margin-top:.4cqw; background:rgba(14,24,38,.85); border:1px solid rgba(255,61,110,.55);
    clip-path:polygon(6px 0,100% 0,calc(100% - 6px) 100%,0 100%); box-shadow:0 0 14px rgba(255,61,110,.25); }
  #bossGhost,#bossFill{ position:absolute; left:0; top:0; bottom:0; width:100%; }
  #bossGhost{ background:rgba(255,255,255,.55); }
  #bossFill{ background:linear-gradient(90deg,#c21f4d,var(--down)); }
  #boss .bb i{ position:absolute; top:0; bottom:0; width:2px; margin-left:-1px; background:rgba(4,6,12,.9); }
  /* Vignetten fuer Warnungen */
  #vigLow,#vigHeat{ position:absolute; inset:0; opacity:0; }
  #vigLow{ box-shadow:inset 0 0 16cqw 4cqw rgba(255,61,110,.8); }
  #vigHeat{ box-shadow:inset 0 0 14cqw 3cqw rgba(255,140,40,.75); }
  .lowhp #vigLow{ animation:vigPulse 1.5s ease-in-out infinite; }
  .lowhp2 #vigLow{ animation-duration:.8s; }
  @keyframes vigPulse{ 0%,100%{ opacity:.12; } 50%{ opacity:.5; } }
  .overheat #vigHeat{ animation:vigPulse .55s ease-in-out infinite; }
  .lowhp #hpcell{ border-color:rgba(255,61,110,.7); }
  .lowhp #hp{ color:var(--down); animation:hudGlitch 2.6s steps(1) infinite; }
  .lowhp2 #hp{ animation-duration:1.4s; }
  @keyframes hudGlitch{
    0%,86%,100%{ transform:none; text-shadow:none; }
    88%{ transform:translateX(-.25cqw); text-shadow:.3cqw 0 rgba(53,228,255,.85),-.3cqw 0 rgba(255,61,110,.85); }
    90%{ transform:translateX(.25cqw) skewX(-8deg); text-shadow:-.3cqw 0 rgba(53,228,255,.85),.3cqw 0 rgba(255,61,110,.85); }
    92%{ transform:none; text-shadow:none; } }
  .lowammo #wcell{ border-color:rgba(255,174,61,.75); animation:cellBlink 1s steps(1) infinite; }
  .lowammo #ammo{ color:var(--amber); }
  .ammo0 #ammo{ color:var(--down); }
  @keyframes cellBlink{ 0%,100%{ box-shadow:0 6px 18px rgba(0,0,0,.5); } 50%{ box-shadow:0 6px 18px rgba(0,0,0,.5),0 0 14px rgba(255,174,61,.6); } }
  .hot #heatfill{ box-shadow:0 0 8px rgba(255,174,61,.8); }
  .overheat #wcell{ border-color:rgba(255,61,110,.8); }

<script>

const FR=4, FG=6, FB=12;            // Nebelfarbe (#04060C)

const cv=document.getElementById('view');
const ctx=cv.getContext('2d');
ctx.imageSmoothingEnabled=false;
const img=ctx.createImageData(W,H);
const buf=new Uint32Array(img.data.buffer);

const $=id=>document.getElementById(id);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
// Touch-Primärgerät (Handy/Tablet ohne Maus) erkennen — zeigt die
// On-Screen-Steuerung (Move-Pad/Blick-Drag/Feuer/Waffe/Pause) nur dort an und

const isTouch=(()=>{ try{ return matchMedia('(hover:none) and (pointer:coarse)').matches; }catch(e){ return 'ontouchstart' in window; } })();

function shade(c,f){
  return (0xFF000000
    | ((((c>>16)&255)*f+FB*(256-f))>>8)<<16
    | ((((c>>8)&255)*f+FG*(256-f))>>8)<<8
    | (((c&255)*f+FR*(256-f))>>8))>>>0;
}

/* ============================================================
   Texturen & Sprites (alles per Code gezeichnet)
   ============================================================ */
function rng(seed){ let s=seed>>>0; return ()=>{ s=(s+0x6D2B79F5)>>>0; let t=s; t=Math.imul(t^(t>>>15),t|1); t^=t+Math.imul(t^(t>>>7),t|61); return ((t^(t>>>14))>>>0)/4294967296; }; }
function px(g,c,x,y,w,h){ g.fillStyle=c; g.fillRect(x,y,w,h); }
function disc(g,c,x,y,rx,ry){ g.fillStyle=c; g.beginPath(); g.ellipse(x,y,rx,ry,0,0,Math.PI*2); g.fill(); }
function poly(g,c,p){ g.fillStyle=c; g.beginPath(); g.moveTo(p[0],p[1]); for(let i=2;i<p.length;i+=2) g.lineTo(p[i],p[i+1]); g.closePath(); g.fill(); }
function speckle(g,r,n,cols){ for(let i=0;i<n;i++){ g.fillStyle=cols[(r()*cols.length)|0]; g.fillRect((r()*64)|0,(r()*64)|0,1,1); } }

function makeTex(draw,cut){
  const c=document.createElement('canvas'); c.width=c.height=64;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false; draw(g);
  const d=g.getImageData(0,0,64,64);
  if(cut){ for(let i=3;i<d.data.length;i+=4) d.data[i]=d.data[i]>110?255:0; }
  return new Uint32Array(d.data.buffer);
}

const texPanel=makeTex(g=>{
  const r=rng(11);
  px(g,'#182231',0,0,64,64);
  px(g,'#1f2c3f',1,1,30,30); px(g,'#1f2c3f',33,1,30,30); px(g,'#1f2c3f',1,33,30,30); px(g,'#1f2c3f',33,33,30,30);
  px(g,'#0a1018',0,0,64,1); px(g,'#0a1018',0,32,64,1); px(g,'#0a1018',0,63,64,1);
  px(g,'#0a1018',0,0,1,64); px(g,'#0a1018',32,0,1,64);
  px(g,'#1b8ea3',0,47,64,1); px(g,'#35E4FF',8,47,18,1); px(g,'#35E4FF',40,47,12,1);
  for(const [x,y] of [[3,3],[27,3],[35,3],[59,3],[3,27],[27,27],[35,27],[59,27],[3,35],[27,35],[35,35],[59,35]]) px(g,'#0a1018',x,y,2,2);
  speckle(g,r,110,['#1a2535','#27384e','#1c283a']);
});
const texRack=makeTex(g=>{
  const r=rng(23);
  px(g,'#0a1017',0,0,64,64);
  for(let i=0;i<8;i++){
    const y=i*8;
    px(g,'#141d29',1,y+1,62,6); px(g,'#0a1017',1,y+7,62,1);
    for(let x=4;x<26;x+=3) px(g,'#0a1017',x,y+2,1,4);
    for(let k=0;k<5;k++){ const c=r()<.5?'#35E4FF':(r()<.5?'#FFAE3D':'#0ECB81'); px(g,r()<.75?c:'#26364b',36+k*5,y+3,2,2); }
  }
  px(g,'#26364b',0,0,1,64); px(g,'#26364b',63,0,1,64);
  speckle(g,r,120,['#0d141c','#1b2636']);
});
// Zusätzliche Blink-Frames für dieselbe Rack-Wand: exakt derselbe Panel-
// Hintergrund (gleicher Seed 23), aber eigene, unabhängig gewürfelte
// LED-Zustände/Farben pro Frame — dadurch "blinken" die Racks im Spiel.
function makeRackFrame(ledSeed){
  return makeTex(g=>{
    const r=rng(23);
    px(g,'#0a1017',0,0,64,64);
    const rl=rng(ledSeed);
    for(let i=0;i<8;i++){
      const y=i*8;
      px(g,'#141d29',1,y+1,62,6); px(g,'#0a1017',1,y+7,62,1);
      for(let x=4;x<26;x+=3) px(g,'#0a1017',x,y+2,1,4);
      for(let k=0;k<5;k++){ const on=rl()<.62; const c=rl()<.5?'#35E4FF':(rl()<.5?'#FFAE3D':'#0ECB81'); px(g,on?c:'#131b26',36+k*5,y+3,2,2); }
    }
    px(g,'#26364b',0,0,1,64); px(g,'#26364b',63,0,1,64);
    speckle(g,r,120,['#0d141c','#1b2636']);
  });
}
const RACK_FRAMES=[texRack, makeRackFrame(4451), makeRackFrame(9137), makeRackFrame(2609)];
const texVault=makeTex(g=>{
  const r=rng(37);
  px(g,'#232a37',0,0,64,64);
  for(let row=0;row<6;row++){
    const y=row*8, off=row%2?8:0;
    px(g,'#161c26',0,y,64,1);
    for(let x=-off;x<64;x+=16) px(g,'#161c26',x,y,1,8);
  }
  px(g,'#0f141c',0,48,64,16);
  for(let x=-16;x<64;x+=12) poly(g,'#FFAE3D',[x,64,x+6,64,x+16,48,x+10,48]);
  px(g,'#0f141c',0,47,64,1);
  speckle(g,r,200,['#1c2330','#2d3646','#2a3140']);
});
function exitTex(col,dark){
  return makeTex(g=>{
    px(g,dark,0,0,64,64);
    for(let i=0;i<7;i++){ g.strokeStyle=i%2?dark:col; g.lineWidth=3; g.strokeRect(2+i*4.5,2+i*4.5,60-i*9,60-i*9); }
    px(g,'#F4FFFF',26,26,12,12);
  });
}
const texExit=exitTex('#35E4FF','#06333d');
const texExitLocked=exitTex('#FF3D6E','#3a0c18');
const texStairs=exitTex('#0ECB81','#0a2a1c'); // Treppe hoch: gleiches Portal-Muster, grün statt cyan/rot

/* Etagen-Anzeigeschilder: kleine 7-Segment-Ziffernschrift, zeigt die
   Stockwerknummer im Fahrstuhl-Schema (Keller=-1, Erdgeschoss=0, 1.Stock=1 …) */
const SEG_DIGITS={
  '0':['a','b','c','d','e','f'], '1':['b','c'], '2':['a','b','g','e','d'],
  '3':['a','b','g','c','d'], '4':['f','g','b','c'], '5':['a','f','g','c','d'],
  '6':['a','f','g','e','c','d'], '7':['a','b','c'], '8':['a','b','c','d','e','f','g'],
  '9':['a','b','c','d','f','g'], '-':['g']
};
function drawSegChar(g,ch,ox,oy,bw,bh,th,color){
  const set=new Set(SEG_DIGITS[ch]||[]);
  const midY=(bh-th)/2;
  if(set.has('a')) px(g,color,ox+th,oy,bw-2*th,th);
  if(set.has('g')) px(g,color,ox+th,oy+midY,bw-2*th,th);
  if(set.has('d')) px(g,color,ox+th,oy+bh-th,bw-2*th,th);
  if(set.has('f')) px(g,color,ox,oy+th,th,midY-th);
  if(set.has('b')) px(g,color,ox+bw-th,oy+th,th,midY-th);
  if(set.has('e')) px(g,color,ox,oy+midY+th,th,midY-th);
  if(set.has('c')) px(g,color,ox+bw-th,oy+midY+th,th,midY-th);
}
function makeFloorSignTex(label){
  return makeTex(g=>{
    px(g,'#0a0f16',0,0,64,64);
    px(g,'#161c26',3,3,58,58);
    px(g,'#080d13',6,6,52,52);
    px(g,'#1b8ea3',9,9,46,2);
    const chars=label.split(''), bw=16, bh=28, th=3, gap=4;
    const totalW=chars.length*bw+(chars.length-1)*gap;
    let ox=32-totalW/2, oy=32-bh/2;
    for(const ch of chars){ drawSegChar(g,ch,ox,oy,bw,bh,th,'#35E4FF'); ox+=bw+gap; }
    px(g,'#26364b',0,0,64,1); px(g,'#26364b',0,63,64,1); px(g,'#26364b',0,0,1,64); px(g,'#26364b',63,0,1,64);
  });
}
const SIGN_TEX={}; for(let i=-1;i<=3;i++) SIGN_TEX[String(i)]=makeFloorSignTex(String(i));
const texFloor=makeTex(g=>{
  const r=rng(51);
  px(g,'#101824',0,0,64,64);
  px(g,'#1d2b3d',0,0,64,1); px(g,'#1d2b3d',0,0,1,64);
  px(g,'#1f6478',0,0,3,3);
  px(g,'#131d2b',8,8,48,48); px(g,'#0f1722',10,10,44,44);
  speckle(g,r,110,['#131c29','#16202e','#0c131d']);
});
const texCeil=makeTex(g=>{
  const r=rng(77);
  px(g,'#080c12',0,0,64,64);
  px(g,'#111926',0,0,64,1); px(g,'#111926',0,0,1,64);
  px(g,'#3d8fa3',18,26,28,12); px(g,'#9fdcea',20,28,24,8);

/* ---- Himmel (Außensektoren): Angle-basiertes Sky-Strip, wie beim Doom-Sky-Hack ---- */
const SKY_W=1440, SKY_H=320;
function makeWideTex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const g=c.getContext('2d'); g.imageSmoothingEnabled=false; draw(g);
  return new Uint32Array(g.getImageData(0,0,w,h).data.buffer);
}
function paintSkyBase(g,horizonCol,zenithCol){
  const grad=g.createLinearGradient(0,SKY_H,0,0);
  grad.addColorStop(0,horizonCol); grad.addColorStop(.4,zenithCol); grad.addColorStop(1,zenithCol);
  g.fillStyle=grad; g.fillRect(0,0,SKY_W,SKY_H);
}
function paintStars(g,seed,n,topBias){
  const r=rng(seed);
  for(let i=0;i<n;i++){
    const y=(Math.pow(r(),topBias)*SKY_H)|0, x=(r()*SKY_W)|0;
    const b=r();
    g.fillStyle=b<.1?'#FFFFFF':(b<.45?'#BFE9FF':'#7FD4E8');
    g.fillRect(x,SKY_H-1-y,1,1);
  }
}
function paintPlanet(g,cx,cy,r,dark,base,light,ring){
  disc(g,dark,cx,cy,r,r);
  g.save(); g.beginPath(); g.arc(cx,cy,r,0,Math.PI*2); g.clip();
  g.fillStyle=base; g.fillRect(cx-r,cy-r,r*1.35,r*2);
  g.fillStyle=light; g.fillRect(cx-r,cy-r,r*.5,r*2);
  g.restore();
  if(ring){
    g.strokeStyle=ring; g.lineWidth=Math.max(2,r*.14);
    g.beginPath(); g.ellipse(cx,cy,r*1.7,r*.4,-.3,0,Math.PI*2); g.stroke();
  }
}

function boomFrame(core,mid,outer,spikes,size,seed){
  return makeTex(g=>{
    disc(g,outer,32,32,size,size);
    disc(g,mid,32,32,size*.7,size*.7);
    disc(g,core,32,32,size*.35,size*.35);
    if(spikes){
      const r=rng(seed);
      for(let i=0;i<9;i++){
        const a=(i/9)*Math.PI*2+r()*.4, rr=size*(1+r()*.5), w=.16+r()*.08;
        poly(g,outer,[32,32,
          32+Math.cos(a-w)*size*.55,32+Math.sin(a-w)*size*.55,
          32+Math.cos(a)*rr,32+Math.sin(a)*rr,
          32+Math.cos(a+w)*size*.55,32+Math.sin(a+w)*size*.55]);
      }
    }
  },true);
}

function shuffleArr(a){ for(let i=a.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0; [a[i],a[j]]=[a[j],a[i]]; } return a; }

function carveMaze(size, blockedIdx, cw){
  // 0=Flur, 1=Wand. Klassischer Recursive-Backtracker, jetzt auf Block-Basis:
  // jede "logische" Zelle belegt ein cw×cw-Feld physischer Gitterzellen
  // (Korridorbreite), die Wand dazwischen bleibt immer exakt 1 Zelle dünn.
  // cw=1 (Default) ist exakt das alte Verhalten (1 Zelle Flur, 1 Zelle Wand).
  // blockedIdx (optional): Set von g-Indizes, die der Backtracker nie betritt
  // (Wert 3 = reserviert) — die Maze waechst organisch drumherum. Wird
  // benutzt, um vorab Platz fuer einen Vorraum freizuhalten.
  cw=Math.max(1,cw|0)||1;
  const step=cw+1;
  const g=new Uint8Array(size*size).fill(1);
  const idx=(x,y)=>y*size+x;
  if(blockedIdx) for(const gi of blockedIdx) g[gi]=3;
  const n=Math.max(1,Math.floor((size-2)/step)); // logische Zellen pro Achse
  const anchor=(i,j)=>[1+i*step,1+j*step];
  function blockFree(ax,ay){
    for(let dy=0;dy<cw;dy++) for(let dx=0;dx<cw;dx++){
      const x=ax+dx,y=ay+dy;
      if(x<0||y<0||x>=size||y>=size) return false;
      if(g[idx(x,y)]===3) return false;
    }
    return true;
  }
  function carveBlock(ax,ay){ for(let dy=0;dy<cw;dy++) for(let dx=0;dx<cw;dx++) g[idx(ax+dx,ay+dy)]=0; }
  function carveLink(ai,aj,di,dj){
    const [ax,ay]=anchor(ai,aj);
    if(di===1){ for(let k=0;k<cw;k++) g[idx(ax+cw,ay+k)]=0; }
    else if(di===-1){ for(let k=0;k<cw;k++) g[idx(ax-1,ay+k)]=0; }
    else if(dj===1){ for(let k=0;k<cw;k++) g[idx(ax+k,ay+cw)]=0; }
    else { for(let k=0;k<cw;k++) g[idx(ax+k,ay-1)]=0; }
  }
  const [a0x,a0y]=anchor(0,0);
  carveBlock(a0x,a0y);
  const visited=new Uint8Array(n*n);
  const vidx=(i,j)=>j*n+i;
  visited[vidx(0,0)]=1;
  const stack=[[0,0]];
  while(stack.length){
    const [ci,cj]=stack[stack.length-1];
    const dirs=shuffleArr([[1,0],[-1,0],[0,1],[0,-1]]);
    let carved=false;
    for(const [di,dj] of dirs){
      const ni=ci+di, nj=cj+dj;
      if(ni<0||nj<0||ni>=n||nj>=n||visited[vidx(ni,nj)]) continue;
      const [nax,nay]=anchor(ni,nj);
      if(!blockFree(nax,nay)) continue;
      carveBlock(nax,nay); carveLink(ci,cj,di,dj);
      visited[vidx(ni,nj)]=1; stack.push([ni,nj]); carved=true; break;
    }
    if(!carved) stack.pop();
  }
  // ein paar Extra-Durchbrüche zwischen bereits benachbarten, verbundenen
  // Zellen, damit nicht alles reine Sackgassen sind
  const extra=Math.floor(n*n*0.02);
  for(let k=0;k<extra;k++){
    const ci=(Math.random()*n)|0, cj=(Math.random()*n)|0;
    if(!visited[vidx(ci,cj)]) continue;
    for(const [di,dj] of shuffleArr([[1,0],[0,1]])){
      const ni=ci+di, nj=cj+dj;
      if(ni<0||nj<0||ni>=n||nj>=n||!visited[vidx(ni,nj)]) continue;
      carveLink(ci,cj,di,dj); break;
    }
  }
  return g;
}
function bfsAll(g,size,sx,sy){
  const idx=(x,y)=>y*size+x;
  const dist=new Int32Array(size*size).fill(-1);
  dist[idx(sx,sy)]=0;
  const q=[[sx,sy]]; let qi=0;
  while(qi<q.length){
    const [x,y]=q[qi++]; const d=dist[idx(x,y)];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=size||ny>=size) continue;
      if(g[idx(nx,ny)]!==0||dist[idx(nx,ny)]!==-1) continue;
      dist[idx(nx,ny)]=d+1; q.push([nx,ny]);
    }
  }
  return dist;
}
function reachableCount(dist){ let c=0; for(let i=0;i<dist.length;i++) if(dist[i]>=0) c++; return c; }
const DOOR_SIDES={N:[0,-1],S:[0,1],W:[-1,0],E:[1,0]};
// Findet die Ausgangs-Innenzelle: immer am Kartenrand, bevorzugt mit nur einem
// Zugang (echter Flaschenhals statt Durchgangsraum von zwei Seiten begehbar).
function findDoorCell(g,size,dist){
  const idx=(x,y)=>y*size+x;
  let best=null;
  for(const side of ['N','S','E','W']){
    const [ox,oy]=DOOR_SIDES[side];
    for(let y=1;y<size-1;y++) for(let x=1;x<size-1;x++){
      if(g[idx(x,y)]!==0) continue;
      const onEdge = side==='N'?y===1 : side==='S'?y===size-2 : side==='W'?x===1 : x===size-2;
      if(!onEdge) continue;
      const d=dist[idx(x,y)]; if(d<0) continue;
      let deg=0;
      for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
        if(dx===ox&&dy===oy) continue;
        const nx=x+dx, ny=y+dy;
        if(nx<0||ny<0||nx>=size||ny>=size) continue;
        if(g[idx(nx,ny)]===0) deg++;
      }
      const cand={side,x,y,deg,d};
      if(!best || cand.deg<best.deg || (cand.deg===best.deg && cand.d>best.d)) best=cand;
    }
  }
  return best;
}
// Versiegelt überzählige Zugänge zur Türzelle — aber nur, wenn dadurch nachweislich
// (per Erreichbarkeits-Check) kein anderer Kartenteil vom Spawn abgeschnitten wird.
function sealExtraApproaches(g,size,cand){
  const idx=(x,y)=>y*size+x;
  const [ox,oy]=DOOR_SIDES[cand.side];
  const before=reachableCount(bfsAll(g,size,1,1));
  const neighbors=[];
  for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
    if(dx===ox&&dy===oy) continue;
    const nx=cand.x+dx, ny=cand.y+dy;
    if(nx<0||ny<0||nx>=size||ny>=size) continue;
    if(g[idx(nx,ny)]===0) neighbors.push(idx(nx,ny));
  }
  let remaining=neighbors.length;
  for(const gi of neighbors){
    if(remaining<=1) break;
    const save=g[gi]; g[gi]=1;
    const after=reachableCount(bfsAll(g,size,1,1));
    if(after>=before-1){ remaining--; } else { g[gi]=save; }
  }
}
/* ---- Vorraum mit Säulen vor dem Ausgang ("Reservieren, dann drumherum wachsen") ----
   Statt hinterher Löcher in eine fertige Maze zu stanzen (riskiert immer,
   irgendwo einen für den Rest der Karte nötigen Gang zu kappen), wird die
   Fläche des Vorraums (Innenraum + 1 Zelle Pufferring) VOR dem Carven als
   Sperrzone reserviert. carveMaze() betritt reservierte Zellen nie und wächst
   organisch drumherum — der Rest der Maze ist dadurch nie auf eine später
   versiegelte Zelle angewiesen. Danach wird der Innenraum als begehbarer
   Flur (+ Säulen zum Verstecken) eingetragen; der Pufferring bleibt Wand bis
   auf genau eine Stelle — der eine echte Zugang, den der Kern-Wächter bewacht. */
function planAntechamber(size,doorCand,cw){
  cw=Math.max(1,cw|0)||1;
  const idx=(x,y)=>y*size+x;
  const side=doorCand.side;
  const [ox,oy]=DOOR_SIDES[side];
  const depthDir=[-ox,-oy]; // von der Kante ins Karteninnere
  const perp=(side==='N'||side==='S')?[1,0]:[0,1]; // Breitenachse des Raums

  // Schwellenwerte mitskaliert mit der Korridorbreite (step), damit dieselbe
  // Raumgröße (3/5/7/9) bei gleicher Maze-Komplexität wie bisher gewählt wird
  // — die physische Kartengröße wächst ja mit der Korridorbreite mit, ohne
  // dass die Maze an sich komplexer würde. Bei cw=1 identisch zum alten Verhalten.
  const step=cw+1;
  let roomSpan = size<=Math.round(15*step/2)?3 : size<=Math.round(25*step/2)?5 : size<=Math.round(41*step/2)?7 : 9;
  function cell(d,w){ return { x: doorCand.x+perp[0]*w+depthDir[0]*d, y: doorCand.y+perp[1]*w+depthDir[1]*d }; }
  function fits(span){
    const half=(span-1)/2;
    for(let d=0; d<=span; d++) for(let w=-half-1; w<=half+1; w++){
      const c=cell(d,w);
      if(c.x<1||c.y<1||c.x>size-2||c.y>size-2) return false;
    }
    return true;
  }
  while(roomSpan>=3 && !fits(roomSpan)) roomSpan-=2;
  if(roomSpan<3) return null; // kein Platz -> normale Einzelzellen-Tür (Fallback)

  const half=(roomSpan-1)/2;
  const interior=new Set(), ring=new Set();
  for(let d=0; d<roomSpan; d++) for(let w=-half; w<=half; w++) interior.add(idx(cell(d,w).x,cell(d,w).y));
  for(let d=0; d<=roomSpan; d++) for(let w=-half-1; w<=half+1; w++){
    const gi=idx(cell(d,w).x,cell(d,w).y);
    if(!interior.has(gi)) ring.add(gi);
  }
  // Sperrzone für den Carve-Durchlauf: bei cw=1 (altes, bewährtes Verhalten)
  // wird wie bisher Innenraum + kompletter Pufferring vorab reserviert. Bei
  // breiteren Korridoren (cw>1) simulativ geprüft: die volle Ring-Reservierung
  // lässt der block-basierten Maze am Kartenrand kaum noch Platz zum Umrouten
  // (Vorraum-Erfolgsquote fiel in 3000 Testläufen von ~75% auf unter 9%) —
  // nur den Innenraum vorab zu sperren und den Ring dem Sicherheitsnetz
  // (Erreichbarkeits-Check unten) zu überlassen bringt sie auf ~60%, ohne die
  // Fallback-Garantie zu verlieren.
  const blocked = cw>1 ? new Set([...interior]) : new Set([...interior,...ring]);
  return {roomSpan,half,side,depthDir,perp,cell,interior,ring,blocked,doorCand};
}
function finishAntechamber(g,size,plan){
  const idx=(x,y)=>y*size+x;
  const {roomSpan,half,cell,interior,ring,doorCand}=plan;
  function ringDW(gi){
    const x=gi%size,y=(gi/size)|0, rx=x-doorCand.x, ry=y-doorCand.y;
    return {d:rx*plan.depthDir[0]+ry*plan.depthDir[1], w:rx*plan.perp[0]+ry*plan.perp[1]};
  }
  // Zugang suchen: Ringzelle mit Aussennachbar, der bereits (um die Sperrzone
  // herum gewachsener) Flur ist — bevorzugt an der hintersten, zentrierten Stelle.
  const candidates=[];
  for(const gi of ring){
    const x=gi%size,y=(gi/size)|0;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=size||ny>=size) continue;
      const ni=idx(nx,ny);
      if(interior.has(ni)||ring.has(ni)) continue;
      if(g[ni]===0) candidates.push(gi);
    }
  }
  let entranceRingIdx=null;
  if(candidates.length){
    candidates.sort((a,b)=>{ const A=ringDW(a),B=ringDW(b); return B.d!==A.d ? B.d-A.d : Math.abs(A.w)-Math.abs(B.w); });
    entranceRingIdx=candidates[0];
  } else {
    // Extrem selten (winziger Sektor): geraden Gang von der hintersten Wand
    // aus graben, bis vorhandener Flur erreicht ist.
    const back=cell(roomSpan,0); let cx=back.x, cy=back.y, gi=idx(cx,cy);
    for(let step=0; step<10; step++){
      if(g[gi]===0){ entranceRingIdx=gi; break; }
      g[gi]=0;
      const nx=cx+plan.depthDir[0], ny=cy+plan.depthDir[1];
      if(nx<1||ny<1||nx>size-2||ny>size-2) break;
      cx=nx; cy=ny; gi=idx(cx,cy);
    }
    if(entranceRingIdx===null) entranceRingIdx=gi;
  }
  for(const gi of interior) g[gi]=0;
  for(const gi of ring) g[gi]=(gi===entranceRingIdx)?0:1;
  // Säulen im Innern (Randreihen/-spalten bleiben frei, damit man an Tür und
  // Zugang immer vorbeikommt)
  const pillars=[];
  if(roomSpan>=5){
    for(let d=2; d<=roomSpan-3; d+=2) for(let w=-half+2; w<=half-2; w+=2){
      const c=cell(d,w), gi=idx(c.x,c.y);
      if(gi===entranceRingIdx) continue;
      g[gi]=1; pillars.push(gi);
    }
  }
  const doorThreshold=cell(0,0);
  const entranceCell={x:entranceRingIdx%size,y:(entranceRingIdx/size)|0};
  const centerCell=cell(Math.floor((roomSpan-1)/2),0);
  return {
    roomSpan, side:plan.side,
    roomCells:[...interior].map(gi=>({x:gi%size,y:(gi/size)|0})),
    pillarCells: pillars.map(gi=>({x:gi%size,y:(gi/size)|0})),
    doorThreshold, entranceCell, centerCell,
  };
}
const SIZE_TIERS=[1,1.35,1.7,2.1]; // vier zufällige Größen-Varianten pro Sektor
const CORR_W=2; // Korridorbreite in Gitterzellen (1 = altes, enges Verhalten). Wand bleibt immer 1 Zelle dünn.
function generateProceduralLevel(depth){
  const tier=SIZE_TIERS[(Math.random()*SIZE_TIERS.length)|0];
  // sizeRef bestimmt wie bisher nur die Anzahl logischer Zellen (n) — die
  // Maze-Komplexität/Weglänge bleibt dadurch unverändert zur alten Version.
  // Die tatsächliche physische Rastergröße wächst dann mit der Korridorbreite.
  let sizeRef=Math.round((11+depth*2.2)*tier); sizeRef+=(1-(sizeRef%2)); sizeRef=Math.max(11,Math.min(sizeRef,61));
  const n=Math.max(1,Math.floor((sizeRef-2)/2));
  const size=n*(CORR_W+1)+2;
  const idx=(x,y)=>y*size+x;

  // Durchlauf 1: normale Maze nur, um eine gute Position für Ausgang+Vorraum
  // zu finden (weit weg vom Spawn, am Kartenrand, echter Flaschenhals statt
  // von zwei Seiten begehbar — damit der Kern-Wächter den Zugang bewacht).
  const gTrial=carveMaze(size,null,CORR_W);
  const doorCand=findDoorCell(gTrial,size,bfsAll(gTrial,size,1,1));
  const plan=doorCand?planAntechamber(size,doorCand,CORR_W):null;

  // Durchlauf 2: die eigentliche Maze — falls ein Vorraum möglich ist, wird
  // seine Fläche vorab als Sperrzone reserviert, die Maze wächst organisch
  // drumherum (siehe planAntechamber/finishAntechamber weiter oben).
  let g = plan ? carveMaze(size, plan.blocked, CORR_W) : gTrial;
  let far={x:1,y:1}, ante=null;
  if(doorCand){
    far={x:doorCand.x,y:doorCand.y};
    if(plan){
      ante=finishAntechamber(g,size,plan);
      // Sicherheitsnetz: Karte muss weiterhin aus einem Stück sein.
      const distFinal=bfsAll(g,size,1,1);
      let floorCount=0, reach=0;
      for(let i=0;i<g.length;i++){ if(g[i]===0){ floorCount++; if(distFinal[i]>=0) reach++; } }
      if(floorCount!==reach){
        // Sollte praktisch nie vorkommen -> auf die bewährte Einzelzellen-Tür zurückfallen.
        g=gTrial; ante=null;
        if(doorCand.deg>1) sealExtraApproaches(g,size,doorCand);
      }
    } else if(doorCand.deg>1) sealExtraApproaches(g,size,doorCand);
  }

  const wallChars=['#','R','H'], wallW=[0.62,0.28,0.10];
  function pickWall(){ const r=Math.random(); let acc=0; for(let i=0;i<wallChars.length;i++){ acc+=wallW[i]; if(r<=acc) return wallChars[i]; } return '#'; }
  const grid2=[];
  for(let y=0;y<size;y++){ const row=[]; for(let x=0;x<size;x++) row.push(g[idx(x,y)]===1?pickWall():'.'); grid2.push(row); }
  grid2[1][1]='P';
  if(doorCand){
    const [ox,oy]=DOOR_SIDES[doorCand.side];
    grid2[far.y+oy][far.x+ox]='X';
  } else {
    grid2[far.y][far.x]='X'; // Notfall (praktisch nie): keine Kandidatenzelle gefunden
  }
  const floorCells=[];
  for(let y=1;y<size-1;y++) for(let x=1;x<size-1;x++) if(g[idx(x,y)]===0 && !(x===1&&y===1) && grid2[y][x]==='.') floorCells.push([x,y]);
  // Zugangs- und Türschwellenzelle des Vorraums von zufälliger Item/Gegner-Platzierung ausnehmen
  if(ante){

// Verteilt mehrere kleine Etagen-Anzeigeschilder ('D') über eine fertige

// ('#'/'R'/'H'), die an mindestens eine Flurzelle angrenzen (also sichtbar
// sind) — nie Spawn/Tür/Treppe/Gegner/Item-Zellen. Beeinflusst dadurch nie
// die Erreichbarkeit, nur die Optik.
function scatterFloorSigns(mapRows,count){
  const size=mapRows.length;
  const rows=mapRows.map(r=>r.split(''));
  const wallCh=new Set(['#','R','H']);
  const candidates=[];
  for(let y=1;y<size-1;y++) for(let x=1;x<rows[y].length-1;x++){
    if(!wallCh.has(rows[y][x])) continue;
    let visible=false;
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const ny=y+dy, nx=x+dx;
      if(rows[ny]&&rows[ny][nx]==='.'){ visible=true; break; }
    }
    if(visible) candidates.push([x,y]);
  }
  shuffleArr(candidates);
  const chosen=[]; let placed=0;
  const minGap=Math.max(5,Math.floor(size/8));
  for(const [x,y] of candidates){
    if(placed>=count) break;
    let ok=true;
    for(const [cx,cy] of chosen){ if(Math.hypot(x-cx,y-cy)<minGap){ ok=false; break; } }
    if(!ok) continue;
    rows[y][x]='D'; chosen.push([x,y]); placed++;
  }

  // mehrere kleine Displays über die Karte verteilt statt nur eins am Spawn.
  // Nur bei echten Mehr-Etagen-Standorten (n>1) — ein einstöckiger Sektor

  if(n>1){

  const ddx=dx===0?1e30:Math.abs(1/dx), ddy=dy===0?1e30:Math.abs(1/dy);
  let sx,sy,sdx,sdy;
  if(dx<0){ sx=-1; sdx=(ox-mx)*ddx; } else { sx=1; sdx=(mx+1-ox)*ddx; }
  if(dy<0){ sy=-1; sdy=(oy-my)*ddy; } else { sy=1; sdy=(my+1-oy)*ddy; }
  let side=0;
  for(let i=0;i<90;i++){
    if(sdx<sdy){ sdx+=ddx; mx+=sx; side=0; } else { sdy+=ddy; my+=sy; side=1; }
    if(mx<0||my<0||mx>=MW||my>=MH) return 1e9;
    if(grid[my*MW+mx]>0) return side===0?sdx-ddx:sdy-ddy;
  }
  return 1e9;
}

/* ---- Wegfindung (Flow-Feld vom Spieler aus) ---- */
let flowT=0;
function computeFlow(){
  flow.fill(-1);
  const q=[]; const sx=P.x|0, sy=P.y|0;
  if(sx<0||sy<0||sx>=MW||sy>=MH) return;
  flow[sy*MW+sx]=0; q.push(sx,sy);
  for(let i=0;i<q.length;i+=2){
    const x=q[i], y=q[i+1], d=flow[y*MW+x];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const k=ny*MW+nx;
      if(flow[k]!==-1||grid[k]>0) continue;
      flow[k]=d+1; q.push(nx,ny);
    }
  }
}
function flowTarget(e){
  const cx=e.x|0, cy=e.y|0; let best=flow[cy*MW+cx], bx=-1, by=-1;
  if(best<0) return null;
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy) continue;
    const nx=cx+dx, ny=cy+dy;
    if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
    const v=flow[ny*MW+nx];
    if(v<0||v>=best) continue;
    if(dx&&dy&&(grid[cy*MW+nx]>0||grid[ny*MW+cx]>0)) continue;   // keine Diagonale durch Ecken
    best=v; bx=nx; by=ny;
  }
  return bx<0?null:{x:bx+.5,y:by+.5};
}
/* ---- Generisches Flow-Feld zu einem beliebigen Ziel (für die Titelbild-Demo) ---- */
function computeFlowFromCell(tx,ty){
  if(tx<0||ty<0||tx>=MW||ty>=MH) return null;
  const f=new Int16Array(MW*MH).fill(-1);
  const q=[tx,ty]; f[ty*MW+tx]=0;
  for(let i=0;i<q.length;i+=2){
    const x=q[i], y=q[i+1], d=f[y*MW+x];
    for(const [dx,dy] of [[1,0],[-1,0],[0,1],[0,-1]]){
      const nx=x+dx, ny=y+dy;
      if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
      const k=ny*MW+nx;
      if(f[k]!==-1||grid[k]>0) continue;
      f[k]=d+1; q.push(nx,ny);
    }
  }
  return f;
}
function fieldTarget(px,py,f){
  if(!f) return null;
  const cx=px|0, cy=py|0; let best=f[cy*MW+cx], bx=-1, by=-1;
  if(best==null||best<0) return null;
  for(let dy=-1;dy<=1;dy++) for(let dx=-1;dx<=1;dx++){
    if(!dx&&!dy) continue;
    const nx=cx+dx, ny=cy+dy;
    if(nx<0||ny<0||nx>=MW||ny>=MH) continue;
    const v=f[ny*MW+nx];
    if(v<0||v>=best) continue;
    if(dx&&dy&&(grid[cy*MW+nx]>0||grid[ny*MW+cx]>0)) continue;
    best=v; bx=nx; by=ny;
  }
  return bx<0?null:{x:bx+.5,y:by+.5};
}

/* ============================================================
   Audio (WebAudio-Synthese)
   ============================================================ */
let ac=null, master=null, muted=false, noiseBuf=null, ambNoiseBuf=null;
function initAudio(){
  if(ac) { if(ac.state==='suspended') ac.resume(); return; }
  try{
    ac=new (window.AudioContext||window.webkitAudioContext)();
    master=ac.createGain(); master.gain.value=.32; master.connect(ac.destination);
    noiseBuf=ac.createBuffer(1,ac.sampleRate*.6,ac.sampleRate);
    const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
    ambNoiseBuf=ac.createBuffer(1,ac.sampleRate*4,ac.sampleRate);
    const ad=ambNoiseBuf.getChannelData(0); for(let i=0;i<ad.length;i++) ad[i]=Math.random()*2-1;
  }catch(e){ ac=null; }
}

/* ---- Ambient-Loops pro Biome ---- */
const AMBIENT_VOL={facility:.05,canyon:.08,desert:.09,jungle:.06};
let ambient=null, ambEventT=0;
function buildAmbient(biome){
  if(!ac||!ambNoiseBuf) return null;
  const src=ac.createBufferSource(); src.buffer=ambNoiseBuf; src.loop=true;
  const filter=ac.createBiquadFilter();
  const gain=ac.createGain(); gain.gain.value=0;
  const lfo=ac.createOscillator(); const lfoGain=ac.createGain();
  if(biome==='desert'){ filter.type='bandpass'; filter.frequency.value=750; filter.Q.value=.6; lfo.frequency.value=1/7; lfoGain.gain.value=380; }
  else if(biome==='jungle'){ filter.type='bandpass'; filter.frequency.value=1300; filter.Q.value=.7; lfo.frequency.value=1/5; lfoGain.gain.value=260; }
  else if(biome==='canyon'){ filter.type='lowpass'; filter.frequency.value=520; filter.Q.value=.4; lfo.frequency.value=1/9; lfoGain.gain.value=140; }
  else { filter.type='lowpass'; filter.frequency.value=220; filter.Q.value=.3; lfo.frequency.value=1/4; lfoGain.gain.value=45; }
  lfo.connect(lfoGain); lfoGain.connect(filter.frequency);
  src.connect(filter); filter.connect(gain); gain.connect(master);
  src.start(); lfo.start();
  gain.gain.setTargetAtTime(muted?0:(AMBIENT_VOL[biome]||.06),ac.currentTime,1.2);
  return {src,filter,gain,lfo,biome};
}
function stopAmbient(){
  if(!ambient) return;
  try{ ambient.gain.gain.setTargetAtTime(0,ac.currentTime,.15); }catch(e){}
  const a=ambient;
  setTimeout(()=>{ try{a.src.stop();}catch(e){} try{a.lfo.stop();}catch(e){} },250);
  ambient=null;
}
function setAmbient(biome){
  if(!ac) return;
  if(ambient && ambient.biome===biome) return;
  stopAmbient();
  ambient=buildAmbient(biome);
  ambEventT=1+Math.random()*2;
}
function refreshAmbientVolume(){
  if(!ambient) return;
  ambient.gain.gain.setTargetAtTime(muted?0:(AMBIENT_VOL[ambient.biome]||.06),ac.currentTime,.3);
}
function ambientTick(dt){
  if(!ambient||muted) return;
  ambEventT-=dt; if(ambEventT>0) return;
  const b=ambient.biome;
  if(b==='jungle'){ const f=2100+Math.random()*900; tone(f,f*.86,.05,'square',.045); tone(f*1.05,f*.9,.05,'square',.03,.09); ambEventT=1.2+Math.random()*2.2; }
  else if(b==='canyon'){ tone(210,85,.35,'triangle',.05); tone(210,85,.3,'triangle',.025,.3); ambEventT=4+Math.random()*5; }
  else if(b==='desert'){ noise(.5,.05,1500); ambEventT=3+Math.random()*4; }
  else { tone(560,560,.05,'square',.025); tone(400,400,.05,'square',.018,.1); ambEventT=3.5+Math.random()*4.5; }
}
function tone(f0,f1,dur,type,vol,delay){
  if(!ac||muted) return;
  const t=ac.currentTime+(delay||0), o=ac.createOscillator(), g=ac.createGain();
  o.type=type||'square'; o.frequency.setValueAtTime(f0,t); o.frequency.exponentialRampToValueAtTime(Math.max(20,f1),t+dur);
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t+dur+.03);
}
function noise(dur,vol,fc){
  if(!ac||muted) return;
  const t=ac.currentTime, s=ac.createBufferSource(), f=ac.createBiquadFilter(), g=ac.createGain();
  s.buffer=noiseBuf; f.type='lowpass'; f.frequency.value=fc;
  g.gain.setValueAtTime(vol,t); g.gain.exponentialRampToValueAtTime(.001,t+dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t+dur+.02);
}

/* ============================================================
   Architektur (Phase 1) — gruppierter Spielzustand unter `NX`
   ------------------------------------------------------------
   Bestehende Variablen bleiben (Performance, keine Regression);
   dieser Block ergänzt nur: zentralen State-Manager, gebündelten
   Effekt-Zustand (FX), versionierten Save (LocalStorage) und den
   Namespace `NX`, über den alle Teilzustände erreichbar sind:
   NX.player / weapons / enemies / level / progression / audio /
   fx / save / settings.  Neue Phasen hängen sich hier ein.
   ============================================================ */
const SAVE_KEY='nexus_breach_save', SAVE_VERSION=1;

/* ---- Game State Manager ---- */
let state='title';   // title | play | pause | dead | levelwin | gamewin
const STATE_FLOW={   // erlaubte Übergänge; unbekannte werden nur gewarnt, nie blockiert
  title:['play'],
  play:['pause','dead','levelwin','gamewin','title'],
  pause:['play','title','gamewin'],
  dead:['play','gamewin','title'],
  levelwin:['play','gamewin','title'],
  gamewin:['play','title']
};
const stateListeners=[], stateWarned={};
function onState(fn){ stateListeners.push(fn); }
function setState(next){
  const prev=state;
  if(next===prev) return;
  if(!STATE_FLOW[next]) { console.warn('[NX] unbekannter State',next); }
  else if(!(STATE_FLOW[prev]||[]).includes(next)){
    const k=prev+'>'+next; if(!stateWarned[k]){ stateWarned[k]=1; console.warn('[NX] ungewöhnlicher State-Übergang',k); }
  }
  state=next;
  if(next!=='play') Save.flush();          // Spielstand sichern, sobald das Spiel nicht mehr läuft
  for(let i=0;i<stateListeners.length;i++){ try{ stateListeners[i](next,prev); }catch(e){ console.error(e); } }
}

/* ---- Effects State (vorher lose Globals: shakeAmt, hurtT, healT, hitMarkT, msgT, flashAdd, faceKind) ---- */
const FX={shake:0, hurt:0, heal:0, hitMark:0, msg:0, flashAdd:0, faceKind:-1, shieldHit:0, dash:0, crit:0};

/* ---- Save State: versioniert, offline, ohne Konto ---- */
const Save=(()=>{
  const isObj=v=>!!v&&typeof v==='object'&&!Array.isArray(v);
  const num=(v,d,lo,hi)=>{ v=+v; return Number.isFinite(v)?Math.min(hi,Math.max(lo,v)):d; };
  // Einstellungen: [min, max, Standard] — Anzeige-/Audio-Schalter, in späteren Phasen ans Settings-Menü gebunden
  const SETTINGS_SPEC={
    masterVol:[0,1,1], sfxVol:[0,1,1], musicVol:[0,1,1],
    screenShake:[0,1,1], scanlines:[0,1,1], pixelFx:[0,1,1], particles:[0,1,1], damageFlash:[0,1,1],
    fov:[50,100,67], mouseSens:[.25,3,1], touchSens:[.25,3,1]
  };
  function defaultSettings(){ const s={ reducedMotion:false }; for(const k in SETTINGS_SPEC) s[k]=SETTINGS_SPEC[k][2]; return s; }
  function defaults(){
    return {
      version:SAVE_VERSION, created:Date.now(), updated:0,
      highestDepth:0, credits:0, bestScore:0, bestTime:0,
      unlockedWeapons:['pistol','fists'], weaponUpgrades:{}, perks:{}, artifacts:[], achievements:{},
      stats:{kills:0, deaths:0, runs:0, bossKills:0, sectorsCleared:0, playTime:0},
      settings:defaultSettings()
    };
  }
  // Migrationen: MIGRATIONS[n] hebt einen Save von Version n auf n+1.
  // Beispiel für später:  1: d=>{ d.newField=0; return d; }
  const MIGRATIONS={};
  function migrate(d){
    let v=Math.floor(+d.version)||1;
    while(v<SAVE_VERSION){
      const m=MIGRATIONS[v];
      if(m){ try{ d=m(d)||d; }catch(e){ console.warn('[save] Migration von v'+v+' fehlgeschlagen',e); } }
      v++; d.version=v;
    }
    return d;
  }
  // Rohdaten (evtl. alt/manipuliert/unvollständig) auf gültiges Schema bringen
  function sanitize(raw){
    const d=defaults();
    if(!isObj(raw)) return d;
    d.created=num(raw.created,d.created,0,Infinity);
    d.updated=num(raw.updated,0,0,Infinity);
    d.highestDepth=num(raw.highestDepth,0,0,1e6)|0;
    d.credits=num(raw.credits,0,0,1e12)|0;
    d.bestScore=num(raw.bestScore,0,0,1e15);
    d.bestTime=num(raw.bestTime,0,0,1e9);
    if(Array.isArray(raw.unlockedWeapons)) d.unlockedWeapons=raw.unlockedWeapons.filter(x=>typeof x==='string').slice(0,64);
    if(Array.isArray(raw.artifacts)) d.artifacts=raw.artifacts.filter(x=>typeof x==='string').slice(0,256);
    for(const k of ['weaponUpgrades','perks','achievements']) if(isObj(raw[k])) d[k]=raw[k];
    if(!Array.isArray(d.weaponUpgrades.discovered)) delete d.weaponUpgrades.discovered;
    else d.weaponUpgrades.discovered=d.weaponUpgrades.discovered.filter(x=>typeof x==='string').slice(0,256);
    if(isObj(raw.stats)) for(const k in d.stats) d.stats[k]=num(raw.stats[k],0,0,1e12);
    if(isObj(raw.settings)){
      for(const k in SETTINGS_SPEC){ const [lo,hi,def]=SETTINGS_SPEC[k]; d.settings[k]=num(raw.settings[k],def,lo,hi); }
      d.settings.reducedMotion=!!raw.settings.reducedMotion;
    }
    return d;
  }

  const api={ data:null, ok:true, readOnly:false, dirty:false };
  let timer=0;
  function read(){ try{ return window.localStorage.getItem(SAVE_KEY); }catch(e){ api.ok=false; return null; } }
  api.load=function(){
    const str=read();
    let raw=null;
    if(str){ try{ raw=JSON.parse(str); }catch(e){ console.warn('[save] beschädigter Spielstand — starte neu'); } }
    if(isObj(raw)){
      if((+raw.version||1)>SAVE_VERSION) api.readOnly=true;   // Save einer neueren Version: nie überschreiben
      else raw=migrate(raw);
      api.data=sanitize(raw);
    } else {
      api.data=defaults();
      // Übernahme der bisherigen Einzel-Bestwerte (vor Save-System)
      try{
        const bt=+window.localStorage.getItem('orca_breach_best')||0, bd=+window.localStorage.getItem('orca_breach_bestdepth')||0;
        if(bt>0) api.data.bestTime=bt; if(bd>0) api.data.highestDepth=bd|0;
      }catch(e){ api.ok=false; }
    }
    return api.data;
  };
  api.flush=function(){
    if(timer){ clearTimeout(timer); timer=0; }
    if(!api.dirty||api.readOnly||!api.ok) return;
    api.data.updated=Date.now(); api.data.version=SAVE_VERSION;
    try{ window.localStorage.setItem(SAVE_KEY,JSON.stringify(api.data)); api.dirty=false; }
    catch(e){ api.ok=false; }
  };
  api.markDirty=function(){ api.dirty=true; if(!timer) timer=setTimeout(api.flush,800); };
  api.reset=function(){ api.data=defaults(); api.dirty=true; api.flush(); };
  api.sanitize=sanitize; api.migrate=migrate; api.defaults=defaults;

  // ---- Ereignisse aus dem Spielablauf ----
  api.onRunStart=function(){ api.data.stats.runs++; api.markDirty(); };
  api.onLevelStart=function(depth){ if(depth>api.data.highestDepth){ api.data.highestDepth=depth|0; api.markDirty(); } };
  api.onKill=function(boss){ const s=api.data.stats; s.kills++; if(boss) s.bossKills++; api.markDirty(); };
  api.onDeath=function(){ api.data.stats.deaths++; api.markDirty(); };
  api.onSectorClear=function(){ api.data.stats.sectorsCleared++; api.markDirty(); };
  api.onRunEnd=function(depth){ if(depth>api.data.highestDepth) api.data.highestDepth=depth|0; api.markDirty(); };
  api.onCampaignComplete=function(t){ t=t|0; if(t>0&&(!api.data.bestTime||t<api.data.bestTime)){ api.data.bestTime=t; } api.markDirty(); };

  api.load();
  window.addEventListener('pagehide',()=>api.flush());
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) api.flush(); });
  return api;
})();

/* ---- Combat-Tracker (Phase 2): Kill-Streak + Combo-Kette fuers HUD; Phase 17 baut daraus das Score-/Style-System ---- */
const COMBO_WINDOW=4;   // Sekunden bis die Kette abreisst
const Combat={ streak:0, bestStreak:0, chain:0, chainBest:0, t:0, popped:false,
  kill(){ this.streak++; if(this.streak>this.bestStreak) this.bestStreak=this.streak; this.chain++; if(this.chain>this.chainBest) this.chainBest=this.chain; this.t=COMBO_WINDOW; this.popped=true; },
  hurt(){ this.streak=0; this.chain=0; this.t=0; },

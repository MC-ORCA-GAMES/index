        if(!row&&!loc) continue;
        if(!row){ await forceUp(k); continue; }
        if(!loc||(k==='main'&&isFresh(loc))){ if(applyCloud(k,row)&&k==='main') reload=true; continue; }
        if(row.value===loc){ verSet(k,row.version|0); api.dirty[k]=false; continue; }
        if(k==='run'){   // Schnappschuss: der jüngere Spielstand gewinnt
          let tl=0,tc=0; try{ tl=JSON.parse(loc).t|0; }catch(e){} try{ tc=JSON.parse(row.value).t|0; }catch(e){}
          if(tc>tl) applyCloud(k,row); else await forceUp(k);
          continue;
        }
        const c=await ask(row,loc);
        if(c==='cloud'){ if(applyCloud(k,row)) reload=true; } else await forceUp(k);
      }
      api.msg=reload?'Cloud-Stand geladen — Spiel wird neu gestartet …':'Synchronisiert '+new Date().toLocaleTimeString('de-DE'); api.last=Date.now();
    }catch(e){ api.msg='Sync fehlgeschlagen: '+((e&&e.message)||e); }
    api.busy=false; api.locked=false; changed();
    if(reload) setTimeout(()=>location.reload(),600);
  };
  api.signOut=async function(){ if(!api.sb) return; await api.sb.auth.signOut(); api.user=null; api.msg='Ausgeloggt.'; changed(); };
  /* Login-Bereich in den Einstellungen */
  api.mount=function(el){
    if(!el) return;
    let step='email', pending='';
    const IS='width:100%;box-sizing:border-box;min-height:48px;margin:.6cqw 0;padding:0 1cqw;background:#06141d;color:#dfe9f3;border:1px solid rgba(53,228,255,.5);font:600 clamp(12px,1.5cqw,20px) monospace';
    const tx=s=>{ const d=document.createElement('div'); d.style.cssText='font:600 clamp(11px,1.35cqw,18px)/1.4 monospace;margin:.4cqw 0'; d.textContent=s; return d; };
    const btn=(t,fn)=>{ const b=document.createElement('button'); b.type='button'; b.textContent=t; b.style.minHeight='48px'; b.style.marginRight='1cqw'; b.onclick=fn; return b; };
    const inp=(ph,mode)=>{ const i=document.createElement('input'); i.placeholder=ph; i.style.cssText=IS; if(mode) i.setAttribute('inputmode',mode); for(const ev of ['keydown','keyup','keypress']) i.addEventListener(ev,e=>e.stopPropagation()); return i; };
    function draw(){
      el.innerHTML='';
      if(!api.sb){ el.appendChild(tx(loading?'Cloud-Konto wird geladen …':'Cloud nicht erreichbar (offline?) — Spielstand bleibt lokal.')); el.appendChild(btn('Erneut versuchen',()=>{ ensure().then(draw); draw(); })); return; }
      if(api.user){
        el.appendChild(tx('Eingeloggt als '+(api.user.email||'?')));
        el.appendChild(tx(isGuest()?'Gast-Modus: kein Cloud-Sync.':'Haupt-Spielstand und Level-Schnappschuss werden automatisch gesichert.'));
        if(api.msg) el.appendChild(tx(api.msg));
        if(!isGuest()) el.appendChild(btn('⟳ Jetzt synchronisieren',()=>api.sync()));
        el.appendChild(btn('Ausloggen',()=>api.signOut()));
        return;
      }
      if(step==='email'){
        el.appendChild(tx('Login per E-Mail-Code — derselbe Account wie bei den anderen MC-Orca-Spielen.'));
        const i=inp('deine@email.de','email'); el.appendChild(i);
        el.appendChild(btn('Code senden',async()=>{
          const m=i.value.trim(); if(m.indexOf('@')<1){ api.msg='Bitte gültige E-Mail eingeben.'; draw(); return; }
          api.msg='Sende Code …'; draw();
          const r=await api.sb.auth.signInWithOtp({email:m,options:{shouldCreateUser:true}});
          if(r.error){ api.msg='Fehler: '+r.error.message; draw(); return; }
          pending=m; step='code'; api.msg='Code an '+m+' geschickt (auch im Spam-Ordner nachsehen).'; draw();
        }));
      } else {
        el.appendChild(tx('Code aus der E-Mail eingeben:'));
        const i=inp('123456','numeric'); i.maxLength=6; el.appendChild(i);
        el.appendChild(btn('Bestätigen',async()=>{
          const c=i.value.trim(); if(!c){ return; }
          api.msg='Prüfe Code …'; draw();
          const r=await api.sb.auth.verifyOtp({email:pending,token:c,type:'email'});
          if(r.error){ api.msg='Fehler: '+r.error.message; draw(); return; }
          api.msg='Eingeloggt!'; draw();
        }));
        el.appendChild(btn('Zurück',()=>{ step='email'; draw(); }));
      }
      if(api.msg) el.appendChild(tx(api.msg));
    }
    api.onChange=()=>{ if(el.isConnected) draw(); };
    draw(); ensure().then(draw);
  };
  api.status=()=>api.user?(isGuest()?'Gast':(api.busy?'synchronisiert …':'Cloud aktiv')):'nur lokal';
  api.state=()=>({user:api.user&&api.user.email,busy:api.busy,dirty:Object.assign({},api.dirty),msg:api.msg,last:api.last,ver:{main:verGet('main'),run:verGet('run')}});
  window.addEventListener('load',()=>{ if(hasSession()) ensure(); });
  return api;
})();

/* ============================================================
   SPEICHERSTAND MITTEN IM LEVEL (Snapshot)
   ============================================================
   Ein Platz (`nb_run_save`, wird in die Cloud gespiegelt). Gesichert wird automatisch alle 20 s Spielzeit, beim Öffnen des
   Pause-Menüs, beim Verlassen/Ausblenden der Seite und per Pause-Menü „Spiel speichern“. Titel: „Spielstand laden“.
   Inhalt: Spieler (Position, Blick, Leben/Schild/Rüstung/Energie, Waffen, Magazine, Munition), Mods/Perks/Loot, Lauf-Zähler,
   Gegner (Position, Leben, Zustand, Elite-Eigenschaften), Pickups, Karten-Änderungen (Türen/Fallen), Nebel des Krieges.
   Gilt für Story-Sektoren und Endlos-Einsätze (Seed). NICHT gesichert: laufende Level-Ereignisse/Fallen-Timer/Missionsfortschritt
   des Sektors (starten frisch), und kein Speichern während eines aktiven Bosskampfs. Sektor gesäubert / Lauf beendet = Schnappschuss weg.
   Konsole: __breach.Snapshot.info(), .capture({force:true}), .load(), .clear() */
const Snapshot=(()=>{
  const KEY='nb_run_save', V=1, api={pending:null};
  const r3=v=>Math.round(v*1000)/1000;
  function scal(o){ const r={}; for(const k in o){ const v=o[k], t=typeof v;
    if(t==='number'){ if(isFinite(v)) r[k]=r3(v); } else if(t==='boolean') r[k]=v; else if(t==='string'&&v.length<=40) r[k]=v; } return r; }
  const toB64=a=>{ let s=''; for(let i=0;i<a.length;i+=8192) s+=String.fromCharCode.apply(null,a.subarray(i,i+8192)); return btoa(s); };
  const fromB64=(s,n)=>{ try{ const b=atob(s); if(b.length!==n) return null; const a=new Uint8Array(n); for(let i=0;i<n;i++) a[i]=b.charCodeAt(i); return a; }catch(e){ return null; } };
  const jclone=v=>{ try{ return JSON.parse(JSON.stringify(v)); }catch(e){ return null; } };
  function read(){ try{ const o=JSON.parse(localStorage.getItem(KEY)||'null'); return (o&&o.v===V&&o.P&&(o.mode==='story'||o.mode==='endless'))?o:null; }catch(e){ return null; } }
  function mode(){
    if(!lvl) return null;
    try{ if(Ascension.state().on) return null; }catch(e){}
    if(Story.live()) return 'story';
    if(Endless.act()&&Endless.seed&&siteFloors&&siteFloors.indexOf(lvl)>=0) return 'endless';
    return null;
  }
  api.has=()=>!!read();
  api.info=function(){
    const o=read(); if(!o) return null;
    const m=Math.max(0,Math.round((Date.now()-(+o.t||0))/60000));
    return {label:o.label||'',mode:o.mode,ago:m<2?'gerade eben':m<60?'vor '+m+' Min.':m<1440?'vor '+Math.round(m/60)+' Std.':'vor '+Math.round(m/1440)+' Tg.'};
  };
  api.clear=function(){ try{ const had=!!localStorage.getItem(KEY); localStorage.removeItem(KEY); if(had) Cloud.removeRun(); }catch(e){} };
  api.capture=function(opt){
    opt=opt||{};
    try{
      if(state!=='play'&&!(opt.force&&(state==='pause'))) return false;
      if(!(P.hp>0)) return false;
      const m=mode(); if(!m) return false;
      for(const e of enemies) if(e.type==='K'&&e.alive&&e.bstarted) return false;   // Bosskampf läuft: keine Momentaufnahme
      const eq=[]; for(let i=0;i<WEAPONS.length;i++) eq.push(Object.assign({},Mods.eq[i]||{}));
      const label=m==='story'?('Sektor '+((Story.cur&&Story.cur.id)||'?')+(Story.cur&&Story.cur.name?' · '+Story.cur.name:'')):('Endlos · Tiefe '+(lvl.depth|0));
      const o={v:V,t:Date.now(),mode:m,label,lv:lvIdx,seed:Endless.seed,diff:Endless.diff,depth:lvl.depth|0,fl:m==='endless'?siteFloors.indexOf(lvl):0,
        P:Object.assign(scal(P),{owned:P.owned.slice(),mag:P.mag.slice(),hs:P.hs.slice(),os:P.os.slice()}),
        mods:{inv:Object.assign({},Mods.inv),eq,pity:Mods.pity|0},
        perks:{lv:Object.assign({},Perks.lv),eliteKills:Perks.eliteKills|0,sectors:Perks.sectors|0,seenSyn:Object.assign({},Perks.seenSyn)},
        loot:{keys:Loot.keys|0,cores:Loot.cores|0,am:Object.assign({},Loot.am),luck:(typeof Loot.luck==='number')?Loot.luck:null},
        run:{kills:run.kills|0,shards:run.shards|0,time:+run.time||0,foes:run.foes|0,shardsMax:run.shardsMax|0},
        score:+Style.score||0, st:{kills:stats.kills|0,shards:stats.shards|0,time:+stats.time||0}, tot:{foes:totals.foes|0,shards:totals.shards|0},
        en:enemies.slice(0,400).map(e=>{ const r=scal(e); if(e.em&&typeof e.em==='object'){ const c=jclone(e.em); if(c) r.em=c; } return r; }),
        pk:pickups.filter(p=>!p.taken).slice(0,600).map(p=>{ const r=scal(p); if(p.loot&&typeof p.loot==='object'){ const c=jclone(p.loot); if(c) r.loot=c; } return r; }),
        gw:MW,gh:MH,g:toB64(grid),fog:seen?toB64(seen):null};
      const json=JSON.stringify(o); if(json.length>1500000) return false;
      localStorage.setItem(KEY,json);
      Cloud.onLocalWrite('run',!!opt.now);
      return true;
    }catch(e){ console.warn('[snapshot] Speichern fehlgeschlagen',e); return false; }
  };
  api.saveNow=function(){ const ok=api.capture({force:true,now:true}); try{ Save.flush(); Cloud.flushNow(); }catch(e){} return ok; };
  /* Laden: neuer Lauf mit dem gesicherten Loadout, der Sektor wird per startLevel gebaut, api.afterStart legt den Zustand darüber */
  api.load=function(){
    const o=read(); if(!o) return false;
    try{
      const S=o.P||{}, num=(v,d)=>Number.isFinite(+v)?+v:d;
      let target;
      if(o.mode==='endless'){ Endless.on=true; Endless.seed=String(o.seed||Endless.rand()); if(Endless.DIFF[o.diff]) Endless.diff=o.diff; }
      else { if(!Number.isInteger(o.lv)||o.lv<0||o.lv>=LEVELS.length) return false; Endless.on=false; }
      newRun();
      try{ Save.data.stats.runs=Math.max(0,(Save.data.stats.runs|0)-1); }catch(x){}   // Laden zählt nicht als neuer Lauf
      for(let i=0;i<WEAPONS.length;i++) if(S.owned&&S.owned[i]) setOwned(i,true);
      P.hasSG=!!S.hasSG;
      if(o.mods){
        Mods.inv=Object.assign(Object.create(null),o.mods.inv||{});
        for(let i=0;i<WEAPONS.length;i++){ Mods.eq[i]=Object.assign({},(o.mods.eq||[])[i]||{}); Mods.refresh(i); }
        Mods.pity=o.mods.pity|0;
      }
      if(o.perks) Perks.load(o.perks);
      if(o.loot){ Loot.keys=o.loot.keys|0; Loot.cores=o.loot.cores|0; Loot.am=Object.assign({},o.loot.am||{}); if(typeof o.loot.luck==='number'){ try{ Loot.luck=o.loot.luck; }catch(x){} } }
      for(let i=0;i<WEAPONS.length;i++){ if(P.owned[i]){ P.mag[i]=Math.max(0,Math.min(Mods.magSize(i),num((S.mag||[])[i],P.mag[i]))); } P.hs[i]=num((S.hs||[])[i],0); P.os[i]=num((S.os||[])[i],0); }
      P.ammo=Math.max(0,Math.min(999,num(S.ammo,P.ammo)));
      P.weapon=P.owned[S.weapon|0]?(S.weapon|0):0;
      P.hp=Math.max(1,Math.min(100,num(S.hp,100)));
      P.shield=Math.max(0,num(S.shield,0)); P.armor=Math.max(0,num(S.armor,0)); P.energy=Math.max(0,num(S.energy,0));
      const r=o.run||{}; run.kills=r.kills|0; run.shards=r.shards|0; run.time=+r.time||0; run.foes=r.foes|0; run.shardsMax=r.shardsMax|0;
      try{ Style.score=+o.score||0; }catch(x){}
      refreshWeaponUI();
      if(o.mode==='endless'){ siteFloors=generateProceduralSite(o.depth|0); target=siteFloors[o.fl|0]||siteFloors[0]; } else target=o.lv;
      api.pending=o; startLevel(target,false); return true;
    }catch(x){ console.warn('[snapshot] Laden fehlgeschlagen',x); Endless.on=false; api.pending=null; return false; }
  };
  function apply(o){
    const S=o.P||{};
    if(o.gw!==MW||o.gh!==MH){ setTimeout(()=>showMsg('Karte weicht ab — Sektor beginnt von vorn',3200),700); return; }
    const sx=P.x, sy=P.y, sa=P.a;
    const g=fromB64(o.g,MW*MH);
    if(g) for(let i=0;i<g.length;i++) if(grid[i]!==g[i]&&g[i]!==3&&grid[i]!==3) grid[i]=g[i];   // Türen/Änderungen; temporäre Fallen (3) frisch lassen
    if(seen&&o.fog){ const f=fromB64(o.fog,MW*MH); if(f) seen.set(f); }
    for(const k in S){ if(k==='owned'||k==='mag'||k==='hs'||k==='os') continue; const v=S[k]; if(typeof v!=='object'&&typeof P[k]===typeof v) P[k]=v; }
    for(let i=0;i<WEAPONS.length;i++){ if(P.owned[i]) P.mag[i]=Math.max(0,Math.min(Mods.magSize(i),+((S.mag||[])[i])||0)); P.hs[i]=+((S.hs||[])[i])||0; P.os[i]=+((S.os||[])[i])||0; }
    if(!P.owned[P.weapon]) P.weapon=0;
    if(boxHit(P.x,P.y,.2)){ P.x=sx; P.y=sy; P.a=sa; }
    if(Array.isArray(o.en)){
      const out=[];
      for(const r of o.en){
        const t=ETYPES[r&&r.type]; if(!t) continue;
        const e={type:r.type,x:+r.x||0,y:+r.y||0,hp:t.hp,maxhp:t.hp,alive:true,awake:false,hear:false,cd:1+Math.random(),flash:0,atk:0,strafe:Math.random()<.5?-1:1,strT:0,bodyT:0,stagT:0,stagX:0,stagY:0};
        AI.init(e); if(e.type==='K') Boss.init(e);
        for(const k in r){ if(k==='em'||k==='type') continue; const v=r[k]; if(v!==null&&typeof v!=='object') e[k]=v; }
        if(r.em&&typeof r.em==='object') e.em=r.em;
        out.push(e);
      }
      enemies=out;
    }
    if(o.tot){ totals.foes=o.tot.foes|0; totals.shards=o.tot.shards|0; }
    if(Array.isArray(o.pk)){
      const used=new Set();
      for(const p of pickups){
        let m=-1;
        for(let j=0;j<o.pk.length;j++){ if(used.has(j)) continue; const r=o.pk[j]; if(r.kind===p.kind&&Math.abs(r.x-p.x)<.06&&Math.abs(r.y-p.y)<.06){ m=j; break; } }
        if(m<0){ p.taken=true; continue; }   // gab es beim Sichern nicht mehr (eingesammelt)
        used.add(m); const r=o.pk[m];
        for(const k in r){ if(k==='kind'||k==='x'||k==='y'||k==='loot') continue; if(typeof r[k]!=='object') p[k]=r[k]; }
      }
      for(let j=0;j<o.pk.length;j++){
        if(used.has(j)) continue;
        const r=o.pk[j]; if(!r||!r.kind) continue;
        const p={kind:r.kind,x:+r.x||0,y:+r.y||0,taken:false,ph:+r.ph||0};
        for(const k in r){ if(k==='loot') continue; if(typeof r[k]!=='object') p[k]=r[k]; }
        if(r.loot&&typeof r.loot==='object') p.loot=r.loot;
        pickups.push(p);
      }
    }
    if(o.st){ stats.kills=o.st.kills|0; stats.shards=o.st.shards|0; stats.time=+o.st.time||0; }
    try{ buildMini(); flowT=0; updateHeatUI(); refreshWeaponUI(); }catch(e){}
    setTimeout(()=>showMsg('Spielstand geladen',2400),700);
  }
  api.afterStart=function(){   // aus startLevel, direkt nach dem Levelaufbau
    const o=api.pending; api.pending=null;
    if(!o) return;
    try{ apply(o); }catch(e){ console.warn('[snapshot] Wiederherstellung teilweise fehlgeschlagen',e); }
  };
  api.titleBtn=function(){ const i=api.info(); return i?'<button id="b-load" type="button">Spielstand laden — '+escH(i.label)+' · '+i.ago+'</button>':''; };
  /* Auto-Sicherung */
  setInterval(()=>{ if(state==='play') api.capture(); },20000);
  const leave=()=>{ try{ if(state==='play') api.capture(); Cloud.flushNow(); }catch(e){} };
  window.addEventListener('pagehide',leave);
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) leave(); });
  return api;
})();

function finishLevel(){
  try{ Snapshot.clear(); }catch(e){}   // Sektor gesäubert: Schnappschuss ist überholt
  setState('levelwin'); releaseLock(); sfx.win(); Cine.glitch(.3); Cine.flash(.25); Save.onSectorClear(lvl&&lvl.procedural?lvl.depth:0); Ach.onSector();
  run.kills+=stats.kills; run.shards+=stats.shards; run.time+=stats.time; run.foes+=totals.foes; run.shardsMax+=totals.shards;
  const last=lvIdx>=LEVELS.length-1;
  const st=[['Feinde erledigt',stats.kills+' / '+totals.foes],['MOGC-Splitter',stats.shards+' / '+totals.shards],['Zeit',fmt(stats.time)]];
  const rw=Mods.sectorReward(modDepth()); if(rw) st.push(['Waffen-Mod',rw.name]);
  { const pc=Perks.onSector(); if(pc) st.push(['Perk-Kern','+'+pc]); }   // Phase 14
  for(const r of Missions.onFinish()) st.push(r);   // Phase 16
  for(const r of Style.onFinish()) st.push(r);   // Phase 17
  for(const r of Meta.onSector(lvl&&lvl.procedural?lvl.depth:0,stats.time)) st.push(r);   // Phase 15
  for(const r of Events.onFinish()) st.push(r);
  for(const r of Story.onSectorClear()) st.push(r);   // Story Mode Phase 1
  if(lvl.procedural){
    if(Ascension.finish(st)) return;   // Phase 20: Ascension-Finale / Endless-Rekorde
    const nextDepth=lvl.depth+1;
    showOverlay(addLoadoutBtn({title:'Sektor gesäubert',text:lvl.name+' ist wieder online.',stats:st,
      buttons:[{label:'Weiter — Tiefe '+nextDepth,primary:true,fn:()=>{ siteFloors=generateProceduralSite(nextDepth); startLevel(siteFloors[0],false); }},
               {label:'Lauf beenden',fn:finishRun}]}));
    return;
  }
  if(Story.finale()){ Epilogue.start(st); return; }   // Story Phase 9: Sektor 30 -> Epilog / Terminal-Finale
  if(!last){
    const ab=Story.actBreak();   // Story Phase 5: letzter Sektor eines Aktes
    const nb=[{label:'Weiter zu '+LEVELS[lvIdx+1].name.split(':')[0],primary:true,fn:()=>startLevel(lvIdx+1,false)}];
    if(ab) nb.push({label:'Zum Titel',fn:showTitle});
    showOverlay(addLoadoutBtn({title:ab?'AKT '+Story.roman(ab.n)+' abgeschlossen':'Sektor gesäubert',text:ab?ab.text:lvl.name+' ist wieder online.',stats:st,buttons:nb}));
  } else if(Story.actEnd()){
    showOverlay({title:'AKT '+Story.roman(Story.cur.act)+' abgeschlossen',text:Story.cur.actEndText||'Die Geschichte geht weiter.',stats:st,
      buttons:[{label:'Zum Titel',primary:true,fn:showTitle}]});
  } else {
    setState('gamewin');
    let best=null;
    try{ best=+localStorage.getItem('orca_breach_best')||0; if(!best||run.time<best){ localStorage.setItem('orca_breach_best',String(run.time|0)); best=run.time|0; } }catch(e){}
    Save.onCampaignComplete(run.time);
    for(const r of Meta.onRunEnd(0).ch) st.push(r);
    for(const r of Style.onRunEnd()) st.push(r);
    st.push(['Gesamtzeit',fmt(run.time)]); st.push(['Gesamt-Splitter',run.shards+' / '+run.shardsMax]);
    if(best) st.push(['Bestzeit (dieser Browser)',fmt(best)]);
    showOverlay({title:'NEXUS ist wieder online',text:'Der Kern ist gesichert. Das war die Testversion — Feedback willkommen.',stats:st,
      buttons:[{label:'Nochmal von vorn',primary:true,fn:()=>{ newRun(); startLevel(0,true); }},{label:'Zum Titel',fn:showTitle}]});
  }
}

/* ============================================================
   Ablauf: Start, Pause, Overlays
   ============================================================ */
function newRun(){
  Save.onRunStart(); Stats.onRunStart(); Mods.reset(); Roles.reset(); Events.reset(); Biome.reset(); Hazards.reset(); Loot.reset(); Perks.reset(); Combat.reset(); Style.reset(); Ascension.reset(); run.kills=run.shards=run.time=run.foes=run.shardsMax=0;
  for(let i=0;i<WEAPONS.length;i++){ P.owned[i]=(i===0||i===2); P.mag[i]=Mods.magSize(i); P.hs[i]=0; P.os[i]=0; }   // Arsenal zurueck auf Pistole + Faeuste
  P.weapon=0; P.heat=0; P.overheatT=0; P.reloadT=0; P.ammo=36; refreshWeaponUI();
}
function startLevel(i,fresh){
  fadeTransition(()=>{
    initAudio();
    if(fresh){ P.hp=100; if(i===0&&!P.hasSG) P.ammo=36+Meta.startAmmo(); }
    parseLevel(i);
    Combat.resetChain(); Style.onSector(); Ascension.onSector(); BossCard.hide(); Story.onSectorStart();
    Save.onLevelStart(lvl.procedural?lvl.depth:0);
    setAmbient(Ascension.amb(curBiome));
    snap={hp:P.hp,ammo:P.ammo,hasSG:P.hasSG,owned:P.owned.slice()};
    Checkpoint.capture();   // Speicherpunkt (Endlos-Einsatz): Beginn des Sektors
    Snapshot.afterStart();  // Laden: gesicherten Zustand (Position, Gegner, Pickups, Karte) über den frischen Sektor legen
    if(!P.owned[P.weapon]) P.weapon=0; refreshWeaponUI();
    hideOverlay(); setState('play'); requestLock();
    showMsg(lvl.intro,4200); flowT=0; lastT=performance.now(); Cine.sector();
  });
}
function pauseGame(){

const FADE_MS=260;
let fadeBusy=false;
function fadeTransition(cb){
  const el=$('fade');
  if(fadeBusy){ cb(); return; } // Sicherheitsnetz, falls schon mitten im Fade
  fadeBusy=true;
  el.classList.add('on');
  setTimeout(()=>{
    cb();
    requestAnimationFrame(()=>requestAnimationFrame(()=>{
      el.classList.remove('on');
      setTimeout(()=>{ fadeBusy=false; },FADE_MS);
    }));
  },FADE_MS);
}

let dirX=1,dirY=0,planeX=0,planeY=PLANE_LEN, horizon=HALF;

const skyColBuf=new Int32Array(W);
function computeSkyCols(){
  for(let x=0;x<W;x++){
    const camX=2*x/W-1, rdx=dirX+planeX*camX, rdy=dirY+planeY*camX;
    let ang=Math.atan2(rdy,rdx); if(ang<0) ang+=Math.PI*2;
    let sx=((ang/(Math.PI*2))*SKY_W)|0; if(sx>=SKY_W) sx=SKY_W-1; if(sx<0) sx=0;
    skyColBuf[x]=sx;
  }
}
function renderFloorCeil(time){
  const rx0=dirX-planeX, ry0=dirY-planeY, rx1=dirX+planeX, ry1=dirY+planeY;
  if(curOutdoor) computeSkyCols();
  for(let y=0;y<H;y++){
    const p=y-horizon, ap=Math.abs(p), base=y*W;
    if(curOutdoor && p<0){
      // Himmel: reine Winkelprojektion (Doom-Sky-Hack), kein Perspektiv-Floorcast, kein Nebel
      let sy=(-p)|0; if(sy>=SKY_H) sy=SKY_H-1; if(sy<0) sy=0;
      const row=sy*SKY_W;
      for(let x=0;x<W;x++) buf[base+x]=curSky[row+skyColBuf[x]];
      continue;
    }
    if(ap<.6){ for(let x=0;x<W;x++) buf[base+x]=FOGC; continue; }
    const rd=(.5*PROJ)/ap;
    const f=clamp(((1-rd/MAXD)*256|0)+FX.flashAdd,0,256);
    if(f<=2){ for(let x=0;x<W;x++) buf[base+x]=FOGC; continue; }
    const stx=rd*(rx1-rx0)/W, sty=rd*(ry1-ry0)/W;
    let fx=P.x+rd*rx0, fy=P.y+rd*ry0;
    if(p>0){
      for(let x=0;x<W;x++){
        buf[base+x]=shade(curFloor[(((fy*TS)|0)&TSM)<<TSH|(((fx*TS)|0)&TSM)],f);
        fx+=stx; fy+=sty;
      }
    } else {
      // Decke: fast überall die normale, ruhig leuchtende Platte — nur eine
      // gehashte Minderheit der Zellen (~1 von 7) ist als Flacker-Lampe
      // markiert, Phase pro Zelle versetzt (wie bei den Server-Racks).
      for(let x=0;x<W;x++){
        const mx=fx|0, my=fy|0;
        const h=((mx*928371)^(my*589301))>>>0;
        let ctex=curCeil, lf=f;
        if(curCeil===texCeil && (h%7)===0){
          const fr=Math.floor(time*2.4+(h%97)*0.08)%CEIL_FLICKER_FRAMES.length;
          ctex=CEIL_FLICKER_FRAMES[fr]; lf=f*CEIL_FLICKER_F[fr];
        }
        buf[base+x]=shade(ctex[(((fy*TS)|0)&TSM)<<TSH|(((fx*TS)|0)&TSM)],lf);
        fx+=stx; fy+=sty;
      }
    }
  }
}
function renderWalls(time){
  const locked_=exitLocked();
  for(let x=0;x<W;x++){
    const camX=2*x/W-1, rdx=dirX+planeX*camX, rdy=dirY+planeY*camX;
    let mx=P.x|0, my=P.y|0;
    const ddx=rdx===0?1e30:Math.abs(1/rdx), ddy=rdy===0?1e30:Math.abs(1/rdy);
    let sx,sy,sdx,sdy;
    if(rdx<0){ sx=-1; sdx=(P.x-mx)*ddx; } else { sx=1; sdx=(mx+1-P.x)*ddx; }
    if(rdy<0){ sy=-1; sdy=(P.y-my)*ddy; } else { sy=1; sdy=(my+1-P.y)*ddy; }
    let side=0, hit=0;
    for(let i=0;i<90;i++){
      if(sdx<sdy){ sdx+=ddx; mx+=sx; side=0; } else { sdy+=ddy; my+=sy; side=1; }
      if(mx<0||my<0||mx>=MW||my>=MH){ hit=1; break; }
      hit=grid[my*MW+mx]; if(hit) break;
    }
    if(!hit){ zBuf[x]=1e9; continue; }
    const perp=Math.max(.05,side===0?sdx-ddx:sdy-ddy);
    zBuf[x]=perp;
    let wallX=side===0?P.y+perp*rdy:P.x+perp*rdx; wallX-=Math.floor(wallX);
    let tx=(wallX*TS)|0;
    if((side===0&&rdx>0)||(side===1&&rdy<0)) tx=TSM-tx;
    const lh=PROJ/perp, top=horizon-lh/2;
    let f=((1-perp/MAXD)*256)|0; if(side===1) f=(f*.74)|0;
    f=clamp(f+FX.flashAdd,0,256);
    let tex=curWall[hit]||curWall[1];
    if(hit===4){ tex=locked_?texExitLocked:texExit; f=clamp(170+((Math.sin(time*4)+1)*43)|0,0,256); }
    else if(hit===5){ tex=texStairs; f=clamp(170+((Math.sin(time*3)+1)*43)|0,0,256); }
    else if(hit===2&&curBiome==='facility'){
      // Server-Racks blinken: Frame-Wahl aus Zeit + Zellposition gehasht,
      // damit nicht alle Racks im Gleichtakt schalten.
      const cellHash=((mx*928371)^(my*589301))>>>0;
      const frame=Math.floor(time*2.2+(cellHash%97)*0.07)%RACK_FRAMES.length;
      tex=RACK_FRAMES[frame];
    }
    else if(hit===6){ tex=SIGN_TEX[String(lvl.signDigit)]||SIGN_TEX['0']; }
    const y0=Math.max(0,top|0), y1=Math.min(H-1,(top+lh)|0);
    const step=TS/lh; let tp=(y0-top)*step;
    for(let y=y0;y<=y1;y++){
      const v=tp*(1/TS), ao=v<.1?.74+2.6*v:(v>.9?.74+2.6*(1-v):1); buf[y*W+x]=shade(tex[((tp|0)&TSM)<<TSH|tx],(f*ao)|0); tp+=step;
    }
  }
}
const drawList=[];

function lineDots(x0,y0,x1,y1,tex,sc,vo,n){ const dx=x1-x0, dy=y1-y0; for(let k=1;k<=n;k++){ const f=k/(n+1); drawList.push({x:x0+dx*f,y:y0+dy*f,tex,sc,vo,flash:0,glow:true}); } }
function roleDecor(e,t,time){

function renderSprites(time){
  drawList.length=0;
  for(const e of enemies){
    const t=ETYPES[e.type], set=curSPR[e.type];
    if(e.alive){ roleDecor(e,t,time); if(!e.phased||((time*16)|0)%9===0) drawList.push({x:e.x,y:e.y,tex:e.atk>0?set.atk:set.idle,sc:t.sc,vo:t.vo+(e.type==='d'?Math.sin(time*3+e.x)*.03:0),flash:e.flash});
      if(e.mark>0&&state==='play') drawList.push({x:e.x,y:e.y,tex:e.mark===2?SPR_EXCL:SPR_QUEST,sc:.2,vo:t.vo+t.sc+.03+(e.elite?(e.mods?e.mods.length:1)*.2:0),flash:0,glow:true}); }   // Phase 6: ! entdeckt / ? misstrauisch
    else drawList.push({x:e.x,y:e.y,tex:set.dead,sc:t.sc*.75,vo:0,flash:0});
  }

    if(p.kind==='L'||p.kind==='Q'||p.kind==='Qo'){ Loot.draw(p,drawList,time); continue; }   // Phase 13
    drawList.push({x:p.x,y:p.y,tex:PICKUP_SPR[p.kind],sc:.36,vo:.02+(Math.sin(time*3+p.ph)+1)*.03,flash:0}); }
  Biome.draw(drawList,time); Hazards.draw(drawList,time);   // Phase 11: Fallen, Felsmarker, Sporenwolken
  for(const s of shots) drawList.push({x:s.x,y:s.y,tex:s.k==='void'?SPR_VOIDP:SPR_BALL,sc:s.k?.34:.24,vo:.38,flash:0,glow:true});
  for(const s of pshots) drawList.push({x:s.x,y:s.y,tex:s.w.pkind==='plasma'?SPR_PLASMA:s.w.pkind==='void'?SPR_VOIDP:SPR_SINGP,sc:s.w.pkind==='sing'?.34:.26,vo:.37,flash:0,glow:true});
  for(const h of holes){
    const pl=1+Math.sin(time*9)*.06, left=h.life-h.t, k=Math.max(.05,Math.min(1,h.t/.3)*(left<.35?left/.35:1));
    drawList.push({x:h.x,y:h.y,tex:SPR_HOLE,sc:1.0*k*pl,vo:.05,flash:0,glow:true});
    drawList.push({x:h.x,y:h.y,tex:SPR_HOLE2,sc:.7*k*(2-pl),vo:.2,flash:0,glow:true});
  }
  for(const b of beams){
    const dx=b.x1-b.x0, dy=b.y1-b.y0, len=Math.hypot(dx,dy)||.01, n=clamp(Math.ceil(len/.4),3,40), nx=-dy/len, ny=dx/len, fade=1-b.t/b.life;
    const tex=b.kind==='rail'?SPR_RAILDOT:SPR_ARCDOT, bsc=(b.kind==='rail'?.15:.11)*(.5+.5*fade);
    for(let k=0;k<=n;k++){
      const f=k/n, off=(b.jag&&k>0&&k<n)?Math.sin(time*57+k*12.9+b.seed)*.13:0;
      drawList.push({x:b.x0+dx*f+nx*off,y:b.y0+dy*f+ny*off,tex,sc:bsc,vo:.44,flash:0,glow:true});
    }
  }
  for(const b of booms){
    const bset=b.set||BOOM_FRAMES;
    const k=Math.min(bset.length-1,(b.t/b.life*bset.length)|0);

    drawList.push({x:b.x,y:b.y,tex:bset[k],sc:(b.scale||1)*grow,vo:.16,flash:0,glow:true});
  }
  for(const sp of sparks){
    const k=Math.min(SPARK_FRAMES.length-1,(sp.t/sp.life*SPARK_FRAMES.length)|0);
    const shrink=1-(sp.t/sp.life)*.3;
    drawList.push({x:sp.x,y:sp.y,tex:SPARK_FRAMES[k],sc:.24*shrink,vo:.26,flash:0,glow:true});
  }
  Cine.draw(drawList);   // Phase 19: Partikel
  for(const d of drawList){ const dx=d.x-P.x, dy=d.y-P.y; d.d=dx*dx+dy*dy; }
  drawList.sort((a,b)=>b.d-a.d);

  const inv=1/(planeX*dirY-dirX*planeY);
  for(const s of drawList){
    const dx=s.x-P.x, dy=s.y-P.y;
    const tX=inv*(dirY*dx-dirX*dy), tY=inv*(-planeY*dx+planeX*dy);
    if(tY<.12) continue;
    const size=PROJ*s.sc/tY, sxc=(W/2)*(1+tX/tY);

    const ya=Math.max(0,top|0), yb=Math.min(H-1,bottom|0);

      if(tY>=zBuf[x]) continue;
      const tx=((x-x0)*ss)|0; if(tx<0||tx>TSM) continue;
      for(let y=ya;y<=yb;y++){
        const ty=((y-top)*ss)|0;
        const c=tex[(ty<<TSH)|tx]; if(c>>>24===0) continue;
        buf[y*W+x]=fl?0xFFFFFFFF:shade(c,f);
      }
    }
  }
}

function enhanceWeaponCanvas(){
  const g=WV.g, X0=140, Y0=110, cw=360, ch=WV.h-Y0;   // nur bei Änderung (Waffe/Hitze/Blitz), nicht pro Bild
  const im=g.getImageData(X0,Y0,cw,ch), d=im.data, L=WV.L||(WV.L=new Float32Array(cw*ch));
  for(let i=0;i<cw*ch;i++){ const o=i*4; L[i]=d[o+3]>=24?d[o]*.3+d[o+1]*.59+d[o+2]*.11:-1; }

    const i=y*cw+x, o=i*4; if(d[o+3]<24) continue;
    const R=d[o], G=d[o+1], B=d[o+2], mx=Math.max(R,G,B), mn=Math.min(R,G,B), l=L[i];
    if(mx>190&&(mx-mn>70||l>200)) continue;                       // Leuchtendes bleibt
    if(L[i-3]<0||L[i+3]<0||L[i-3*cw]<0||L[i+3*cw]<0){ d[o]=R*.42; d[o+1]=G*.42; d[o+2]=B*.45; continue; }   // Kontur
    const lx=L[i+3], lm=L[i-3], ly=L[i+3*cw], lu=L[i-3*cw];
    const add=clamp(-((lx-lm)+(ly-lu))*.42,-30,30);
    const m=1.16-.36*(y/ch)+(((x*73856093)^(y*19349663))&15)/16*.05;
    d[o]=R*m+add; d[o+1]=G*m+add; d[o+2]=B*m+add*1.05;

/* ---- Grafik-Upgrade: Bloom (helle Bereiche glimmen) + Vignette; per Konsole: __gfx.bloom=0 ---- */
const BW=W>>2, BH=H>>2, bA=new Float32Array(BW*BH*3), bB=new Float32Array(BW*BH*3);
let bloomTick=0, bloomLive=false;
function blurPass(src,dst,horiz){
  const w=BW,h=BH, R=4, n=1/(R*2+1);
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    let r=0,g=0,b=0;
    for(let k=-R;k<=R;k++){ let xx=horiz?x+k:x, yy=horiz?y:y+k; if(xx<0)xx=0; else if(xx>=w)xx=w-1; if(yy<0)yy=0; else if(yy>=h)yy=h-1; const i=(yy*w+xx)*3; r+=src[i]; g+=src[i+1]; b+=src[i+2]; }
    const o=(y*w+x)*3; dst[o]=r*n; dst[o+1]=g*n; dst[o+2]=b*n;
  }
}
function bloomPass(){
  if(!GFX.bloom) return;
  if((bloomTick++&1)===0){            // Glow nur jedes 2. Bild neu berechnen
    let any=0;
    for(let by=0;by<BH;by++) for(let bx=0;bx<BW;bx++){
      let r=0,g=0,b=0;
      for(let k=0;k<4;k++){ const c=buf[(by*4+(k>>1)*2)*W+bx*4+(k&1)*2]; const cr=c&255, cg=(c>>8)&255, cb=(c>>16)&255; const l=cr*.3+cg*.59+cb*.11, e=l>140?(l-140)/115:0; r+=cr*e; g+=cg*e; b+=cb*e; }
      const o=(by*BW+bx)*3; bA[o]=r*.25; bA[o+1]=g*.25; bA[o+2]=b*.25; any+=r+g+b;
    }
    bloomLive=any>40;
    if(bloomLive){ blurPass(bA,bB,true); blurPass(bB,bA,false); }
  }
  if(!bloomLive) return;
  for(let by=0;by<BH;by++) for(let bx=0;bx<BW;bx++){
    const o=(by*BW+bx)*3, br=bA[o]*.9, bg=bA[o+1]*.9, bb=bA[o+2]*.9;
    if(br+bg+bb<5) continue;           // dunkle Blöcke überspringen
    for(let j=0;j<4;j++){ let i=(by*4+j)*W+bx*4;
      for(let k=0;k<4;k++,i++){ const c=buf[i]; let r=(c&255)+br, g=((c>>8)&255)+bg, b=((c>>16)&255)+bb;
        buf[i]=0xFF000000|((b>255?255:b)<<16)|((g>255?255:g)<<8)|(r>255?255:r); }
    }
  }
}

  hset('m:'+name,pct,v=>{ el._u.style.width=v+'%'; });
}
function hud2Update(dt){
  if(!lvl) return;
  const playing=state==='play'||state==='pause'||state==='dead'||state==='levelwin'||state==='gamewin';
  if(!playing) return;
  HUD.tick++;

  // --- Sektor / Ziel (Text nur bei Aenderung) ---
  let foes=0; for(let i=0;i<enemies.length;i++) if(enemies[i].alive) foes++;
  const obj=objectiveText(foes);
  hset('top',lvl.name+'|'+sectorSub()+'|'+obj,()=>{ elHudTop.innerHTML='<b>'+lvl.name+'</b><span class="sub">'+sectorSub()+'</span><span class="obj">'+obj+'</span>'; });

  // --- Shield / Armor / Energy (Slots; aktiv sobald Max>0, Phase 3) ---
  setMod('sh',elMods.sh,P.shield,P.shieldMax); setMod('ar',elMods.ar,P.armor,P.armorMax); setMod('en',elMods.en,P.energy,P.energyMax);
  // Dash: Balken = geladene Ladungen + Fortschritt der naechsten; Energie-Sperre (Sprint leer / Dash ohne Energie) blinkt rot
  { const dmax=Stats.val.dashCharges, part=P.dashN<dmax?clamp(1-P.dashCd/Stats.val.dashCd,0,1):0;
    hset('m:ds',Math.round(clamp((P.dashN+part)/dmax,0,1)*100),v=>{ elMods.ds._u.style.width=v+'%'; });
    hcls(elMods.ds,'ready',P.dashN>=1); hcls(elMods.ds,'two',dmax>=2); hcls(elDashBtn,'cool',P.dashN<1);
    hcls(elMods.en,'lock',P.sprintLock||P.enFlash>0); }

  // --- Waffe: Level + Krit ---
  hset('wlv',P.wLv[P.weapon]|0,v=>{ elWlv.textContent='LV'+v; });
  hset('crit',Math.round(P.crit*100),v=>{ elCritv.textContent=v+'%'; });
  // Nachlade-Balken + Waffenleiste 1-9 (cur = aktiv, own = gefunden)
  hset('rld',P.reloadT>0?Math.round((1-P.reloadT/P.reloadDur)*100):-1,v=>{ elRldFill.style.width=Math.max(0,v)+'%'; elRld.classList.toggle('show',v>=0); elRldTxt.classList.toggle('on',v>=0); });
  { let mask=''; for(let i=0;i<WEAPONS.length;i++) mask+=(i===P.weapon?'c':P.owned[i]?'o':'-');
    hset('wslots',mask,()=>{ for(let i=0;i<elWslots.length;i++) elWslots[i].className=i===P.weapon?'cur':P.owned[i]?'own':''; }); }

  // --- Bedrohung (10 Hz) ---
  if(HUD.tick%6===1){ HUD.threat=threatLevel(computeThreat()); }
  const tl=HUD.threat;
  hset('threat',tl,v=>{
    for(let i=0;i<elThreatPips.length;i++) elThreatPips[i].classList.toggle('on',i<v);
    elThreat.className=''; if(v>=3) elThreat.classList.add('t'+v);
    elThreatTxt.textContent='BEDROHUNG · '+THREAT_NAMES[v];
  });

  // --- Combo / Streak ---
  const showCombo=Combat.chain>=2||Combat.streak>=3;
  hcls(elCombo,'on',showCombo);
  if(showCombo){
    hset('chain',Combat.chain,v=>{ elComboN.innerHTML='<small>COMBO</small>'+v; });
    hset('streak',Combat.streak,v=>{ elStreakN.textContent=v; });
    hset('cbar',Math.round(Combat.t/COMBO_WINDOW*100),v=>{ elComboBar.style.width=v+'%'; });
    if(Combat.popped){ Combat.popped=false; elComboN.classList.remove('pop'); void elComboN.offsetWidth; elComboN.classList.add('pop'); }
  } else Combat.popped=false;

  // --- Boss-Leiste ---
  const boss=bossOf();
  const bossOn=!!(boss&&boss.awake);
  hcls(elStage,'boss',bossOn);
  if(boss){
    hset('bossName',(boss.bv|0)+':'+(boss.bp|0),()=>{ elBossName.textContent=Boss.name(boss); elBossLv.textContent='LV '+Boss.level(boss)+' · PHASE '+(boss.bp||1); const c=Boss.color(boss); elBossFill.style.background='linear-gradient(90deg,'+c+'88,'+c+')'; });
    const pct=clamp(boss.hp/boss.maxhp,0,1);
    if(HUD.boss!==boss){ HUD.boss=boss; HUD.ghost=pct; }
    HUD.ghost=Math.max(pct,HUD.ghost-dt*.4);
    hset('bossFill',Math.round(pct*1000),v=>{ elBossFill.style.width=(v/10)+'%'; });
    hset('bossGhost',Math.round(HUD.ghost*1000),v=>{ elBossGhost.style.width=(v/10)+'%'; });
  } else HUD.boss=null;

  // --- Warnungen (nur im laufenden Spiel) ---
  const live=state==='play'&&P.hp>0;
  const lowHp=live&&P.hp<=30;
  hcls(elStage,'lowhp',lowHp); hcls(elStage,'lowhp2',live&&P.hp<=15);
  if(lowHp){ HUD.lowHpT-=dt; if(HUD.lowHpT<=0){ sfx.lowHp(); HUD.lowHpT=P.hp<=15?.9:1.5; } } else HUD.lowHpT=0;
  const lw=WEAPONS[P.weapon], cells=lw.cost>0?P.ammo+P.mag[P.weapon]*lw.cost:99;   // Zellen gesamt (Magazin + Vorrat)
  const lowAmmo=live&&lw.cost>0&&cells<=8;
  hcls(elStage,'lowammo',lowAmmo); hcls(elStage,'ammo0',live&&lw.cost>0&&cells<lw.cost);
  if(lowAmmo&&!HUD.wasLowAmmo) sfx.lowAmmo();
  HUD.wasLowAmmo=lowAmmo;
  hcls(elStage,'hot',live&&P.heat>.66&&P.overheatT<=0);
  hcls(elStage,'overheat',live&&P.overheatT>0);
  hcls(elStage,'aimed',live&&Roles.aimed>0);
}
function updateHud(dt){ updateHudCore(); hud2Update(dt||0.016); }
hudApplySettings();

/* ============================================================
   Titelbild-Demo (Wächter-Programm spielt sich selbst)
   ============================================================ */
let demoLvIdx=0, demoTarget=null, demoFlowMap=null, demoFlowKey=null, demoIdleT=0, demoAimT=0, demoStuckT=0;
const DEMO_DEPTHS=[3,6,9,12]; // je ein Boss-Tiefe-Sprung pro Biome: Anlage, Schlucht, Wüste, Dschungel
function demoPickTarget(){
  if(demoTarget && !demoTarget.alive) demoTarget=null;   // Ziel tot -> neu wählen
  if(!demoTarget){
    let best=null, bd=1e9;
    for(const e of enemies){
      if(!e.alive) continue;
      const d=(e.x-P.x)*(e.x-P.x)+(e.y-P.y)*(e.y-P.y);
      if(d<bd){ bd=d; best=e; }
    }
    demoTarget=best;   // am gewählten Gegner festhalten, statt jeden Frame neu zu wählen (verhindert Zappeln)
  }
  if(demoTarget) return {x:demoTarget.x,y:demoTarget.y,enemy:demoTarget};
  if(exitCell) return {x:exitCell.x+.5,y:exitCell.y+.5,enemy:null};
  return null;
}
function nextDemoScene(){
  fadeTransition(()=>{
    demoLvIdx=(demoLvIdx+1)%DEMO_DEPTHS.length;
    parseLevel(generateProceduralLevel(DEMO_DEPTHS[demoLvIdx])); P.a=lvl.angle; P.weapon=0;
    demoTarget=null; demoFlowMap=null; demoFlowKey=null; demoIdleT=0; demoAimT=0; demoStuckT=0;
    setAmbient(curBiome); lastT=performance.now();
  });
}
function updateDemo(dt){
  if(fadeBusy) return;   // während des Szenenwechsels nichts bewegen
  AI.tick(dt); Roles.tick(dt);
  for(const e of enemies) updateEnemy(e,dt);
  updateShots(dt); updateBooms(dt); updateSparks(dt);
  P.fireCd=Math.max(0,P.fireCd-dt); P.recoil=Math.max(0,P.recoil-dt*5); P.flash=Math.max(0,P.flash-dt);
  FX.hitMark=Math.max(0,FX.hitMark-dt); FX.shake=Math.max(0,FX.shake-dt*3.4);
  flowT-=dt; if(flowT<=0){ computeFlow(); flowT=.3; }

  const target=demoPickTarget();
  const foesLeft=enemies.some(e=>e.alive);
  if(!target){
    P.a+=dt*.12; P.moving=Math.max(0,P.moving-dt*8);
  } else {
    const dx=target.x-P.x, dy=target.y-P.y, dist=Math.hypot(dx,dy)||.001;
    const aimAng=Math.atan2(dy,dx);
    const los=target.enemy && rayWallDist(P.x,P.y,dx/dist,dy/dist)>=dist-.2;
    let wantMove=true;
    if(los){
      demoAimT=.6;
      const da=((aimAng-P.a+Math.PI*3)%(Math.PI*2))-Math.PI;
      P.a+=clamp(da,-3.4*dt,3.4*dt);
      wantMove=dist>3.1;
      if(Math.abs(da)<.11) demoFire();
    } else {
      demoAimT=Math.max(0,demoAimT-dt);
      const tk=(target.x|0)+','+(target.y|0);
      if(tk!==demoFlowKey){ demoFlowMap=computeFlowFromCell(target.x|0,target.y|0); demoFlowKey=tk; }
      const nx=fieldTarget(P.x,P.y,demoFlowMap);
      if(nx){
        const moveAng=Math.atan2(nx.y-P.y,nx.x-P.x);
        const da=((moveAng-P.a+Math.PI*3)%(Math.PI*2))-Math.PI;
        P.a+=clamp(da,-2.6*dt,2.6*dt);
      } else wantMove=false;
    }
    if(wantMove){
      const sp=2.3*dt;
      const mv=tryMove(P,Math.cos(P.a)*sp,Math.sin(P.a)*sp,.22);
      P.moving=Math.min(1,P.moving+dt*8); P.bob+=mv*2.6;
      stepPhase=Math.floor(P.bob/Math.PI);
      if(mv<sp*.15) demoStuckT+=dt; else demoStuckT=0;
    } else { P.moving=Math.max(0,P.moving-dt*8); demoStuckT=0; }
    if(demoStuckT>2){   // Bewegung blockiert (z.B. Engstelle/Ecke) -> Ziel fallen lassen und neu ausrichten
      demoStuckT=0; demoTarget=null; demoFlowMap=null; demoFlowKey=null;
      P.a+=(Math.random()<.5?-1:1)*(Math.PI*.5+Math.random()*Math.PI*.5);
    }
  }

  if(!foesLeft){
    demoIdleT+=dt;
    const atExit=exitCell&&Math.hypot(P.x-(exitCell.x+.5),P.y-(exitCell.y+.5))<1.1;
    if(!exitCell||atExit||demoIdleT>5) nextDemoScene();
  } else demoIdleT=0;
}

/* ============================================================
   Hauptschleife
   ============================================================ */
let lastT=performance.now();
let stepPhase=0;
function update(dt){
  stats.time+=dt; Save.data.stats.playTime+=dt; Combat.tick(dt);
  // Bewegung (Phase 3: Sprint kostet Energie, Dash mit i-Frames, Tempo-Faktor aus Stats)
  const V=Stats.val;
  const turn=(keys.ArrowRight||keys.KeyE?1:0)-(keys.ArrowLeft||keys.KeyQ?1:0);
  P.a+=turn*2.4*dt;
  readMove();
  const wantSprint=!!(keys.ShiftLeft||keys.ShiftRight||touchSprint);
  if(P.dashT>0){
    const step=Math.min(dt,P.dashT); P.dashT-=step;
    const dist=V.dashDist/V.dashTime*step, n=Math.max(1,Math.ceil(dist/.2)), d=dist/n;   // Teilschritte: kein Durchtunneln
    for(let i=0;i<n;i++) tryMove(P,P.dashX*d,P.dashY*d,.22);
    P.sprinting=false; P.moving=Math.min(1,P.moving+dt*8);
  } else if(mvLen>0){
    P.sprinting=wantSprint&&!P.sprintLock&&P.energy>0;
    if(P.sprinting){
      P.energy=Math.max(0,P.energy-V.sprintCost*dt); P.enT=Math.max(P.enT,V.energyDelay);
      if(P.energy<=0){ P.sprintLock=true; P.sprinting=false; sfx.noEnergy(); }
    }
    if(P.sprinting){ P.noiseT=(P.noiseT||0)-dt; if(P.noiseT<=0){ P.noiseT=.5; AI.noise(P.x,P.y,4.5); } }   // Sprinten ist hörbar
    const sp=(P.sprinting?4.8:3.2)*V.speed*Biome.speedMul()*Hazards.speedMul()*dt;
    const mv=tryMove(P,mvX*sp,mvY*sp,.22);
    P.moving=Math.min(1,P.moving+dt*8); P.bob+=mv*2.6;
    const stepIdx=Math.floor(P.bob/Math.PI);
    if(stepIdx>stepPhase){ stepPhase=stepIdx; sfx.step(curBiome); }
  } else { P.sprinting=false; P.moving=Math.max(0,P.moving-dt*8); }
  if(P.sprintLock&&!wantSprint&&P.energy>=P.energyMax*V.sprintResume) P.sprintLock=false;   // erst loslassen UND 20 % Energie
  Stats.tick(dt);
  // Feuern
  P.fireCd=Math.max(0,P.fireCd-dt); P.recoil=Math.max(0,P.recoil-dt*5); P.flash=Math.max(0,P.flash-dt);
  if(P.reloadT>0){ P.reloadT-=dt; if(P.reloadT<=0){ P.reloadT=0; finishReload(); } }
  if(P.overheatT>0){ P.overheatT=Math.max(0,P.overheatT-dt); if(P.overheatT===0) P.heat=0; }
  else P.heat=Math.max(0,P.heat-dt*WEAPONS[P.weapon].cool*Mods.eff(P.weapon).cool);
  for(let i=0;i<WEAPONS.length;i++){                       // weggelegte Waffen kuehlen im Hintergrund
    if(i===P.weapon) continue;
    if(P.os[i]>0){ P.os[i]=Math.max(0,P.os[i]-dt); if(P.os[i]===0) P.hs[i]=0; }
    else if(P.hs[i]>0) P.hs[i]=Math.max(0,P.hs[i]-dt*WEAPONS[i].cool*Mods.eff(i).cool);
  }
  if(keys.Space||mouseDown||touchFireDown) tryFire();
  // Welt
  if(lvl.fog) updateFog();
  flowT-=dt; if(flowT<=0){ computeFlow(); flowT=.3; }
  Events.tick(dt); Biome.tick(dt); Hazards.tick(dt); Loot.tick(dt); Perks.tick(dt); Missions.tick(dt); Style.tick(dt); Ach.tick(dt); AI.tick(dt); Roles.tick(dt);
  for(const e of enemies) updateEnemy(e,dt);
  updateShots(dt); updatePshots(dt); updateHoles(dt); updateBeams(dt); updatePickups(); updateBooms(dt); updateSparks(dt); checkExit(dt); checkStairs();
  ambientTick(dt);
  // Effekte
  FX.hurt=Math.max(0,FX.hurt-dt); FX.heal=Math.max(0,FX.heal-dt); FX.hitMark=Math.max(0,FX.hitMark-dt);
  FX.shake=Math.max(0,FX.shake-dt*3.4);
  FX.shieldHit=Math.max(0,FX.shieldHit-dt); FX.dash=Math.max(0,FX.dash-dt); FX.crit=Math.max(0,FX.crit-dt);
  $('hurt').style.opacity=Math.min(1,FX.hurt*2.4)*dmgK; $('heal').style.opacity=Math.min(1,FX.heal*2.4);
  elShieldFx.style.opacity=Math.min(1,FX.shieldHit*2.4); elDashFx.style.opacity=Math.min(1,FX.dash*3);
  $('xh').classList.toggle('hit',FX.hitMark>0); $('xh').classList.toggle('crit',FX.crit>0);
  updateHeatUI();
  if(FX.msg>0){ FX.msg-=dt; if(FX.msg<=0) $('msg').classList.remove('on'); }
}
function applyShake(){
  if(FX.shake>.003){
    const m=FX.shake*FX.shake*shakeK;
    const ox=(Math.random()*2-1)*m*2.2, oy=(Math.random()*2-1)*m*2.2;
    cv.style.transform='translate('+ox.toFixed(2)+'cqw,'+oy.toFixed(2)+'cqw)';
  } else if(cv.style.transform){ cv.style.transform=''; }
}
function frame(now){
  let dt=Math.min(.05,(now-lastT)/1000); lastT=now; const rdt=dt;
  if(Cine.stop>0&&state==='play'){ Cine.stop-=rdt; dt*=.05; }   // Phase 19: Hit-Stop
  if(state==='play') update(dt);
  else if(state==='title'){ updateDemo(dt); }
  else if(state==='dead'||state==='levelwin'||state==='gamewin'){ FX.hurt=Math.max(0,FX.hurt-dt); FX.shake=Math.max(0,FX.shake-dt*3.4); $('hurt').style.opacity=state==='dead'?.55*dmgK:0; }
  Snd.tick(rdt); Cine.tick(rdt,dt); StoryUI.tick(rdt); try{ Story.tick(rdt); }catch(e){}
  if(lvl){ render(now/1000); if(state==='play'||state==='pause') drawMini(); updateHud(dt); applyShake(); }
  if(isTouch) window.__syncTouchLayer();
  requestAnimationFrame(frame);
}

/* ---- Start ---- */
drawFace(0);
showTitle();          // parst Sektor 1 selbst als Kulisse für den Titelbildschirm

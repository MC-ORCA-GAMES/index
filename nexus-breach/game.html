      d.records={sector:mapNum(rc.sector,1e6,false,300), bosses:mapNum(rc.bosses,1e6,true,16), bestKills:num(rc.bestKills,0,0,1e9)|0, bestStreak:num(rc.bestStreak,0,0,1e9)|0}; }
    { const a=isObj(raw.asc)?raw.asc:{};
      d.asc={done:!!a.done, clears:num(a.clears,0,0,1e6)|0, endDepth:num(a.endDepth,0,0,1e6)|0, endScore:num(a.endScore,0,0,1e15), bosses:mapNum(a.bosses,1e6,true,16), secret:num(a.secret,0,0,1e6)|0, daily:mapNum(a.daily,1e15,false,40)}; }
    d.story=sanitizeStory(raw.story);
    if(isObj(raw.stats)) for(const k in d.stats) d.stats[k]=num(raw.stats[k],0,0,1e12);
    if(isObj(raw.settings)){
      for(const k in SETTINGS_SPEC){ const [lo,hi,def]=SETTINGS_SPEC[k]; d.settings[k]=num(raw.settings[k],def,lo,hi); }
      d.settings.reducedMotion=!!raw.settings.reducedMotion;
    }
    return d;
  }

  const api={ data:null, ok:true, readOnly:false, dirty:false };
  let timer=0;
  function read(){ try{ return window.localStorage.getItem(SAVE_KEY); }catch(e){ api.ok=false; return null; } }
  api.load=function(){
    const str=read();
    let raw=null;
    if(str){ try{ raw=JSON.parse(str); }catch(e){ console.warn('[save] beschädigter Spielstand — starte neu'); } }
    if(isObj(raw)){
      if((+raw.version||1)>SAVE_VERSION) api.readOnly=true;   // Save einer neueren Version: nie überschreiben
      else raw=migrate(raw);
      api.data=sanitize(raw);
    } else {
      api.data=defaults();
      // Übernahme der bisherigen Einzel-Bestwerte (vor Save-System)
      try{
        const bt=+window.localStorage.getItem('orca_breach_best')||0, bd=+window.localStorage.getItem('orca_breach_bestdepth')||0;
        if(bt>0) api.data.bestTime=bt; if(bd>0) api.data.highestDepth=bd|0;
      }catch(e){ api.ok=false; }
    }
    return api.data;
  };
  api.flush=function(){
    if(timer){ clearTimeout(timer); timer=0; }
    if(!api.dirty||api.readOnly||!api.ok) return;
    api.data.updated=Date.now(); api.data.version=SAVE_VERSION;
    try{ window.localStorage.setItem(SAVE_KEY,JSON.stringify(api.data)); api.dirty=false; try{ Cloud.onLocalWrite('main'); }catch(e2){} }
    catch(e){ api.ok=false; }
  };
  api.markDirty=function(){ api.dirty=true; if(!timer) timer=setTimeout(api.flush,800); };
  api.reset=function(){ api.data=defaults(); api.dirty=true; api.flush(); };
  api.sanitize=sanitize; api.migrate=migrate; api.defaults=defaults; api.storyKey=storyKey;

  // ---- Ereignisse aus dem Spielablauf ----
  api.onRunStart=function(){ api.data.stats.runs++; api.markDirty(); };
  api.onLevelStart=function(depth){ if(depth>api.data.highestDepth){ api.data.highestDepth=depth|0; api.markDirty(); } };
  api.onKill=function(boss){ const s=api.data.stats; s.kills++; if(boss) s.bossKills++; api.markDirty(); };
  api.onDeath=function(){ api.data.stats.deaths++; api.markDirty(); };
  api.onSectorClear=function(){ api.data.stats.sectorsCleared++; api.markDirty(); };
  api.onRunEnd=function(depth){ if(depth>api.data.highestDepth) api.data.highestDepth=depth|0; api.markDirty(); };
  api.onCampaignComplete=function(t){ t=t|0; if(t>0&&(!api.data.bestTime||t<api.data.bestTime)){ api.data.bestTime=t; } api.markDirty(); };

  api.load();
  window.addEventListener('pagehide',()=>api.flush());
  document.addEventListener('visibilitychange',()=>{ if(document.hidden) api.flush(); });
  return api;
})();

/* ---- Combat-Tracker (Phase 2): Kill-Streak + Combo-Kette fuers HUD; Phase 17 baut daraus das Score-/Style-System ---- */
const COMBO_WINDOW=4;   // Sekunden bis die Kette abreisst
const Combat={ streak:0, bestStreak:0, chain:0, chainBest:0, t:0, popped:false,
  kill(){ this.streak++; if(this.streak>this.bestStreak) this.bestStreak=this.streak; this.chain++; if(this.chain>this.chainBest) this.chainBest=this.chain; this.t=COMBO_WINDOW; this.popped=true; },
  hurt(){ this.streak=0; this.chain=0; this.t=0; },
  tick(dt){ if(this.t>0){ this.t-=dt; if(this.t<=0){ this.t=0; this.chain=0; } } },
  reset(){ this.streak=0; this.chain=0; this.t=0; this.popped=false; },
  resetChain(){ this.chain=0; this.t=0; }
};

/* ---- Spieler-Werte (Phase 3): Basiswerte + Bonusquellen -> abgeleitete Werte ----
   Alle Spielerwerte laufen ueber `Stats.val`. Perks (Phase 14), Waffen-/Ruestungsmods (Phase 5/13) und Meta-Upgrades (Phase 15)
   tragen sich als Bonusquelle ein: `NX.stats.add('run:perk-ironcore',{armorMax:25})`. Quellen mit Praefix `run:` werden bei
   newRun() entfernt, alles andere (z. B. `meta:`) bleibt. Additiv; Grenzen stehen in PLIM. */
const PBASE={
  shieldMax:25, shieldRegen:8, shieldDelay:3.5,            // Schild: Puffer, Regen/s, Sekunden ohne Treffer bis Regen
  armorMax:50, armorAbsorb:.5, armorSector:.3,             // Panzerung: nimmt 50 % des Restschadens auf; Sektorstart: 30 % Fuellung
  energyMax:100, energyRegen:22, energyDelay:.6, sprintCost:15, sprintResume:.2,   // Energie: Sprint kostet/s; nach Leerlauf erst ab 20 % wieder
  hpRegen:0, hpRegenDelay:4,                               // Integritaets-Regen (HP/s) — Basis 0, kommt ueber Perks/Meta
  fireRate:0, dmgMul:1, reloadSpeed:0, heatMul:1,           // Phase 4 (Waffen-Hooks): Feuerrate +x, Schadensfaktor, Nachladetempo +x, Hitze-Faktor
  resist:0, speed:1, crit:.05, critDmg:1.5,                // Schadensresistenz, Tempo-Faktor, Krit-Chance, Krit-Multiplikator
  dashCharges:1, dashCd:1.2, dashCost:20, dashDist:2.6, dashTime:.17   // Dash: Ladungen (2 = Double Dash), Cooldown je Ladung, Energie, Weite, Dauer
};
const PLIM={ shieldMax:[0,500], shieldRegen:[0,100], armorMax:[0,500], energyMax:[20,500], energyRegen:[0,200], sprintCost:[0,60],
  hpRegen:[0,20], resist:[0,.75], speed:[.5,2], crit:[0,1], critDmg:[1,6], dashCharges:[1,4], dashCd:[.3,4], dashCost:[0,60], dashDist:[1,6], fireRate:[-.5,3], dmgMul:[.1,10], reloadSpeed:[-.5,4], heatMul:[0,3] };
/* ============================================================
   Waffen-Mods (Phase 5): 5 Slots je Waffe (Lauf, Kern, Magazin, System, Spezial), 3 Stufen (I-III).
   Mods aendern NICHT die Tabelle WEAPONS, sondern liefern pro Waffe ein abgeleitetes Werte-Paket `Mods.eff(waffe)`,
   das Feuern/Nachladen/Hitze/Krit/Schaden auslesen. Ohne Mods ist das Paket neutral (Verhalten wie Phase 4).
   Mods gehoeren zum Lauf: `newRun()` leert Inventar und Einbauten (Meta-Freischaltung folgt in Phase 15).
   ============================================================ */
const MOD_SLOTS=[{id:'barrel',name:'LAUF'},{id:'core',name:'KERN'},{id:'mag',name:'MAGAZIN'},{id:'system',name:'SYSTEM'},{id:'special',name:'SPEZIAL'}];
const MOD_TIERS=[{n:'I',col:'#35E4FF'},{n:'II',col:'#FFAE3D'},{n:'III',col:'#B45CFF'}];
const pc=v=>Math.round(v*100)+'%';
// v = Wirkung je Stufe [I,II,III]; txt = Beschreibung aus den aufgeloesten Werten x
const MOD_BASE=[
  {k:'b_dmg',slot:'barrel',name:'Verstärkter Lauf',v:{dmg:[.10,.17,.25]},txt:x=>'Schaden +'+pc(x.dmg)},
  {k:'b_rng',slot:'barrel',name:'Langlauf',v:{range:[.20,.35,.50]},txt:x=>'Reichweite +'+pc(x.range)},
  {k:'b_acc',slot:'barrel',name:'Präzisionsdrall',v:{acc:[.25,.40,.55]},txt:x=>'Streuung −'+pc(x.acc)},
  {k:'c_en',slot:'core',name:'Energie-Kern',v:{dmg:[.08,.14,.20],energyCut:[.15,.25,.35]},txt:x=>'Schaden +'+pc(x.dmg)+', Energiekosten −'+pc(x.energyCut)},
  {k:'c_pl',slot:'core',name:'Plasma-Kern',v:{plasma:[.20,.30,.42]},txt:x=>'Treffer: Plasma-Flächenschaden ('+pc(x.plasma)+' des Schadens, Radius 1,2)'},
  {k:'c_cr',slot:'core',name:'Krit-Kern',v:{critAdd:[.06,.10,.15],critMulAdd:[.25,.40,.60]},txt:x=>'Krit-Chance +'+pc(x.critAdd)+', Krit-Schaden +'+pc(x.critMulAdd)},
  {k:'m_ext',slot:'mag',name:'Erweitertes Magazin',v:{magMul:[.35,.60,.90]},txt:x=>'Magazin +'+pc(x.magMul)},
  {k:'m_qk',slot:'mag',name:'Schnelllader',v:{reload:[.30,.50,.75]},txt:x=>'Nachladen '+pc(x.reload)+' schneller'},
  {k:'m_sv',slot:'mag',name:'Zellen-Sparer',v:{free:[.12,.20,.30]},txt:x=>pc(x.free)+' Chance, dass ein Schuss kein Magazin kostet'},
  {k:'s_oc',slot:'system',name:'Übertaktung',v:{fireRate:[.12,.20,.30]},txt:x=>'Feuerrate +'+pc(x.fireRate)},
  {k:'s_hs',slot:'system',name:'Kühlkörper',v:{heatCut:[.25,.40,.55],coolAdd:[.20,.35,.50]},txt:x=>'Hitze −'+pc(x.heatCut)+', Abkühlung +'+pc(x.coolAdd)},
  {k:'s_st',slot:'system',name:'Stabilisator',v:{rcCut:[.30,.50,.70],acc:[.10,.15,.20]},txt:x=>'Rückstoß −'+pc(x.rcCut)+', Streuung −'+pc(x.acc)},
  {k:'x_ch',slot:'special',name:'Kettenblitz',v:{chainP:[.30,.42,.55],chainF:[.40,.50,.60],chainN:[1,2,2]},txt:x=>'Treffer: '+pc(x.chainP)+' Chance auf Blitz ('+pc(x.chainF)+' Schaden, '+x.chainN+' Ziel'+(x.chainN>1?'e':'')+')'},
  {k:'x_ex',slot:'special',name:'Explosivgeschosse',v:{expF:[.30,.42,.55],expR:[1.2,1.4,1.7]},txt:x=>'Erster Treffer je Schuss explodiert ('+pc(x.expF)+' Schaden, Radius '+String(x.expR).replace('.',',')+'); Projektilwaffen: Splash +'+pc(x.expF)},
  {k:'x_ap',slot:'special',name:'Panzerbrecher',v:{ap:[.30,.50,.75]},txt:x=>'+'+pc(x.ap)+' Schaden gegen gepanzerte/schwere Gegner'},
  {k:'x_ls',slot:'special',name:'Lebensraub',v:{ls:[.03,.05,.08]},txt:x=>pc(x.ls)+' des verursachten Schadens heilen Integrität'},
  {k:'x_sd',slot:'special',name:'Schild-Entzug',v:{sd:[.10,.18,.28]},txt:x=>pc(x.sd)+' des verursachten Schadens laden das Schild'}
];
const MODS=[], MOD_BY_ID=Object.create(null);
for(const b of MOD_BASE) for(let t=0;t<3;t++){
  const x={}; for(const key in b.v) x[key]=b.v[key][t];
  const m={id:b.k+(t+1),base:b.k,slot:b.slot,tier:t+1,name:b.name+' '+MOD_TIERS[t].n,x,txt:b.txt(x)};
  MODS.push(m); MOD_BY_ID[m.id]=m;
}
const Mods=(()=>{
  const cache=[];
  const api={ inv:Object.create(null), eq:WEAPONS.map(()=>({})), shotId:0, lastShot:-1, busy:false, lsAcc:0, pity:0 };
  function slotsOf(i){ return !!WEAPONS[i]&&WEAPONS[i].id!=='fists'; }     // Faeuste haben keine Slots
  function build(i){
    const w=WEAPONS[i], e=api.eq[i]||{};
    const M={dmg:1,range:1,spread:1,critAdd:0,critMulAdd:0,energy:1,magAdd:0,reload:0,free:0,fireRate:0,heat:1,cool:1,rc:1,
             plasma:0,chainP:0,chainF:0,chainN:0,expF:0,expR:0,ap:0,ls:0,sd:0,n:0};
    let rng=0,acc=0,eCut=0,mMul=0,hCut=0,cAdd=0,rcCut=0;
    for(const sl in e){
      const mod=MOD_BY_ID[e[sl]]; if(!mod) continue; M.n++; const x=mod.x;
      if(x.dmg) M.dmg+=x.dmg; if(x.range) rng+=x.range; if(x.acc) acc+=x.acc; if(x.energyCut) eCut+=x.energyCut;
      if(x.plasma) M.plasma+=x.plasma; if(x.critAdd) M.critAdd+=x.critAdd; if(x.critMulAdd) M.critMulAdd+=x.critMulAdd;
      if(x.magMul) mMul+=x.magMul; if(x.reload) M.reload+=x.reload; if(x.free) M.free+=x.free;
      if(x.fireRate) M.fireRate+=x.fireRate; if(x.heatCut) hCut+=x.heatCut; if(x.coolAdd) cAdd+=x.coolAdd; if(x.rcCut) rcCut+=x.rcCut;
      if(x.chainP){ M.chainP=x.chainP; M.chainF=x.chainF; M.chainN=x.chainN; }
      if(x.expF){ M.expF=x.expF; M.expR=x.expR; }
      if(x.ap) M.ap+=x.ap; if(x.ls) M.ls+=x.ls; if(x.sd) M.sd+=x.sd;
    }
    { const tl=(Save.data.meta&&Save.data.meta.tune&&Save.data.meta.tune[w.id])|0; if(tl>0){ M.dmg+=.06*tl; M.critAdd+=.01*tl; } }   // Phase 15: Feinabstimmung (Meta)
    M.range=1+rng; M.spread=Math.max(.1,1-acc); M.energy=Math.max(.3,1-eCut); M.heat=Math.max(.25,1-hCut); M.cool=1+cAdd; M.rc=Math.max(.2,1-rcCut);
    M.magAdd=(w.mag>0&&mMul>0)?Math.max(1,Math.round(w.mag*mMul)):0;
    return M;
  }
  const NEUTRAL=build(2);   // Faeuste ohne Mods = neutral
  for(let i=0;i<WEAPONS.length;i++) cache[i]=build(i);
  api.NEUTRAL=NEUTRAL;
  api.slotsOf=slotsOf;
  /* Werte-Paket einer Waffe (Index oder Waffen-Objekt); ohne Angabe/unbekannt: neutral */
  api.eff=function(w){ const i=typeof w==='number'?w:(w&&typeof w.i==='number'?w.i:-1); return cache[i]||NEUTRAL; };
  api.magSize=function(i){ const w=WEAPONS[i]; return w&&w.mag>0?w.mag+(cache[i]?cache[i].magAdd:0):0; };
  function equippedCount(id){ let n=0; for(let i=0;i<api.eq.length;i++){ const e=api.eq[i]; for(const sl in e) if(e[sl]===id) n++; } return n; }
  api.count=id=>api.inv[id]|0;
  api.free=id=>(api.inv[id]|0)-equippedCount(id);
  api.refresh=function(i){
    cache[i]=build(i);
    const sz=api.magSize(i);
    if(sz>0&&P.mag[i]>sz){ const ex=P.mag[i]-sz; P.mag[i]=sz; P.ammo=Math.min(99,P.ammo+ex*WEAPONS[i].cost); }   // ueberzaehlige Schuesse als Zellen zurueck
    P.wLv[i]=1+cache[i].n;
    if(i===P.weapon) Stats.recalc();
  };
  api.add=function(id,quiet){
    const m=MOD_BY_ID[id]; if(!m) return false;
    api.inv[id]=(api.inv[id]|0)+1;
    const wu=Save.data.weaponUpgrades, dl=Array.isArray(wu.discovered)?wu.discovered:(wu.discovered=[]);
    if(dl.indexOf(id)<0&&dl.length<256){ dl.push(id); Save.markDirty(); }
    if(!quiet){ showMsg('Waffen-Mod: '+m.name+' ('+m.slot.toUpperCase()+') — '+(isTouch?'Pause → Loadout':'L = Loadout'),2600); sfx.pickup(); }
    return true;
  };
  api.equip=function(i,id){
    const m=MOD_BY_ID[id]; if(!m||!slotsOf(i)||!P.owned[i]) return false;
    if(api.eq[i][m.slot]===id) return true;
    if(api.free(id)<1) return false;
    api.eq[i][m.slot]=id; api.refresh(i); return true;
  };
  api.unequip=function(i,slot){
    if(!slotsOf(i)||!api.eq[i][slot]) return false;
    delete api.eq[i][slot]; api.refresh(i); return true;
  };
  api.reset=function(){
    api.inv=Object.create(null); api.lsAcc=0; api.pity=0; api.shotId=0; api.lastShot=-1;
    for(let i=0;i<WEAPONS.length;i++){ api.eq[i]={}; cache[i]=build(i); P.wLv[i]=1; }
  };
  /* Zufallsmod: Stufe waechst mit der Tiefe (Boss zaehlt +6) */
  api.roll=function(depth,boss){
    const d=(depth||1)+(boss?6:0);
    let t=1;
    if(d>=7&&Math.random()<Math.min(.35,(d-5)*.05)) t=3; else if(d>=2&&Math.random()<Math.min(.6,.3+d*.03)) t=2;
    if(boss&&t<2) t=2;
    return MOD_BASE[(Math.random()*MOD_BASE.length)|0].k+t;
  };
  api.onKill=function(e,depth){
    if(e.type==='K'){ api.add(api.roll(depth,true),true); api.add(api.roll(depth,true)); return; }
    api.pity++;
    if(Math.random()<.03+api.pity*.004){ api.pity=0; api.add(api.roll(depth)); }
  };
  api.sectorReward=function(depth){ const id=api.roll(depth); api.add(id,true); return MOD_BY_ID[id]; };
  const armored=e=>(e.armor>0)||ETYPES[e.type].sc>=1;   // schwer/gepanzert (Phase 8 setzt e.armor)
  api.armored=armored;
  /* Flaechenschaden ohne weitere Mod-Wirkung (Explosiv/Plasma): Abfall bis -50 %, nicht durch Waende */
  function area(cx,cy,R,base,skip){
    for(const en of enemies){
      if(!en.alive||en===skip) continue;
      const dx=en.x-cx, dy=en.y-cy, d=Math.hypot(dx,dy); if(d>R) continue;
      if(d>.3&&rayWallDist(cx,cy,dx/d,dy/d)<d-.1) continue;
      damageEnemy(en,Math.max(1,Math.round(base*(1-d/R*.5))),d>.001?Math.atan2(dy,dx):null,false,true);
    }
  }
  function chain(from,base,n){
    let cur=from; const used=[from];
    for(let k=0;k<n;k++){
      let nx=null, nd=3.2;
      for(const en of enemies){
        if(!en.alive||used.indexOf(en)>=0) continue;
        const dx=en.x-cur.x, dy=en.y-cur.y, d=Math.hypot(dx,dy); if(d>=nd) continue;
        if(rayWallDist(cur.x,cur.y,dx/(d||1),dy/(d||1))<d-.1) continue;
        nx=en; nd=d;
      }
      if(!nx) break;
      beams.push({kind:'arc',x0:cur.x,y0:cur.y,x1:nx.x,y1:nx.y,t:0,life:.12,jag:true,seed:Math.random()*9});
      damageEnemy(nx,Math.max(1,Math.round(base)),Math.atan2(nx.y-cur.y,nx.x-cur.x),false,true);
      used.push(nx); cur=nx;
    }
  }
  /* Nach einem Spielertreffer (Direkttreffer einer Waffe): Plasma/Explosion/Kettenblitz — je Schuss nur einmal, ohne Rekursion */
  api.onHit=function(e,dealt,M,w){
    if(api.busy||M.n<1||state!=='play'||api.lastShot===api.shotId) return;
    if(!(M.plasma||M.expF||M.chainP)) return;
    api.lastShot=api.shotId; api.busy=true;
    try{
      if(M.plasma) area(e.x,e.y,1.2,dealt*M.plasma,e);
      if(M.expF&&w&&w.kind!=='proj'){ area(e.x,e.y,M.expR,dealt*M.expF,e); spawnBoom(e.x,e.y,.8+M.expR*.3,BOOM_PLASMA); sfx.boomP(Math.hypot(e.x-P.x,e.y-P.y)); }
      if(M.chainP&&Math.random()<M.chainP) chain(e,dealt*M.chainF,M.chainN);
    } finally { api.busy=false; }
  };
  /* Lebensraub / Schild-Entzug aus tatsaechlich verursachtem Schaden */
  api.leech=function(dealt,M){
    if(state!=='play'||dealt<=0||P.hp<=0) return;
    if(M.ls>0&&P.hp<100){ api.lsAcc+=dealt*M.ls; if(api.lsAcc>=1){ const n=api.lsAcc|0; api.lsAcc-=n; P.hp=Math.min(100,P.hp+n); FX.heal=Math.max(FX.heal,.12); } }
    if(M.sd>0&&P.shieldMax>0&&P.shield<P.shieldMax) P.shield=Math.min(P.shieldMax,P.shield+dealt*M.sd);
  };
  return api;
})();

const Stats=(()=>{
  const src=Object.create(null), val={};
  /* Waffen-Krit: Waffenwert + Spielerbonus (Bonus = Abweichung vom Basiswert) */
  function weaponCrit(w){ return Math.min(1,Math.max(0,w.crit+(val.crit-PBASE.crit)+Mods.eff(w).critAdd)); }
  function weaponCritMul(w){ return Math.max(1,w.critMul+(val.critDmg-PBASE.critDmg)+Mods.eff(w).critMulAdd); }
  function recalc(){
    for(const k in PBASE){
      let v=PBASE[k];
      for(const id in src){ const a=src[id][k]; if(a) v+=a; }
      const lim=PLIM[k]; if(lim) v=clamp(v,lim[0],lim[1]);
      val[k]=v;
    }
    val.dashCharges=Math.round(val.dashCharges);
    P.shieldMax=val.shieldMax; P.armorMax=val.armorMax; P.energyMax=val.energyMax; P.crit=weaponCrit(WEAPONS[P.weapon]);
    P.shield=Math.min(P.shield,P.shieldMax); P.armor=Math.min(P.armor,P.armorMax); P.energy=Math.min(P.energy,P.energyMax);
    P.dashN=Math.min(P.dashN,val.dashCharges);
  }
  const api={
    val,
    add(id,bonus){ src[id]=bonus; recalc(); },
    remove(id){ delete src[id]; recalc(); },
    removePrefix(pre){ for(const id in src) if(id.indexOf(pre)===0) delete src[id]; recalc(); },
    sources(){ return Object.keys(src); },
    recalc,
    /* Neuer Lauf: Lauf-Boni weg, alles voll, Panzerung leer (kommt am Sektorstart wieder auf Grundfuellung) */
    onRunStart(){ api.removePrefix('run:'); P.shield=P.shieldMax; P.energy=P.energyMax; P.armor=0; api.resetTimers(); },
    /* Jeder Sektorstart (auch nach Tod/Neustart): Schild+Energie voll, Panzerung mindestens Grundfuellung, Dash bereit */
    onSector(){ P.shield=P.shieldMax; P.energy=P.energyMax; P.armor=Math.max(P.armor,Math.round(P.armorMax*val.armorSector)); api.resetTimers(); },
    resetTimers(){ P.dashN=val.dashCharges; P.dashT=0; P.dashCd=0; P.sprinting=false; P.sprintLock=false; P.shieldT=0; P.enT=0; P.enFlash=0; P.hpT=0; P.hpAcc=0; },
    /* Regeneration + Dash-Aufladung, einmal pro Frame im Zustand `play` */
    tick(dt){
      if(P.shieldT>0) P.shieldT-=dt;
      else if(P.shield<P.shieldMax){ const was=P.shield; P.shield=Math.min(P.shieldMax,P.shield+val.shieldRegen*dt); if(was<=0&&P.shield>0) sfx.shieldUp(); }
      if(val.hpRegen>0&&P.hp>0&&P.hp<100){
        if(P.hpT>0) P.hpT-=dt;
        else { P.hpAcc+=val.hpRegen*dt; if(P.hpAcc>=1){ const n=P.hpAcc|0; P.hpAcc-=n; P.hp=Math.min(100,P.hp+n); } }
      }
      if(P.enT>0) P.enT-=dt;
      else if(!P.sprinting&&P.energy<P.energyMax) P.energy=Math.min(P.energyMax,P.energy+val.energyRegen*dt);
      if(P.enFlash>0) P.enFlash-=dt;
      if(P.dashN<val.dashCharges){ P.dashCd-=dt; if(P.dashCd<=0){ P.dashN++; P.dashCd=P.dashN<val.dashCharges?val.dashCd:0; } }
    },
    /* Krit-Wurf fuer Spielertreffer: Multiplikator (1 = kein Krit). Nur im echten Spiel, nicht in der Titel-Demo. */
    weaponCrit, weaponCritMul,
    critMul(w){ w=w||WEAPONS[P.weapon]; return (state==='play'&&Math.random()<weaponCrit(w))?weaponCritMul(w):1; }
  };
  recalc();
  P.shield=P.shieldMax; P.energy=P.energyMax; P.armor=Math.round(P.armorMax*val.armorSector);
  return api;
})();

const keys={};
let locked=false, lockFailed=false, lockWanted=false, mouseDown=false;

window.addEventListener('keydown',e=>{
  if(['Space','ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Tab'].includes(e.code)) e.preventDefault();
  if(e.repeat) return;
  if(StoryUI.keyDown(e)) return;   // Story-Dialog offen (Phase 2)
  keys[e.code]=true;
  if(state==='play'){
    if(/^Digit[1-9]$/.test(e.code)) setWeapon(+e.code[5]-1);
    else if(e.code==='KeyR') manualReload();
    else if(e.code==='KeyM') { if(Endless.mapOff()) return; $('mini').style.display=$('mini').style.display==='none'?'block':'none'; }
    else if(e.code==='KeyF') tryDash();
    else if(e.code==='KeyL'){ pauseGame(); openLoadout(pauseMenu); }
    else if(e.code==='KeyP'){ pauseGame(); }
  } else if(state==='pause' && (e.code==='KeyP'||e.code==='Enter')){ resumeGame(); }
});
window.addEventListener('keyup',e=>{ keys[e.code]=false; });
window.addEventListener('blur',()=>{ for(const k in keys) keys[k]=false; mouseDown=false; });
document.addEventListener('visibilitychange',()=>{ if(document.hidden && state==='play') pauseGame(); });

document.addEventListener('mousemove',e=>{
  if(state!=='play'||!locked) return;
  P.a+=e.movementX*.0022*Settings.mouseK;
  P.pitch=clamp(P.pitch-e.movementY*.35*Settings.mouseK,-220,220);
});
cv.addEventListener('contextmenu',e=>{ e.preventDefault(); });
let wheelT=0;
cv.addEventListener('wheel',e=>{ if(state!=='play'||isTouch) return; e.preventDefault(); const n=performance.now(); if(n-wheelT<120) return; wheelT=n; cycleWeapon(e.deltaY>0?1:-1); },{passive:false});
cv.addEventListener('mousedown',e=>{
  if(isTouch) return;
  if(e.button===2){ if(state==='play') tryDash(); return; }
  if(e.button!==0) return;
  if(state==='play'){ mouseDown=true; if(!locked&&!lockFailed) requestLock(); }
});
window.addEventListener('mouseup',()=>{ mouseDown=false; });
document.addEventListener('pointerlockchange',()=>{
  locked=document.pointerLockElement===cv;
  if(!locked && state==='play' && lockWanted && !lockFailed) pauseGame();
});
document.addEventListener('pointerlockerror',()=>{ lockFailed=true; });
function requestLock(){
  if(isTouch) return;   // auf Touch-Geräten gibt es kein sinnvolles Pointer-Lock — Blick läuft übers Touch-Drag
  lockWanted=true;
  try{ const r=cv.requestPointerLock&&cv.requestPointerLock(); if(r&&r.catch) r.catch(()=>{ lockFailed=true; }); }
  catch(e){ lockFailed=true; }
}
function releaseLock(){ lockWanted=false; try{ if(document.pointerLockElement) document.exitPointerLock(); }catch(e){} }

/* ============================================================
   Touch-Steuerung (Handy/Tablet): Move-Pad links, Blick-Drag rechts,
   Feuer-/Waffen-/Pause-Buttons. Nur aktiv, wenn isTouch true ist (siehe
   oben) — auf Desktop bleibt alles wie gehabt bei Maus+Tastatur.
   ============================================================ */
let touchFwd=0, touchStr=0, touchSprint=false, touchFireDown=false;
if(isTouch){
  const tcLayer=$('touchLayer'), tcMove=$('tcMove'), tcKnob=$('tcMoveKnob'),
        tcFire=$('tcFireBtn'), tcWeapon=$('tcWeaponBtn'), tcPause=$('tcPauseBtn'), tcDash=$('tcDashBtn'), tcReload=$('tcReloadBtn');
  let moveId=null, moveCx=0, moveCy=0, moveR=1;
  let lookId=null, lookLastX=0, lookLastY=0;
  let fireId=null, dashId=null;
  const TOUCH_TURN=0.0034, TOUCH_PITCH=0.55;
  function resetMovePad(){ touchFwd=0; touchStr=0; touchSprint=false; tcKnob.style.transform='translate(-50%,-50%)'; }
  function inRect(el,x,y){ const r=el.getBoundingClientRect(); return x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom; }
  function handleStart(t){
    const x=t.clientX, y=t.clientY;
    if(moveId===null && inRect(tcMove,x,y)){
      const r=tcMove.getBoundingClientRect();
      moveId=t.identifier; moveCx=r.left+r.width/2; moveCy=r.top+r.height/2; moveR=r.width/2;
      return;
    }
    if(fireId===null && inRect(tcFire,x,y)){ fireId=t.identifier; touchFireDown=true; tcFire.classList.add('active'); return; }
    if(dashId===null && inRect(tcDash,x,y)){ dashId=t.identifier; tcDash.classList.add('active'); if(state==='play') tryDash(); return; }
    if(inRect(tcWeapon,x,y)){ cycleWeapon(); return; }
    if(inRect(tcReload,x,y)){ if(state==='play') manualReload(); return; }
    if(inRect(tcPause,x,y)){ if(state==='play') pauseGame(); return; }
    if(lookId===null && state==='play'){ lookId=t.identifier; lookLastX=x; lookLastY=y; }
  }
  function handleMove(t){
    if(t.identifier===moveId){
      let dx=t.clientX-moveCx, dy=t.clientY-moveCy;
      const d=Math.hypot(dx,dy);
      if(d>moveR){ dx=dx/d*moveR; dy=dy/d*moveR; }
      touchStr=dx/moveR; touchFwd=-dy/moveR; touchSprint=d>moveR*.78;
      tcKnob.style.transform='translate('+(dx-tcKnob.offsetWidth/2)+'px,'+(dy-tcKnob.offsetHeight/2)+'px)';
    } else if(t.identifier===lookId){
      const dx=t.clientX-lookLastX, dy=t.clientY-lookLastY;
      lookLastX=t.clientX; lookLastY=t.clientY;
      P.a+=dx*TOUCH_TURN*Settings.touchK;
      P.pitch=clamp(P.pitch-dy*TOUCH_PITCH*.1*Settings.touchK,-220,220);
    }
  }
  function handleEnd(t){
    if(t.identifier===moveId){ moveId=null; resetMovePad(); }
    else if(t.identifier===lookId){ lookId=null; }
    else if(t.identifier===fireId){ fireId=null; touchFireDown=false; tcFire.classList.remove('active'); }
    else if(t.identifier===dashId){ dashId=null; tcDash.classList.remove('active'); }
  }
  tcLayer.addEventListener('touchstart',e=>{ e.preventDefault(); for(const t of e.changedTouches) handleStart(t); },{passive:false});
  tcLayer.addEventListener('touchmove',e=>{ e.preventDefault(); for(const t of e.changedTouches) handleMove(t); },{passive:false});
  tcLayer.addEventListener('touchend',e=>{ e.preventDefault(); for(const t of e.changedTouches) handleEnd(t); },{passive:false});
  tcLayer.addEventListener('touchcancel',e=>{ for(const t of e.changedTouches) handleEnd(t); });
  function syncTouchLayer(){
    const playing=state==='play';
    tcLayer.style.pointerEvents=playing?'auto':'none';
    if(!playing){ moveId=null; lookId=null; fireId=null; dashId=null; touchFireDown=false; tcFire.classList.remove('active'); tcDash.classList.remove('active'); resetMovePad(); }
  }
  window.__syncTouchLayer=syncTouchLayer;
}
function cycleWeapon(dir){
  const order=[0,2,1,3,4,5,6,7,8], step=dir<0?-1:1, n=order.length;
  const idx=order.indexOf(P.weapon);
  for(let i=1;i<=n;i++){
    const cand=order[((idx+step*i)%n+n)%n];
    if(P.owned[cand]){ setWeapon(cand); break; }
  }
}

// (Effekt-Zustand liegt seit Phase 1 gebündelt in FX — siehe Architektur-Block)
function kick(amt){ FX.shake=Math.max(FX.shake,amt); }

function showMsg(t,ms){ const m=$('msg'); if(m.style) m.style.color=''; m.textContent=t; m.classList.add('on'); FX.msg=(ms||2200)/1000; }
function refreshWeaponUI(){ $('wname').textContent=WEAPONS[P.weapon].name; Stats.recalc(); }
function setWeapon(i){
  if(!(i>=0&&i<WEAPONS.length)) return;
  if(!P.owned[i]){ showMsg(WEAPONS[i].name+' noch nicht gefunden',1400); return; }
  if(i!==P.weapon){
    P.hs[P.weapon]=P.heat; P.os[P.weapon]=P.overheatT;              // Hitze je Waffe: die weggelegte kuehlt im Hintergrund
    P.weapon=i; P.heat=P.hs[i]; P.overheatT=P.os[i];
    P.reloadT=0; P.fireCd=Math.max(P.fireCd,.12);
  }
  refreshWeaponUI();
}
function grantWeapon(i,addAmmo){
  const w=WEAPONS[i]; if(!w) return;
  const fresh=!P.owned[i];
  if(addAmmo) P.ammo=Math.min(99,P.ammo+addAmmo);
  if(fresh){
    P.owned[i]=true; P.mag[i]=Mods.magSize(i);
    const u=Save.data.unlockedWeapons; if(u.indexOf(w.id)<0){ u.push(w.id); Save.markDirty(); }
    setWeapon(i); showMsg(w.name+'! (Taste '+(i+1)+')',2600);
  } else if(addAmmo) showMsg(w.name+': Ladung +'+addAmmo,1200);
}
/* Nachladen: Magazin zaehlt Schuesse, Vorrat zaehlt Zellen (cost je Schuss). Abbuchung erst beim Fertigstellen. */
function startReload(){
  const i=P.weapon, w=WEAPONS[i];
  if(w.mag<=0||P.reloadT>0||P.mag[i]>=Mods.magSize(i)||P.ammo<w.cost) return false;
  P.reloadDur=w.reload/Math.max(.3,1+Stats.val.reloadSpeed+Mods.eff(i).reload); P.reloadT=P.reloadDur; sfx.reload(i);
  return true;
}
function manualReload(){ if(state==='play') startReload(); }
function finishReload(){
  const i=P.weapon, w=WEAPONS[i];
  const n=Math.min(Mods.magSize(i)-P.mag[i],Math.floor(P.ammo/w.cost));
  if(n>0){ P.mag[i]+=n; P.ammo-=n*w.cost; }
  sfx.reloadDone(P.weapon);
}
/* Schadenspipeline (Phase 3): Dash-I-Frames -> Resistenz -> Schild -> Panzerung (nimmt Anteil des Rests auf) -> Integritaet.
   Integritaet bleibt ganzzahlig (HUD/Schwellen erwarten das): durchschlagender Rest wird aufgerundet, mind. 1. */
function hurtPlayer(n,src){
  if(P.hp<=0||state!=='play') return;
  if(P.dashT>0) return;                                    // waehrend des Dashs unverwundbar
  const V=Stats.val;
  Combat.hurt(); Missions.onHurt(); Style.onHurt(n);
  n*=1-V.resist;
  if(src) n*=Ascension.dmgK()*Endless.dmgK();   // Phase 20: Ascension-/Endless-Skalierung + Endlos-Einsatz-Schwierigkeit
  if(src&&src.em) Elite.onPlayerHit(src,n);   // Phase 8: Vampir-Elite heilt sich
  P.shieldT=V.shieldDelay; P.hpT=V.hpRegenDelay; P.hpAcc=0;
  let sAbs=0, broke=false;
  if(P.shield>0){ sAbs=Math.min(P.shield,n); P.shield-=sAbs; n-=sAbs; if(P.shield<=.001){ P.shield=0; broke=true; } }
  if(n>0&&P.armor>0){ const a=Math.min(P.armor,n*V.armorAbsorb); P.armor-=a; n-=a; }
  const dmg=n>.001?Math.max(1,Math.ceil(n-1e-6)):0;
  if(dmg>0){ P.hp=Math.max(0,P.hp-dmg); FX.hurt=.4; sfx.hurt(); kick(Math.min(1,.32+dmg*.035)); Cine.onHurt(dmg); }
  if(sAbs>0){
    FX.shieldHit=.35;
    if(broke){ sfx.shieldBreak(); kick(.3); Cine.glitch(.4); showMsg('Schild zusammengebrochen',900); }
    else if(dmg===0){ sfx.shieldHit(); kick(.14); }
  }
  if(P.hp<=0) die();
}
/* Bewegungswunsch als Einheitsvektor (0,0 = keine Eingabe) — gemeinsam fuer Laufen und Dash */
let mvX=0, mvY=0, mvLen=0;
function readMove(){
  const fwd=(keys.KeyW||keys.ArrowUp?1:0)-(keys.KeyS||keys.ArrowDown?1:0)+touchFwd;
  const str=(keys.KeyD?1:0)-(keys.KeyA?1:0)+touchStr;
  const vx=Math.cos(P.a)*fwd+(-Math.sin(P.a))*str, vy=Math.sin(P.a)*fwd+Math.cos(P.a)*str;
  mvLen=Math.hypot(vx,vy);
  if(mvLen>0){ mvX=vx/mvLen; mvY=vy/mvLen; } else { mvX=0; mvY=0; }
}
function tryDash(){
  if(state!=='play'||P.hp<=0||P.dashT>0) return false;
  const V=Stats.val;
  if(P.dashN<1) return false;                              // Cooldown laeuft (HUD zeigt den Balken)
  if(P.energy<V.dashCost){ P.enFlash=.5; sfx.noEnergy(); return false; }
  readMove();
  if(mvLen>0){ P.dashX=mvX; P.dashY=mvY; } else { P.dashX=Math.cos(P.a); P.dashY=Math.sin(P.a); }   // ohne Eingabe: nach vorn
  P.energy-=V.dashCost; P.enT=Math.max(P.enT,V.energyDelay);
  if(P.dashN>=V.dashCharges) P.dashCd=V.dashCd;
  P.dashN--; P.dashT=V.dashTime; FX.dash=.3;
  sfx.dash(); kick(.14); Perks.onDash(); Missions.onDash(); Style.onDash();
  return true;
}
function die(){
  setState('dead'); releaseLock(); sfx.die(); kick(1); Cine.onDeath(); Save.onDeath(); Style.onDeath(); Story.onPlayerDeath();
  setTimeout(()=>{
    const buttons=[{label:'Sektor neu starten',primary:true,fn:()=>{ P.hp=100; P.ammo=Math.max(snap.ammo,30); for(let k=0;k<WEAPONS.length;k++){ if(snap.owned[k]){ setOwned(k,true); P.mag[k]=Mods.magSize(k); } else P.owned[k]=false; } restartCurrent(); }}];
    if(lvl.procedural) buttons.push({label:'Lauf beenden',fn:finishRun});
    buttons.push({label:'Zum Titel',fn:showTitle});
    showOverlay(addLoadoutBtn({
      title:'Prozess beendet',
      text:'Die Rogue-Prozesse waren schneller. '+lvl.name+' wird neu gestartet, sobald du bereit bist.',
      stats:[['Feinde erledigt',stats.kills+' / '+totals.foes],['Zeit',fmt(stats.time)]],
      buttons
    }));
  },900);
}

/* ============================================================
   Loadout-Screen (Phase 5): Waffe waehlen, Slot waehlen, Mod einbauen/ablegen. Alles Buttons (touch-tauglich).
   `back` zeigt das vorherige Overlay wieder an (Pause, Sektor geschafft, Tod).
   ============================================================ */
function addMetaBtn(o){ o.buttons.push({label:'Archiv',fn:()=>Meta.screen(()=>showOverlay(o))}); return o; }
function addLoadoutBtn(o){ o.buttons.push({label:'Loadout',fn:()=>openLoadout(()=>showOverlay(o))}); return addMetaBtn(o); }
const escH=t=>String(t).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function modSpan(m){ return '<b style="color:'+MOD_TIERS[m.tier-1].col+'">'+escH(m.name)+'</b>'; }
/* Kennwerte einer Waffe: [Label, ohne Mods, mit Mods] als Text */
function loadoutRows(i){
  const w=WEAPONS[i], V=Stats.val, N=Mods.NEUTRAL, M=Mods.eff(i), r1=v=>(Math.round(v*10)/10).toString().replace('.',',');
  const f=(M)=>({
    dmg:Math.round(w.dmg*M.dmg*V.dmgMul)+(w.pel>1?' ×'+w.pel:''),
    rate:r1((1+V.fireRate+M.fireRate)/w.rate)+'/s',
    mag:w.mag>0?String(w.mag+M.magAdd):'∞',
    rel:w.mag>0?r1(w.reload/Math.max(.3,1+V.reloadSpeed+M.reload))+' s':'–',
    rng:r1(w.range*M.range),
    spr:r1(w.spread*M.spread*57.3)+'°',
    crit:pc(Math.min(1,Math.max(0,w.crit+(V.crit-PBASE.crit)+M.critAdd)))+' ×'+r1(Math.max(1,w.critMul+(V.critDmg-PBASE.critDmg)+M.critMulAdd)),
    en:w.energy>0?r1(w.energy*M.energy):'–',
    heat:w.heat>0?Math.round(w.heat*V.heatMul*M.heat*100)+'%':'–'
  });
  const a=f(N), b=f(M);
  return [['Schaden',a.dmg,b.dmg],['Feuerrate',a.rate,b.rate],['Magazin',a.mag,b.mag],['Nachladen',a.rel,b.rel],['Reichweite',a.rng,b.rng],
          ['Streuung',a.spr,b.spr],['Krit',a.crit,b.crit],['Energie/Schuss',a.en,b.en],['Hitze/Schuss',a.heat,b.heat]];
}
function openLoadout(back){
  const list=[]; for(let i=0;i<WEAPONS.length;i++) if(P.owned[i]&&Mods.slotsOf(i)) list.push(i);
  let selW=list.indexOf(P.weapon)>=0?P.weapon:list[0], selS='barrel', note='';
  function draw(box){
    const i=selW, w=WEAPONS[i], eq=Mods.eq[i];
    let h='<h2>Loadout</h2><div class="ld-tabs">';
    for(const wi of list) h+='<button type="button" class="chip'+(wi===i?' sel':'')+'" data-w="'+wi+'">'+escH(WEAPONS[wi].name)+' LV'+P.wLv[wi]+'</button>';
    h+='</div><div class="ld-grid"><div class="ld-col">';
    for(const sl of MOD_SLOTS){
      const m=MOD_BY_ID[eq[sl.id]];
      h+='<button type="button" class="ld-slot'+(sl.id===selS?' sel':'')+'" data-s="'+sl.id+'"><small class="ld-sl">'+sl.name+'</small>'+
         (m?modSpan(m)+'<small>'+escH(m.txt)+'</small>':'<span class="ld-empty">— leer —</span>')+'</button>';
    }
    h+='</div><div class="ld-col"><div class="ld-sub">'+escH(MOD_SLOTS.find(s=>s.id===selS).name)+' — verfügbare Mods</div>';
    const cur=eq[selS];
    const opts=MODS.filter(m=>m.slot===selS&&(Mods.free(m.id)>0||cur===m.id)).sort((a,b)=>b.tier-a.tier);
    if(cur) h+='<button type="button" class="ld-opt" data-off="'+selS+'"><span>Ablegen</span></button>';
    for(const m of opts) h+='<button type="button" class="ld-opt'+(cur===m.id?' on':'')+'" data-m="'+m.id+'">'+modSpan(m)+(Mods.free(m.id)>1?' ×'+Mods.free(m.id):'')+'<small>'+escH(m.txt)+'</small></button>';
    if(!opts.length&&!cur) h+='<p class="small">Keine Mods für diesen Slot. Mods findest du bei Kills (Chance), nach Sektor-Abschlüssen und bei Bossen.</p>';
    h+='</div><div class="ld-col"><div class="ld-sub">'+escH(w.name)+'</div><table class="ld-tab">';
    for(const r of loadoutRows(i)) h+='<tr><td>'+r[0]+'</td><td>'+(r[1]===r[2]?r[2]:'<s>'+r[1]+'</s></td><td class="up">'+r[2])+'</td></tr>';
    h+='</table></div></div>';
    h+='<div class="row" style="margin-top:1.2cqw"><button type="button" class="primary" id="ld-back">Zurück</button></div>';
    box.innerHTML=h;
    box.querySelectorAll('[data-w]').forEach(b=>b.onclick=()=>{ selW=+b.dataset.w; draw(box); });
    box.querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{ selS=b.dataset.s; draw(box); });
    box.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{ if(Mods.equip(selW,b.dataset.m)) sfx.reloadDone(); draw(box); });

function alertNear(r){ AI.noise(P.x,P.y,r||9); }   // Phase 6: Gegner untersuchen das Geräusch (Radius je Waffe, durch Wände gedämpft)
function tryFire(){
  if(P.fireCd>0||P.reloadT>0||P.overheatT>0) return;      // Cooldown / Nachladen / gesperrt (kuehlt ab)
  const i=P.weapon, w=WEAPONS[i], V=Stats.val, M=Mods.eff(i);
  if(w.mag>0&&P.mag[i]<=0){
    if(!startReload()){ sfx.empty(); P.fireCd=.35; showMsg('Keine Ladung',1200); }
    return;
  }
  const en=w.energy*M.energy;                              // Mods (Energie-Kern) senken die Energiekosten
  if(en>0){
    if(P.energy<en){ P.enFlash=.5; sfx.noEnergy(); P.fireCd=.25; return; }
    P.energy-=en; P.enT=Math.max(P.enT,V.energyDelay);
  }
  if(w.mag>0&&!(M.free>0&&Math.random()<M.free)) P.mag[i]--;   // Zellen-Sparer: Freischuss
  P.fireCd=w.rate/(1+V.fireRate+M.fireRate); P.recoil=1; P.flash=i===2?.12:.09;
  Mods.shotId++;
  sfx[w.snd]();
  const sp=w.spread*M.spread, rg=w.range*M.range;
  if(w.kind==='hit'){ for(let k=0;k<w.pel;k++) hitscan((Math.random()-.5)*sp,w.dmg,rg,w); }
  else if(w.kind==='proj'){
    const a=P.a+(Math.random()-.5)*sp, dx=Math.cos(a), dy=Math.sin(a);
    pshots.push({x:P.x+dx*.35,y:P.y+dy*.35,dx,dy,w,trav:0,m:M,rng:rg});
  }
  else if(w.kind==='rail') fireRail(w,M);
  else if(w.kind==='arc') fireArc(w,M);
  kick(w.rc*M.rc);
  if(w.heat>0){
    P.heat=Math.min(1,P.heat+w.heat*V.heatMul*M.heat);
    if(P.heat>=1){ P.overheatT=1.6; sfx.overheat(); showMsg(w.name+' überhitzt — kühlt ab…',1300); kick(.32); }
  }
  alertNear(NOISE[w.id]||9);
  if(w.mag>0&&P.mag[i]<=0) startReload();                  // letzter Schuss: automatisch nachladen
}
/* ---- Feuern für die Titelbild-Demo: identisches Waffengefühl, aber ohne Munitionsverbrauch ---- */
function demoFire(){

function hitscan(off,dmg,maxRange,w){
  const a=P.a+off, dx=Math.cos(a), dy=Math.sin(a);
  const wd=rayWallDist(P.x,P.y,dx,dy);
  let best=null, bd=maxRange?Math.min(wd,maxRange):wd;
  for(const e of enemies){
    if(!e.alive) continue;
    const ex=e.x-P.x, ey=e.y-P.y, along=ex*dx+ey*dy;
    if(along<.1||along>=bd) continue;
    const perp=Math.abs(ex*dy-ey*dx);
    if(perp<ETYPES[e.type].rad){ best=e; bd=along; }
  }
  Cine.tracer(P.x,P.y,dx,dy,bd,w);   // Phase 19: Leuchtspur
  const hz=Hazards.ray(P.x,P.y,dx,dy,bd);   // Phase 12: Fass/Turm liegt vor Gegner/Wand
  if(hz){ Hazards.hurt(hz.o,dmg*Stats.val.dmgMul); spawnSpark(P.x+dx*hz.d,P.y+dy*hz.d); return; }
  if(best) hitEnemy(best,dmg,a,w);
  else if(wd<1e8 && (!maxRange||wd<=maxRange)) spawnSpark(P.x+dx*wd,P.y+dy*wd);
}
/* Spielertreffer: Schadensfaktor + Waffen-Krit (Krit nur im echten Spiel, siehe Stats.critMul) */
function hitEnemy(e,dmg,ang,w,quiet){
  const m=Stats.critMul(w), M=Mods.eff(w);
  const d=Math.max(1,Math.round(dmg*Stats.val.dmgMul*M.dmg*(M.ap>0&&Mods.armored(e)?1+M.ap:1)*m));
  const hp0=e.hp;
  damageEnemy(e,d,ang,m>1,quiet);
  if(m>1) Perks.onCrit(e,d);   // Phase 14: Void Heart
  if(M.n>0){ Mods.leech(Math.max(0,hp0-Math.max(0,e.hp)),M); Mods.onHit(e,d,M,w); }   // Phase 5: Lebensraub/Schild-Entzug, Plasma/Explosion/Kettenblitz
}
/* Railgun: Strahl durchschlaegt bis zu 4 Ziele (je -25 %), stoppt an der Wand */
function fireRail(w,M){
  M=M||Mods.NEUTRAL; const rg=w.range*M.range;
  const dx=Math.cos(P.a), dy=Math.sin(P.a), wd=rayWallDist(P.x,P.y,dx,dy), lim=Math.min(wd,rg), hits=[];
  for(const e of enemies){
    if(!e.alive) continue;
    const ex=e.x-P.x, ey=e.y-P.y, along=ex*dx+ey*dy;
    if(along<.1||along>=lim) continue;
    if(Math.abs(ex*dy-ey*dx)<ETYPES[e.type].rad) hits.push({e,along});
  }
  hits.sort((a,b)=>a.along-b.along);
  for(let k=0;k<hits.length&&k<4;k++) hitEnemy(hits[k].e,w.dmg*Math.pow(.75,k),P.a,w,k>0);
  { const hz=Hazards.ray(P.x,P.y,dx,dy,lim); if(hz) Hazards.hurt(hz.o,w.dmg*Stats.val.dmgMul); }   // Phase 12
  beams.push({kind:'rail',x0:P.x+dx*.3,y0:P.y+dy*.3,x1:P.x+dx*lim,y1:P.y+dy*lim,t:0,life:.3,jag:false,seed:0});
  if(wd<=rg) spawnSpark(P.x+dx*wd,P.y+dy*wd);
}
/* Arc-Blaster: naechstes Ziel im Kegel, dann Kettenblitz (100 % / 60 % / 40 %) auf Ziele in 3.2 Feldern */
function fireArc(w,M){
  M=M||Mods.NEUTRAL;
  const dx=Math.cos(P.a), dy=Math.sin(P.a), wd=rayWallDist(P.x,P.y,dx,dy), lim=Math.min(wd,w.range*M.range);
  const sx=P.x+dx*.3, sy=P.y+dy*.3;
  let first=null, fd=1e9;
  for(const e of enemies){
    if(!e.alive) continue;
    const ex=e.x-P.x, ey=e.y-P.y, along=ex*dx+ey*dy;
    if(along<.1||along>lim||along>=fd) continue;
    if(Math.abs(ex*dy-ey*dx)>=ETYPES[e.type].rad+along*.22) continue;
    const d=Math.hypot(ex,ey); if(rayWallDist(P.x,P.y,ex/d,ey/d)<d-.15) continue;
    first=e; fd=along;
  }
  { const hz=Hazards.ray(P.x,P.y,dx,dy,first?fd:lim);   // Phase 12: Blitz trifft Fass/Turm, zuendet Gas
    if(hz){ const hx=P.x+dx*hz.d, hy=P.y+dy*hz.d; beams.push({kind:'arc',x0:sx,y0:sy,x1:hx,y1:hy,t:0,life:.12,jag:true,seed:Math.random()*9}); Hazards.hurt(hz.o,w.dmg*Stats.val.dmgMul); Hazards.ignite(hx,hy,1.2); return; } }
  if(!first){ beams.push({kind:'arc',x0:sx,y0:sy,x1:P.x+dx*Math.min(lim,3),y1:P.y+dy*Math.min(lim,3),t:0,life:.1,jag:true,seed:Math.random()*9}); return; }
  const hit=[first], mul=[1,.6,.4]; let cur=first, px0=sx, py0=sy;
  for(let k=0;k<3&&cur;k++){
    beams.push({kind:'arc',x0:px0,y0:py0,x1:cur.x,y1:cur.y,t:0,life:.12,jag:true,seed:Math.random()*9});
    hitEnemy(cur,w.dmg*mul[k],Math.atan2(cur.y-py0,cur.x-px0),w,k>0);
    px0=cur.x; py0=cur.y;
    let nx=null, nd=3.2;
    for(const e of enemies){
      if(!e.alive||hit.indexOf(e)>=0) continue;
      const ex=e.x-cur.x, ey=e.y-cur.y, d=Math.hypot(ex,ey);
      if(d>=nd) continue;
      if(rayWallDist(cur.x,cur.y,ex/(d||1),ey/(d||1))<d-.1) continue;
      nx=e; nd=d;
    }
    if(nx) hit.push(nx);
    cur=nx;
  }
}
/* Projektile (Plasma/Void/Singularitaet): Teilschritte gegen Durchtunneln; Einschlag an Gegner, Wand oder Reichweite */
function updatePshots(dt){
  for(let i=pshots.length-1;i>=0;i--){
    const s=pshots[i], total=s.w.pspd*dt, n=Math.max(1,Math.ceil(total/.2)), st=total/n;
    let done=false;
    for(let k=0;k<n&&!done;k++){
      s.x+=s.dx*st; s.y+=s.dy*st; s.trav+=st;
      if(solidAt(s.x,s.y)){ s.x-=s.dx*st; s.y-=s.dy*st; pdetonate(s,null); done=true; break; }
      if(Hazards.at(s.x,s.y,.28)){ pdetonate(s,null); done=true; break; }   // Phase 12
      for(const e of enemies){
        if(e.alive&&Math.hypot(e.x-s.x,e.y-s.y)<ETYPES[e.type].rad+.14){ pdetonate(s,e); done=true; break; }
      }
      if(!done&&s.trav>=(s.rng||s.w.range)){ pdetonate(s,null); done=true; }
    }
    if(done) pshots.splice(i,1);
  }
}
function pdetonate(s,e){
  const w=s.w;
  const M=s.m||Mods.eff(w);
  if(w.pkind==='sing'){ holes.push({x:s.x,y:s.y,t:0,life:2.6,tk:0,dm:M.dmg}); sfx.holeOpen(); return; }
  const cx=e?e.x:s.x, cy=e?e.y:s.y, isVoid=w.pkind==='void';
  if(e) hitEnemy(e,w.dmg,Math.atan2(s.dy,s.dx),w);
  splash(cx,cy,w.splashR*(1+M.expF*.5),w.splash*(1+M.expF),e,isVoid,M);   // Explosivgeschosse verstaerken Projektil-Splash
  spawnBoom(cx,cy,isVoid?1.5:1.1,isVoid?BOOM_VOID:BOOM_PLASMA);
  sfx.boomP(Math.hypot(cx-P.x,cy-P.y)); kick(isVoid?.35:.22);
}
/* Flaechenschaden mit Abfall (bis -50 % am Rand), keine Wirkung durch Waende; pull = Sog zum Zentrum (Void) statt Rueckstoss */
function splash(cx,cy,R,base,skip,pull,M){
  const dm=Stats.val.dmgMul*(M?M.dmg:1); Style.boom++;
  Hazards.splashObjs(cx,cy,R,base*dm);   // Phase 12: Faesser/Tuerme/Gas
  for(const en of enemies){
    if(!en.alive||en===skip) continue;
    const dx=en.x-cx, dy=en.y-cy, d=Math.hypot(dx,dy);
    if(d>R) continue;
    const ux=d>.001?dx/d:0, uy=d>.001?dy/d:0;
    if(d>.3&&rayWallDist(cx,cy,ux,uy)<d-.1) continue;
    const sd=Math.max(1,Math.round(base*(1-d/R*.5)*dm)), hp0=en.hp;
    damageEnemy(en,sd,pull?null:Math.atan2(dy,dx),false,true);
    if(M&&M.n>0) Mods.leech(Math.min(sd,Math.max(0,hp0)),M);
    if(pull&&en.alive&&d>.15){ const f=4.5*(1-d/R*.5); en.stagT=Math.max(en.stagT,.3); en.stagX=-ux*f; en.stagY=-uy*f; }
  }
  Style.boom--;
}
/* Singularitaet: Loch zieht Gegner + verschluckt gegnerische Geschosse, tickt Schaden, kollabiert mit Explosion */
function updateHoles(dt){
  const R=3.4;
  for(let i=holes.length-1;i>=0;i--){
    const h=holes[i], dm=Stats.val.dmgMul*(h.dm||1); h.t+=dt; h.tk+=dt;
    for(let j=shots.length-1;j>=0;j--){ if(Math.hypot(shots[j].x-h.x,shots[j].y-h.y)<1.3) shots.splice(j,1); }
    for(const e of enemies){
      if(!e.alive) continue;
      const dx=h.x-e.x, dy=h.y-e.y, d=Math.hypot(dx,dy);
      if(d>R||d<.05) continue;
      const f=1.4+2.2*(1-d/R);
      e.stagT=Math.max(e.stagT,.12); e.stagX=dx/d*f; e.stagY=dy/d*f;
    }
    if(h.tk>=.25){
      h.tk-=.25;
      for(const e of enemies){ if(e.alive&&Math.hypot(e.x-h.x,e.y-h.y)<2.2) damageEnemy(e,Math.max(1,Math.round(6*dm)),null,false,true); }
    }
    if(h.t>=h.life){
      for(const e of enemies){
        if(!e.alive) continue;
        const d=Math.hypot(e.x-h.x,e.y-h.y); if(d>3.2) continue;
        damageEnemy(e,Math.max(1,Math.round(90*(1-d/3.2*.5)*dm)),null,false,true);
      }
      spawnBoom(h.x,h.y,2.2,BOOM_VOID); sfx.holeCollapse(Math.hypot(h.x-P.x,h.y-P.y)); kick(.55);
      holes.splice(i,1);
    }
  }
}
function updateBeams(dt){

function damageEnemy(e,dmg,ang,crit,quiet){

/* ============================================================

  api.field=function(cx,cy){

    if(!h){ h={f:computeFlowFromCell(cx,cy)}; if(api.cache.size>=12) api.cache.delete(api.cache.keys().next().value); api.cache.set(key,h); }

  api.onDeath=function(e){

  };
  api.deathsNear=function(e,R,T){ let n=0; for(const d of api.deaths) if(api.t-d.t<T&&Math.hypot(d.x-e.x,d.y-e.y)<R) n++; return n; };
  function pickWaypoint(e){

      if(solidAt(x,y)) continue;

  /* Gegner ohne Kampf: Sinne, Untersuchen, Patrouille/Wache. true = jetzt im Kampf. */
  api.idle=function(e,dt,dist,dx,dy){

    e.senseT-=dt;

/* ============================================================
   Gegner-Klassen (Phase 7). e.role: scout, swarm, tank, sniper, support, shielder, summoner, assassin, juggernaut; e.elite = verstaerkter Gegner.

    sniper:'SNIPER — roter Laser! Kurz vor dem Schuss seitlich ausweichen',
    support:'SUPPORT — heilt Verbündete: zuerst ausschalten',
    shielder:'SCHILD-GENERATOR — Verbündete im Feld nehmen ~45 % weniger Schaden',
    summoner:'BESCHWÖRER — ruft Verstärkung, ein Treffer unterbricht den Ruf',
    assassin:'ASSASSIN — springt hinter dich: bei Blitz-Geräusch umdrehen',
    juggernaut:'JUGGERNAUT — Ansturm: im letzten Moment ausweichen, Wand-Aufprall betäubt ihn',
    elite:'ELITE — verstärkt und löst einen Nova-Stoß aus: aus dem Ring laufen'

  api.minions=function(e){ let n=0; for(const o of enemies) if(o.alive&&o.owner===e) n++; return n; };
  api.summon=function(e){

      const a=Math.random()*TAU, r=1+Math.random()*.6, ca=Math.cos(a), sa=Math.sin(a), x=e.x+ca*r, y=e.y+sa*r;
      if(boxHit(x,y,T.rad)||rayWallDist(e.x,e.y,ca,sa)<r+.05) continue;
      const m={type,x,y,hp:T.hp,maxhp:T.hp,alive:true,awake:false,hear:false,cd:1+Math.random(),flash:0,atk:0,strafe:1,strT:0,bodyT:0,stagT:0,stagX:0,stagY:0,owner:e};
      enemies.push(m); totals.foes++; AI.init(m); AI.engage(m); spawnBoom(x,y,.5); made++;
    }
    if(made) api.stats.summons++;
  };
  /* Assassine: springt in den Ruecken/die Flanke des Spielers (Ziel muss frei und einsehbar sein) */
  api.blink=function(e){
    const t=ETYPES[e.type];
    for(let k=0;k<14;k++){
      const a=k<7?P.a+Math.PI+(Math.random()-.5)*1.6:Math.random()*TAU, r=1.4+Math.random()*.6, ca=Math.cos(a), sa=Math.sin(a), x=P.x+ca*r, y=P.y+sa*r;
      if(boxHit(x,y,t.rad)||rayWallDist(P.x,P.y,ca,sa)<r+.1) continue;
      spawnBoom(e.x,e.y,.5); e.x=x; e.y=y; spawnBoom(x,y,.5); sfx.blink(r);
      e.cd=.4; e.face=Math.atan2(P.y-y,P.x-x); e.lkx=P.x; e.lky=P.y; api.stats.blinks++;
      return true;
    }
    return false;
  };
  api.nova=function(e,dist){
    spawnBoom(e.x,e.y,1.6); sfx.boomP(dist); kick(.5); api.stats.novas++;
    if(Math.hypot(P.x-e.x,P.y-e.y)<3.4) hurtPlayer(Math.round(18*(e.em&&e.em.over?1.35:1)),e);
  };
  const flicker=(e,rt,hz)=>{ if(((rt*hz)|0)%2) e.flash=.05; };
  /* Bewegung ueberschreiben: Richtung + Ziel (kein Ziel = stehen bleiben) */
  const keep=(e,ux,uy,dist,near,far)=>{ api.has=true; if(dist<near){ api.vx=-ux; api.vy=-uy; } else if(dist>far){ api.vx=ux; api.vy=uy; } else { api.vx=0; api.vy=0; } };
  const toward=(e,tx,ty,ux,uy,dist,stopD)=>{
    api.has=true; api.vx=api.vy=0;
    if(dist<4.5){ api.vx=-ux; api.vy=-uy; return; }
    const v=AI.dirTo(e,tx,ty); if(v[2]>stopD){ api.vx=v[0]; api.vy=v[1]; }
  };
  api.act=function(e,dt,los,dist,dx,dy,fleeing){
    api.has=false; e.rsp=(e.pk||1)*(e.elite?1.1:1)*(e.em?Elite.spd(e):1); e.healing=false;
    if(e.ai!==AI_COMBAT||fleeing){ if(e.rs) cancel(e); e.vs=0; return false; }
    const t=ETYPES[e.type], ux=dx/dist, uy=dy/dist;
    e.rcd-=dt; if(e.em){ const cb=Elite.cdBoost(e); if(cb) e.cd-=dt*cb; }
    if(e.elite){                                             // Elite-Faehigkeit: Nova-Stoss (1 s Ansage, Radius 3.4)
      e.novaCd-=dt;
      if(e.rs===R_NOVA){
        e.rt-=dt; flicker(e,e.rt,8); AI.turn(e,Math.atan2(dy,dx),dt*6);
        if(e.rt<=0){ e.rs=0; api.nova(e,dist); }
        return true;
      }
      if(!e.rs&&e.novaCd<=0&&los&&dist<4.2&&!e.phased&&!e.vs){ e.rs=R_NOVA; e.rt=1; e.novaCd=8+Math.random()*3; sfx.novaWind(dist); return true; }
      if(e.em&&Elite.act(e,dt,los,dist,dx,dy)) return true;   // Phase 8: Void-Energiekugel
    }
    switch(e.role){
      case 'sniper':
        if(e.rs===R_AIM){
          if(!los){ cancel(e); e.rcd=1.5; return false; }
          e.rt-=dt; e.aim=1-Math.max(0,e.rt)/e.aimT; api.aimN++; AI.turn(e,Math.atan2(dy,dx),dt*10);
          if(!e.locked&&e.rt<=.3){ e.locked=true; e.lx=P.x; e.ly=P.y; }        // Ziel rastet .3 s vor dem Schuss ein: Ausweichfenster
          if(e.rt<=.3) e.atk=.1;
          if(e.rt<=0){
            const a=Math.atan2(e.ly-e.y,e.lx-e.x); e.atk=.3; sfx.snipe(dist); spawnShot(e.x,e.y,a,api.dmg(e,26),24,'snipe',e);
            cancel(e); e.rcd=3+Math.random()*1.5; api.stats.snipes++;
          }
          return true;
        }
        if(e.rcd<=0&&los&&dist>4&&dist<16){ e.rs=R_AIM; e.aimT=[1.35,1.15,.95][e.aggr||0]; e.rt=e.aimT; e.locked=false; e.aim=0; sfx.aimWarn(dist); return true; }
        if(los) keep(e,ux,uy,dist,7,13);
        return false;
      case 'support': {
        e.hT-=dt;
        if(e.hT<=0){                                         // schwaechsten Verbuendeten in Sicht waehlen
          e.hT=.35; e.ht=null; let best=.95, bo=null;
          for(const o of enemies){
            if(o===e||!o.alive||o.type==='K'||o.role==='support') continue;
            const f=o.hp/o.maxhp; if(f>=best) continue;
            const ox=o.x-e.x, oy=o.y-e.y, d=Math.hypot(ox,oy); if(d>8) continue;
            if(d>.4&&rayWallDist(e.x,e.y,ox/d,oy/d)<d-.1) continue;
            best=f; bo=o;
          }
          e.ht=bo;
        }
        let tg=e.ht;
        if(tg&&tg.alive&&tg.hp<tg.maxhp&&Math.hypot(tg.x-e.x,tg.y-e.y)<9){ tg.hp=Math.min(tg.maxhp,tg.hp+api.dmg(e,10)*dt); e.healing=true; e.cd=Math.max(e.cd,.6); }
        else { tg=null; e.ht=null; let bd=10; for(const o of enemies){ if(o===e||!o.alive||o.type==='K'||o.role==='support') continue; const d=Math.hypot(o.x-e.x,o.y-e.y); if(d<bd){ bd=d; tg=o; } } }
        if(tg) toward(e,tg.x,tg.y,ux,uy,dist,3.2);
        return false;
      }
      case 'shielder': {
        let sx=0, sy=0, n=0;
        for(const o of enemies){ if(o===e||!o.alive||o.type==='K'||o.role==='shielder') continue; if(Math.hypot(o.x-e.x,o.y-e.y)<8){ sx+=o.x; sy+=o.y; n++; } }
        if(n) toward(e,sx/n,sy/n,ux,uy,dist,1.8);
        return false;
      }
      case 'summoner':
        if(e.rs===R_CHAN){
          e.rt-=dt; e.atk=.1; AI.turn(e,Math.atan2(dy,dx),dt*6);
          if(e.rt<=0){ e.rs=0; e.rcd=10+Math.random()*3; api.summon(e); }
          return true;
        }
        if(e.rcd<=0&&los&&dist>4&&dist<14&&api.minions(e)<4){ e.rs=R_CHAN; e.rt=1.4; sfx.summon(dist); return true; }
        if(los) keep(e,ux,uy,dist,5.5,10);
        return false;
      case 'assassin':
        if(e.rs===R_WIND){
          e.rt-=dt; e.atk=.1; flicker(e,e.rt,10);
          if(e.rt<=0){ e.rs=0; e.rcd=api.blink(e)?5.5+Math.random()*2:1.5; }
          return true;
        }
        if(e.rcd<=0&&los&&dist>3.5&&dist<11){ e.rs=R_WIND; e.rt=.55; sfx.blinkWind(dist); return true; }
        return false;
      case 'juggernaut':
        if(e.rs===R_CW){
          e.rt-=dt; e.atk=.1; AI.turn(e,Math.atan2(dy,dx),dt*8); flicker(e,e.rt,12);
          if(e.rt<=0){ e.rs=R_CH; e.rt=1.1; e.cvx2=ux; e.cvy2=uy; api.stats.charges++; }     // Richtung rastet beim Start des Ansturms ein
          return true;
        }
        if(e.rs===R_CH){
          e.rt-=dt; e.atk=.1;
          const sp=9*dt, n=Math.max(1,Math.ceil(sp/.2)), st=sp/n; let crash=false, hit=false;
          for(let k=0;k<n;k++){                              // Teilschritte: kein Durchtunneln von Waenden
            const mx=e.cvx2*st, my=e.cvy2*st, m=tryMove(e,mx,my,t.rad*.8);
            if(m<(Math.abs(mx)+Math.abs(my))*.75){ crash=true; break; }
            if(Math.hypot(P.x-e.x,P.y-e.y)<t.rad+.45){ hit=true; break; }
          }
          if(hit){ hurtPlayer(api.dmg(e,32),e); kick(.8); sfx.melee(); e.rs=R_STUN; e.rt=1; e.vuln=false; e.rcd=5+Math.random()*2; }
          else if(crash){ kick(.7); spawnSpark(e.x+e.cvx2*.6,e.y+e.cvy2*.6); sfx.stomp(dist); e.rs=R_STUN; e.rt=1.8; e.vuln=true; e.rcd=6+Math.random()*2; }
          else if(e.rt<=0){ e.rs=R_STUN; e.rt=.7; e.vuln=false; e.rcd=5+Math.random()*2; }
          return true;
        }
        if(e.rs===R_STUN){ e.rt-=dt; if(e.rt<=0){ e.rs=0; e.vuln=false; } return true; }
        if(e.rcd<=0&&los&&dist>3.5&&dist<11){ e.rs=R_CW; e.rt=.9; sfx.chargeWind(dist); return true; }
        return false;
    }
    return false;
  };
  return api;
})();

/* ============================================================
   Elite-Modifikatoren (Phase 8). Liegen ueber den Elite-Grundwerten aus Phase 7 (HP x1,8, Schaden x1,25, Nova-Stoss).
   e.mods = Liste der Modifikator-IDs (1, ab Tiefe 12 mit 30 % Chance 2), e.em[id] = Schnellzugriff.
   over ueberladen (+35 % Schaden, +15 % Feuerrate) | armor gepanzert (-40 % Schaden, e.armor=1 fuer Panzerbrecher, HP x1,15)
   vamp vampirisch (heilt 60 % des verursachten Schadens) | phase Phasen (verschwindet 1,3 s, dann unverwundbar) | rage Berserker (unter 50 % HP bis +45 % Tempo, +60 % Feuerrate)
   void Void (langsame Energiekugel, entzieht 30 Energie) | swarm Brut (ruft bei 66 %/33 % HP Nachschub) | reflect reflektierend (30 % des Schadens, max 10, alle .25 s)
   ============================================================ */
const Elite=(()=>{
  const EM={
    over:  {n:'ÜBERLADEN',    c:'#FF9A2E', tip:'ÜBERLADEN — deutlich mehr Schaden und Feuerrate: keine Treffer kassieren'},
    armor: {n:'GEPANZERT',    c:'#8FB4D9', tip:'GEPANZERT — nimmt ~40 % weniger Schaden: Panzerbrecher-Mod oder Railgun nutzen'},
    vamp:  {n:'VAMPIRISCH',   c:'#FF2E63', tip:'VAMPIRISCH — heilt sich bei Treffern: nicht treffen lassen, Schaden bündeln'},
    phase: {n:'PHASEN',       c:'#C9A8FF', tip:'PHASEN — verschwindet kurz und ist dann unverwundbar: Feuer einstellen, ausweichen'},
    rage:  {n:'BERSERKER',    c:'#FF3B3B', tip:'BERSERKER — bei wenig Integrität schneller und aggressiver: schnell erledigen'},
    void:  {n:'VOID',         c:'#B45CFF', tip:'VOID — violette Energiekugeln entziehen Energie: ausweichen'},
    swarm: {n:'BRUT',         c:'#7CE85A', tip:'BRUT — ruft bei Schaden Nachschub: Kern schnell ausschalten'},
    reflect:{n:'REFLEKTIEREND',c:'#5FD8FF', tip:'REFLEKTIEREND — wirft Schaden zurück: wenige starke Treffer statt Dauerfeuer'}
  };
  const IDS=Object.keys(EM);
  const ICON={
    over:  ['...XX','..XX.','.XX..','XXXXX','..XX.','.XX..','XX...'],
    armor: ['XXXXX','X...X','X...X','X...X','.X.X.','.X.X.','..X..'],
    vamp:  ['..X..','..X..','.XXX.','.XXX.','XXXXX','XXXXX','.XXX.'],
    phase: ['.XXX.','XXXXX','X.X.X','XXXXX','XXXXX','XXXXX','X.X.X'],
    rage:  ['X...X','XX.XX','XXXXX','X.X.X','XXXXX','.XXX.','.X.X.'],
    void:  ['..X..','.XXX.','XX.XX','X...X','XX.XX','.XXX.','..X..'],
    swarm: ['X...X','.....','..X..','.XXX.','..X..','.....','X...X'],
    reflect:['..X..','.XXX.','X.X.X','..X..','X.X.X','.XXX.','..X..']
  };
  const AURA={}, ICONTEX={};
  for(const id of IDS){
    const c=EM[id].c;
    AURA[id]=makeTex(g=>{ g.strokeStyle=c; g.lineWidth=2.8; g.beginPath(); g.ellipse(32,32,29,29,0,0,Math.PI*2); g.stroke();
      g.lineWidth=1.6; if(g.setLineDash) g.setLineDash([3,4]); g.beginPath(); g.ellipse(32,32,24,24,0,0,Math.PI*2); g.stroke(); },true);
    ICONTEX[id]=makeTex(g=>glyph(g,ICON[id],c,12,4,8),true);
  }
  const api={ EM, IDS, AURA, ICONTEX, stats:{reflects:0,drains:0,phases:0,bolts:0,vamps:0,broods:0} };
  const okFor=(id,e)=>{
    if(id==='phase') return !STATIONARY_TYPES[e.type]&&e.role!=='juggernaut';
    if(id==='void') return e.role!=='sniper';
    if(id==='swarm') return e.role!=='summoner';
    return true;
  };
  const applyStats=(e,id)=>{
    if(id==='armor'){ e.maxhp=Math.round(e.maxhp*1.15); e.armor=1; }
    else if(id==='phase'){ e.maxhp=Math.round(e.maxhp*.85); e.phCd=3+Math.random()*3; e.phT=0; e.phW=0; e.phased=false; }
    else if(id==='void'){ e.vcd=2+Math.random()*2; e.vs=0; e.vt=0; }
    else if(id==='swarm') e.swN=0;
    else if(id==='reflect') e.rfT=0;
  };
  api.assign=function(e){
    const d=(lvl&&lvl.depth)||1, want=Ascension.eliteMods(d,(d>=12&&Math.random()<.3)?2:1);
    e.mods=[]; e.em={};
    for(let k=0;k<want;k++){
      const pool=IDS.filter(id=>!e.em[id]&&okFor(id,e)); if(!pool.length) break;
      const id=Biome.pickElite(pool); e.em[id]=1; e.mods.push(id); applyStats(e,id);
    }
    e.hp=e.maxhp;
  };
  const low=e=>{ const f=e.hp/e.maxhp; return f<.5?1-f/.5:0; };   // Berserker-Staerke 0..1
  api.spd=e=>{ const em=e.em; let m=1; if(em.armor) m*=.92; if(em.over) m*=1.05; if(em.phase&&e.phased) m*=1.5; if(em.rage) m*=1+low(e)*.45; return m; };
  api.cdBoost=e=>{ const em=e.em; return (em.over?.15:0)+(em.rage?low(e)*.6:0); };
  api.mitigate=(e,dmg)=>e.em.armor?Math.max(1,Math.round(dmg*.6)):dmg;
  api.deflect=function(e,quiet){ if(!quiet&&Roles.t>=(e.phSp||0)){ e.phSp=Roles.t+.15; spawnSpark(e.x,e.y); } };
  /* pro Frame (vor Stagger/KI): Phasen-Zyklus, Reflexions-Abklingzeit */
  api.tick=function(e,dt){
    const em=e.em; if(e.rfT>0) e.rfT-=dt;
    if(!em.phase) return;
    if(e.phased){
      e.phT-=dt; e.cd=Math.max(e.cd,.25);
      if(e.phT<=0){ e.phased=false; e.phCd=6+Math.random()*3; spawnBoom(e.x,e.y,.5); sfx.blink(Math.hypot(e.x-P.x,e.y-P.y)); api.stats.phases++; }
    } else if(e.phW>0){
      e.phW-=dt; if(((e.phW*12)|0)%2) e.flash=.05;
      if(e.phW<=0){ e.phased=true; e.phT=1.3+(e.aggr||0)*.2; }
    } else if(e.awake&&e.ai===AI_COMBAT){
      e.phCd-=dt;
      if(e.phCd<=0){ const d=Math.hypot(P.x-e.x,P.y-e.y); if(d>2.5){ e.phW=.4; sfx.blinkWind(d); } else e.phCd=.5; }
    }
  };
  /* Void: 0,6 s Ansage (Flackern + Ton), dann langsame violette Kugel (dodgebar) */
  api.act=function(e,dt,los,dist,dx,dy){
    if(!e.em.void) return false;
    if(e.vs===1){
      e.vt-=dt; e.atk=.1; AI.turn(e,Math.atan2(dy,dx),dt*8); if(((e.vt*14)|0)%2) e.flash=.05;
      if(e.vt<=0){ e.vs=0; e.vcd=3.2+Math.random()*1.3; e.atk=.3; sfx.voidFire(dist); spawnShot(e.x,e.y,Math.atan2(dy,dx),Roles.dmg(e,14),7,'void',e); api.stats.bolts++; }
      return true;
    }
    e.vcd-=dt;
    if(e.vcd<=0&&!e.rs&&!e.phased&&los&&dist>3&&dist<13){ e.vs=1; e.vt=.6; sfx.novaWind(dist); return true; }
    return false;
  };
  api.voidHit=function(){ if(P.dashT>0||P.hp<=0) return; P.energy=Math.max(0,P.energy-30); P.enT=Math.max(P.enT||0,1.2); P.enFlash=.5; api.stats.drains++; };
  api.onPlayerHit=function(src,n){
    if(!src.alive||!src.em.vamp) return;
    const h=Math.max(1,Math.round(n*.6)); src.hp=Math.min(src.maxhp,src.hp+h); src.flash=.06; api.stats.vamps+=h;
  };
  /* nach jedem Treffer auf den Elite (Schaden bereits abgezogen): Reflexion, Brut-Nachschub */
  api.onDamaged=function(e,dmg,ang){
    if(state!=='play'||e.hp<=0) return;
    const em=e.em;
    if(em.reflect&&ang!=null&&e.rfT<=0&&dmg>0){
      e.rfT=.25; api.stats.reflects++; spawnSpark(e.x,e.y); hurtPlayer(Math.min(10,Math.max(1,Math.round(dmg*.3))));
    }
    if(em.swarm){
      const f=e.hp/e.maxhp;
      while(e.swN<2&&f<(e.swN?.33:.66)){ e.swN++; if(Roles.minions(e)<4){ Roles.summon(e); api.stats.broods++; } }
    }
  };
  /* Darstellung: Ring je Modifikator (Farbe), Icon ueber dem Kopf; Phasen-Elite flimmert */
  api.decor=function(e,t,time){
    const ms=e.mods, sp=(e.em.rage&&low(e)>0)?12:4, vis=!e.phased||((time*10)|0)%2===0;
    for(let i=0;i<ms.length;i++){
      if(vis) drawList.push({x:e.x,y:e.y,tex:AURA[ms[i]],sc:t.sc*(1.32+i*.14+Math.sin(time*sp+e.x+i*2)*.03),vo:t.vo,flash:0,glow:true});
      drawList.push({x:e.x,y:e.y,tex:ICONTEX[ms[i]],sc:.2,vo:t.vo+t.sc+.03+i*.2,flash:0,glow:true});
    }
  };
  return api;
})();

/* ============================================================
   Boss-Evolution (Phase 9). Jeder Boss-Sektor (alle 3 Tiefen) hat einen eigenen Boss: n = Tiefe/3, Variante v = (n-1) % 4.
   0 Kern-Waechter · 1 Phantom-Prozess · 2 Reaktor-Titan · 3 Void-Weber (Werte/Angriffe/Farbe in BD).
   4 Phasen bei 100/75/50/25 % HP (die Marken der Boss-Leiste): 1 normale Attacken · 2 neue Mechanik · 3 Arena aendert sich (Saeulen) + mehr Angriffe · 4 Enrage + Todesnova.
   Phasenwechsel: Boss unverwundbar (1,8 s), Gegnerschuesse verschwinden, Schaden kann keine Phase ueberspringen (Boss.clamp).
   Intro 2,6 s (unverwundbar, Ton, Meldung). Arena-Sperre: Zugang des Vorraums wird versiegelt, sobald der Spieler drin ist (nur mit lvl.arena), Freigabe beim Boss-Tod.
   Angriffe: burst (Faecher) · ring (Ring mit Luecke) · spiral · nova (Telegraph, Flaeche) · slam (Schockwelle) · blink (Teleport + Salve) · summon (Nachschub).
   Musik: synthetisierter Kampfpuls je Phase (nur solange der Boss kaempft). Belohnung: Credits, Health/Ammo, 2 Mods (Mods.onKill), dauerhafter Lauf-Bonus je Boss (Stats 'run:boss<n>').
   ============================================================ */
const Boss=(()=>{
  const BD=[
    {name:'Kern-Wächter',    c:'#FF3D6E', hp:1,    dm:1,   spd:1,   cd:1.0, pil:4, burst:[3,3,5,7], bv:9, bdm:9,
      ph:['Kernprotokoll','Ringwelle','Arena kollabiert','ENRAGE — Todesnova'],
      at:[['burst'],['burst','ring'],['burst','ring','summon'],['burst','ring','nova']], bonus:{resist:.04}, bt:'+4 % Resistenz'},
    {name:'Phantom-Prozess', c:'#B45CFF', hp:.85,  dm:1,   spd:1.15,cd:.9,  pil:6, burst:[3,3,4,5], bv:9, bdm:8,
      ph:['Schattenlauf','Blink-Angriffe','Nachschub-Protokoll','ENRAGE — Phasensturm'],
      at:[['burst'],['burst','blink'],['blink','summon','ring'],['blink','burst','nova']], bonus:{speed:.05}, bt:'+5 % Tempo'},
    {name:'Reaktor-Titan',   c:'#FF9A2E', hp:1.5,  dm:1.1, spd:.8,  cd:1.2, pil:5, burst:[3,3,4,4], bv:6, bdm:12, big:1,
      ph:['Schwerfeuer','Schockwellen','Trümmerfeld','ENRAGE — Kernschmelze'],
      at:[['burst'],['slam','burst'],['slam','spiral','burst'],['slam','spiral','nova']], bonus:{armorMax:10}, bt:'+10 max. Panzerung'},
    {name:'Void-Weber',      c:'#3DFFC2', hp:1.25, dm:1.05,spd:1,   cd:1.1, pil:3, burst:[3,3,4,5], bv:8, bdm:8,
      ph:['Sporenspirale','Ringgeflecht','Riss im Raum','ENRAGE — Singularität'],
      at:[['spiral'],['ring','burst'],['summon','blink','spiral'],['spiral','ring','nova','blink']], bonus:{crit:.03,critDmg:.15}, bt:'+3 % Krit, +15 % Krit-Schaden'}
  ];
  const CD=[1.7,1.5,1.35,1.0], SPD=[1,1.08,1.2,1.4], BPM=[96,112,128,148], ROOT=[55,49,44,58], THR=[.75,.5,.25];

  const api={ BD, locked:false, pillars:[], stats:{phases:0,rings:0,novas:0,slams:0,blinks:0,summons:0,spirals:0} };

  /* Phase 3: isolierte Saeulen in der Arena (nie an Waenden -> keine Engstellen, nie auf Spieler/Gegner/Zugang) */
  const arenaChange=function(e){
    const D=BD[e.bv]; let cells;
    if(lvl&&lvl.arena) cells=lvl.arena.cells;
    else { cells=[]; const cx=(e.hx!=null?e.hx:e.x)|0, cy=(e.hy!=null?e.hy:e.y)|0; for(let y=cy-6;y<=cy+6;y++) for(let x=cx-6;x<=cx+6;x++) cells.push([x,y]); }
    const free=(x,y)=>{ if(x<1||y<1||x>=MW-1||y>=MH-1) return false; for(let j=-1;j<=1;j++) for(let i=-1;i<=1;i++) if(grid[(y+j)*MW+x+i]) return false; return true; };
    const pool=cells.slice(); for(let i=pool.length-1;i>0;i--){ const j=(Math.random()*(i+1))|0, t=pool[i]; pool[i]=pool[j]; pool[j]=t; }

    for(const [x,y] of pool){

      const cx=x+.5, cy=y+.5;

    for(const o of enemies) if(o.alive&&Math.hypot(o.x-(A.ex+.5),o.y-(A.ey+.5))<1.3) return;
    grid[A.ey*MW+A.ex]=3; api.locked=true; buildMini(); flowT=0; sfx.bossLock(); kick(.6); showMsg('ARENA VERSIEGELT',1800);
  };
  const unlock=function(){

  /* Kampfmusik: 16 Achtel-Schritte, Tempo/Lagen je Phase */

    const st=NX.settings, mv=(st&&typeof st.musicVol==='number')?st.musicVol:1; if(mv<=0) return;

  /* ---- DOM (einmalig): Abdunkelung, Farbschleier, Ereignis-Leiste (max. 3 Zeilen) ---- */

    if(dom) return;
    const st=document.createElement('style');
    st.textContent='#evFx{position:absolute;inset:0;pointer-events:none;opacity:0;background:radial-gradient(circle at 50% 52%,rgba(0,0,0,0) 0,rgba(0,0,0,.35) 15%,rgba(0,0,0,.93) 44%,#000 76%)}'
      +'#evTint{position:absolute;inset:0;pointer-events:none;opacity:0}'
      +'#evTint.alarm{background:radial-gradient(ellipse at center,rgba(255,40,40,0) 42%,rgba(255,40,40,.5) 100%);animation:evTint 1.2s ease-in-out infinite}'
      +'#evTint.melt{background:radial-gradient(ellipse at center,rgba(255,110,20,0) 38%,rgba(255,80,10,.55) 100%);animation:evTint .8s ease-in-out infinite}'
      +'@keyframes evTint{0%,100%{opacity:.2}50%{opacity:.85}}'
      +'.rm #evTint.alarm,.rm #evTint.melt{animation:none !important;opacity:.4 !important}'
      +'#evt{position:absolute;left:50%;top:9.4cqw;transform:translateX(-50%);width:34cqw;pointer-events:none}'
      +'.touchable #evt{width:30cqw;top:9cqw}'
      +'#evt .ev{display:none;margin-top:.5cqw;padding:.45cqw .9cqw .55cqw;background:rgba(6,12,20,.74);border-left:.35cqw solid var(--c,#35E4FF);color:#DCF6FF;font-weight:700;font-size:1.45cqw;line-height:1.25}'
      +'#evt .ev b{display:inline-block;color:var(--c,#35E4FF);letter-spacing:.08em;margin-right:.8cqw}'
      +'#evt .ev u{display:block;height:.35cqw;margin-top:.35cqw;background:var(--c,#35E4FF);width:0}'
      +'#evt .ev.warn{animation:evBlink .6s steps(2) infinite}'
      +'@keyframes evBlink{50%{background:rgba(70,10,10,.85)}}'
      +'.rm #evt .ev.warn{animation:none}';
    (document.head||document.documentElement).appendChild(st);
    const hud2=document.getElementById('hud2'), par=hud2.parentNode||document.body;
    const put=n=>{ if(par.insertBefore&&hud2.parentNode) par.insertBefore(n,hud2); else par.appendChild(n); };
    const fx=document.createElement('div'); fx.id='evFx'; put(fx);
    const ti=document.createElement('div'); ti.id='evTint'; put(ti);
    const box=document.createElement('div'); box.id='evt'; hud2.appendChild(box);
    const rows=[]; for(let i=0;i<3;i++){ const d=document.createElement('div'); d.className='ev'; const b=document.createElement('b'), t=document.createElement('span'), u=document.createElement('u');
      d.appendChild(b); d.appendChild(t); d.appendChild(u); box.appendChild(d); rows.push({d,b,i:t,u}); }
    dom={fx,ti,box,rows,stage:document.getElementById('stage')};
  }

  /* ---- Hilfen ---- */
  const inArena=(x,y)=>S.ar.has(y*MW+x);
  const pay=cr=>{ cr|=0; if(cr<=0) return; Save.data.credits+=cr; Save.markDirty(); api.stats.credits+=cr; };
  const kill=()=>totals.foes>0?stats.kills/totals.foes:0;
  const ready=ev=>ev.now||stats.time>4.6;                         // erst nach dem Einblenden der Sektor-Meldung
  const alive=()=>{ let n=0; for(const e of enemies) if(e.alive) n++; return n; };
  function arrow(x,y){ const dx=x-P.x, dy=y-P.y; let r=Math.atan2(dy,dx)-P.a; r=Math.atan2(Math.sin(r),Math.cos(r)); const a=Math.abs(r); return a<.5?'▲':a>2.6?'▼':r>0?'▶':'◀'; }
  function exitDist(f){
    if(!exitCell||!f) return 0; let b=1e9;
    for(const d of [[1,0],[-1,0],[0,1],[0,-1]]){ const x=exitCell.x+d[0], y=exitCell.y+d[1]; if(x<0||y<0||x>=MW||y>=MH) continue; const v=f[y*MW+x]; if(v>=0&&v<b) b=v; }
    return b===1e9?0:b;
  }
  function pickCell(f0,f1,sep){
    const df=S.df; if(!df) return null; let mx=0; for(let i=0;i<df.length;i++) if(df[i]>mx) mx=df[i];
    const a=[];
    for(let y=2;y<MH-2;y++) for(let x=2;x<MW-2;x++){
      const k=y*MW+x, v=df[k]; if(v<f0*mx||v>f1*mx||grid[k]!==0||S.pk.has(k)) continue;
      if(grid[k+1]||grid[k-1]||grid[k+MW]||grid[k-MW]) continue;                // nicht direkt an Wänden/Engstellen
      if(inArena(x,y)) continue;
      if(exitCell&&Math.abs(x-exitCell.x)+Math.abs(y-exitCell.y)<4) continue;
      if(stairsCell&&Math.abs(x-stairsCell.x)+Math.abs(y-stairsCell.y)<4) continue;
      let ok=true; for(const u of S.used) if(Math.hypot(u.x-x-.5,u.y-y-.5)<(sep||6)){ ok=false; break; } if(ok) a.push(k);
    }
    if(!a.length) return null;
    const k=a[(Math.random()*a.length)|0], c={x:(k%MW)+.5,y:((k/MW)|0)+.5}; S.used.push(c); return c;
  }
  /* Sackgassen-Bloecke des Labyrinths (genau 1 Verbindung, leer): Kandidaten fuer Geheimraum/Tresor */
  function findPockets(){
    const out=[], st=CORR_W+1, F=(x,y)=>x>=0&&y>=0&&x<MW&&y<MH&&grid[y*MW+x]===0, Wl=(x,y)=>x<0||y<0||x>=MW||y>=MH||grid[y*MW+x]===1;
    const near=(ox,oy)=>{ for(const e of enemies) if(e.x>ox-.6&&e.x<ox+CORR_W+.6&&e.y>oy-.6&&e.y<oy+CORR_W+.6) return true;
      for(const p of pickups) if(p.x>ox-.6&&p.x<ox+CORR_W+.6&&p.y>oy-.6&&p.y<oy+CORR_W+.6) return true; return false; };
    for(let oy=1;oy+CORR_W<=MH-1;oy+=st) for(let ox=1;ox+CORR_W<=MW-1;ox+=st){
      let ok=true;
      for(let dy=0;dy<CORR_W&&ok;dy++) for(let dx=0;dx<CORR_W;dx++) if(!F(ox+dx,oy+dy)||inArena(ox+dx,oy+dy)){ ok=false; break; }
      if(!ok) continue;
      let open=null, cnt=0, bad=false;
      for(const a of [[1,0],[-1,0],[0,1],[0,-1]]){
        const cells=[];
        for(let k=0;k<CORR_W;k++) cells.push([a[0]===1?ox+CORR_W:a[0]===-1?ox-1:ox+k, a[1]===1?oy+CORR_W:a[1]===-1?oy-1:oy+k]);
        let nF=0,nW=0; for(const c of cells){ if(F(c[0],c[1])) nF++; else if(Wl(c[0],c[1])) nW++; }
        if(nF===CORR_W){ cnt++; open=cells; if(cells.some(c=>inArena(c[0],c[1])||inArena(c[0]+a[0],c[1]+a[1]))) bad=true; }
        else if(nW!==CORR_W){ bad=true; break; }
      }
      if(bad||cnt!==1) continue;
      const cx=ox+CORR_W/2, cy=oy+CORR_W/2;
      if(Math.hypot(cx-P.x,cy-P.y)<4.5||near(ox,oy)) continue;
      out.push({ox,oy,open,cx,cy,d:S.df[(oy|0)*MW+(ox|0)]});
    }
    return out;
  }
  function seal(pk){ for(const c of pk.open) grid[c[1]*MW+c[0]]=1; }
  /* Gegnerwahl + Spawn */
  function pool(){
    const ro=BIOME_ROSTER[curBiome]||BIOME_ROSTER.facility, d=lvl.depth, out=[]; let tot=0;
    for(const t in MINT){ if(d<MINT[t]||!ETYPES[t]) continue; const w=ro[t]||0; if(w>0){ out.push([t,w]); tot+=w; } }
    return out.length?{list:out,tot}:{list:[['p',1]],tot:1};
  }
  function pickType(pl){ let x=Math.random()*pl.tot; for(const it of pl.list){ x-=it[1]; if(x<=0) return it[0]; } return pl.list[0][0]; }
  function spawnEnemy(type,x,y,engage){
    const T=ETYPES[type]; if(!T) return null;
    const e={type,x,y,hp:T.hp,maxhp:T.hp,alive:true,awake:false,hear:false,cd:1+Math.random(),flash:0,atk:0,strafe:Math.random()<.5?-1:1,strT:0,bodyT:0,stagT:0,stagX:0,stagY:0};
    enemies.push(e); totals.foes++; AI.init(e); Roles.rollElite(e); Ascension.onEnemy(e); if(engage) AI.engage(e); spawnBoom(x,y,.6);
    return e;
  }
  function findSpot(minD,maxD,hidden,maxFlow){
    for(let i=0;i<90;i++){
      const a=Math.random()*TAU, r=minD+Math.random()*(maxD-minD), x=P.x+Math.cos(a)*r, y=P.y+Math.sin(a)*r, cx=x|0, cy=y|0;
      if(cx<1||cy<1||cx>=MW-1||cy>=MH-1) continue;
      const k=cy*MW+cx; if(grid[k]!==0||S.pk.has(k)||flow[k]<0||flow[k]>(maxFlow||45)||inArena(cx,cy)||boxHit(x,y,.32)) continue;
      if(hidden){ const dx=x-P.x, dy=y-P.y, d=Math.hypot(dx,dy); if(rayWallDist(P.x,P.y,dx/d,dy/d)>=d-.1) continue; }
      return {x,y};
    }
    return null;
  }
  function wave(n,hidden,tag){
    const pl=pool(), made=[]; n=Math.min(n,Math.max(0,36-alive()));
    for(let i=0;i<n;i++){
      const s=findSpot(hidden?5.5:8,hidden?11:16,hidden)||findSpot(6,18,false); if(!s) continue;
      const e=spawnEnemy(pickType(pl),s.x,s.y,true); if(e){ if(tag) e[tag]=1; made.push(e); }
    }
    return made;
  }
  function drop(x,y,kinds){ for(const k of kinds) pickups.push({kind:k,x:x+(Math.random()-.5)*.6,y:y+(Math.random()-.5)*.6,taken:false,ph:Math.random()*6}); }
  const wn=()=>Math.max(3,Math.min(8,3+(((lvl.depth-3)/3)|0)));

  /* ---- Wurf ---- */
  function roll(L){
    const d=L.depth, bi=BI[L.biome]||0, boss=L.lock==='boss', mid=!!stairsCell, ex=!!exitCell&&!boss&&!mid;
    let n=d<5?1:d<10?(Math.random()<.5?1:2):(Math.random()<.3?3:2);
    if(mid) n=Math.random()<.45?1:0;
    const out=[];
    for(let k=0;k<n;k++){
      const pl=[]; let tot=0;
      for(const id of ALL){
        const r=RULE[id]; if(d<r.min||out.indexOf(id)>=0) continue;
        if((mid&&!r.mid)||(boss&&!r.boss)||(r.exit&&!ex)) continue;
        if(CONFLICT.some(c=>(c[0]===id&&out.indexOf(c[1])>=0)||(c[1]===id&&out.indexOf(c[0])>=0))) continue;
        pl.push([id,r.w[bi]]); tot+=r.w[bi];
      }
      if(!pl.length) break;
      let x=Math.random()*tot, pick=pl[pl.length-1][0];
      for(const it of pl){ x-=it[1]; if(x<=0){ pick=it[0]; break; } }
      out.push(pick);
    }
    if(out.indexOf('vault')>=0&&out.indexOf('override')<0) out.push('override');
    return out;
  }
  function make(id){
    const ev={id,st:0,t:0}, d=lvl.depth;
    switch(id){
      case 'alarm': ev.at=30+Math.random()*35; ev.dur=18; ev.a0=AI.stats.alarms; ev.sir=0; ev.nz=0; break;
      case 'lockdown': ev.kf=.3; ev.g=[]; break;
      case 'blackout': ev.at=22+Math.random()*30; ev.dur=26+Math.min(14,d); break;
      case 'meltdown': ev.kf=.25; ev.at=55; ev.rad=0; ev.bp=0; ev.sh=0; break;
      case 'reinforce': ev.wave=0; ev.waves=d>=8?2:1; break;
      case 'ambush': { const c=pickCell(.3,.65); if(!c) return null; ev.x=c.x; ev.y=c.y; pickups.push({kind:Math.random()<.5?'h':'a',x:c.x,y:c.y,taken:false,ph:0,bait:true}); break; }
      case 'supply': ev.at=18+Math.random()*40; break;
      case 'hunt': {
        const c=enemies.filter(e=>e.alive&&e.type!=='K'&&e.type!=='e'&&e.role!=='swarm'&&!STATIONARY_TYPES[e.type]); if(!c.length) return null;
        c.sort((a,b)=>Math.hypot(b.x-P.x,b.y-P.y)-Math.hypot(a.x-P.x,a.y-P.y)); const t=c[(Math.random()*Math.min(3,c.length))|0];
        if(!t.elite){ t.elite=true; t.maxhp=Math.round(t.maxhp*1.8); t.hp=t.maxhp; t.novaCd=3+Math.random()*3; t.aggr=Math.max(t.aggr||0,1); Elite.assign(t); }
        t.hunt=1; ev.tg=t; break; }
      case 'override': { const c=pickCell(.45,.85); if(!c) return null; ev.x=c.x; ev.y=c.y; ev.p=0; ev.hk=0;
        ev.pk=pickups.push({kind:'T',x:c.x,y:c.y,taken:false,ph:0,fixed:true})&&pickups[pickups.length-1]; break; }
      case 'hidden': case 'vault': {
        if(!S.pockets.length) return null;
        let i=0; if(id==='vault'){ let b=-1; S.pockets.forEach((p,k)=>{ if(p.d>b){ b=p.d; i=k; } }); } else i=(Math.random()*S.pockets.length)|0;
        const pk=S.pockets.splice(i,1)[0]; seal(pk); ev.pk=pk; ev.hold=0; ev.ht=0; ev.mt=0;
        if(id==='vault') ev.locked=!!S.list.find(e=>e.id==='override'); break; }
      case 'timer': ev.par=Math.min(600,Math.round(50+exitDist(S.df)*.9+totals.foes*4.5)); break;
    }
    return ev;
  }

  /* ---- Ablauf ---- */
  api.reset=function(){ api.stats={rolled:0,started:0,done:0,secrets:0,fails:0,credits:0}; };
  api.setup=function(){
    ensureDom();
    S={list:[],dark:0,rows:[],df:null,pk:new Set(),ar:new Set(),pockets:[],used:[],hudT:0};
    dom.fx.style.opacity=0; dom.ti.className=''; HUD.last.evfx=null; HUD.last.evti=null; api.paint();
    if(!lvl||!lvl.procedural||!(lvl.depth>=2)) return;
    if(!lvl._ev) lvl._ev=roll(lvl);
    if(lvl.arena) for(const c of lvl.arena.cells) S.ar.add(c[1]*MW+c[0]);
    S.df=computeFlowFromCell(P.x|0,P.y|0);
    S.pockets=findPockets();
    for(const p of S.pockets){ for(let dy=-1;dy<=CORR_W;dy++) for(let dx=-1;dx<=CORR_W;dx++) S.pk.add((p.oy+dy)*MW+p.ox+dx); }
    const ids=lvl._ev.slice().sort((a,b)=>(a==='vault'?1:0)-(b==='vault'?1:0));
    for(const id of ids){ const ev=make(id); if(ev) S.list.push(ev); }
    api.stats.rolled+=S.list.length;
  };
  api.force=function(id){
    if(!lvl||!lvl.procedural||!NAME[id]) return null;
    if(!S.df){ S.df=computeFlowFromCell(P.x|0,P.y|0); S.pockets=findPockets(); }
    const ev=make(id); if(!ev) return null; ev.now=true; ev.at=0; ev.kf=0; S.list.push(ev); return ev;
  };
  function begin(ev,msg,snd){ ev.st=1; ev.t=0; api.stats.started++; if(msg) showMsg(msg,2800); if(snd&&sfx[snd]) sfx[snd](); }
  function done(ev,msg){ ev.st=2; api.stats.done++; if(msg) showMsg(msg,2600); }
  function openPocket(ev){
    const pk=ev.pk, vault=ev.id==='vault';
    for(const c of pk.open) grid[c[1]*MW+c[0]]=0;
    buildMini(); ev.st=2; Missions.onSecret(); api.stats.secrets++; api.stats.done++; sfx.evSecret();
    const kinds=vault?['m','m','m','h']:['h','a','m','m'];
    let i=0; for(let dy=0;dy<CORR_W;dy++) for(let dx=0;dx<CORR_W;dx++){ const k=kinds[i++%kinds.length]; if(k==='m') totals.shards++;
      pickups.push({kind:k,x:pk.ox+dx+.5,y:pk.oy+dy+.5,taken:false,ph:Math.random()*6}); }
    const cr=vault?50+6*lvl.depth:15+2*lvl.depth; pay(cr);
    let txt=(vault?'TRESOR geöffnet':'GEHEIMRAUM entdeckt')+' — +'+cr+' Credits';
    if(vault||Math.random()<.5){ const id=Mods.roll(modDepth()+(vault?3:0)); if(Mods.add(id,true)) txt+=' · Mod: '+MOD_BY_ID[id].name; }
    showMsg(txt,3200);
  }
  function rowsOf(){
    const R=[], T=stats.time;
    for(const ev of S.list){
      const c=COL[ev.id]; let r=null;
      switch(ev.id){
        case 'alarm': if(ev.st===1) r={t:NAME.alarm,s:'Durchhalten '+Math.ceil(ev.dur-ev.t)+' s',p:1-ev.t/ev.dur,w:1}; break;
        case 'lockdown': if(ev.st===1){ const n=ev.g.filter(e=>e.alive).length; r={t:NAME.lockdown,s:'Wachen '+n+' / '+ev.g.length,p:n/ev.g.length,w:1}; } break;
        case 'blackout': if(ev.st===1) r={t:NAME.blackout,s:Math.ceil(ev.dur-ev.t)+' s',p:1-ev.t/ev.dur}; break;
        case 'meltdown': if(ev.st===1){ const left=ev.lim-ev.t;
          r=left>0?{t:'KERN-DURCHBRUCH',s:'Portal '+arrow(exitCell.x+.5,exitCell.y+.5)+' '+Math.ceil(left)+' s',p:left/ev.lim,w:left<15}:{t:'STRAHLUNG!',s:'Portal '+arrow(exitCell.x+.5,exitCell.y+.5),p:1,w:1}; } break;
        case 'supply': if(ev.st===1) r={t:NAME.supply,s:arrow(ev.x,ev.y)+' '+Math.round(Math.hypot(ev.x-P.x,ev.y-P.y))+' m',p:1}; break;
        case 'hunt': if(ev.st===0&&ev.tg&&ev.tg.alive&&ev.ann) r={t:NAME.hunt,s:arrow(ev.tg.x,ev.tg.y)+' '+Math.round(Math.hypot(ev.tg.x-P.x,ev.tg.y-P.y))+' m · '+ETYPES[ev.tg.type].name,p:ev.tg.hp/ev.tg.maxhp}; break;
        case 'override': if(ev.st===0) r={t:'OVERRIDE',s:ev.p>0?Math.round(ev.p*100)+' %':arrow(ev.x,ev.y)+' Terminal '+Math.round(Math.hypot(ev.x-P.x,ev.y-P.y))+' m',p:ev.p>0?ev.p:0}; break;
        case 'timer': if(ev.st===0){ const left=Math.max(0,ev.par-T); r={t:NAME.timer,s:fmt(left),p:left/ev.par,w:left<15}; } break;
      }
      if(r){ r.c=c; R.push(r); if(R.length>=3) break; }
    }
